<script>
(function BLOK_VG_VARIABLE_GLOBAL_V5() {

    // ═══════════════════════════════════════════════════════════
    // [VG.0] — GUARD 4 LAPIS + A43 SELF-REGISTER + A46 HEALTH SYNC
    // ═══════════════════════════════════════════════════════════
    if (window._blokVGDoneV5) {
        console.log('ℹ️ BLOK VG v' + (window._blokVGVersi || '?') + ' sudah terpasang.');
        return;
    }

    // ── Guard 4 lapis (A32) ──
    window._blokVGDoneV5 = true;   // ⭐ GUARD UTAMA v5.0
    window._blokVGDoneV3 = true;   // alias (kompat CPAJ_BLOK_MAP)
    window._blokVGDoneV2 = true;   // alias legacy v2
    window._blokVGDone   = true;   // alias legacy (registri 0.1.g.2)
    window._blokVGVersi  = '5.0 FINAL';

    // ── A43: Self-register deferred (retry 30×500ms) ──
    // VG di L0a — load sebelum 0.1.g.1 (blokDaftarkanGuard). Retry 15s max.
    var _a43Attempt = 0;
    var _a43Max = 30;

    function _deferredA43() {
        _a43Attempt++;
        if (typeof window.blokDaftarkanGuard === 'function') {
            try {
                window.blokDaftarkanGuard('_blokVGDoneV5', 'VG');
                window.blokDaftarkanGuard('_blokVGDoneV3', 'VG');
                window.blokDaftarkanGuard('_blokVGDone',   'VG');
                console.log('✅ [VG v5.0] A43 self-register OK ' +
                    '(attempt ' + _a43Attempt + '/' + _a43Max + ')');
                return;
            } catch (e) {}
        }
        if (_a43Attempt < _a43Max) {
            setTimeout(_deferredA43, 500);
        } else {
            console.warn('⚠️ [VG v5.0] A43 self-register GAGAL setelah ' +
                _a43Max + ' attempt. Fallback manual sudah aktif.');
        }
    }
    setTimeout(_deferredA43, 500);

    // ── A46: Fallback manual BLOK_GUARD_MAP (SINKRON, idempotent) ──
    window.BLOK_GUARD_MAP = window.BLOK_GUARD_MAP || {};
    if (!window.BLOK_GUARD_MAP['_blokVGDoneV5']) {
        window.BLOK_GUARD_MAP['_blokVGDoneV5'] = 'VG';
    }
    if (!window.BLOK_GUARD_MAP['_blokVGDoneV3']) {
        window.BLOK_GUARD_MAP['_blokVGDoneV3'] = 'VG';
    }
    if (!window.BLOK_GUARD_MAP['_blokVGDone']) {
        window.BLOK_GUARD_MAP['_blokVGDone'] = 'VG';
    }

    // ── _log helper (A27 silent — opt-in via CS_FLAG.DEBUG_MODE) ──
    function _log(msg, warna) {
        var debugOn = window.CS_FLAG && window.CS_FLAG.DEBUG_MODE === true;
        if (!debugOn) return;
        var style = 'background:#17A2B8;color:#fff;padding:2px 6px;' +
                    'border-radius:3px;font-weight:bold;';
        if (warna === 'success') style = 'background:#28A745;color:#fff;padding:2px 6px;border-radius:3px;font-weight:bold;';
        if (warna === 'warning') style = 'background:#FFC107;color:#000;padding:2px 6px;border-radius:3px;font-weight:bold;';
        if (warna === 'danger')  style = 'background:#DC3545;color:#fff;padding:2px 6px;border-radius:3px;font-weight:bold;';
        console.log('%c[VG] ' + msg, style);
    }

    // ═══════════════════════════════════════════════════════════
    // [VG.1] — DEKLARASI 20 VARIABEL GLOBAL (A17)
    // ═══════════════════════════════════════════════════════════
    // Pola (A18): window.namaVar = window.namaVar || defaultValue
    // ═══════════════════════════════════════════════════════════

    // ── Grup 1: Data Akun & User (4) ──
    window.dataLoginUser         = window.dataLoginUser         || [];
    window.dataAkunAktif         = window.dataAkunAktif         || [];
    window.dataKasir             = window.dataKasir             || [];
    window.dataArsipAkun         = window.dataArsipAkun         || [];

    // ── Grup 2: Data Wilayah (1) ──
    window.dataWilayah           = window.dataWilayah           || [];

    // ── Grup 3: Data Pengajuan & Verifikasi (2) ──
    window.dataPengajuanBukaAkun = window.dataPengajuanBukaAkun || [];
    window.dataVerifikasiDokumen = window.dataVerifikasiDokumen || [];

    // ── Grup 4: Data Audit & Log (2) ──
    window.dataLogAuditSA        = window.dataLogAuditSA        || { log: [] };
    window.dataHistoriAktivitas  = window.dataHistoriAktivitas  || [];

    // ── Grup 5: Data Keuangan (3) ──
    window.dataRekening          = window.dataRekening          || [];
    window.dataTopUpHistory      = window.dataTopUpHistory      || [];
    window.dataWithdrawHistory   = window.dataWithdrawHistory   || [];

    // ── Grup 6: Data Transaksi (1) ──
    window.dataOrder             = window.dataOrder             || [];

    // ── Grup 7: Data Produk (2) ──
    window.dataProduk            = window.dataProduk            || [];
    window.dataKategoriProduk    = window.dataKategoriProduk    || [];

    // ── Grup 8: Data Komunikasi (2) ──
    window.dataNotifikasi        = window.dataNotifikasi        || [];
    window.dataChat              = window.dataChat              || [];

    // ── Grup 9: Data Media (2) ──
    window.dataKoleksiGif        = window.dataKoleksiGif        || [];
    window.dataMediaIndex        = window.dataMediaIndex        || {};

    // ── Grup 10: Data Sesi (1) ──
    window.userAktif             = window.userAktif             || null;

    // ═══════════════════════════════════════════════════════════
    // [VG.2] — VALIDASI TIPE PAKSA (A19)
    // ═══════════════════════════════════════════════════════════
    // CATATAN (A19 EXEMPT eksplisit):
    //   VG load sebelum CS4 (yang menyediakan csIsArray/csIsObject).
    //   Menggunakan Array.isArray/typeof manual = equivalent.
    //   A19 tujuan: validasi tipe — Array.isArray memenuhi tujuan tsb.
    // ═══════════════════════════════════════════════════════════
    function _paksaArray(nama, defaultVal) {
        try {
            if (!Array.isArray(window[nama])) {
                console.warn('⚠️ VG: ' + nama + ' bukan array — dipaksa jadi [].');
                window[nama] = Array.isArray(defaultVal) ? defaultVal : [];
            }
        } catch (e) {
            window[nama] = [];
        }
    }

    function _paksaObject(nama, defaultVal) {
        try {
            if (!window[nama] ||
                typeof window[nama] !== 'object' ||
                Array.isArray(window[nama])) {
                console.warn('⚠️ VG: ' + nama + ' bukan object — dipaksa jadi {}.');
                window[nama] = defaultVal || {};
            }
        } catch (e) {
            window[nama] = {};
        }
    }

    _paksaArray('dataLoginUser',         []);
    _paksaArray('dataAkunAktif',         []);
    _paksaArray('dataKasir',             []);
    _paksaArray('dataArsipAkun',         []);
    _paksaArray('dataWilayah',           []);
    _paksaArray('dataPengajuanBukaAkun', []);
    _paksaArray('dataVerifikasiDokumen', []);
    _paksaObject('dataLogAuditSA',       { log: [] });
    _paksaArray('dataHistoriAktivitas',  []);
    _paksaArray('dataRekening',          []);
    _paksaArray('dataTopUpHistory',      []);
    _paksaArray('dataWithdrawHistory',   []);
    _paksaArray('dataOrder',             []);
    _paksaArray('dataProduk',            []);
    _paksaArray('dataKategoriProduk',    []);
    _paksaArray('dataNotifikasi',        []);
    _paksaArray('dataChat',              []);
    _paksaArray('dataKoleksiGif',        []);
    _paksaObject('dataMediaIndex',       {});

    if (!Array.isArray(window.dataLogAuditSA.log)) {
        window.dataLogAuditSA.log = [];
    }

    // ═══════════════════════════════════════════════════════════
    // [VG.3] — HELPER: vgInfoVariabel (A20)
    // ═══════════════════════════════════════════════════════════
    window.vgInfoVariabel = function() {
        try {
            var list = [
                { nama: 'dataLoginUser',         tipe: 'array'  },
                { nama: 'dataAkunAktif',         tipe: 'array'  },
                { nama: 'dataKasir',             tipe: 'array'  },
                { nama: 'dataArsipAkun',         tipe: 'array'  },
                { nama: 'dataWilayah',           tipe: 'array'  },
                { nama: 'dataPengajuanBukaAkun', tipe: 'array'  },
                { nama: 'dataVerifikasiDokumen', tipe: 'array'  },
                { nama: 'dataLogAuditSA',        tipe: 'object' },
                { nama: 'dataHistoriAktivitas',  tipe: 'array'  },
                { nama: 'dataRekening',          tipe: 'array'  },
                { nama: 'dataTopUpHistory',      tipe: 'array'  },
                { nama: 'dataWithdrawHistory',   tipe: 'array'  },
                { nama: 'dataOrder',             tipe: 'array'  },
                { nama: 'dataProduk',            tipe: 'array'  },
                { nama: 'dataKategoriProduk',    tipe: 'array'  },
                { nama: 'dataNotifikasi',        tipe: 'array'  },
                { nama: 'dataChat',              tipe: 'array'  },
                { nama: 'dataKoleksiGif',        tipe: 'array'  },
                { nama: 'dataMediaIndex',        tipe: 'object' },
                { nama: 'userAktif',             tipe: 'any'    }
            ];

            var hasil = { total: list.length, valid: 0, list: [] };
            list.forEach(function(item) {
                var val = window[item.nama];
                var ok = false;
                var panjang = 0;

                if (item.tipe === 'array') {
                    ok = Array.isArray(val);
                    panjang = ok ? val.length : 0;
                } else if (item.tipe === 'object') {
                    ok = val && typeof val === 'object' && !Array.isArray(val);
                    panjang = ok ? Object.keys(val).length : 0;
                } else {
                    ok = val !== undefined;
                    panjang = val ? 1 : 0;
                }

                if (ok) hasil.valid++;
                hasil.list.push({
                    nama:  item.nama,
                    tipe:  item.tipe,
                    ok:    ok,
                    isi:   panjang
                });
            });
            return hasil;
        } catch (e) {
            return { total: 0, valid: 0, list: [], error: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [VG.4] — HELPER: vgResetData (A20)
    // ═══════════════════════════════════════════════════════════
    window.vgResetData = function(opts) {
        opts = opts || {};
        try {
            if (!opts.force) {
                var konfirm = window.confirm(
                    '⚠️ Reset SEMUA variabel global ke kosong?\n\n' +
                    'Data yang tidak disimpan akan HILANG.\n\n' +
                    'Lanjutkan?'
                );
                if (!konfirm) return { sukses: false, pesan: 'Dibatalkan' };
            }

            window.dataLoginUser.length = 0;
            window.dataAkunAktif.length = 0;
            window.dataKasir.length = 0;
            window.dataArsipAkun.length = 0;
            window.dataWilayah.length = 0;
            window.dataPengajuanBukaAkun.length = 0;
            window.dataVerifikasiDokumen.length = 0;
            window.dataLogAuditSA.log = [];
            window.dataHistoriAktivitas.length = 0;
            window.dataRekening.length = 0;
            window.dataTopUpHistory.length = 0;
            window.dataWithdrawHistory.length = 0;
            window.dataOrder.length = 0;
            window.dataProduk.length = 0;
            window.dataKategoriProduk.length = 0;
            window.dataNotifikasi.length = 0;
            window.dataChat.length = 0;
            window.dataKoleksiGif.length = 0;

            Object.keys(window.dataMediaIndex).forEach(function(k) {
                delete window.dataMediaIndex[k];
            });

            window.userAktif = null;

            return { sukses: true, pesan: 'Semua variabel direset' };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

        // ═══════════════════════════════════════════════════════════
    // [VG.5] — HELPER: vgLoadStorage (delegasi CS2)
    // ═══════════════════════════════════════════════════════════
    // ⭐ A2 FIX v5.0 FINAL: delegasi CS2 diutamakan.
    //    Fallback manual 19 var dipertahankan sebagai SAFETY NET
    //    untuk kondisi VG load SEBELUM CS2 ready (urutan edge case).
    //    Tambah console.warn untuk visibility saat fallback aktif
    //    (membantu debug / audit trail tanpa ubah logic).
    // ═══════════════════════════════════════════════════════════
    window.vgLoadStorage = function() {
        try {
            // ── Prioritas 1: Delegasi ke CS2 (A1/A25) ──
            if (typeof window.loadDataDariLocalStorage === 'function') {
                return window.loadDataDariLocalStorage();
            }

            // ── Prioritas 2: Fallback manual (VG load sebelum CS2) ──
            // A2 FIX: warn untuk visibility — logic tidak berubah
            console.warn('⚠️ VG vgLoadStorage: fallback manual aktif (CS2 belum ready). ' +
                         'Cek urutan load — VG seharusnya di L0a (paling awal body), ' +
                         'CS2 di L1 (setelah Core System start).');

            var map = [
                { var: 'dataLoginUser',         key: 'dataLoginUser',         def: [] },
                { var: 'dataAkunAktif',         key: 'dataAkunAktif',         def: [] },
                { var: 'dataKasir',             key: 'dataKasir',             def: [] },
                { var: 'dataArsipAkun',         key: 'dataArsipAkun',         def: [] },
                { var: 'dataWilayah',           key: 'dataWilayah',           def: [] },
                { var: 'dataPengajuanBukaAkun', key: 'dataPengajuanBukaAkun', def: [] },
                { var: 'dataVerifikasiDokumen', key: 'dataVerifikasiDokumen', def: [] },
                { var: 'dataLogAuditSA',        key: 'dataLogAuditSA',        def: { log: [] } },
                { var: 'dataHistoriAktivitas',  key: 'dataHistoriAktivitas',  def: [] },
                { var: 'dataRekening',          key: 'dataRekening',          def: [] },
                { var: 'dataTopUpHistory',      key: 'dataTopUpHistory',      def: [] },
                { var: 'dataWithdrawHistory',   key: 'dataWithdrawHistory',   def: [] },
                { var: 'dataOrder',             key: 'dataOrder',             def: [] },
                { var: 'dataProduk',            key: 'dataProduk',            def: [] },
                { var: 'dataKategoriProduk',    key: 'dataKategoriProduk',    def: [] },
                { var: 'dataNotifikasi',        key: 'dataNotifikasi',        def: [] },
                { var: 'dataChat',              key: 'dataChat',              def: [] },
                { var: 'dataKoleksiGif',        key: 'dataKoleksiGif',        def: [] },
                { var: 'dataMediaIndex',        key: 'dataMediaIndex',        def: {} }
            ];

            var hasil = {};
            var berhasil = 0, gagal = 0;

            map.forEach(function(m) {
                try {
                    var s = localStorage.getItem(m.key);
                    var loaded = s ? JSON.parse(s) : m.def;
                    var target = window[m.var];

                    if (Array.isArray(target) && Array.isArray(loaded)) {
                        target.length = 0;
                        loaded.forEach(function(x) { target.push(x); });
                        hasil[m.var] = loaded.length;
                        berhasil++;
                    } else if (target && typeof target === 'object' &&
                               !Array.isArray(target) &&
                               loaded && typeof loaded === 'object') {
                        Object.keys(target).forEach(function(k) { delete target[k]; });
                        Object.assign(target, loaded);
                        hasil[m.var] = Object.keys(loaded).length;
                        berhasil++;
                    } else {
                        gagal++;
                    }
                } catch (e) {
                    hasil[m.var] = 0;
                    gagal++;
                }
            });

            // A2 FIX: summary warn (visibility tambahan)
            if (berhasil > 0) {
                console.log('🔄 VG vgLoadStorage: fallback selesai — ' +
                            berhasil + '/' + map.length + ' var berhasil' +
                            (gagal > 0 ? ' · ' + gagal + ' gagal' : ''));
            }

            return hasil;
        } catch (e) {
            console.error('vgLoadStorage error:', e);
            return {};
        }
    };
	
    // ═══════════════════════════════════════════════════════════
    // [VG.6] — HELPER: vgCekDataKosong
    // ═══════════════════════════════════════════════════════════
    window.vgCekDataKosong = function() {
        try {
            return {
                loginUserKosong: (window.dataLoginUser || []).length === 0,
                akunAktifKosong: (window.dataAkunAktif || []).length === 0,
                wilayahKosong:   (window.dataWilayah || []).length === 0,
                totalLoginUser:  (window.dataLoginUser || []).length,
                totalAkunAktif:  (window.dataAkunAktif || []).length
            };
        } catch (e) {
            return { error: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [VG.7] — PINTU 1: KIRIM (A11, A13)
    // ═══════════════════════════════════════════════════════════
    window.kirimVG = function(tipe, ke, data, idRef) {
        try {
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }
            return window.mnKirimKeMenu({
                tipe: tipe || 'vg_info',
                dari: {
                    idUser:   (typeof window.gidIdUser === 'function')
                              ? window.gidIdUser() : null,
                    idOwner:  (typeof window.gidIdOwner === 'function')
                              ? window.gidIdOwner() : null,
                    kodeRole: (typeof window.gidKodeRoleUser === 'function')
                              ? window.gidKodeRoleUser() : null,
                    menu: 'VariableGlobal', blok: 'L0a-VG'
                },
                ke:        ke || { menu: 'VariableGlobal' },
                data:      data || {},
                idRef:     idRef || null,
                timestamp: (window.csNow ? window.csNow() : new Date().toISOString())
            });
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [VG.8] — PINTU 2: TERIMA (A11)

                ke:   { menu: opts.keMenu || filter.keMenu || 'caller' },
