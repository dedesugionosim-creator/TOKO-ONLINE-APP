<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online 2R - Login SuperAdmin</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- CryptoJS untuk MD5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <style>
        body {
            background-color: #FF8C00;
            background-image: linear-gradient(135deg, #FF8C00 0%, #FF6B00 50%, #FF5500 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }

        .card {
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .card-header { border-radius: 15px 15px 0 0 !important; }
        .navbar-orange { background-color: #FF6B00 !important; }

        .menu-item { cursor: pointer; transition: background 0.2s; }
        .menu-item:hover { background: rgba(255, 140, 0, 0.1) !important; }

        @media (max-width: 768px) {
            .container { padding-left: 15px; padding-right: 15px; }
        }
    </style>
</head>
<body>

    <!-- ===== HALAMAN LOGIN ===== -->
    <div id="halamanLogin" class="page-section active">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="text-center mb-4">
                        <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 100px; height: 100px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                            <i class="fas fa-store-alt fa-3x" style="color: #FF8C00;"></i>
                        </div>
                        <h3 class="fw-bold text-white">Toko Online 2R</h3>
                        <p class="text-white opacity-75">Silakan login sebagai SuperAdmin</p>
                    </div>
                    
                    <div class="card shadow-lg border-0">
                        <div class="card-body p-4">
                            <div id="notifikasiLogin" class="alert d-none" role="alert"></div>
                            
                            <form id="formLogin" onsubmit="return prosesLogin(event)">
                                <div class="mb-3">
                                    <label for="usernameLogin" class="form-label fw-bold">
                                        <i class="fas fa-user me-1" style="color: #FF8C00;"></i>Username
                                    </label>
                                    <input type="text" id="usernameLogin" class="form-control" placeholder="Masukkan username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="passwordLogin" class="form-label fw-bold">
                                        <i class="fas fa-lock me-1" style="color: #FF8C00;"></i>Password
                                    </label>
                                    <input type="password" id="passwordLogin" class="form-control" placeholder="Masukkan password" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-lg fw-bold text-white" style="background-color: #FF8C00;">
                                        <i class="fas fa-sign-in-alt me-2"></i>Login
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== HALAMAN DASBOR SUPERADMIN ===== -->
    <div id="halamanDasbor" class="page-section">
        
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-orange sticky-top">
            <div class="container">
                <button class="btn text-white me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
                    <i class="fas fa-bars fa-lg"></i>
                </button>
                <a class="navbar-brand fw-bold text-white" href="#">
                    <i class="fas fa-store-alt me-2"></i>Toko Online 2R
                </a>
                <div class="ms-auto">
                    <span class="text-white me-2" id="namaUserDisplay">SuperAdmin</span>
                    <button class="btn btn-outline-light btn-sm" onclick="prosesLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
        </nav>

        <!-- Sidebar -->
        <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="offcanvasMenu">
            <div class="offcanvas-header" style="background-color: #FF6B00;">
                <h5 class="offcanvas-title fw-bold"><i class="fas fa-bars me-2"></i>Menu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <div class="text-center mb-4 pb-3 border-bottom border-secondary">
                    <h6 id="offcanvasNamaUser">SuperAdmin</h6>
                    <span class="badge bg-secondary" id="offcanvasRoleUser">SuperAdmin</span>
                </div>
                <nav id="menuNavigasi" class="list-group list-group-flush">
                    <!-- Menu akan diisi JavaScript -->
                </nav>
            </div>
        </div>

        <!-- Konten Utama -->
        <main id="kontenDasbor" class="container-fluid px-4 py-4">
            <!-- Akan diisi JavaScript -->
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ============================================================
        // KONSTANTA SUPERADMIN
        // ============================================================
        const SUPERADMIN_USERNAME = 'AppTokoOnLine2R';
        const SUPERADMIN_PASSWORD_HASH = 'e10adc3949ba59abbe56e057f20f883e'; // MD5 dari "MyHand0286"

        let userAktif = null;
        let kontenAsliDasbor = null;

        // ============================================================
        // NAVIGASI HALAMAN
        // ============================================================
        function tampilkanHalaman(halaman) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('halaman' + halaman.charAt(0).toUpperCase() + halaman.slice(1));
            if (target) target.classList.add('active');
            window.scrollTo(0, 0);
        }

        function kembaliKeDasbor() {
            if (kontenAsliDasbor) {
                document.getElementById('kontenDasbor').innerHTML = kontenAsliDasbor;
                updateHeader();
            }
            const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasMenu'));
            if (offcanvas) offcanvas.hide();
        }

        function updateHeader() {
            if (userAktif) {
                document.getElementById('namaUserDisplay').textContent = userAktif.nama;
                document.getElementById('offcanvasNamaUser').textContent = userAktif.nama;
                document.getElementById('offcanvasRoleUser').textContent = userAktif.role;
            }
        }

        // ============================================================
        // LOGIN & LOGOUT (dengan Hash MD5)
        // ============================================================
        function prosesLogin(event) {
            event.preventDefault();
            const u = document.getElementById('usernameLogin').value.trim();
            const p = document.getElementById('passwordLogin').value.trim();
            const notif = document.getElementById('notifikasiLogin');

            if (!u || !p) {
                notif.className = 'alert alert-warning';
                notif.innerHTML = 'Username dan Password wajib diisi!';
                notif.classList.remove('d-none');
                return false;
            }

            const hashInput = CryptoJS.MD5(p).toString();

            if (u === SUPERADMIN_USERNAME && hashInput === SUPERADMIN_PASSWORD_HASH) {
                userAktif = {
                    nama: 'SuperAdmin',
                    role: 'SuperAdmin',
                    kodeRole: 'SA',
                    idUser: 'ID_TK2R_SA-0001'
                };
                notif.className = 'alert alert-success';
                notif.innerHTML = 'Login SuperAdmin berhasil!';
                notif.classList.remove('d-none');
                setTimeout(() => {
                    notif.classList.add('d-none');
                    masukDasbor();
                }, 500);
                return false;
            }

            notif.className = 'alert alert-danger';
            notif.innerHTML = 'Username atau Password salah!';
            notif.classList.remove('d-none');
            return false;
        }

        function prosesLogout() {
            userAktif = null;
            tampilkanHalaman('login');
            document.getElementById('usernameLogin').value = '';
            document.getElementById('passwordLogin').value = '';
            const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasMenu'));
            if (offcanvas) offcanvas.hide();
        }

        // ============================================================
        // KONFIGURASI MENU SUPERADMIN
        // ============================================================
        const menuConfig = {
            'SA': {
                namaRole: 'SuperAdmin',
                menu: [
                    { nama: 'Dasbor', ikon: 'fas fa-tachometer-alt', aksi: 'dashboardUtama' },
                    { nama: 'Profil', ikon: 'fas fa-user', aksi: 'profil' },
                    { nama: 'Persetujuan Akun', ikon: 'fas fa-user-check', aksi: 'persetujuanAkun' },
                    { nama: 'Kelola Akun Aktif', ikon: 'fas fa-users-cog', aksi: 'kelolaAkun' },
                    { nama: 'Katalog Produk', ikon: 'fas fa-th-list', aksi: 'katalogProduk' },
                    { nama: 'Backup & Restore', ikon: 'fas fa-cloud-upload-alt', aksi: 'backupRestore' },
                    { nama: 'Setting Harga Aplikasi', ikon: 'fas fa-tags', aksi: 'settingHarga' }
                ]
            }
        };

        // ============================================================
        // RENDER MENU & DASBOR
        // ============================================================
        function masukDasbor() {
            tampilkanHalaman('dasbor');
            updateHeader();

            const konten = document.getElementById('kontenDasbor');
            if (!kontenAsliDasbor && konten) {
                kontenAsliDasbor = konten.innerHTML;
            }

            loadMenuNavigasi(userAktif.kodeRole);
            renderDasborSuperAdmin();
        }

        function loadMenuNavigasi(kodeRole) {
            const container = document.getElementById('menuNavigasi');
            const config = menuConfig[kodeRole];
            if (!config) {
                container.innerHTML = '<div class="text-center text-white">Menu tidak tersedia.</div>';
                return;
            }

            let htmlMenu = '';
            config.menu.forEach(item => {
                htmlMenu += `
                    <a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="handleMenuAction('${item.aksi}')">
                        <i class="${item.ikon} me-2" style="color:#FF8C00;"></i>${item.nama}
                    </a>
                `;
            });
            htmlMenu += `<hr class="border-secondary"><a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="prosesLogout()"><i class="fas fa-sign-out-alt me-2 text-danger"></i>Logout</a>`;
            container.innerHTML = htmlMenu;
        }

        function handleMenuAction(aksi) {
            const konten = document.getElementById('kontenDasbor');
            switch(aksi) {
                case 'dashboardUtama':
                    renderDasborSuperAdmin();
                    break;
                case 'profil':
                    konten.innerHTML = `
                        <div class="card border-0 shadow-sm p-4">
                            <h4><i class="fas fa-user me-2"></i>Profil SuperAdmin</h4>
                            <p><strong>Nama:</strong> ${userAktif.nama}</p>
                            <p><strong>ID:</strong> ${userAktif.idUser}</p>
                            <p><strong>Role:</strong> ${userAktif.role}</p>
                            <p><strong>Username:</strong> ${SUPERADMIN_USERNAME}</p>
                            <p class="text-muted">Halaman ini masih placeholder.</p>
                        </div>
                    `;
                    break;
                case 'persetujuanAkun':
                    konten.innerHTML = `
                        <div class="card border-0 shadow-sm p-4">
                            <h4><i class="fas fa-user-check me-2"></i>Persetujuan Akun</h4>
                            <p class="text-muted">Halaman Persetujuan Akun (placeholder).</p>
                        </div>
                    `;
                    break;
                case 'kelolaAkun':
                    konten.innerHTML = `
                        <div class="card border-0 shadow-sm p-4">
                            <h4><i class="fas fa-users-cog me-2"></i>Kelola Akun Aktif</h4>
                            <p class="text-muted">Halaman Kelola Akun Aktif (placeholder).</p>
                        </div>
                    `;
                    break;
                case 'katalogProduk':
                    konten.innerHTML = `
                        <div class="card border-0 shadow-sm p-4">
                            <h4><i class="fas fa-th-list me-2"></i>Katalog Produk</h4>
                            <p class="text-muted">Halaman Katalog Produk (placeholder).</p>
                        </div>
                    `;
                    break;
                case 'backupRestore':
                    konten.innerHTML = `
                        <div class="card border-0 shadow-sm p-4">
                            <h4><i class="fas fa-cloud-upload-alt me-2"></i>Backup & Restore</h4>
                            <p class="text-muted">Halaman Backup & Restore (placeholder).</p>
                        </div>
                    `;
                    break;
                case 'settingHarga':
                    konten.innerHTML = `
                        <div class="card border-0 shadow-sm p-4">
                            <h4><i class="fas fa-tags me-2"></i>Setting Harga Aplikasi</h4>
                            <p class="text-muted">Halaman Setting Harga (placeholder).</p>
                        </div>
                    `;
                    break;
                default:
                    renderDasborSuperAdmin();
            }
            const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasMenu'));
            if (offcanvas) offcanvas.hide();
        }

        function renderDasborSuperAdmin() {
            const konten = document.getElementById('kontenDasbor');
            konten.innerHTML = `
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm text-white" style="background: linear-gradient(135deg, #FF6B00 0%, #FF5500 100%);">
                            <div class="card-body py-3 text-center">
                                <h5 class="fw-bold">Selamat Datang, ${userAktif.nama}!</h5>
                                <p class="mb-0">Anda telah login sebagai SuperAdmin.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-4 g-3">
                    <div class="col-md-3 col-6">
                        <div class="card border-0 shadow-sm bg-light text-center p-3" style="cursor: pointer;" onclick="handleMenuAction('kelolaAkun')">
                            <i class="fas fa-users fa-2x mb-2" style="color:#FF8C00;"></i>
                            <h4 class="fw-bold">0</h4>
                            <small>Akun Aktif</small>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="card border-0 shadow-sm bg-light text-center p-3" style="cursor: pointer;" onclick="handleMenuAction('persetujuanAkun')">
                            <i class="fas fa-user-clock fa-2x mb-2" style="color:#FF6B00;"></i>
                            <h4 class="fw-bold">0</h4>
                            <small>Menunggu Persetujuan</small>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="card border-0 shadow-sm bg-light text-center p-3" style="cursor: pointer;" onclick="handleMenuAction('katalogProduk')">
                            <i class="fas fa-store fa-2x mb-2" style="color:#FF8C00;"></i>
                            <h4 class="fw-bold">0</h4>
                            <small>Total Toko</small>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="card border-0 shadow-sm bg-light text-center p-3" style="cursor: pointer;" onclick="handleMenuAction('profil')">
                            <i class="fas fa-user-shield fa-2x mb-2" style="color:#FF8C00;"></i>
                            <h4 class="fw-bold">${userAktif.nama}</h4>
                            <small>SuperAdmin</small>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
