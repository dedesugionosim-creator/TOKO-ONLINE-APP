    // ═══════════════════════════════════════════════════════════
    // [0.1.j.13] — cpJalankanAutoUpdate (Full Cycle)
    // ═══════════════════════════════════════════════════════════
    window.cpJalankanAutoUpdate = function(opts) {
        opts = opts || {};
        var cycle = {
            timestamp: new Date().toISOString(),
            scanBlok: null, scanFungsi: null,
            autoBlok: null, autoFungsi: null, autoRiwayat: null,
            validasi: null, refresh: null, anomali: []
        };

        try {
            cycle.scanBlok = window.cpScanBlokBaru();
            if (!opts.skipAuto) cycle.autoBlok = window.cpAutoCatatBlokBaru();
            cycle.scanFungsi = window.cpScanFungsiGlobal();
            if (!opts.skipAuto) cycle.autoFungsi = window.cpAutoCatatFungsiBaru();
            if (!opts.skipAuto) cycle.autoRiwayat = window.cpAutoCatatRiwayatBaru();
            if (!opts.skipValidasi) cycle.validasi = window.cpValidasiKonsistensi32();
            cycle.refresh = window.cpAutoRefreshAll();

            if (cycle.validasi && !cycle.validasi.ok) {
                cycle.validasi.detail.forEach(function(d) {
                    if (d.status === 'error') {
                        cycle.anomali.push(d.cek + ': ' + d.pesan);
                    }
                });
            }
            if (cycle.anomali.length > 0) {
                _anomali(cycle.anomali.length + ' masalah terdeteksi', cycle.anomali);
            }

            if (!opts.silent) {
                var s = '';
                if (cycle.autoBlok && cycle.autoBlok.ditambah > 0) {
                    s += ' +' + cycle.autoBlok.ditambah + ' blok';
                }
                if (cycle.autoFungsi && cycle.autoFungsi.ditambah > 0) {
                    s += ' +' + cycle.autoFungsi.ditambah + ' domain';
                }
                if (cycle.autoRiwayat && cycle.autoRiwayat.ditambah > 0) {
                    s += ' +' + cycle.autoRiwayat.ditambah + ' riwayat';
                }
                if (s) _log('🔄 Auto-cycle:' + s, 'success');
            }
            return cycle;
        } catch (e) {
            console.error('cpJalankanAutoUpdate error:', e);
            cycle.anomali.push('Exception: ' + e.message);
            return cycle;
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [0.1.j.14] — MONITOR: Start / Stop / Status
    // ═══════════════════════════════════════════════════════════
    var _intervalId = null;
    var _observer = null;
    var _cycleCount = 0;
    var _cycleAktif = false;

    window.cpStartAutoMonitor = function(opts) {
        opts = opts || {};
        try {
            window.cpStopAutoMonitor();
            var intervalMs = parseInt(opts.intervalMs, 10) ||
                             window.CPAJ_KONFIG.INTERVAL_MS;

            if (window.CPAJ_KONFIG.USE_INTERVAL) {
                _intervalId = setInterval(function() {
                    _cycleCount++;
                    window.cpJalankanAutoUpdate({ silent: true });
                }, intervalMs);
            }

            if (window.CPAJ_KONFIG.USE_OBSERVER &&
                typeof MutationObserver !== 'undefined') {
                try {
                    var target = document.body || document.documentElement;
                    if (target) {
                        _observer = new MutationObserver(function() {
                            if (_observer._debounce) clearTimeout(_observer._debounce);
                            _observer._debounce = setTimeout(function() {
                                window.cpJalankanAutoUpdate({
                                    silent: true,
                                    skipValidasi: true
                                });
                            }, 2000);
                        });
                        _observer.observe(target, { childList: true, subtree: true });
                    }
                } catch (e) {}
            }

            _cycleAktif = true;
            _log('🟢 Auto-monitor AKTIF (interval ' + (intervalMs/1000) + 's)', 'success');
            return { sukses: true, intervalMs: intervalMs, aktif: true };
        } catch (e) {
            console.error('cpStartAutoMonitor error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    window.cpStopAutoMonitor = function() {
        try {
            if (_intervalId) { clearInterval(_intervalId); _intervalId = null; }
            if (_observer) {
                try { _observer.disconnect(); } catch (e) {}
                _observer = null;
            }
            if (_cycleAktif) _log('🔴 Auto-monitor STOPPED', 'warning');
            _cycleAktif = false;
            return { sukses: true, aktif: false };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.cpMonitorStatus = function() {
        return {
            aktif: _cycleAktif,
            intervalId: !!_intervalId,
            observerId: !!_observer,
            cycleCount: _cycleCount,
            konfig: Object.assign({}, window.CPAJ_KONFIG)
        };
    };
