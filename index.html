<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- ═══ BLOK FBA-L4 — BUAT AKUN SA (UNIVERSAL PENDING) 🇮🇩 v1.0 ═ -->
<!-- ═══ Layer: L4 (Fungsi Global Domain — Akun Creation) ═══════ -->
<!-- ═══ Guard: _fbaL4DoneV1 (A32) · Versi: 1.0 ════════════════ -->
<!-- ═══ Dep: CS1, CS2, CS5, CS7, CS15, CS17, GID, MN, MD ══════ -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- ═══ Aturan yang DIPATUHI (24):                                -->
<!-- ═══   A1, A2, A3, A5, A7, A10, A11, A12, A13, A18, A19,     -->
<!-- ═══   A25, A26, A28, A29, A30, A31, A32, A33, A34, A35,    -->
<!-- ═══   A36, A38, A39, A40, A41, A42 ═══════════════════════ -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- ═══ KONSEP:                                                   -->
<!-- ═══   • SA buat akun: role + username + password SAJA         -->
<!-- ═══   • Status: PENDING + _isIncomplete: true                -->
<!-- ═══   • User login → FORCE lengkapi profil                    -->
<!-- ═══   • 15 role verif → SA verif via CS17                     -->
<!-- ═══   • 17 role non-verif → auto Aktif setelah lengkapi       -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<script>
(function BLOK_FBA_L4_V1() {
    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.0] — GUARD + DEPENDENCY (A32)
    // ═══════════════════════════════════════════════════════════
    if (window._fbaL4DoneV1) {
        console.log('ℹ️ FBA-L4 v1.0 sudah terpasang.');
        return;
    }
    if (!window.csLoadJSON || !window.csSaveJSON) {
        console.warn('⚠️ FBA-L4: CS2 belum siap. Ditunda.');
        return;
    }
    if (!window.CS_ROLE_MAP) {
        console.warn('⚠️ FBA-L4: CS_ROLE_MAP belum ada. Ditunda.');
        return;
    }
    window._fbaL4DoneV1 = true;
    window._fbaL4Versi  = '1.0';

    // Register CS_KEY prefix (A18)
    if (window.CS_KEY) {
        window.CS_KEY.FBAL4_LOG = window.CS_KEY.FBAL4_LOG || 'fbaL4_log';
    }

    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.1] — KONSTANTA
    // ═══════════════════════════════════════════════════════════
    var ROLE_TIDAK_BOLEH_DIBUAT = ['SA'];   // SA hardcoded
    var ROLE_BUTUH_NIK_DEFAULT = [
        'SA_STAF','MKT','TGH','CS','EO','SOT','SOO','ORG','IND',
        'TK','PP','PM','COD','OJ','GR','DST','DP','FIN','DLR','JS',
        'KDMP_PUSAT','KDMP_KAB','KDMP_KEC','KDMP_DESA'
    ];
    var ROLE_BUTUH_VERIF_15 = [
        'TK','PP','PM','COD','OJ','GR','DST','DP','FIN','DLR','JS',
        'KDMP_PUSAT','KDMP_KAB','KDMP_KEC','KDMP_DESA'
    ];

    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.2] — HELPER INTERNAL (A19, A25)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) {
        try {
            var v = window.csLoadJSON(key, def);
            if (Array.isArray(def) && !Array.isArray(v)) return def;
            if (def && typeof def === 'object' && !Array.isArray(def) &&
                (!v || typeof v !== 'object' || Array.isArray(v))) return def;
            return v;
        } catch (e) { return def; }
    }
    function _save(key, data) {
        try { return window.csSaveJSON(key, data, { backup: false }); }
        catch (e) { return { sukses: false, pesan: e.message }; }
    }
    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }
    function _catatLog(aksi, detail) {
        try {
            if (typeof window.catatAktivitasGlobal === 'function') {
                window.catatAktivitasGlobal(
                    window.gidIdUser ? window.gidIdUser() : 'SA',
                    aksi, detail, { kategori: 'Akun', level: 'info' }
                );
            }
        } catch (e) {}
    }
    function _roleButuhNik(kodeRole) {
        if (typeof window.csRoleButuhNik === 'function') {
            return window.csRoleButuhNik(kodeRole);
        }
        return ROLE_BUTUH_NIK_DEFAULT.indexOf(kodeRole) !== -1;
    }
    function _roleButuhVerif(kodeRole) {
        if (typeof window.csRoleButuhVerif === 'function') {
            return window.csRoleButuhVerif(kodeRole);
        }
        return ROLE_BUTUH_VERIF_15.indexOf(kodeRole) !== -1;
    }
    function _dokumenWajib(kodeRole) {
        if (typeof window.fvdDokumenWajib === 'function') {
            return window.fvdDokumenWajib(kodeRole) || [];
        }
        if (window.CS17_DOKUMEN_WAJIB && window.CS17_DOKUMEN_WAJIB[kodeRole]) {
            return window.CS17_DOKUMEN_WAJIB[kodeRole];
        }
        return [];
    }

    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.3] — CREATE (A26 idempotent — cek username unik)
    // ═══════════════════════════════════════════════════════════
    window.fbaL4CekBolehBuat = function(kodeRole) {
        if (!kodeRole) return { boleh: false, alasan: 'kodeRole kosong' };
        if (ROLE_TIDAK_BOLEH_DIBUAT.indexOf(kodeRole) !== -1) {
            return { boleh: false, alasan: 'Role SA hardcoded — hanya via SA-HARD' };
        }
        if (!window.CS_ROLE_MAP[kodeRole]) {
            return { boleh: false, alasan: 'Kode role tidak dikenal: ' + kodeRole };
        }
        return { boleh: true, info: window.CS_ROLE_MAP[kodeRole] };
    };

    window.fbaL4CekUsername = function(username) {
        if (!username) return { tersedia: false, pesan: 'Username kosong' };
        var str = String(username).trim();
        if (str.length < 5) {
            return { tersedia: false, pesan: 'Username minimal 5 karakter' };
        }
        if (!/^[a-zA-Z0-9._-]+$/.test(str)) {
            return { tersedia: false,
                     pesan: 'Username hanya huruf, angka, titik, minus, underscore' };
        }
        var users = _load('dataLoginUser', []);
        var lower = str.toLowerCase();
        var exists = users.some(function(u) {
            return u && u.username && String(u.username).toLowerCase() === lower;
        });
        if (exists) return { tersedia: false, pesan: 'Username sudah dipakai' };
        return { tersedia: true, pesan: 'Username tersedia' };
    };

    window.fbaL4GeneratePassword = function(len) {
        var n = parseInt(len, 10) || 10;
        if (n < 6) n = 6;
        if (n > 32) n = 32;
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$';
        var pass = '';
        for (var i = 0; i < n; i++) {
            pass += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return pass;
    };

    window.fbaL4BuatAkun = function(kodeRole, username, password, opts) {
        opts = opts || {};
        try {
            // 1. Validasi role
            var cekRole = window.fbaL4CekBolehBuat(kodeRole);
            if (!cekRole.boleh) {
                return { sukses: false, pesan: cekRole.alasan };
            }
            // 2. Validasi username
            var cekUser = window.fbaL4CekUsername(username);
            if (!cekUser.tersedia) {
                return { sukses: false, pesan: cekUser.pesan };
            }
            // 3. Validasi password
            if (!password || String(password).length < 6) {
                return { sukses: false, pesan: 'Password minimal 6 karakter' };
            }

            // 4. Generate ID (CS5)
            var idUser = (typeof window.generateKodeUnik === 'function')
                ? window.generateKodeUnik(kodeRole)
                : 'ID_R2C_' + kodeRole + '-' +
                  String(Date.now() % 1000000).padStart(6, '0');

            var infoRole   = window.CS_ROLE_MAP[kodeRole];
            var now        = _now();
            var butuhVerif = _roleButuhVerif(kodeRole);
            var idSA       = window.gidIdUser ? window.gidIdUser() : 'SA';

            // 5. Susun objek akun PENDING + _isIncomplete
            var akun = {
                idUser:            idUser,
                id:                idUser,
                username:          String(username).trim(),
                password:          String(password),
                kodeRole:          kodeRole,
                role:              infoRole.nama || kodeRole,
                status:            'Pending',
                statusVerifikasi:  'Pending',

                // ⭐ Flag khusus FBA-L4
                _isIncomplete:      true,
                _createdBySA:       true,
                _createdBy:         idSA,
                _createdAt:         now,
                _profileCompleted:  false,
                _profileCompletedAt: null,

                // ═══ Field kosong (user lengkapi nanti) ═══
                nama:              null,
                namaLengkap:       null,
                nik_ktp:           null,
                hp:                null,
                email:             String(username).trim() + '@pending.r2coin.id',
                alamat:            null,
                alamatKtp:         null,
                lat:               null,
                lng:               null,
                fotoUrl:           null,

                // ═══ Relasi (diisi user saat lengkapi) ═══
                idInduk:           null,
                idOwner:           null,
                ownerId:           null,

                // ═══ Meta ═══
                createdBy:         'SA_CREATE',
                createdAt:         now,
                tipePendaftaran:   'SA_CREATED',
                butuhVerif:        butuhVerif,
                catatanSA:         String(opts.catatan || '').substring(0, 500)
            };

            // 6. Save ke dataLoginUser
            var users = _load('dataLoginUser', []);
            users.push(akun);
            var saveRes = _save('dataLoginUser', users);
            if (!saveRes.sukses) {
                return { sukses: false, pesan: 'Gagal simpan: ' + (saveRes.pesan || '?') };
            }

            // 7. Sync global
            try {
                if (Array.isArray(window.dataLoginUser)) {
                    window.dataLoginUser.length = 0;
                    users.forEach(function(u) { window.dataLoginUser.push(u); });
                }
            } catch (e) {}

            // 8. Audit
            _catatLog('FBA-L4 Buat Akun',
                kodeRole + ' — ' + akun.username + ' (PENDING, _isIncomplete)');

            return {
                sukses:     true,
                idUser:     idUser,
                username:   akun.username,
                password:   akun.password,
                kodeRole:   kodeRole,
                status:     'Pending',
                butuhVerif: butuhVerif,
                pesan:      'Akun dibuat PENDING. User wajib lengkapi profil.' +
                            (butuhVerif ? ' Lalu verifikasi SA.' : ' Lalu auto Aktif.')
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fbaL4BuatBatch = function(listAkun) {
        try {
            if (!Array.isArray(listAkun)) {
                return { sukses: false, pesan: 'listAkun harus array' };
            }
            if (listAkun.length > 50) {
                return { sukses: false, pesan: 'Maksimal 50 akun per batch' };
            }
            var berhasil = 0, gagal = 0, list = [];
            listAkun.forEach(function(item, idx) {
                if (!item || !item.kodeRole || !item.username || !item.password) {
                    gagal++;
                    list.push({ index: idx, sukses: false,
                                pesan: 'Data tidak lengkap (kodeRole, username, password)' });
                    return;
                }
                var r = window.fbaL4BuatAkun(
                    item.kodeRole, item.username, item.password,
                    { catatan: item.catatan }
                );
                if (r.sukses) {
                    berhasil++;
                    list.push({
                        index: idx, sukses: true,
                        idUser: r.idUser, username: r.username,
                        password: r.password, kodeRole: r.kodeRole
                    });
                } else {
                    gagal++;
                    list.push({ index: idx, sukses: false,
                                username: item.username, pesan: r.pesan });
                }
            });
            return { sukses: true, berhasil: berhasil, gagal: gagal, list: list };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.4] — PENDING MANAGEMENT
    // ═══════════════════════════════════════════════════════════
    window.fbaL4ListPending = function(filter) {
        filter = filter || {};
        try {
            var users = _load('dataLoginUser', []);
            return users.filter(function(u) {
                if (!u || u._createdBySA !== true) return false;
                if (u.status === 'Aktif') return false;
                if (filter.kodeRole && u.kodeRole !== filter.kodeRole) return false;
                if (filter.incomplete === true && u._isIncomplete !== true) return false;
                if (filter.incomplete === false && u._isIncomplete !== false) return false;
                return true;
            });
        } catch (e) { return []; }
    };

    window.fbaL4CekStatusAkun = function(idUser) {
        try {
            if (!idUser) return null;
            var users = _load('dataLoginUser', []);
            var u = users.find(function(x) {
                return x && (x.idUser === idUser || x.id === idUser);
            });
            if (!u) return null;
            return {
                idUser:             u.idUser || u.id,
                username:           u.username,
                kodeRole:           u.kodeRole,
                role:               u.role,
                status:             u.status,
                statusVerifikasi:   u.statusVerifikasi,
                _isIncomplete:      u._isIncomplete,
                _profileCompleted:  u._profileCompleted,
                _profileCompletedAt: u._profileCompletedAt,
                butuhVerif:         u.butuhVerif || _roleButuhVerif(u.kodeRole),
                dokumenWajib:       _dokumenWajib(u.kodeRole),
                nama:               u.nama,
                nik_ktp:            u.nik_ktp,
                hp:                 u.hp,
                email:              u.email
            };
        } catch (e) { return null; }
    };

    window.fbaL4StatistikPending = function() {
        try {
            var list = window.fbaL4ListPending();
            var perRole = {}, incomplete = 0, selesaiLengkapi = 0;
            list.forEach(function(u) {
                perRole[u.kodeRole] = (perRole[u.kodeRole] || 0) + 1;
                if (u._isIncomplete === true) incomplete++;
                else selesaiLengkapi++;
            });
            return {
                total:            list.length,
                incomplete:       incomplete,
                selesaiLengkapi:  selesaiLengkapi,
                perRole:          perRole
            };
        } catch (e) { return { total: 0 }; }
    };

    window.fbaL4BatalBuat = function(idUser) {
        try {
            if (!idUser) return { sukses: false, pesan: 'idUser kosong' };
            var users = _load('dataLoginUser', []);
            var idx = users.findIndex(function(u) {
                return u && (u.idUser === idUser || u.id === idUser);
            });
            if (idx === -1) return { sukses: false, pesan: 'Akun tidak ditemukan' };
            var u = users[idx];
            if (u._createdBySA !== true) {
                return { sukses: false, pesan: 'Bukan akun buatan SA' };
            }
            if (u._isIncomplete !== true) {
                return { sukses: false, pesan: 'User sudah lengkapi, tidak bisa batal' };
            }
            users.splice(idx, 1);
            _save('dataLoginUser', users);
            _catatLog('FBA-L4 Batal', u.kodeRole + ' — ' + u.username);
            return { sukses: true, pesan: 'Akun PENDING dibatalkan' };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.fbaL4ResetPassword = function(idUser, newPassword) {
        try {
            if (!idUser) return { sukses: false, pesan: 'idUser kosong' };
            if (!newPassword || String(newPassword).length < 6) {
                return { sukses: false, pesan: 'Password minimal 6 karakter' };
            }
            var users = _load('dataLoginUser', []);
            var idx = users.findIndex(function(u) {
                return u && (u.idUser === idUser || u.id === idUser);
            });
            if (idx === -1) return { sukses: false, pesan: 'Akun tidak ditemukan' };
            users[idx].password = String(newPassword);
            users[idx].passwordUpdatedAt = _now();
            users[idx].passwordUpdatedBy = window.gidIdUser ? window.gidIdUser() : 'SA';
            _save('dataLoginUser', users);
            _catatLog('FBA-L4 Reset Password', users[idx].username);
            return { sukses: true, pesan: 'Password direset' };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.5] — PROFILE COMPLETION (User Side)
    // ═══════════════════════════════════════════════════════════
    window.fbaL4CekPerluLengkapi = function() {
        try {
            var idUser = window.gidIdUser ? window.gidIdUser() : null;
            if (!idUser) return { perlu: false, pesan: 'Tidak ada user aktif — login dulu' };
            var users = _load('dataLoginUser', []);
            var u = users.find(function(x) {
                return x && (x.idUser === idUser || x.id === idUser);
            });
            if (!u) return { perlu: false, pesan: 'User tidak ditemukan' };
            if (u._createdBySA !== true) {
                return { perlu: false, pesan: 'Bukan akun buatan SA' };
            }
            if (u._isIncomplete !== true) {
                return { perlu: false, pesan: 'Profil sudah lengkap', status: u.status };
            }
            return {
                perlu:         true,
                role:          u.kodeRole,
                butuhVerif:    u.butuhVerif || _roleButuhVerif(u.kodeRole),
                butuhNik:      _roleButuhNik(u.kodeRole),
                dokumenWajib:  _dokumenWajib(u.kodeRole),
                pesan:         'Profil belum lengkap, wajib dilengkapi'
            };
        } catch (e) { return { perlu: false, pesan: e.message }; }
    };

    window.fbaL4MulaiLengkapi = function() {
        try {
            var cek = window.fbaL4CekPerluLengkapi();
            if (!cek.perlu) return { sukses: false, pesan: cek.pesan };
            var schema = {
                role: cek.role,
                fields: [
                    { name: 'nama',   label: 'Nama Lengkap',  type: 'text',   wajib: true },
                    { name: 'hp',     label: 'Nomor HP',      type: 'tel',    wajib: true },
                    { name: 'email',  label: 'Email',         type: 'email',  wajib: true },
                    { name: 'alamat', label: 'Alamat',        type: 'text',   wajib: true },
                    { name: 'lat',    label: 'Latitude',      type: 'number', wajib: true },
                    { name: 'lng',    label: 'Longitude',     type: 'number', wajib: true }
                ],
                nik: {
                    wajib: cek.butuhNik,
                    type: 'text',
                    length: 16
                },
                dokumen:   cek.dokumenWajib,
                butuhVerif: cek.butuhVerif
            };
            return { sukses: true, schema: schema };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.fbaL4SimpanProfil = function(data) {
        try {
            data = data || {};
            var idUser = window.gidIdUser ? window.gidIdUser() : null;
            if (!idUser) return { sukses: false, pesan: 'Tidak ada user aktif — login dulu' };

            var users = _load('dataLoginUser', []);
            var idx = users.findIndex(function(u) {
                return u && (u.idUser === idUser || u.id === idUser);
            });
            if (idx === -1) return { sukses: false, pesan: 'User tidak ditemukan' };
            var u = users[idx];

            if (u._createdBySA !== true) {
                return { sukses: false, pesan: 'Bukan akun buatan SA' };
            }

            // Validasi field wajib
            if (!data.nama)   return { sukses: false, pesan: 'Nama wajib diisi' };
            if (!data.hp)     return { sukses: false, pesan: 'HP wajib diisi' };
            if (!data.email)  return { sukses: false, pesan: 'Email wajib diisi' };
            if (!data.alamat) return { sukses: false, pesan: 'Alamat wajib diisi' };
            if (!data.lat || !data.lng) {
                return { sukses: false, pesan: 'Koordinat wajib diisi' };
            }

            var butuhNik = _roleButuhNik(u.kodeRole);
            if (butuhNik) {
                if (!data.nik || String(data.nik).length !== 16) {
                    return { sukses: false, pesan: 'NIK wajib 16 digit' };
                }
                if (!/^[0-9]{16}$/.test(String(data.nik))) {
                    return { sukses: false, pesan: 'NIK harus angka 16 digit' };
                }
            }

            if (typeof window.csValidasiEmail === 'function' &&
                !window.csValidasiEmail(data.email)) {
                return { sukses: false, pesan: 'Format email tidak valid' };
            }
            if (typeof window.csValidasiHp === 'function' &&
                !window.csValidasiHp(data.hp)) {
                return { sukses: false, pesan: 'Format HP tidak valid' };
            }

            // Update field profil
            u.nama        = String(data.nama).trim();
            u.namaLengkap = u.nama;
            u.hp          = String(data.hp).trim();
            u.email       = String(data.email).trim();
            u.alamat      = String(data.alamat).trim();
            u.alamatKtp   = u.alamat;
            u.lat         = parseFloat(data.lat);
            u.lng         = parseFloat(data.lng);

            if (butuhNik) u.nik_ktp = String(data.nik);
            if (data.fotoKtp) u.fotoKtp = data.fotoKtp;
            if (Array.isArray(data.dokumen) && data.dokumen.length > 0) {
                u.dokumen = data.dokumen;
            }

            // Set flag complete
            u._isIncomplete     = false;
            u._profileCompleted = true;
            u._profileCompletedAt = _now();

            var butuhVerif = _roleButuhVerif(u.kodeRole);
            u.butuhVerif   = butuhVerif;

            var statusBaru = 'Pending';
            if (!butuhVerif) {
                statusBaru = 'Aktif';
                u.status           = 'Aktif';
                u.statusVerifikasi = 'Aktif';
            } else {
                u.status           = 'Pending';
                u.statusVerifikasi = 'Pending';
            }

            var saveRes = _save('dataLoginUser', users);
            if (!saveRes.sukses) {
                return { sukses: false, pesan: saveRes.pesan };
            }

            // Kalau langsung Aktif → save ke dataAkunAktif
            if (statusBaru === 'Aktif') {
                var aktif = _load('dataAkunAktif', []);
                var idxA = aktif.findIndex(function(a) {
                    return a && (a.idUser === idUser || a.id === idUser);
                });
                if (idxA === -1) {
                    aktif.push(Object.assign({}, u));
                } else {
                    aktif[idxA] = Object.assign({}, u);
                }
                _save('dataAkunAktif', aktif);
            }

            // Sync global
            try {
                if (Array.isArray(window.dataLoginUser)) {
                    window.dataLoginUser.length = 0;
                    users.forEach(function(x) { window.dataLoginUser.push(x); });
                }
            } catch (e) {}

            _catatLog('FBA-L4 Lengkapi Profil',
                u.kodeRole + ' — ' + u.username + ' → ' + statusBaru);

            return {
                sukses:         true,
                status:         statusBaru,
                _isIncomplete:  false,
                butuhVerif:     butuhVerif,
                pesan:          butuhVerif
                    ? 'Profil lengkap, menunggu verifikasi SA'
                    : 'Profil lengkap, akun langsung aktif'
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fbaL4AjukanVerifikasi = function() {
        try {
            var idUser = window.gidIdUser ? window.gidIdUser() : null;
            if (!idUser) return { sukses: false, pesan: 'Tidak ada user aktif' };
            if (typeof window.csNotifInfo === 'function') {
                window.csNotifInfo('Pengajuan Verifikasi',
                    'Pengajuan verifikasi Anda sedang diproses SA');
            }
            return { sukses: true, pesan: 'Pengajuan diteruskan ke SA' };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.6] — HOOK FORCE REDIRECT (login pertama)
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('r2coin:user-login', function(e) {
        try {
            var user = e && e.detail && e.detail.user;
            if (!user || user._isIncomplete !== true) return;
            setTimeout(function() {
                try {
                    window.dispatchEvent(new CustomEvent('r2coin:force-complete-profile', {
                        detail: {
                            idUser:   user.idUser || user.id,
                            kodeRole: user.kodeRole
                        }
                    }));
                } catch (err) {}
                if (typeof window.tampilkanLengkapiProfil === 'function') {
                    window.tampilkanLengkapiProfil();
                } else if (typeof window.csToast === 'function') {
                    window.csToast('⚠️ Lengkapi profil Anda terlebih dahulu', 'warning');
                }
            }, 400);
        } catch (err) {}
    });

            return { sukses: false, pesan: 'MN belum terpasang' };

        return window.mnKirimKeMenu({
            tipe: tipe || 'fbaL4',
            dari: {
                idUser:   window.gidIdUser ? window.gidIdUser() : null,
                kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                menu:     'FBA-L4',
                blok:     'L4-FBA-L4'
            },
            ke: ke || { menu: 'FBA-L4' },
            data: data || {},
            idRef: idRef || null,
            timestamp: _now()
        });
    };

    window.terimaFBAL4 = function(aksiMenu) {
        if (typeof window.mnInboxMenu !== 'function') return [];
        return window.mnInboxMenu(aksiMenu || 'FBA-L4');
    };

    window.ambilFBAL4 = function(filter) {
        filter = filter || {};
        switch (filter.tipe || 'pending') {
            case 'pending':   return window.fbaL4ListPending(filter);
            case 'statistik': return window.fbaL4StatistikPending();
            case 'status':    return window.fbaL4CekStatusAkun(filter.idUser);
            case 'role':      return window.fbaL4DaftarRoleBisaDibuat();
            default:          return null;
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.8] — HELPER PUBLIK
    // ═══════════════════════════════════════════════════════════
    window.fbaL4DaftarRoleBisaDibuat = function() {
        var list = [];
        if (!window.CS_ROLE_MAP) return list;
        Object.keys(window.CS_ROLE_MAP).forEach(function(kode) {
            if (ROLE_TIDAK_BOLEH_DIBUAT.indexOf(kode) !== -1) return;
            var info = window.CS_ROLE_MAP[kode];
            list.push({
                kode:          kode,
                nama:          info.nama,
                kategori:      info.kategori,
                butuhVerif:    _roleButuhVerif(kode),
                butuhNik:      _roleButuhNik(kode),
                dokumenWajib:  _dokumenWajib(kode)
            });
        });
        return list;
    };

    window.fbaL4InfoDokumenWajib = function(kodeRole) {
        return _dokumenWajib(kodeRole);
    };

    window.fbaL4InfoAlur = function(kodeRole) {
        var info = window.CS_ROLE_MAP[kodeRole];
        if (!info) return null;
        var butuhVerif = _roleButuhVerif(kodeRole);
        return {
            role: kodeRole,
            nama: info.nama,
            alur: butuhVerif ? 'PENDING_VERIF' : 'PENDING_AUTO',
            langkah: [
                '1. SA buat akun (username + password)',
                '2. User login → wajib lengkapi profil',
                '3. User isi: nama, hp, email, alamat, koordinat' +
                    (_roleButuhNik(kodeRole) ? ', NIK 16 digit' : ''),
                butuhVerif
                    ? '4. SA verifikasi dokumen (CS17)'
                    : '4. Akun otomatis aktif setelah lengkapi',
                butuhVerif ? '5. Akun aktif' : '5. Selesai'
            ]
        };
    };

    // ═══════════════════════════════════════════════════════════
    // [FBA-L4.9] — DEBUG (A5)

            fungsi: {

                fbaL4StatistikPending:  typeof window.fbaL4StatistikPending,
                fbaL4BatalBuat:         typeof window.fbaL4BatalBuat,

                fbaL4CekPerluLengkapi:  typeof window.fbaL4CekPerluLengkapi,
                fbaL4MulaiLengkapi:     typeof window.fbaL4MulaiLengkapi,
                fbaL4SimpanProfil:      typeof window.fbaL4SimpanProfil,
                fbaL4AjukanVerifikasi:  typeof window.fbaL4AjukanVerifikasi,
                kirimFBAL4:             typeof window.kirimFBAL4,
                terimaFBAL4:            typeof window.terimaFBAL4,
                ambilFBAL4:             typeof window.ambilFBAL4,
                fbaL4DaftarRoleBisaDibuat: typeof window.fbaL4DaftarRoleBisaDibuat,
                fbaL4InfoDokumenWajib:  typeof window.fbaL4InfoDokumenWajib,
                fbaL4InfoAlur:          typeof window.fbaL4InfoAlur,
                debugFBAL4:             typeof window.debugFBAL4

        };
        console.log('🔍 debugFBAL4 v1.0:', info);
