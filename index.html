<script>

    // ═══════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════

    // ── 2a. Escape HTML (delegasi CS4 / MPP / GID) ──
    function _esc(s) {
        if (typeof window.csEscHtml === 'function') return window.csEscHtml(s);
        if (typeof window.mppEscHtml === 'function') return window.mppEscHtml(s);
        var d = document.createElement('div');
        d.textContent = String(s == null ? '' : s);
        return d.innerHTML;
    }
    window.mnNavEsc = _esc;

    // ── 2b. Escape untuk string JS inline onclick ──
    function _escJs(s) {
        return String(s == null ? '' : s)
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'")
            .replace(/"/g, '\\"')
            .replace(/\n/g, '\\n')
            .replace(/\r/g, '\\r');
    }

    // ── 2c. Timestamp ──

    }

    // ── 2e. Normalisasi teks kategori ──
    function _normKategori(k) {
        var s = String(k == null ? '' : k).trim();

    }

    // ═══════════════════════════════════════════════════════════
    // [MODUL 3] — HELPER RESOLVER (4 fungsi)

    // ── 3a. Ambil menuConfig per role ──
    function _getMenuConfig(kodeRole) {
        try {
            var cfg = window.menuConfig || {};
            return cfg[kodeRole] || null;
        } catch (e) { return null; }
    }

    // ── 3b. Resolve kodeRole aktif ──
    function _getKodeRoleAktif(kodeRole) {
        if (kodeRole) return kodeRole;
        try {
            if (typeof window.gidKodeRoleUser === 'function') {
                var k = window.gidKodeRoleUser();
                if (k) return k;
            }
        } catch (e) {}
        try {
            var u = (typeof window.getUserAktif === 'function')
                ? window.getUserAktif() : window.userAktif;
            if (u) {
                if (u.kodeRole) return u.kodeRole;
                if (u.role && typeof window.csKodeRoleDariNama === 'function') {
                    return window.csKodeRoleDariNama(u.role);
                }
            }
        } catch (e) {}
        return null;
    }

    // ── 3c. Resolve status user aktif ──
    function _getStatusUserAktif(statusUser) {
        if (statusUser) return statusUser;
        try {
            var u = (typeof window.getUserAktif === 'function')
                ? window.getUserAktif() : window.userAktif;
            if (u) return (u.statusVerifikasi || u.status || 'Aktif');
        } catch (e) {}
        return 'Aktif';
    }

    // ── 3d. Cek user sudah Aktif (boleh akses semua menu) ──
    function _userSudahAktif(statusUser) {
        var s = String(statusUser || '').toLowerCase();
        return (s === 'aktif' || s === 'active');
    }

    function _getAksiPending() {
        try {
            if (window.FPV_KONSTANTA &&
                Array.isArray(window.FPV_KONSTANTA.AKSI_PENDING) &&
                window.FPV_KONSTANTA.AKSI_PENDING.length > 0) {
                return window.FPV_KONSTANTA.AKSI_PENDING.slice();
            }
        } catch (e) {}
        return window.MN_NAV_AKSI_PENDING_FALLBACK.slice();
    }

    // ── 4b. Filter menu sesuai status user ──
    //   Aktif    → semua menu ditampilkan
    //   Pending  → hanya menu di AKSI_PENDING + flag onlyPending
    function _filterMenuSesuaiStatus(menuList, statusUser) {
        if (!Array.isArray(menuList)) return [];
        if (_userSudahAktif(statusUser)) return menuList.slice();

        var allowed = _getAksiPending();
        return menuList.filter(function(m) {
            if (!m || !m.aksi) return false;
            if (m.onlyPending === true) return true;
            return allowed.indexOf(m.aksi) !== -1;
        });
    }

    // ── 4c. Group menu per kategori ──
    //   Return: { "Nama Kategori": [menu1, menu2, ...], ... }
    //   Urutan kategori mengikuti urutan kemunculan pertama
    function _groupByKategori(menuList) {
        if (!Array.isArray(menuList)) return {};
        var hasil = {};
        var urutan = [];
        menuList.forEach(function(m) {
            if (!m) return;
            var kat = _normKategori(m.kategori);
            if (!hasil[kat]) { hasil[kat] = []; urutan.push(kat); }
            hasil[kat].push(m);
        });
        // Rebuild object dengan urutan yang benar
        var hasilUrut = {};
        urutan.forEach(function(k) { hasilUrut[k] = hasil[k]; });
        return hasilUrut;
    }

    // ── 4d. Hitung badge menu (unread count dari MN) ──
    function _getBadgeCount(aksi) {
        try {
            if (typeof window.mnHitungBadgeMenu === 'function') {
                var n = parseInt(window.mnHitungBadgeMenu(aksi), 10) || 0;
                return n > 0 ? n : 0;
            }
        } catch (e) {}
        return 0;
    }

    // [MODUL 5] — HELPER BUKA MENU (4-lapis fallback)
    // ═══════════════════════════════════════════════════════════
    function _bukaAksi(aksi, nama) {
        if (!aksi) return false;
        try {
            // Lapis 1: menuHandlers[aksi]
            if (window.menuHandlers &&
                typeof window.menuHandlers[aksi] === 'function') {
                return window.menuHandlers[aksi]({ nama: nama, aksi: aksi });
            }
            // Lapis 2: window[aksi] langsung
            if (typeof window[aksi] === 'function') {
                return window[aksi]({ nama: nama, aksi: aksi });
            }
            // Lapis 3: mnBukaMenu (Menu Network)
            if (typeof window.mnBukaMenu === 'function') {
                return window.mnBukaMenu(aksi, { nama: nama });
            }
            // Lapis 4: placeholder
            if (typeof window.tampilkanPlaceholderMenu === 'function') {
                return window.tampilkanPlaceholderMenu(nama || aksi, aksi);
            }
            console.warn('[9.3.2(0)] Handler tidak ditemukan untuk aksi:', aksi);
            return false;
        } catch (e) {
            console.error('[9.3.2(0)] _bukaAksi error:', e);
            return false;
        }
    }

    // ═══════════════════════════════════════════════════════════
    // [MODUL 6] — RENDER ITEM MENU (1 item)
    // ═══════════════════════════════════════════════════════════
    function _renderItemMenu(m, opts) {
        if (!m || !m.aksi) return '';
        opts = opts || {};

        var ikon    = _esc(m.ikon || 'fas fa-circle');
        var nama    = _esc(m.nama || '-');
        var aksiEsc = _escJs(m.aksi);
        var namaEsc = _escJs(m.nama || '');
        var badge   = _getBadgeCount(m.aksi);
        var badgeHtml = badge > 0
            ? '<span class="badge bg-danger rounded-pill ms-auto">' +
              (badge > 99 ? '99+' : badge) + '</span>'
            : '';

        // Tandai menu aktif (opsional kalau ada state)
        var aktifCls = '';
        try {
            if (window.menuAktifSaatIni === m.aksi) {
                aktifCls = ' active-menu-nav';
            }
        } catch (e) {}

        return '' +
            '<a href="#" ' +
               'class="list-group-item list-group-item-action bg-dark text-white ' +
                       'border-secondary py-2 d-flex align-items-center' +
                       aktifCls + '" ' +
               'data-aksi="' + _esc(m.aksi) + '" ' +
               'onclick="event.preventDefault();' +
                         'window.bukaMenuNavigasi(\'' + aksiEsc + '\',\'' + namaEsc + '\');' +
                         'return false;">' +
                '<i class="' + ikon + ' me-2" ' +
                   'style="width:20px;color:#FF8C00;text-align:center;"></i>' +
                '<span class="small flex-grow-1">' + nama + '</span>' +
                badgeHtml +
            '</a>';
    }

    // ═══════════════════════════════════════════════════════════
    // [MODUL 7] — RENDER GRUP KATEGORI
    // ═══════════════════════════════════════════════════════════
    function _renderGrupKategori(kategori, menuList) {
        if (!Array.isArray(menuList) || menuList.length === 0) return '';

        var h = '' +
            '<div class="mt-3 mb-1 px-2 d-flex align-items-center">' +
                '<small class="text-uppercase text-warning fw-bold flex-grow-1" ' +
                       'style="font-size:10px;letter-spacing:0.5px;">' +
                    _esc(kategori) +
                '</small>' +
                '<span class="badge bg-secondary" style="font-size:9px;">' +
                    menuList.length +
                '</span>' +
            '</div>';

        menuList.forEach(function(m) {
            h += _renderItemMenu(m);
        });
        return h;
    }

    // [MODUL 8] — RENDER HEADER OFF-CANVAS (update #offcanvasNamaUser + #offcanvasRoleUser)

    function _renderHeaderOffcanvas(roleConfig, kodeRole, statusUser) {

            var namaUser = 'User';

                elNama.textContent = namaUser;

            var elRole = document.getElementById(

            if (elRole) {
                var namaRole = (roleConfig && roleConfig.namaRole)

                // Warna badge berdasarkan status

                    elRole.className = 'badge';
                    elRole.style.backgroundColor = '#FF8C00';

    function _renderMenuFallback(kodeRole) {

    // [MODUL 12] — FUNGSI UTAMA: loadMenuNavigasi
    // ═══════════════════════════════════════════════════════════
    // Dipanggil oleh:

    // ═══════════════════════════════════════════════════════════
    window.loadMenuNavigasi = function(kodeRole, statusUser) {
        try {
            // ── 1. Resolve kodeRole + statusUser ──
            var kr = _getKodeRoleAktif(kodeRole);
            if (!kr) {
                console.warn('[9.3.2(0)] Kode role tidak diketahui — abort.');
                return false;
            }
            var st = _getStatusUserAktif(statusUser);
            var isAktif = _userSudahAktif(st);

            // ── 2. Update header offcanvas ──
            var roleConfig = _getMenuConfig(kr);
