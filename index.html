	function renderInformasi() {
		var listContainer = document.getElementById('listInformasi');
		if (!listContainer) return;
		if (dataInformasi.length === 0) {
			listContainer.innerHTML = '<div class="text-center text-muted py-4">Belum ada pengumuman.</div>';
			return;
		}
		var html = '';
		dataInformasi.slice().reverse().forEach(function(item, idx) {
			var indexAsli = dataInformasi.length - 1 - idx;
			html += `
				<div class="card mb-2 border-0 shadow-sm bg-light">
					<div class="card-body">
						<div class="d-flex justify-content-between align-items-start">
							<div>
								<p class="mb-1">${item.isi}</p>
								<small class="text-muted">Dipublikasikan: ${item.tanggal}</small>

							</button>
						</div>
					</div>
				</div>`;
		});
		listContainer.innerHTML = html;
	}

	function prosesLogout() {
		localStorage.removeItem('userAktif');

			clearInterval(intervalTimer);
			intervalTimer = null;
		}
		try {
			var offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasMenu'));
			if (offcanvas) offcanvas.hide();

			var menu = document.getElementById('offcanvasMenu');
			if (menu) menu.classList.remove('show');

		if (passInput) passInput.value = '';

		window.scrollTo(0, 0);

	<script>
	function getStatusOnlineAkun(idAkun) {
		var storedStatus = localStorage.getItem('dataStatusOnline');
		var dataStatusOnline = {};
		if (storedStatus) {
			try { dataStatusOnline = JSON.parse(storedStatus); }
			catch (e) { dataStatusOnline = {}; }
		}
		return dataStatusOnline[idAkun] || 'Online';
	}

	function getAllProdukDariSemuaToko() {
		var semuaProduk = [];
		var sellerRoles = ['Toko', 'Pedagang Pasar', 'Pedagang Makanan', 'COD Seller', 'Ojek', 'Grosir', 'Distributor'];
		dataAkunAktif.forEach(function(akun) {
			if (!sellerRoles.includes(akun.role)) return;
			var key = '';
			if (akun.role === 'Toko') key = 'dataProdukToko_' + akun.id;
			else if (akun.role === 'Pedagang Pasar') key = 'dataProdukPP_' + akun.id;
			else if (akun.role === 'Pedagang Makanan') key = 'dataProdukPM_' + akun.id;
			else if (akun.role === 'COD Seller') key = 'dataProdukCOD_' + akun.id;
			else if (akun.role === 'Ojek') key = 'dataProdukOJ_' + akun.id;
			else if (akun.role === 'Distributor') key = 'dataProdukDistributor_' + akun.id;
			else if (akun.role === 'Grosir') {
				var keyGrosir = 'dataProdukGrosir_' + akun.id;
				key = localStorage.getItem(keyGrosir) ? keyGrosir : 'dataProdukToko_' + akun.id;
			}
			var stored = localStorage.getItem(key);
			if (stored) {
				try {
					var produkList = JSON.parse(stored);
					produkList.forEach(function(produk) {
						produk.sellerId = akun.id;
						produk.sellerNama = akun.nama;
						produk.sellerRole = akun.role;
						semuaProduk.push(produk);
					});
				} catch (e) { console.warn('Data produk rusak dari ' + akun.nama); }
			}
		});
		return semuaProduk;
	}

	function getAllTransaksiGlobal() {
		var semuaTransaksi = [];
		var sellerRoles = ['Toko', 'Pedagang Pasar', 'Pedagang Makanan', 'COD Seller', 'Ojek', 'Grosir', 'Distributor'];
		dataAkunAktif.forEach(function(akun) {
			if (!sellerRoles.includes(akun.role)) return;
			var key = 'dataTransaksiOffline_' + akun.id;
			var stored = localStorage.getItem(key);
			if (stored) {
				try {
					var transaksiList = JSON.parse(stored);
					transaksiList.forEach(function(trx) {
						trx.namaToko = akun.nama;
						trx.idToko = akun.id;
						trx.roleToko = akun.role;
						trx.statusLanggananToko = akun.statusLangganan || 'Free';
						if (!trx.metodePembayaran) trx.metodePembayaran = 'Tunai';
						semuaTransaksi.push(trx);
					});
				} catch (e) { console.warn('Data transaksi rusak dari ' + akun.nama); }
			}
		});
		return semuaTransaksi;
	}

	function renderRunningText() {
		var container = document.getElementById('runningTextContent');
		if (!container) return;
		var aktif = dataRunningText.filter(function(item) { return item.status === 'Aktif'; });
		if (aktif.length === 0) {
			container.textContent = '';
			return;
		}

	function tampilkanDownloadSKU() {
		var konten = document.getElementById('kontenDasbor');
		if (!kontenAsliDasbor) kontenAsliDasbor = konten.innerHTML;

	function isiDataSKU() {
		var user = userAktif;
		if (!user) return;
		var stored = localStorage.getItem('profil_' + user.idUser);
		var profil = {};
		if (stored) {
			try { profil = JSON.parse(stored); } catch(e) { profil = {}; }
		}
		var namaLengkap = profil.namaLengkap || user.nama || '';
		var nik = user.nik_ktp || profil.nikKtp || '';
		var alamatKtp = profil.alamatKtp || profil.alamat || user.alamat || '';
		var hp = profil.hp || user.hp || '';
		var email = profil.email || user.email || '';
		var alamatUsaha = profil.alamat || user.alamat || '';
		var role = user.role;
		var namaUsahaDefault = '';
		if (['Toko', 'Pedagang Pasar', 'Pedagang Makanan', 'COD Seller', 'Ojek', 'Grosir'].includes(role)) {
			namaUsahaDefault = profil.namaToko || user.nama || '';
		} else {
			namaUsahaDefault = profil.namaToko || user.nama || '';
		}
		document.getElementById('skuNamaLengkap').value = namaLengkap;
		document.getElementById('skuNik').value = nik;
		document.getElementById('skuAlamatKtp').value = alamatKtp;
		document.getElementById('skuHp').value = hp;
		document.getElementById('skuEmail').value = email;
		document.getElementById('skuNamaUsaha').value = namaUsahaDefault;
		document.getElementById('skuAlamatUsaha').value = alamatUsaha;
		document.getElementById('skuNomorSurat').value = 'SKU/SKD-' + user.kodeRole + '-' + Date.now();
	}

	function pasangListenerSKU() {
		var inputs = ['skuNamaUsaha', 'skuAlamatUsaha', 'skuKepalaDesa', 'skuNomorSurat'];
		inputs.forEach(function(id) {
			var el = document.getElementById(id);
			if (el) el.addEventListener('input', renderPreviewSKU);
		});
	}

	function renderPreviewSKU() {
		var user = userAktif;
		if (!user) return;
		var namaLengkap = document.getElementById('skuNamaLengkap').value;
		var nik = document.getElementById('skuNik').value;
		var alamatKtp = document.getElementById('skuAlamatKtp').value;

		var email = document.getElementById('skuEmail').value;
		var namaUsaha = document.getElementById('skuNamaUsaha').value.trim();
		var alamatUsaha = document.getElementById('skuAlamatUsaha').value.trim();
		var kepalaDesa = document.getElementById('skuKepalaDesa').value.trim();
		var nomorSurat = document.getElementById('skuNomorSurat').value.trim();
		var namaDesa = '-';
		if (alamatKtp) {
			var parts = alamatKtp.split(',');
			if (parts.length > 0) namaDesa = parts[0].trim();
		}
		var today = new Date();
		var tanggal = today.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
		var role = user.role;
		var jenisUsaha = 'usaha';
		if (role === 'Pedagang Pasar') jenisUsaha = 'usaha/dagangan';
		else if (role === 'Pedagang Makanan') jenisUsaha = 'usaha/warung';
		else if (role === 'Ojek') jenisUsaha = 'usaha/ojek';
		else if (role === 'COD Seller') jenisUsaha = 'usaha/toko COD';
		else if (role === 'Grosir') jenisUsaha = 'usaha/grosir';
		else jenisUsaha = 'usaha/toko';
		var suratHTML = `
			<div style="font-family: 'Times New Roman', Times, serif; line-height: 1.2; padding: 10px; font-size: 10px;">
				<div style="text-align: center; margin-bottom: 8px;">
					<h3 style="margin: 0; font-size: 12px;">PERMOHONAN PENERBITAN SURAT KETERANGAN USAHA (SKU)</h3>

	<script>
	function hitungJarak(lat1, lon1, lat2, lon2) {
		var R = 6371;
		var dLat = (lat2 - lat1) * Math.PI / 180;
		var dLon = (lon2 - lon1) * Math.PI / 180;
		var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
				Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
				Math.sin(dLon / 2) * Math.sin(dLon / 2);
		var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
		return R * c;
	}
	</script>

	<script>

	// ============================================================

	// --- 1.1 Get Key Penyimpanan per Role ---
	function getProdukKey(role) {
		var user = userAktif || {};
		var roleMap = {
			'Toko': 'dataProdukToko',
			'Pedagang Pasar': 'dataProdukPP',
			'Pedagang Makanan': 'dataProdukPM',
			'COD Seller': 'dataProdukCOD',
			'Ojek': 'dataProdukOJ',
			'Grosir': 'dataProdukGrosir',
			'Distributor': 'dataProdukDistributor'
		};
		var baseKey = roleMap[role] || 'dataProdukToko';
		return baseKey + '_' + user.idUser;
	}

	// --- 1.2 Load Produk dari localStorage ---
	function loadProduk(role) {
		var key = getProdukKey(role);
		try {
			return JSON.parse(localStorage.getItem(key) || '[]');
		} catch (e) {
			return [];
		}
	}

	// --- 1.3 Simpan Produk ke localStorage ---
	function simpanProduk(role, data) {
		var key = getProdukKey(role);
		localStorage.setItem(key, JSON.stringify(data || []));
	}

	// AKHIR BLOK R 01.7(1)

	function renderTabelProduk(role) {
		var tbody = document.getElementById('tabelProduk_' + role);
		var totalSpan = document.getElementById('totalProduk_' + role);
		if (!tbody) return;

		var produkList = loadProduk(role);
		if (totalSpan) totalSpan.textContent = produkList.length;

		// --- Hitung statistik otomatis ---
		var totalStok = 0;
		var totalHargaRp = 0;
		var totalHargaCoin = 0;
		produkList.forEach(function(p) {
			totalStok += p.stok || 0;
			totalHargaRp += p.harga || 0;
			totalHargaCoin += p.hargaCoin || 0;
		});

		// Update elemen statistik (jika ada)
		var elTotalStok = document.getElementById('totalStok_' + role);
		if (elTotalStok) elTotalStok.textContent = totalStok;
		var elTotalRp = document.getElementById('totalHargaRp_' + role);
		if (elTotalRp) elTotalRp.textContent = 'Rp ' + totalHargaRp.toLocaleString('id-ID');
		var elTotalCoin = document.getElementById('totalHargaCoin_' + role);
		if (elTotalCoin) elTotalCoin.textContent = totalHargaCoin + ' Coin';

		// --- Render tabel ---
		if (produkList.length === 0) {
			tbody.innerHTML = '<tr><td colspan="13" class="text-center text-muted py-4">Belum ada produk.</td></tr>';
			return;
		}

		var isKasir = (userAktif && userAktif.role === 'Kasir');
		var html = '';

		produkList.forEach(function(p, i) {
			var aksi = isKasir
				? '<span class="text-muted small">Read-only</span>'
				: `<button class="btn btn-sm btn-warning me-1" onclick="editProduk('${role}', ${i})" title="Edit"><i class="fas fa-edit"></i></button>
				   <button class="btn btn-sm btn-danger" onclick="hapusProduk('${role}', ${i})" title="Hapus"><i class="fas fa-trash"></i></button>`;

			var fotoSrc = p.foto || 'https://placehold.co/50x50/FF8C00/ffffff?text=G';
			var hargaRp = Number(p.harga).toLocaleString('id-ID');
			var hargaCoin = Number(p.hargaCoin || 0).toLocaleString('id-ID');

			html += `
				<tr>
					<td>${i + 1}</td>
					<td><img src="${fotoSrc}" width="50" height="50" class="rounded" alt="Produk"></td>
					<td><strong>${p.nama || '-'}</strong></td>
					<td>${p.kode || '-'}</td>
					<td>${p.kategori || '-'}</td>
					<td>Rp ${hargaRp}</td>
					<td>${hargaCoin} Coin</td>
					<td>${p.satuan || '-'}</td>
					<td>${p.stok || 0}</td>
					<td>${p.tglInput || '-'}</td>
					<td>${p.tglKadaluarsa || '-'}</td>
					<td>${p.petugas || '-'}</td>
					<td>${aksi}</td>
				</tr>
			`;
		});

		tbody.innerHTML = html;
	}

        alert('Kasir tidak bisa mengubah produk.');
        return;
    }

    var modal = document.getElementById('formProdukModal');

        alert('Modal form produk tidak ditemukan!');

    var isEdit = (index !== null && index !== undefined && index !== '');
    var produkList = loadProduk(role);
    var produk = isEdit ? produkList[parseInt(index)] : null;

    // Set hidden fields
    setInputValue('formProdukRole', role);
    setInputValue('formProdukIndex', isEdit ? index : '');

    // Set judul
    document.getElementById('formProdukModalLabel').textContent = isEdit ? 'Edit Produk (' + role + ')' : 'Tambah Produk (' + role + ')';

    // Set nilai input dengan helper aman
    setInputValue('formProdukNama', produk ? produk.nama || '' : '');

    setInputValue('formProdukKategori', produk ? produk.kategori || '' : '');
    setInputValue('formProdukSatuan', produk ? produk.satuan || '' : '');
    setInputValue('formProdukHarga', produk ? produk.harga || '' : '');
    setInputValue('formProdukHargaCoin', produk ? produk.hargaCoin || '' : '');
    setInputValue('formProdukStok', produk ? produk.stok || '' : '');
    setInputValue('formProdukTglInput', produk ? produk.tglInput || '' : new Date().toISOString().split('T')[0]);
    setInputValue('formProdukTglKadaluarsa', produk ? produk.tglKadaluarsa || '' : '');
    setInputValue('formProdukPetugas', produk ? produk.petugas || '' : (userAktif ? userAktif.nama : '-'));

    // Foto
    document.getElementById('previewFotoProduk').innerHTML = '';
    setInputValue('formProdukFotoUrl', '');
    setInputValue('formProdukFoto', '');

    if (isEdit && produk && produk.foto) {
        setInputValue('formProdukFotoUrl', produk.foto);
        document.getElementById('previewFotoProduk').innerHTML =
            '<img src="' + produk.foto + '" style="width:100px;height:100px;object-fit:cover;border-radius:5px;border:2px solid #FF8C00;">';
    }

    // Hitung harga coin otomatis
    hitungHargaR2CoinForm();

    // Tampilkan modal
    var bsModal = new bootstrap.Modal(modal);
    bsModal.show();
}

// ============================================================
// 3. FUNGSI BACA FOTO PRODUK (PREVIEW)
// ============================================================
function bacaFotoProduk(event) {
    var file = event.target.files[0];
    var preview = document.getElementById('previewFotoProduk');
    var fotoUrlInput = document.getElementById('formProdukFotoUrl');

    if (!file) {
        preview.innerHTML = '';
        return;
    }
    if (file.size > 2000000) {
        alert('Ukuran file maksimal 2MB.');
        event.target.value = '';
        preview.innerHTML = '';
        return;
    }

    var reader = new FileReader();
    reader.onload = function(e) {
        fotoUrlInput.value = e.target.result;
        preview.innerHTML = '<img src="' + e.target.result + '" style="width:100px;height:100px;object-fit:cover;border-radius:5px;border:2px solid #FF8C00;">';
    };
    reader.readAsDataURL(file);
}

// ============================================================
// 4. FUNGSI HITUNG HARGA R2COIN OTOMATIS
// ============================================================
function hitungHargaR2CoinForm() {
    var hargaRp = parseFloat(document.getElementById('formProdukHarga').value) || 0;
    var setting = JSON.parse(localStorage.getItem('settingEkonomiCoin')) || { hargaBeli: 750 };
    var hargaBeliCoin = setting.hargaBeli || 750;
    var hargaCoin = 0;
    if (hargaRp > 0 && hargaBeliCoin > 0) {
        hargaCoin = Math.round(hargaRp / hargaBeliCoin);
    }
    document.getElementById('formProdukHargaCoin').value = hargaCoin;
}

// ============================================================
// 5. FUNGSI SCAN BARCODE (SIMULASI / INTEGRASI QUAGGA)
// ============================================================
function scanBarcodeProduk() {
    var kodeInput = document.getElementById('formProdukKode');
    if (kodeInput) {
        kodeInput.focus();
        kodeInput.select();
        alert('Silakan scan barcode dengan pemindai atau ketik manual.');
    }
}

// ============================================================
// 6. FUNGSI SIMPAN PRODUK (TAMBAH/EDIT)
// ============================================================
function simpanFormProduk() {
    var role = document.getElementById('formProdukRole').value;
    var index = document.getElementById('formProdukIndex').value;

    if (!role) {
        alert('Role tidak ditemukan.');
        return false;
    }

    var nama = document.getElementById('formProdukNama').value.trim();
    var kode = document.getElementById('formProdukKode').value.trim();
    var kategori = document.getElementById('formProdukKategori').value;
    var satuan = document.getElementById('formProdukSatuan').value;
    var harga = parseFloat(document.getElementById('formProdukHarga').value) || 0;
    var hargaCoin = parseFloat(document.getElementById('formProdukHargaCoin').value) || 0;
    var stok = parseInt(document.getElementById('formProdukStok').value) || 0;
    var tglInput = document.getElementById('formProdukTglInput').value || new Date().toISOString().split('T')[0];
    var tglKadaluarsa = document.getElementById('formProdukTglKadaluarsa').value || '';
    var petugas = document.getElementById('formProdukPetugas').value.trim() || (userAktif ? userAktif.nama : '-');
    var foto = document.getElementById('formProdukFotoUrl').value || '';

    if (!nama || !kategori || !satuan || harga < 0 || stok < 0) {
        alert('Mohon lengkapi field wajib (Nama, Kategori, Satuan, Harga, Stok).');
        return false;
    }

    var produkList = loadProduk(role);
    var obj = {
        nama: nama,
        kode: kode,
        kategori: kategori,
        satuan: satuan,
        harga: harga,
        hargaCoin: hargaCoin,
        stok: stok,
        tglInput: tglInput,
        tglKadaluarsa: tglKadaluarsa,
        petugas: petugas,
        foto: foto
    };

    if (index !== '') {
        var idx = parseInt(index);
        if (idx >= 0 && idx < produkList.length) {
            produkList[idx] = obj;
        } else {
            alert('Index produk tidak valid.');
            return false;
        }
    } else {
        // Cek batas produk jika ada (untuk paket Free/Pro)
        var maxProduk = 999;
        if (userAktif && userAktif.statusLangganan === 'Free') maxProduk = 5;
        else if (userAktif && userAktif.statusLangganan === 'Pro') maxProduk = 25;

        if (produkList.length >= maxProduk) {
            alert('Anda telah mencapai batas produk (' + maxProduk + ') untuk paket ' + userAktif.statusLangganan + '. Upgrade untuk menambah produk.');
            return false;
        }
        produkList.push(obj);
    }

    simpanProduk(role, produkList);
    renderTabelProduk(role);

    // Tutup modal
    var modalEl = document.getElementById('formProdukModal');
    var modal = bootstrap.Modal.getInstance(modalEl);
    if (modal) modal.hide();

    // Reset form
    document.getElementById('formProduk').reset();
    document.getElementById('previewFotoProduk').innerHTML = '';
    setInputValue('formProdukFotoUrl', '');

    alert('✅ Produk berhasil disimpan!');
    return true;
}
</script>

<script>
// ============================================================
// 1. HAPUS PRODUK
// ============================================================
function hapusProduk(role, index) {
    // Cegah Kasir menghapus produk
    if (userAktif && userAktif.role === 'Kasir') {
        alert('Kasir tidak bisa menghapus produk.');
        return;
    }

    // Konfirmasi sebelum hapus
    if (!confirm('Yakin ingin menghapus produk ini?')) return;

    // Ambil daftar produk sesuai role
    var produkList = loadProduk(role);

    // Hapus produk berdasarkan index
    produkList.splice(index, 1);

    // Simpan kembali ke localStorage
    simpanProduk(role, produkList);

    // Render ulang tabel
    renderTabelProduk(role);
}

// ============================================================
// 2. EDIT PRODUK (ALIAS UNTUK TAMPILKAN FORM PRODUK)
// ============================================================
function editProduk(role, index) {
    // Pastikan fungsi global tampilkanFormProduk sudah ada
    if (typeof tampilkanFormProduk === 'undefined') {
        alert('Fungsi tampilkanFormProduk belum dimuat. Pastikan blok R 01.7(3) sudah terpasang.');
        return;
    }

    // Panggil fungsi global untuk membuka modal edit
    tampilkanFormProduk(role, index);
}
</script>

<script>
// ============================================================
// 5.1 FUNGSI GENERIK TAMPILKAN HALAMAN PRODUK
// ============================================================
function tampilkanManajemenProdukGeneric(role) {
    var konten = document.getElementById('kontenDasbor');
    if (!kontenAsliDasbor) kontenAsliDasbor = konten.innerHTML;

    var containerId = '';
    switch (role) {
        case 'Toko': containerId = 'manajemenProdukTokoContainer'; break;
        case 'Pedagang Pasar': containerId = 'manajemenProdukPPContainer'; break;
        case 'Pedagang Makanan': containerId = 'manajemenProdukPMContainer'; break;
        case 'COD Seller': containerId = 'manajemenProdukCODContainer'; break;
        case 'Distributor': containerId = 'manajemenProdukDistributorContainer'; break;
        case 'Grosir': containerId = 'manajemenProdukGrosirContainer'; break;
        default: containerId = 'manajemenProdukTokoContainer'; break;
    }

    var container = document.getElementById(containerId);
    if (!container) {
        console.warn('Container ' + containerId + ' tidak ditemukan. Pastikan HTML bloknya sudah dimuat.');
        return;
    }

    konten.innerHTML = container.innerHTML;

    var roleInput = document.getElementById('formProdukRole');
    if (roleInput) roleInput.value = role;

    var isKasir = (userAktif && userAktif.role === 'Kasir');

    // Sembunyikan tombol tambah jika kasir
    var btn = konten.querySelector('.btn-tambah-produk');
    if (btn) btn.style.display = isKasir ? 'none' : 'inline-block';

    // Sembunyikan kolom aksi jika kasir
    var thAksi = konten.querySelector('table th:last-child');
    if (thAksi && isKasir) thAksi.style.display = 'none';

    renderTabelProduk(role);

    tutupMenu();
}

// ============================================================
// 5.2 WRAPPER PER ROLE (SATU DEFINISI, TANPA DUPLIKASI)
// ============================================================
function tampilkanManajemenProdukToko() {
    tampilkanManajemenProdukGeneric('Toko');
}
function tampilkanManajemenProdukPP() {
    tampilkanManajemenProdukGeneric('Pedagang Pasar');
}
function tampilkanManajemenProdukPM() {
    tampilkanManajemenProdukGeneric('Pedagang Makanan');
}
function tampilkanManajemenProdukCOD() {
    tampilkanManajemenProdukGeneric('COD Seller');
}
function tampilkanManajemenProdukDistributor() {
    tampilkanManajemenProdukGeneric('Distributor');
}
function tampilkanManajemenProdukGrosir() {
    tampilkanManajemenProdukGeneric('Grosir');
}
</script>
