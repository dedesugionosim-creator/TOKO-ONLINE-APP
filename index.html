<!-- ═══ BLOK FD-UNIVERSAL v2.2 — FUNGSI GLOBAL DASBOR 🇮🇩 ══════ -->
<!-- ═══ Layer: L4 (Fungsi Global Domain — Dasbor 32 Role) ═════ -->
<!-- ═══ Dependency: CS1 v4.2+ (WAJIB) · GID v6.1+ (WAJIB) ═════ -->
<!-- ═══             CS2 v4.0 · CS3 v4.0 · CS14 · KDMP v5.1 ═══ -->
<!-- ═══             MN v4.2 (OPSIONAL) ═════════════════════════ -->
<!-- ═══ Guard: _fdUnivV22Done (UTAMA) + 3 alias ══════════════ -->
<!-- ═══ Versi: 2.2 — R2COIN Merah Putih (Aturan-Compliant) ════ -->
<!-- ═══ Aturan: A1, A2, A3, A5, A11, A12, A13, A19, A25, ═══ -->
<!-- ═══         A29—A32, A33, A34, A35, A36, A40, A42, ═════ -->
<!-- ═══         A43, A44, A46 ═════════════════════════════════ -->
<!-- ═══ Isi: 9 sub-seksi [FD.1]—[FD.9] ══════════════════════ -->
<!-- ═══   [FD.1]  Guard 3 lapis + dep retry + A43 ════════════ -->
<!-- ═══   [FD.2]  Helper internal (delegasi CS2/CS4) ═════════ -->
<!-- ═══   [FD.3]  Widget builder (12 tipe standar) ══════════ -->
<!-- ═══   [FD.4]  fduAmbilStatistik (5 kategori role) ════════ -->
<!-- ═══   [FD.5]  fduAmbilAktivitasTerakhir ══════════════════ -->
<!-- ═══   [FD.6]  3 Pintu: kirimFDU · terimaFDU · ambilFDU ═══ -->
<!-- ═══   [FD.7]  cekPintuFDU + fduCekKonsistensi32 ═════════ -->
<!-- ═══   [FD.8]  Debug A5 (debugFDU v2.2) ══════════════════ -->
<!-- ═══   [FD.9]  Auto-registry + Log terpasang ═════════════ -->
<!-- ═══ ⚠️ A25: SEMUA delegasi: gidIsEO/SOT/SOO/SA_STAF, ═══ -->
<!-- ═══    gidFilterByOwner (bukan filter manual) ═══════════ -->
<!-- ═══ ⚠️ A43: WAJIB blokDaftarkanGuard("_fdUnivV22Done","FD-U") -->
<!-- ═══ ⚠️ A44: FIX WAJIB di sumber ini — JANGAN patch Console -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<script>
(function BLOK_FD_UNIVERSAL_V22() {

    // ═══════════════════════════════════════════════════════════
    // [FD.1] — GUARD 3 LAPIS + DEP RETRY + A43 SELF-REGISTER
    // ═══════════════════════════════════════════════════════════
    if (window._fdUnivV22Done) return;

    // ── A19: Dep retry CS1 ──
    if (!window.CS_ROLE_MAP) {
        window._fdRetryCS1 = (window._fdRetryCS1 || 0) + 1;
        if (window._fdRetryCS1 < 20) { setTimeout(BLOK_FD_UNIVERSAL_V22, 500); return; }
        console.warn('⚠️ FD-UNIVERSAL v2.2: CS1 tidak tersedia setelah 20 retry. Ditunda.');
        return;
    }

    // ── A19: Dep retry GID ──
    if (typeof window.gidIdUser !== 'function' || typeof window.gidKodeRoleUser !== 'function') {
        window._fdRetryGID = (window._fdRetryGID || 0) + 1;
        if (window._fdRetryGID < 20) { setTimeout(BLOK_FD_UNIVERSAL_V22, 500); return; }
        console.warn('⚠️ FD-UNIVERSAL v2.2: GID tidak tersedia setelah 20 retry. Ditunda.');
        return;
    }

    // ── A19: Validasi tipe storage helper wajib ──
    if (typeof window.csLoadJSON !== 'function') {
        window._fdRetryCS2 = (window._fdRetryCS2 || 0) + 1;
        if (window._fdRetryCS2 < 20) { setTimeout(BLOK_FD_UNIVERSAL_V22, 500); return; }
        console.warn('⚠️ FD-UNIVERSAL v2.2: csLoadJSON tidak tersedia setelah 20 retry. Ditunda.');
        return;
    }

    // ── Guard 4 lapis ──
    window._fdUnivV22Done = true;   // ⭐ UTAMA v2.2
    window._fdUnivV21Done = true;   // ← alias legacy + CPAJ detection
    window._fdUnivV20Done = true;   // alias v2.0
    window._fdUnivVersi   = '2.2';

    // ── A43: Self-register guard ──
    if (typeof window.blokDaftarkanGuard === 'function') {
        window.blokDaftarkanGuard('_fdUnivV22Done', 'FD-U');
    }

    // ═══════════════════════════════════════════════════════════
    // [FD.2] — HELPER INTERNAL (DELEGASI A1/A2/A25)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) {
        return window.csLoadJSON(key, def);
    }

    function _formatRp(val) {
        if (typeof window.csFormatRp === 'function') return window.csFormatRp(val);
        return 'Rp ' + (val || 0).toLocaleString('id-ID');
    }

    // A25: Delegasi gidFilterByOwner untuk filter by owner
    function _filterByOwner(list, entitas) {
        if (typeof window.gidFilterByOwner === 'function') {
            return window.gidFilterByOwner(list, { entitas: entitas });
        }
        // Fallback (kalau GID v5 lama)
        var idOwner = window.gidIdOwner ? window.gidIdOwner() : null;
        if (!idOwner) return [];
        return list.filter(function(x) {
            return x && (x.idOwner === idOwner || x.ownerId === idOwner);
        });
    }

    // ═══════════════════════════════════════════════════════════
    // [FD.3] — WIDGET BUILDER (A19: konsisten format)
    // ═══════════════════════════════════════════════════════════
    function _buatWidget(label, value, ikon, warna, linkAksi) {
        return {
            label: String(label || '-'),
            value: String(value !== undefined && value !== null ? value : '0'),
            ikon:  String(ikon || 'fas fa-circle'),
            warna: String(warna || 'primary'),
            link:  linkAksi || null
        };
    }

    // ═══════════════════════════════════════════════════════════
    // [FD.4] — fduAmbilStatistik (5 kategori role)
    // ═══════════════════════════════════════════════════════════
    // A25: semua gidIsRole('X') diganti dengan flag individual
    // A1/A2: filter by owner delegasi ke gidFilterByOwner
    // A36: deteksi 32 role via GID helper
    // ═══════════════════════════════════════════════════════════
    window.fduAmbilStatistik = function() {
        var widgets = [];
        try {
            var kodeRole = window.gidKodeRoleUser() || 'SA';
            var idUser   = window.gidIdUser();

            // ── KATEGORI 1: SISTEM & STAF ──
            // A25: pakai gidIsEO/gidIsSOT/gidIsSOO (bukan gidIsRole('X'))
            if (window.gidIsSA() || window.gidIsSA_STAF() || window.gidIsStaf() ||
                window.gidIsEO() || window.gidIsSOT() || window.gidIsSOO()) {

                var users  = _load('dataLoginUser', []);
                var orders = _load('dataOrder', []);
                var pending = users.filter(function(u) { return u.status === 'Pending'; }).length;

                widgets.push(_buatWidget('Total Pengguna',      users.length,   'fas fa-users',         'primary', 'kelolaAkun'));
                widgets.push(_buatWidget('Verifikasi Pending',  pending,        'fas fa-clock',         'warning', 'verifikasiDokumen'));
                widgets.push(_buatWidget('Total Transaksi',     orders.length,  'fas fa-shopping-cart', 'success', 'semuaTransaksi'));

                // A25: pakai gidIsSA_STAF() langsung
                if (window.gidIsSA() || window.gidIsSA_STAF()) {
                    var kopdes = users.filter(function(u) {
                        return u.kodeRole && u.kodeRole.indexOf('KDMP_') === 0;
                    }).length;
                    widgets.push(_buatWidget('Total Kopdes', kopdes, 'fas fa-flag', 'danger', 'kelolaKopdes'));
                }
            }

            // ── KATEGORI 2: SELLER ──
            // A1/A2: filter by owner delegasi ke gidFilterByOwner
            else if (window.gidIsSeller()) {
                var produk       = _filterByOwner(_load('dataProduk', []), 'produk');
                var orderSeller  = _filterByOwner(_load('dataOrder',  []), 'order');
                var orderPending = orderSeller.filter(function(o) { return o.status === 'Pending'; }).length;

                var dompet = _load('dataRekening', []).find(function(d) { return d.idUser === idUser; });
                var saldo  = dompet ? (dompet.saldo || 0) : 0;

                widgets.push(_buatWidget('Produk Saya',    produk.length,       'fas fa-box',          'warning', 'produkSaya'));
                widgets.push(_buatWidget('Pesanan Masuk',  orderSeller.length,  'fas fa-shopping-bag', 'primary', 'transaksiPemilik'));
                widgets.push(_buatWidget('Order Pending',  orderPending,        'fas fa-clock',        'danger',  'transaksiPemilik'));
                widgets.push(_buatWidget('Saldo R2Coin',   _formatRp(saldo),    'fas fa-wallet',       'success', 'dompetSaya'));
            }

            // ── KATEGORI 3: KOPDES ──
            // A40: delegasi KDMP
            else if (window.gidIsKopdes()) {
                var anakKopdes    = window.kdmpListByInduk       ? window.kdmpListByInduk(idUser).length       : 0;
                var listKasir     = window.kdmpListKasirPerDesa  ? window.kdmpListKasirPerDesa(idUser).length  : 0;
                var produkKopdes  = _filterByOwner(_load('dataProduk', []), 'produk').length;

                widgets.push(_buatWidget('Kopdes Bawahan',  anakKopdes,         'fas fa-sitemap',       'danger',  'kelolaKopdes'));
                widgets.push(_buatWidget('Kasir Aktif',     listKasir,          'fas fa-cash-register', 'warning', 'manajemenKasir'));
                widgets.push(_buatWidget('Produk Kopdes',   produkKopdes,       'fas fa-box',           'primary', 'manajemenProduk'));
                widgets.push(_buatWidget('Saldo Kas',       _formatRp(0),       'fas fa-wallet',        'success', 'dompetSaya'));
            }

            // ── KATEGORI 4: KASIR ──
            // A42: deteksi via gidIsKasir (delegasi CS14)
            else if (window.gidIsKasir()) {
                var today = new Date().toISOString().split('T')[0];
                var trxKasir = _load('dataOrder', []).filter(function(o) {
                    return o.idKasir === idUser && o.tanggal === today;
                });

                widgets.push(_buatWidget('Transaksi Hari Ini', trxKasir.length, 'fas fa-receipt',           'success', 'transaksiKasir'));
                widgets.push(_buatWidget('Shift Status',       'Aktif',          'fas fa-clock',             'primary', 'riwayatKasir'));
                widgets.push(_buatWidget('Kas di Tangan',      _formatRp(0),     'fas fa-money-bill-wave',   'warning', 'rekapKasir'));
            }

            // ── KATEGORI 5: CUSTOMER / ORGANISASI ──
            // A41: CT tanpa NIK, tapi widget sama dengan ORG/IND
            else if (window.gidIsCT() || window.gidIsORG() || window.gidIsIND()) {
                var orderCust = _load('dataOrder', []).filter(function(o) { return o.idCustomer === idUser; });
                var dompetC   = _load('dataRekening', []).find(function(d) { return d.idUser === idUser; });
                var saldoC    = dompetC ? (dompetC.saldo || 0) : 0;

                widgets.push(_buatWidget('Pesanan Saya',       orderCust.length, 'fas fa-shopping-bag', 'primary', 'transaksiCustomer'));
                widgets.push(_buatWidget('Saldo R2Coin',       _formatRp(saldoC), 'fas fa-wallet',      'success', 'dompetSaya'));
                widgets.push(_buatWidget('Chat Belum Dibaca',  0,                'fas fa-comments',     'warning', 'chatSaya'));
            }

            // ── Fallback default ──
            if (widgets.length === 0) {
                widgets.push(_buatWidget('Selamat Datang', 'Aplikasi Siap', 'fas fa-check', 'primary', null));
            }

            return {
                siap:     true,
                kodeRole: String(kodeRole),
                roleInfo: window.csGetRoleInfo ? window.csGetRoleInfo(kodeRole) : null,
                widgets:  widgets
            };
        } catch (e) {
            console.error('[FD-UNIVERSAL v2.2] error:', e);
            return { siap: false, widgets: [], error: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FD.5] — fduAmbilAktivitasTerakhir
    // ═══════════════════════════════════════════════════════════
    window.fduAmbilAktivitasTerakhir = function(limit) {
        try {
            return typeof window.csAmbilHistoriAktivitas === 'function'
                ? window.csAmbilHistoriAktivitas({ limit: limit || 5 })
                : [];
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FD.6] — 3 PINTU STANDAR (A11—A13)
    // ═══════════════════════════════════════════════════════════
    window.kirimFDU = function(tipe, ke, data, idRef) {
        try {
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }
            return window.mnKirimKeMenu({
                tipe: tipe || 'info',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser(),
                    menu:     'FD-Universal',
                    blok:     'L4-FDU'
                },
                ke:        ke || { menu: 'FD-Universal' },
                data:      data || {},
                idRef:     idRef || null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()
            });
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.terimaFDU = function(aksiMenu, opts) {
        try {
            return typeof window.mnInboxMenu === 'function'
                ? window.mnInboxMenu(aksiMenu || 'FD-Universal', opts)
                : [];
        } catch (e) { return []; }
    };

    // A13: format paket lengkap
    window.ambilFDU = function(idPaket, aksiMenu, opts) {
        opts = opts || {};
        try {
            if (idPaket && aksiMenu && typeof window.mnAmbilPaket === 'function') {
                return window.mnAmbilPaket(aksiMenu, idPaket, opts);
            }
            return {
                tipe: 'snapshot-fdu',
                dari: { menu: 'FD-Universal', blok: 'L4-FDU' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: window.fduAmbilStatistik(),
                idRef: null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()
            };
        } catch (e) {
            return { tipe: 'error', dari: {}, ke: {}, data: null, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FD.7] — cekPintuFDU + fduCekKonsistensi32
    // ═══════════════════════════════════════════════════════════
    window.cekPintuFDU = function() {
        var skor =
            (typeof window.kirimFDU  === 'function' ? 1 : 0) +
            (typeof window.terimaFDU === 'function' ? 1 : 0) +
            (typeof window.ambilFDU  === 'function' ? 1 : 0);
        return {
            blok:    'FD-U',
            kirim:   typeof window.kirimFDU  === 'function',
            terima:  typeof window.terimaFDU === 'function',
            ambil:   typeof window.ambilFDU  === 'function',
            skor:    skor + '/3',
            lengkap: skor === 3
        };
    };

    window.fduCekKonsistensi32 = function() {
        var hasil = { ok: true, totalCek: 0, totalWarning: 0, detail: [] };
        function _addCek(nama, status, pesan) {
            hasil.totalCek++;
            if (status !== 'ok') hasil.totalWarning++;
            hasil.detail.push({ cek: nama, status: status, pesan: pesan || '-' });
            if (status !== 'ok') hasil.ok = false;
        }

        try {
            // [1] 5 kategori role bisa dideteksi via GID
            var kategoriDeteksi = {
                sistem:     typeof window.gidIsSA === 'function',
                staf:       typeof window.gidIsStaf === 'function',
                seller:     typeof window.gidIsSeller === 'function',
                kopdes:     typeof window.gidIsKopdes === 'function',
                kasir:      typeof window.gidIsKasir === 'function',
                customer:   typeof window.gidIsCT === 'function',
                organisasi: typeof window.gidIsORG === 'function'
            };
            var totalDeteksi = Object.keys(kategoriDeteksi).filter(function(k) {
                return kategoriDeteksi[k];
            }).length;
            if (totalDeteksi === 7) {
                _addCek('Deteksi 7 kategori role', 'ok', 'Semua GID helper tersedia');
            } else {
                _addCek('Deteksi 7 kategori role', 'warning', totalDeteksi + '/7 helper tersedia');
            }

            // [2] Flag individual (A25)
            var flagIndividual = {
                isEO:     typeof window.gidIsEO === 'function',
                isSOT:    typeof window.gidIsSOT === 'function',
                isSOO:    typeof window.gidIsSOO === 'function',
                isSA_STAF:typeof window.gidIsSA_STAF === 'function',
                isMKT:    typeof window.gidIsMKT === 'function'
            };
            var totalFlag = Object.keys(flagIndividual).filter(function(k) {
                return flagIndividual[k];
            }).length;
            if (totalFlag === 5) {
                _addCek('Flag individual (A25)', 'ok', 'GID v6.1+ terpasang');
            } else {
                _addCek('Flag individual (A25)', 'warning', totalFlag + '/5 flag');
            }

            // [3] gidFilterByOwner tersedia (A25)
            if (typeof window.gidFilterByOwner === 'function') {
                _addCek('gidFilterByOwner (A25)', 'ok', 'Delegasi filter OK');
            } else {
                _addCek('gidFilterByOwner (A25)', 'warning', 'Fallback manual dipakai');
            }

            // [4] 3 Pintu lengkap
            var pintu = window.cekPintuFDU();
            if (pintu.lengkap) {
                _addCek('3 Pintu lengkap', 'ok', '3/3');
            } else {
                _addCek('3 Pintu lengkap', 'warning', pintu.skor);
            }

            // [5] A43 self-register
            if (window.BLOK_GUARD_MAP && window.BLOK_GUARD_MAP['_fdUnivV22Done']) {
                _addCek('A43 self-register', 'ok', 'BLOK_GUARD_MAP terisi');
            } else if (typeof window.blokDaftarkanGuard === 'function') {
                _addCek('A43 self-register', 'warning', 'Entry FD-U belum terdaftar');
            } else {
                _addCek('A43 self-register', 'warning', 'blokDaftarkanGuard belum ada');
            }

            // [6] MFD tidak ada
            if (window.CS_ROLE_MAP && window.CS_ROLE_MAP['MFD']) {
                _addCek('MFD tidak ada', 'warning', 'MFD ada di CS_ROLE_MAP');
            } else {
                _addCek('MFD tidak ada', 'ok', 'MFD tidak ada (benar)');
            }

            // [7] CS_ROLE_MAP = 32
            var total = window.CS_ROLE_MAP ? Object.keys(window.CS_ROLE_MAP).length : 0;
            if (total === 32) {
                _addCek('CS_ROLE_MAP = 32', 'ok', 'Benar: 32 role');
            } else {
                _addCek('CS_ROLE_MAP = 32', 'warning', 'Ada ' + total);
            }

            // [8] CS_HIERARKI_KOPDES lengkap (A40)
            var hier = window.CS_HIERARKI_KOPDES ? Object.keys(window.CS_HIERARKI_KOPDES).length : 0;
            if (hier === 4) {
                _addCek('4 Kopdes hierarki (A40)', 'ok', 'Pusat/Kab/Kec/Desa');
            } else {
                _addCek('4 Kopdes hierarki (A40)', 'warning', 'Ada ' + hier);
            }

            // [9] CS14_VARIAN_KASIR = 6 (A42)
            var kasir = window.CS14_VARIAN_KASIR ? Object.keys(window.CS14_VARIAN_KASIR).length : 0;
            if (kasir === 6) {
                _addCek('6 Kasir varian (A42)', 'ok', 'KSR_TK/PP/PM/DST/GR/KDMP');
            } else {
                _addCek('6 Kasir varian (A42)', 'warning', 'Ada ' + kasir);
            }
        } catch (e) {
            hasil.ok = false;
            hasil.detail.push({ cek: 'exception', status: 'error', pesan: e.message });
        }
        return hasil;
    };

    // ═══════════════════════════════════════════════════════════
    // [FD.8] — DEBUG (A5) — debugFDU v2.2
    // ═══════════════════════════════════════════════════════════
    window.debugFDU = function() {
        var stat   = window.fduAmbilStatistik();
        var pintu  = window.cekPintuFDU();
        var konsis = window.fduCekKonsistensi32();

        var info = {
            blok:  'FD-UNIVERSAL',
            versi: window._fdUnivVersi,
            guard: {
                v22:     window._fdUnivV22Done,
                v21:     window._fdUnivV21Done,
                v20:     window._fdUnivV20Done
            },
            userAktif: {
                kodeRole:    stat.kodeRole,
                totalWidget: stat.widgets.length
            },
            widgets: stat.widgets,
            pintu:   pintu,
            konsistensi32: konsis,
            cekV22: {
                A25_delegasi_flag:   typeof window.gidIsEO === 'function' &&
                                     typeof window.gidIsSOT === 'function' &&
                                     typeof window.gidIsSOO === 'function',
                A25_delegasi_filter: typeof window.gidFilterByOwner === 'function',
                A11_3Pintu:          pintu.lengkap,
                A13_FormatPaket:     typeof window.ambilFDU === 'function',
                A19_FallbackArray:   Array.isArray(stat.widgets),
                A43_SelfRegister:    !!(window.BLOK_GUARD_MAP && window.BLOK_GUARD_MAP['_fdUnivV22Done'])
            },
            fungsi: {
                fduAmbilStatistik:        typeof window.fduAmbilStatistik,
                fduAmbilAktivitasTerakhir: typeof window.fduAmbilAktivitasTerakhir,
                kirimFDU:                 typeof window.kirimFDU,
                terimaFDU:                typeof window.terimaFDU,
                ambilFDU:                 typeof window.ambilFDU,
                cekPintuFDU:              typeof window.cekPintuFDU,
                fduCekKonsistensi32:      typeof window.fduCekKonsistensi32
            }
        };
        console.log('🔍 debugFDU v2.2:', info);
        return info;
    };

    // ═══════════════════════════════════════════════════════════
    // [FD.9] — AUTO-REGISTRY (A33, A34, A35) + LOG TERPASANG
    // ═══════════════════════════════════════════════════════════
    setTimeout(function() {
        try {
            // A33
            if (typeof window.cpTambahBlok === 'function') {
                var ada = (window.CP_REGISTRY_BLOK || []).some(function(b) {
                    return b && b.kode === 'FD-U';
                });
                var namaFinal = 'Dasbor Universal v2.2 (32 role · Delegasi)';
                if (!ada) {
                    window.cpTambahBlok({
                        kode:    'FD-U',
                        nama:    namaFinal,
                        layer:   'L4',
                        status:  'Selesai',
                        tanggal: new Date().toISOString().substring(0, 10)
                    });
                } else if (typeof window.cpUpdateBlok === 'function') {
                    window.cpUpdateBlok('FD-U', { status: 'Selesai', nama: namaFinal });
                }
            }

            // A35
            if (typeof window.cpUpdateFungsi === 'function') {
                window.cpUpdateFungsi('fdu', {
                    nama:   'Fungsi Dasbor Universal v2.2',
                    status: 'Selesai',
                    jumlah: 7
                });
            }

            // A34
            if (typeof window.cpTambahRiwayat === 'function') {
                var adaR = (window.CP_RIWAYAT || []).some(function(r) {

            if (!idUser) return { sukses: false, pesan: 'Sesi habis' };

            // A1/A2/A25: delegasi validasi ke CS4

                return u && (u.idUser === idUser || u.id === idUser);
            });

            if (!passBaru || passBaru.length < 6) {
                return { sukses: false, pesan: 'Password baru minimal 6 karakter' };

            users[idx].password = passBaru;
            users[idx].passwordUpdatedAt = window.csNow ? window.csNow() : new Date().toISOString();

                var idUser = window.gidIdUser();

                // Validasi input

                        sukses: false,

                        var file   = new File([blob], 'avatar_' + idUser + '.png', { type: mime });

                    var idx = users.findIndex(function(u) {
                        return u && (u.idUser === idUser || u.id === idUser);

                    if (idx !== -1) {

                        users[idx].fotoUrl = '';
                        _save('dataLoginUser', users);

                data: r.sukses ? r.data : null,
                idRef: null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()

            });

                    return { sukses: false, pesan: 'CS16 fkaBlokir belum ada' };
                }
                return window.fkaBlokir(idUser, alasan);

                    return { sukses: false, pesan: 'CS16 fkaNonaktifkan belum ada' };
                }

                }

    window.cekPintuFGKA = function() {

            terima:  typeof window.terimaFGKA === 'function',
            ambil:   typeof window.ambilFGKA  === 'function',
            skor:    skor + '/3',

        };
    };

    window.fgkaCekKonsistensi32 = function() {
        var hasil = { ok: true, totalCek: 0, totalWarning: 0, detail: [] };
        function _addCek(nama, status, pesan) {
            hasil.totalCek++;
            if (status !== 'ok') hasil.totalWarning++;
            hasil.detail.push({ cek: nama, status: status, pesan: pesan || '-' });
            if (status !== 'ok') hasil.ok = false;
        }

        try {
            // [1] CS_ROLE_MAP = 32
            var total = window.CS_ROLE_MAP ? Object.keys(window.CS_ROLE_MAP).length : 0;
            if (total === 32) {
                _addCek('CS_ROLE_MAP = 32', 'ok', 'Benar: 32 role');
            } else {
                _addCek('CS_ROLE_MAP = 32', 'warning', 'Ada ' + total);
            }

            // [2] CS_STATUS lengkap (A25)
            var S = _getStatusMap();
            var statusLengkap = ['AKTIF','PENDING','BLOKIR','NONAKTIF','ARSIP']
                .every(function(k) { return typeof S[k] === 'string'; });
            if (statusLengkap) {
                _addCek('CS_STATUS lengkap', 'ok', '7 status delegates dari CS1');
            } else {
                _addCek('CS_STATUS lengkap', 'warning', 'Beberapa status hilang');
            }

            // [3] GID helper
            if (typeof window.gidGetUserById === 'function' &&
                typeof window.gidIdUser === 'function') {
                _addCek('GID helper tersedia', 'ok', 'gidGetUserById + gidIdUser');
            } else {
                _addCek('GID helper tersedia', 'warning', 'GID belum v6.1+');
            }

            // [4] CS15 FBA
            if (typeof window.fbaBuatAkun === 'function') {
                _addCek('CS15 FBA tersedia', 'ok', 'fbaBuatAkun tersedia');
            } else {
                _addCek('CS15 FBA tersedia', 'warning', 'CS15 belum terpasang');
            }

            // [5] CS16 FKA
            if (typeof window.fkaListAkun === 'function' &&
                typeof window.fkaStatistikAkun === 'function' &&
                typeof window.fkaUbahStatus === 'function') {
                _addCek('CS16 FKA tersedia', 'ok', 'list + statistik + ubahStatus');
            } else if (typeof window.fkaListAkun === 'function') {
                _addCek('CS16 FKA tersedia', 'warning', 'Sebagian CS16 helper hilang');
            } else {
                _addCek('CS16 FKA tersedia', 'warning', 'CS16 belum terpasang');
            }

            // [6] CS17 FVD (opsional)
            if (typeof window.fvdSetujui === 'function' &&
                typeof window.fvdTolak === 'function') {
                _addCek('CS17 FVD tersedia', 'ok', 'Setujui + Tolak + Revisi');
            } else {
                _addCek('CS17 FVD tersedia', 'warning', 'CS17 belum terpasang (opsional)');
            }

            // [7] 3 Pintu lengkap
            var pintu = window.cekPintuFGKA();
            if (pintu.lengkap) {
                _addCek('3 Pintu lengkap', 'ok', '3/3');
            } else {
                _addCek('3 Pintu lengkap', 'warning', pintu.skor);
            }

            // [8] A43 self-register
            if (window.BLOK_GUARD_MAP && window.BLOK_GUARD_MAP['_fgkaDoneV11']) {
                _addCek('A43 self-register', 'ok', 'BLOK_GUARD_MAP terisi');
            } else if (typeof window.blokDaftarkanGuard === 'function') {
                _addCek('A43 self-register', 'warning', 'Entry FGKA belum terdaftar');
            } else {
                _addCek('A43 self-register', 'warning', 'blokDaftarkanGuard belum ada');
            }

            // [9] MFD tidak ada
            if (window.CS_ROLE_MAP && window.CS_ROLE_MAP['MFD']) {
                _addCek('MFD tidak ada', 'warning', 'MFD ada di CS_ROLE_MAP');
            } else {
                _addCek('MFD tidak ada', 'ok', 'MFD tidak ada (benar)');
            }
        } catch (e) {
            hasil.ok = false;
            hasil.detail.push({ cek: 'exception', status: 'error', pesan: e.message });
        }
        return hasil;
    };

<!-- ═══ Dependency: CS1 v4.2+ (WAJIB) · CS2 v4.0+ (WAJIB) ═════ -->
<!-- ═══             GID v6.1+ (WAJIB) · CS17 v4.0+ (WAJIB) ═══ -->
<!-- ═══             CS16 v4.0+ (WAJIB) · CS9 v4.0 (OPSIONAL) ═ -->
<!-- ═══             MN v4.2 (OPSIONAL) · CS3 v4.0 · CS7 v4.0 ═ -->
<!-- ═══ Guard: _fgpaDoneV11 (UTAMA) + 2 alias ═════════════════ -->
<!-- ═══ Versi: 1.1 — R2COIN Merah Putih (Aturan-Compliant) ════ -->
<!-- ═══ Aturan: A1, A2, A3, A5, A11, A12, A13, A19, A25, ════ -->
<!-- ═══         A29—A32, A33, A34, A35, A36, A38, A40, A41, ═ -->
<!-- ═══         A42, A43, A44, A46 ═══════════════════════════ -->
<!-- ═══ Isi: 13 sub-seksi [FGPA.1]—[FGPA.13] ════════════════ -->
<!-- ═══   [FGPA.1]  Guard 3 lapis + dep retry + A43 ═════════ -->
<!-- ═══   [FGPA.2]  Konstanta delegasi (CS_STATUS) ═════════ -->
<!-- ═══   [FGPA.3]  Helper internal (delegasi CS1/CS2/CS16) ═ -->
<!-- ═══   [FGPA.4]  GETTER: ListAntrean, ListDokumen ════════ -->
<!-- ═══   [FGPA.5]  VALIDATOR: CekSyarat, CekRoleButuhVerif -->
<!-- ═══   [FGPA.6]  MUTATOR: Setujui, Tolak, MintaRevisi ═════ -->
<!-- ═══   [FGPA.7]  BATCH: SetujuiBatch, TolakBatch, RevisiBatch -->
<!-- ═══   [FGPA.8]  USER SIDE: CekStatusSaya ════════════════ -->
<!-- ═══   [FGPA.9]  STATISTIK: Antrean & Verifikasi ═════════ -->
<!-- ═══   [FGPA.10] PINTU 1 — kirimFGPA (A11, A13) ═════════ -->
<!-- ═══   [FGPA.11] PINTU 2 — terimaFGPA (A11) ═════════════ -->
<!-- ═══   [FGPA.12] PINTU 3 — ambilFGPA (A11, A13, FIXED) ═ -->
<!-- ═══   [FGPA.13] Debug + Auto-registry + Log ════════════ -->
<!-- ═══ ⚠️ A25: SEMUA delegasi: fkaListAkun, fkaListArsip ══ -->
<!-- ═══    fvdSetujui/Tolak/MintaRevisi/CekKelengkapan, ═════ -->
<!-- ═══    csGetRoleInfo, CS_STATUS, gidGetUserById ════════ -->
<!-- ═══ ⚠️ A11/A13: ambilFGPA return paket {tipe,dari,ke,data,idRef} -->
<!-- ═══ ⚠️ A43: WAJIB blokDaftarkanGuard("_fgpaDoneV11","FGPA") -->
<!-- ═══ ⚠️ A44: FIX WAJIB di sumber ini — JANGAN patch Console -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<script>
(function BLOK_FGPA_V11() {

    // ═══════════════════════════════════════════════════════════
    // [FGPA.1] — GUARD 3 LAPIS + DEP RETRY + A43 SELF-REGISTER
    // ═══════════════════════════════════════════════════════════
    if (window._fgpaDoneV11) return;

    // ── A19: CS1 (WAJIB) ──
    if (!window.CS_ROLE_MAP) {
        window._fgpaRetryCS1 = (window._fgpaRetryCS1 || 0) + 1;
        if (window._fgpaRetryCS1 < 20) { setTimeout(BLOK_FGPA_V11, 500); return; }
        console.warn('⚠️ FGPA v1.1: CS1 tidak tersedia setelah 20 retry. Ditunda.');
        return;
    }

    // ── A19: GID (WAJIB) ──
    if (typeof window.gidIdUser !== 'function' ||
        typeof window.gidKodeRoleUser !== 'function' ||
        typeof window.gidGetUserById !== 'function') {
        window._fgpaRetryGID = (window._fgpaRetryGID || 0) + 1;
        if (window._fgpaRetryGID < 20) { setTimeout(BLOK_FGPA_V11, 500); return; }
        console.warn('⚠️ FGPA v1.1: GID tidak tersedia setelah 20 retry. Ditunda.');
        return;
    }

    // ── A19: CS17 FVD (WAJIB) ──
    if (typeof window.fvdSetujui !== 'function' ||
        typeof window.fvdTolak !== 'function' ||
        typeof window.fvdMintaRevisi !== 'function') {
        window._fgpaRetryCS17 = (window._fgpaRetryCS17 || 0) + 1;
        if (window._fgpaRetryCS17 < 20) { setTimeout(BLOK_FGPA_V11, 500); return; }
        console.warn('⚠️ FGPA v1.1: CS17 (FVD) tidak tersedia setelah 20 retry. Ditunda.');
        return;
    }

    // ── A19: CS16 FKA (WAJIB untuk list) ──
    if (typeof window.fkaListAkun !== 'function') {
        window._fgpaRetryCS16 = (window._fgpaRetryCS16 || 0) + 1;
        if (window._fgpaRetryCS16 < 20) { setTimeout(BLOK_FGPA_V11, 500); return; }
        console.warn('⚠️ FGPA v1.1: CS16 (FKA) tidak tersedia setelah 20 retry. Ditunda.');
        return;
    }

    // ── A19: CS2 storage helper ──
    if (typeof window.csLoadJSON !== 'function' || typeof window.csSaveJSON !== 'function') {
        console.warn('⚠️ FGPA v1.1: csLoadJSON/csSaveJSON bukan function. Ditunda.');
        return;
    }

    // ── Guard 3 lapis ──
    window._fgpaDoneV11 = true;   // ⭐ UTAMA v1.1
    window._fgpaDoneV1  = true;   // ← alias legacy + CPAJ detection
    window._fgpaDone    = true;   // ← general alias
    window._fgpaVersi   = '1.1';

    // ── A43: Self-register guard ──
    if (typeof window.blokDaftarkanGuard === 'function') {
        window.blokDaftarkanGuard('_fgpaDoneV11', 'FGPA');
    }

    // ═══════════════════════════════════════════════════════════
    // [FGPA.2] — KONSTANTA DELEGASI (A1, A2, A25)
    // ═══════════════════════════════════════════════════════════
    // Status Pending & Revisi DELEGASI ke CS_STATUS (CS1 v4.2)
    // ═══════════════════════════════════════════════════════════
    function _getStatusMap() {
        if (window.CS_STATUS) return window.CS_STATUS;
        return {
            AKTIF:    'Aktif',
            PENDING:  'Pending',
            REJECTED: 'Ditolak',
            REVISI:   'Revisi',
            BLOKIR:   'Diblokir',
            NONAKTIF: 'Nonaktif',
            ARSIP:    'Diarsipkan'
        };
    }

    // A38: 15 role verif — delegasi CS17 / CS13
    function _getRoleVerif15() {
        if (window.CS17_ROLE_BUTUH_VERIF) return window.CS17_ROLE_BUTUH_VERIF.slice();
        if (window.CS13_ROLE_BUTUH_VERIF) return window.CS13_ROLE_BUTUH_VERIF.slice();
        return [];
    }

    // ═══════════════════════════════════════════════════════════
    // [FGPA.3] — HELPER INTERNAL (DELEGASI A1/A2/A25)
    // ═══════════════════════════════════════════════════════════

    // A25: Delegasi ke CS1 csGetRoleInfo (prioritas) — bukan role32Info
    function _infoRole(kodeRole) {
        if (!kodeRole) return null;
        if (typeof window.csGetRoleInfo === 'function') {
            var info = window.csGetRoleInfo(kodeRole);
            if (info) return info;
        }
        if (typeof window.role32Info === 'function') {
            return window.role32Info(kodeRole);
        }
        return window.CS_ROLE_MAP[kodeRole] || null;
    }

    // A25: Delegasi ke CS16 fkaListAkun
    function _loadUsers(filter) {
        filter = filter || {};
        if (typeof window.fkaListAkun === 'function') {
            return window.fkaListAkun(Object.assign({
                limit: 9999,
                includeArsip: true
            }, filter));
        }
        return window.csLoadJSON('dataLoginUser', []) || [];
    }

    // A38: Delegasi ke CS17 / CS13
    function _roleButuhVerif(kodeRole) {
        if (!kodeRole) return false;
        if (typeof window.fvdCekRoleButuhVerif === 'function') {
            return window.fvdCekRoleButuhVerif(kodeRole);
        }
        if (typeof window.csRoleButuhVerif === 'function') {
            return window.csRoleButuhVerif(kodeRole);
        }
        return _getRoleVerif15().indexOf(kodeRole) !== -1;
    }

    // ═══════════════════════════════════════════════════════════
    // [FGPA.4] — GETTER: ListAntrean, ListDokumen
    // ═══════════════════════════════════════════════════════════

    // ── fgpaListAntrean (A25: delegasi CS16 + CS_STATUS) ──
    window.fgpaListAntrean = function(filter) {
        filter = filter || {};
        try {
            var S = _getStatusMap();

            // A25: base list dari CS16
            var list = _loadUsers({ limit: 9999, includeArsip: false });

            // Filter status: Pending atau Revisi (delegasi CS_STATUS)
            list = list.filter(function(u) {
                var st = (u.status || u.statusVerifikasi || S.PENDING).toLowerCase();
                return st === S.PENDING.toLowerCase() || st === S.REVISI.toLowerCase();
            });

            // Filter role
            if (filter.kodeRole) {
                list = list.filter(function(u) { return u.kodeRole === filter.kodeRole; });
            }
            // Filter kategori (A36: delegasi info role)
            if (filter.kategori) {
                list = list.filter(function(u) {
                    var info = _infoRole(u.kodeRole);
                    return info && info.kategori === filter.kategori;
                });
            }
            // Filter cari
            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(u) {
                    return (String(u.nama || u.namaLengkap || '').toLowerCase().indexOf(q) !== -1) ||
                           (String(u.email || '').toLowerCase().indexOf(q) !== -1) ||
                           (String(u.idUser || '').toLowerCase().indexOf(q) !== -1);
                });
            }
            // Filter butuhVerif (A38)
            if (filter.hanyaButuhVerif === true) {
                list = list.filter(function(u) { return _roleButuhVerif(u.kodeRole); });
            }

            // Sort by createdAt desc
            list.sort(function(a, b) {
                return new Date(b.createdAt || 0).getTime() -
                       new Date(a.createdAt || 0).getTime();
            });

            return { sukses: true, total: list.length, data: list };
        } catch (e) {
            console.error('[FGPA v1.1] fgpaListAntrean error:', e);
            return { sukses: false, pesan: e.message, data: [] };
        }
    };

    // ── fgpaListDokumen (A25: delegasi CS17) ──
    window.fgpaListDokumen = function(idUser) {
        try {
            if (!idUser) return { sukses: false, pesan: 'ID kosong', data: null };

            // A25: delegasi ke CS17 fvdDetailPengajuan
            if (typeof window.fvdDetailPengajuan === 'function') {
                var detail = window.fvdDetailPengajuan(idUser);
                if (detail) {
                    return { sukses: true, data: detail };
                }
            }

            // A25: fallback ke GID
            var user = window.gidGetUserById(idUser);
            if (!user) {
                return { sukses: false, pesan: 'User tidak ditemukan', data: null };
            }

            return {
                sukses: true,
                pesan:  'Belum ada dokumen terunggah',
                data:   { user: user, dokumen: {} }
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGPA.5] — VALIDATOR: CekSyarat, CekRoleButuhVerif
    // ═══════════════════════════════════════════════════════════

    // ── fgpaCekSyarat (A25: delegasi CS17 fvdCekKelengkapan) ──
    window.fgpaCekSyarat = function(idUser) {
        try {
            if (!idUser) return { lengkap: false, pesan: 'ID kosong' };

            // A25: delegasi CS17
            if (typeof window.fvdCekKelengkapan === 'function') {
                return window.fvdCekKelengkapan(idUser);
            }

            // Fallback (aman — bukan auto-approve)
            return {
                lengkap: false,
                pesan:   'CS17 (FVD) belum terpasang — tidak bisa validasi kelengkapan',
                persen:  0
            };
        } catch (e) {
            return { lengkap: false, pesan: e.message };
        }
    };

    // ── fgpaCekRoleButuhVerif (A38, A25) ──
    window.fgpaCekRoleButuhVerif = function(kodeRole) {
        return _roleButuhVerif(kodeRole);
    };

    // ═══════════════════════════════════════════════════════════
    // [FGPA.6] — MUTATOR: Setujui, Tolak, MintaRevisi
    // ═══════════════════════════════════════════════════════════

    // ── Helper internal: kirim notif ke user (CS9 + MN) ──
    function _kirimNotifUser(idUser, judul, pesan, prioritas) {
        try {
            // Prioritas 1: CS9 csNotifTambah (notifikasi dalam app)
            if (typeof window.csNotifTambah === 'function') {
                window.csNotifTambah({
                    idUser:    idUser,
                    judul:     judul,
                    pesan:     pesan,
                    ikon:      'fas fa-file-signature',
                    warna:     prioritas === 'high' ? 'danger' : 'warning',
                    kategori:  'Verifikasi',
                    prioritas: prioritas || 'normal',
                    idRef:     idUser
                });
            }
            // A12: juga kirim via MN (paralel, tidak blocking)
            if (typeof window.mnKirimKeUser === 'function') {
                try {
                    window.mnKirimKeUser(idUser, 'notif', {
                        judul:     judul,
                        pesan:     pesan,
                        prioritas: prioritas || 'normal'
                    }, { menu: 'FGPA' });
                } catch (e) {}
            }
        } catch (e) {}
    }

    // ── fgpaSetujui (A25: delegasi CS17 fvdSetujui) ──
    window.fgpaSetujui = function(idUser, catatan) {
        try {
            if (!idUser) return { sukses: false, pesan: 'ID kosong' };

            // Opsional: cek kelengkapan (warning saja, tidak blocking SA)
            var cek = window.fgpaCekSyarat(idUser);
            if (!cek.lengkap) {
                console.warn('[FGPA v1.1] Setujui akun dengan dokumen kurang lengkap:',
                    cek.pesan || cek.hilang);
            }

            // A25: delegasi ke CS17
            var res = window.fvdSetujui(idUser, catatan || 'Disetujui Admin');

            if (res.sukses) {
                _kirimNotifUser(
                    idUser,
                    'Akun Disetujui',
                    'Akun Anda telah diverifikasi dan aktif.',
                    'normal'
                );
                // A34: catat via CS7
                if (typeof window.catatAktivitasGlobal === 'function') {
                    try {
                        window.catatAktivitasGlobal(
                            window.gidIdUser(),
                            'FGPA Setujui',
                            'Setujui akun ' + idUser + (catatan ? ' — ' + catatan : ''),
                            { kategori: 'Verifikasi', idRef: idUser }
                        );
                    } catch (e) {}
                }
            }
            return res;
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ── fgpaTolak (A25: delegasi CS17 fvdTolak) ──
    window.fgpaTolak = function(idUser, alasan) {
        try {
            if (!idUser) return { sukses: false, pesan: 'ID kosong' };
            if (!alasan) return { sukses: false, pesan: 'Alasan penolakan wajib diisi' };

            var res = window.fvdTolak(idUser, alasan);

            if (res.sukses) {
                _kirimNotifUser(
                    idUser,
                    'Akun Ditolak',
                    'Maaf, pendaftaran Anda ditolak: ' + alasan,
                    'high'
                );
                if (typeof window.catatAktivitasGlobal === 'function') {
                    try {
                        window.catatAktivitasGlobal(
                            window.gidIdUser(),
                            'FGPA Tolak',
                            'Tolak akun ' + idUser + '. Alasan: ' + alasan,
                            { kategori: 'Verifikasi', idRef: idUser, level: 'warning' }
                        );
                    } catch (e) {}
                }
            }
            return res;
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ── fgpaMintaRevisi (A25: delegasi CS17 fvdMintaRevisi) ──
    window.fgpaMintaRevisi = function(idUser, catatan) {
        try {
            if (!idUser) return { sukses: false, pesan: 'ID kosong' };
            if (!catatan) return { sukses: false, pesan: 'Catatan revisi wajib diisi' };

            var res = window.fvdMintaRevisi(idUser, catatan);

            if (res.sukses) {
                _kirimNotifUser(
                    idUser,
                    'Perbaikan Dokumen',
                    'Dokumen Anda perlu direvisi: ' + catatan,
                    'high'
                );
                if (typeof window.catatAktivitasGlobal === 'function') {
                    try {
                        window.catatAktivitasGlobal(
                            window.gidIdUser(),
                            'FGPA Minta Revisi',
                            'Minta revisi akun ' + idUser + '. Catatan: ' + catatan,
                            { kategori: 'Verifikasi', idRef: idUser, level: 'warning' }
                        );
                    } catch (e) {}
                }
            }
            return res;
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGPA.7] — BATCH: SetujuiBatch, TolakBatch, RevisiBatch
    // ═══════════════════════════════════════════════════════════
    window.fgpaSetujuiBatch = function(listIdUser, catatan) {
        try {
            if (!Array.isArray(listIdUser) || listIdUser.length === 0) {
                return { sukses: false, pesan: 'List kosong' };
            }
            if (listIdUser.length > 50) {
                return { sukses: false, pesan: 'Maksimal 50 per batch' };
            }
            var hasil = { sukses: 0, gagal: 0, list: [] };
            listIdUser.forEach(function(id) {
                var r = window.fgpaSetujui(id, catatan);
                if (r && r.sukses) {
                    hasil.sukses++;
                    hasil.list.push({ id: id, status: 'ok' });
                } else {
                    hasil.gagal++;
                    hasil.list.push({ id: id, pesan: r ? r.pesan : 'unknown' });
                }
            });
            return hasil;
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.fgpaTolakBatch = function(listIdUser, alasan) {
        try {
            if (!Array.isArray(listIdUser) || listIdUser.length === 0) {
                return { sukses: false, pesan: 'List kosong' };
            }
            if (!alasan) return { sukses: false, pesan: 'Alasan wajib' };
            if (listIdUser.length > 50) {
                return { sukses: false, pesan: 'Maksimal 50 per batch' };
            }
            var hasil = { sukses: 0, gagal: 0, list: [] };
            listIdUser.forEach(function(id) {
                var r = window.fgpaTolak(id, alasan);
                if (r && r.sukses) {
                    hasil.sukses++;
                    hasil.list.push({ id: id, status: 'ok' });
                } else {
                    hasil.gagal++;
                    hasil.list.push({ id: id, pesan: r ? r.pesan : 'unknown' });
                }
            });
            return hasil;
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.fgpaRevisiBatch = function(listIdUser, catatan) {
        try {
            if (!Array.isArray(listIdUser) || listIdUser.length === 0) {
                return { sukses: false, pesan: 'List kosong' };
            }
            if (!catatan) return { sukses: false, pesan: 'Catatan wajib' };
            if (listIdUser.length > 50) {
                return { sukses: false, pesan: 'Maksimal 50 per batch' };
            }
            var hasil = { sukses: 0, gagal: 0, list: [] };
            listIdUser.forEach(function(id) {
                var r = window.fgpaMintaRevisi(id, catatan);
                if (r && r.sukses) {
                    hasil.sukses++;
                    hasil.list.push({ id: id, status: 'ok' });
                } else {
                    hasil.gagal++;
                    hasil.list.push({ id: id, pesan: r ? r.pesan : 'unknown' });
                }
            });
            return hasil;
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGPA.8] — USER SIDE: CekStatusSaya
    // ═══════════════════════════════════════════════════════════
    window.fgpaCekStatusSaya = function() {
        try {
            var idUser = window.gidIdUser();
            if (!idUser) return { sukses: false, pesan: 'Sesi habis' };

            // A25: delegasi GID
            var user = window.gidGetUserById(idUser);
            if (!user) return { sukses: false, pesan: 'User tidak ditemukan' };

            var S = _getStatusMap();
            var status  = user.status || user.statusVerifikasi || S.PENDING;
            var catatan = user.catatanVerifikator || user.alasanPerubahanStatus || '';

            return {
                sukses: true,
                data: {
                    status:     status,
                    catatan:    catatan,
                    tglUpdate:  user.diverifikasiPada || user.updatedAt || '-',
                    sudahVerif: status === S.AKTIF,
                    butuhVerif: _roleButuhVerif(user.kodeRole)
                }
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGPA.9] — STATISTIK: Antrean & Verifikasi
    // ═══════════════════════════════════════════════════════════
    window.fgpaStatistik = function() {
        try {
            // A25: delegasi CS16 fkaStatistikAkun
            var statCS16 = (typeof window.fkaStatistikAkun === 'function')
                ? window.fkaStatistikAkun()
                : null;

            // A25: delegasi CS17 fvdStatistikVerifikasi
            var statCS17 = (typeof window.fvdStatistikVerifikasi === 'function')
                ? window.fvdStatistikVerifikasi()
                : null;

            return {
                sukses: true,
                data: {
                    totalAkun:       statCS16 ? statCS16.total      : 0,
                    pending:         statCS16 ? statCS16.totalPending : 0,
                    butuhVerif:      statCS16 ? statCS16.butuhVerif   : 0,
                    perluTindakan:   statCS17 ? statCS17.perluTindakan : 0,
                    perStatus:       statCS17 ? statCS17.perStatus   : {},
                    perKategori:     statCS17 ? statCS17.perKategori : {},
                    _sumberCS16:     !!statCS16,
                    _sumberCS17:     !!statCS17
                }
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGPA.10] — PINTU 1: KIRIM (A11, A13)
    // ═══════════════════════════════════════════════════════════
    window.kirimFGPA = function(tipe, ke, data, idRef) {
        try {
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }
            return window.mnKirimKeMenu({
                tipe: tipe || 'info',
                dari: {
                    idUser:   window.gidIdUser(),

<script>
(function BLOK_FGDA_V11() {

    // ═══════════════════════════════════════════════════════════
    // [FGDA.1] — GUARD 3 LAPIS + DEP RETRY + A43 SELF-REGISTER
    // ═══════════════════════════════════════════════════════════
    if (window._fgdaDoneV11) return;

    // ── A19: CS1 ──
    if (!window.CS_ROLE_MAP) {
        window._fgdaRetryCS1 = (window._fgdaRetryCS1 || 0) + 1;
        if (window._fgdaRetryCS1 < 20) { setTimeout(BLOK_FGDA_V11, 500); return; }
        console.warn('⚠️ FGDA v1.1: CS1 tidak tersedia. Ditunda.');

    // ── A19: GID ──
    if (typeof window.gidIdUser !== 'function' ||
        typeof window.gidKodeRoleUser !== 'function' ||
        typeof window.gidGetUserById !== 'function') {
        window._fgdaRetryGID = (window._fgdaRetryGID || 0) + 1;

        console.warn('⚠️ FGDA v1.1: GID tidak tersedia. Ditunda.');

    // ═══════════════════════════════════════════════════════════
    // [FGDA.2] — KONSTANTA DELEGASI (A1, A2, A25)

            PENDING:  'Pending',

            var list = [];
            Object.keys(window.CS_ROLE_MAP).forEach(function(kode) {
                var r = window.CS_ROLE_MAP[kode];

                list.push({
                    kode:      kode,
                    nama:      r.nama,
                    kategori:  r.kategori,

            // A25: delegasi CS11
            if (typeof window.cekDuplikatAkunGlobal === 'function') {
                var dup = window.cekDuplikatAkunGlobal({ username: username });
                if (!dup.sukses) {
                    return { tersedia: false, pesan: dup.pesan };
                }
                return { tersedia: true, pesan: 'Username tersedia' };
            }

            // Fallback
            var users = window.csLoadJSON('dataLoginUser', []) || [];
            var uLower = String(username).toLowerCase();
            var exists = users.some(function(u) {
                return u && u.username && u.username.toLowerCase() === uLower;
            });
            return exists
                ? { tersedia: false, pesan: 'Username sudah dipakai' }
                : { tersedia: true, pesan: 'Username tersedia' };
        } catch (e) {
            return { tersedia: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGDA.5] — MUTATOR: BuatAkunBaru (A25: delegasi CS15)
    // ═══════════════════════════════════════════════════════════
    window.fgdaBuatAkunBaru = function(kodeRole, dataSA, opts) {
        opts = opts || {};
        try {
            // Validasi input
            if (!kodeRole) return { sukses: false, pesan: 'Role wajib dipilih' };
            if (!dataSA || !dataSA.username) return { sukses: false, pesan: 'Username wajib' };
            if (!dataSA.password) return { sukses: false, pesan: 'Password wajib' };

            // Cek duplikat (via helper delegasi)
            var cek = window.fgdaCekUsernameTersedia(dataSA.username);
            if (!cek.tersedia) return { sukses: false, pesan: cek.pesan };

            var infoRole = _infoRole(kodeRole);
            if (!infoRole) return { sukses: false, pesan: 'Role tidak dikenal: ' + kodeRole };

            // Siapkan payload (dummy NIK untuk lolos CS15)
            var butuhNik = infoRole.butuhKTP === true;
            var payload = {
                username: dataSA.username,
                password: dataSA.password,
                nama:     dataSA.nama || ('Akun Baru ' + infoRole.nama),
                nik:      butuhNik ? '0000000000000000' : null,
                email:    dataSA.email || (dataSA.username + '@pending.r2coin.id'),
                hp:       dataSA.hp || '080000000000',
                alamat:   dataSA.alamat || 'Belum diisi (Menunggu User)',
                lat:      0,
                lng:      0
            };
            if (opts.idOwner) payload.idOwner = opts.idOwner;
            if (opts.idInduk) payload.idInduk = opts.idInduk;

            // A25: delegasi ke CS15
            var resFba = window.fbaBuatAkun(kodeRole, payload, opts);
            if (!resFba.sukses) {
                return { sukses: false, pesan: 'Gagal CS15: ' + resFba.pesan };
            }

            // Post-processing: tandai akun parsial
            var idUserBaru = resFba.idUser;
            var users = window.csLoadJSON('dataLoginUser', []) || [];
            var idx = users.findIndex(function(u) {
                return u && (u.idUser === idUserBaru || u.id === idUserBaru);
            });
            if (idx !== -1) {
                var S = _getStatusMap();
                users[idx]._isPartial = true;
                users[idx].nik_ktp = null;
                if (butuhNik) {
                    users[idx].statusVerifikasi = S.PENDING;
                    users[idx].status = S.PENDING;
                }
                window.csSaveJSON('dataLoginUser', users, { backup: false });

                // A34: catat via CS7
                if (typeof window.catatAktivitasGlobal === 'function') {
                    try {
                        window.catatAktivitasGlobal(
                            window.gidIdUser(),
                            'Buat Akun Parsial (SA)',
                            'Akun ' + kodeRole + ' untuk ' + dataSA.username,
                            { kategori: 'Akun', idRef: idUserBaru }
                        );
                    } catch (e) {}
                }
            }

            return {
                sukses:     true,
                pesan:      'Akun berhasil dibuat. Status: ' + resFba.statusAwal,
                idUser:     idUserBaru,
                statusAwal: resFba.statusAwal,
                butuhVerif: resFba.butuhVerif
            };
        } catch (e) {
            console.error('[FGDA v1.1] fgdaBuatAkunBaru error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGDA.6] — BATCH: GenerateAkunMassal (max 50)
    // ═══════════════════════════════════════════════════════════
    window.fgdaGenerateAkunMassal = function(kodeRole, jumlah, prefix, opts) {
        try {
            if (!kodeRole || !jumlah || jumlah < 1) {
                return { sukses: false, pesan: 'Parameter tidak valid' };
            }
            if (jumlah > 50) {
                return { sukses: false, pesan: 'Maksimal 50 akun per batch' };
            }

            var berhasil = 0, gagal = 0, listAkun = [];
            var prefixUser = prefix || (kodeRole.toLowerCase() + '-');

            for (var i = 1; i <= jumlah; i++) {
                var username = prefixUser + i;
                var password = '123456';
                var res = window.fgdaBuatAkunBaru(kodeRole, {
                    username: username,
                    password: password,
                    nama:     'Akun Massal ' + i
                }, opts);
                if (res.sukses) {
                    berhasil++;
                    listAkun.push({ username: username, password: password, idUser: res.idUser });
                } else {
                    gagal++;
                }
            }

            return {
                sukses: true,
                pesan:  'Berhasil: ' + berhasil + ', Gagal: ' + gagal,
                list:   listAkun,
                totalBerhasil: berhasil,
                totalGagal:    gagal
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGDA.7] — STATISTIK
    // ═══════════════════════════════════════════════════════════
    window.fgdaStatistik = function() {
        try {
            var users = window.csLoadJSON('dataLoginUser', []) || [];
            var partial = users.filter(function(u) { return u && u._isPartial === true; });
            var S = _getStatusMap();
            var pending = users.filter(function(u) {
                var st = u.status || u.statusVerifikasi;
                return st === S.PENDING;
            });
            return {
                sukses: true,
                data: {
                    totalAkun:        users.length,
                    totalPartial:     partial.length,
                    totalPending:     pending.length,
                    pilihanRole:      window.fgdaAmbilPilihanRole().length
                }
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGDA.8] — PINTU 1: KIRIM (A11, A13)
    // ═══════════════════════════════════════════════════════════
    window.kirimFGDA = function(tipe, ke, data, idRef) {
        try {
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }
            return window.mnKirimKeMenu({
                tipe: tipe || 'info',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser(),
                    menu:     'FGDA',
                    blok:     'L4-FGDA'
                },
                ke:        ke || { menu: 'FGDA' },
                data:      data || {},
                idRef:     idRef || null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()
            });
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGDA.9] — PINTU 2 & 3: TERIMA & AMBIL (FIXED A13)
    // ═══════════════════════════════════════════════════════════
    window.terimaFGDA = function(aksiMenu, opts) {
        try {
            if (typeof window.mnInboxMenu !== 'function') return [];
            return window.mnInboxMenu(aksiMenu || 'FGDA', opts);
        } catch (e) { return []; }
    };

    // FIX A13: return format paket
    window.ambilFGDA = function(idPaket, aksiMenu, opts) {
        opts = opts || {};
        try {
            // Mode 1: ambil MN paket
            if (idPaket && aksiMenu && typeof window.mnAmbilPaket === 'function') {
                return window.mnAmbilPaket(aksiMenu, idPaket, opts);
            }
            // Mode 2: snapshot paket (A13 compliant)
            var roles = window.fgdaAmbilPilihanRole();
            var stat = window.fgdaStatistik();
            return {
                tipe: 'snapshot-fgda',
                dari: { menu: 'FGDA', blok: 'L4-FGDA' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: {
                    pilihanRole: roles,
                    totalRole:   roles.length,
                    statistik:   stat.data,
                    pengirim: {
                        idUser:   window.gidIdUser(),
                        kodeRole: window.gidKodeRoleUser()
                    }
                },
                idRef:     null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()
            };
        } catch (e) {
            return {
                tipe: 'error',
                dari: { menu: 'FGDA', blok: 'L4-FGDA' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: null,
                pesan: e.message
            };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGDA.10a] — cekPintuFGDA + fgdaCekKonsistensi32
    // ═══════════════════════════════════════════════════════════
    window.cekPintuFGDA = function() {
        var skor =
            (typeof window.kirimFGDA  === 'function' ? 1 : 0) +
            (typeof window.terimaFGDA === 'function' ? 1 : 0) +
            (typeof window.ambilFGDA  === 'function' ? 1 : 0);
        return {
            blok:    'FGDA',
            kirim:   typeof window.kirimFGDA  === 'function',
            terima:  typeof window.terimaFGDA === 'function',
            ambil:   typeof window.ambilFGDA  === 'function',
            skor:    skor + '/3',
            lengkap: skor === 3
        };
    };

    window.fgdaCekKonsistensi32 = function() {
        var hasil = { ok: true, totalCek: 0, totalWarning: 0, detail: [] };
        function _addCek(nama, status, pesan) {
            hasil.totalCek++;
            if (status !== 'ok') hasil.totalWarning++;
            hasil.detail.push({ cek: nama, status: status, pesan: pesan || '-' });
            if (status !== 'ok') hasil.ok = false;
        }

        try {
            // [1] CS_ROLE_MAP = 32
            var total = window.CS_ROLE_MAP ? Object.keys(window.CS_ROLE_MAP).length : 0;
            if (total === 32) {
                _addCek('CS_ROLE_MAP = 32', 'ok', 'Benar: 32 role');
            } else {
                _addCek('CS_ROLE_MAP = 32', 'warning', 'Ada ' + total);
            }

            // [2] CS_STATUS lengkap
            var S = _getStatusMap();
            if (typeof S.PENDING === 'string' && typeof S.AKTIF === 'string') {
                _addCek('CS_STATUS lengkap', 'ok', 'Delegasi CS1 berhasil');
            } else {
                _addCek('CS_STATUS lengkap', 'warning', 'Beberapa status hilang');
            }

            // [3] GID helper
            if (typeof window.gidGetUserById === 'function' &&
                typeof window.gidIdUser === 'function') {
                _addCek('GID helper tersedia', 'ok', 'gidGetUserById + gidIdUser');
            } else {
                _addCek('GID helper tersedia', 'warning', 'GID belum v6.1+');
            }

            // [4] CS15 FBA
            if (typeof window.fbaBuatAkun === 'function' &&
                typeof window.fbaListRoleBisaDibuat === 'function') {
                _addCek('CS15 FBA tersedia', 'ok', 'buatAkun + listRole');
            } else {
                _addCek('CS15 FBA tersedia', 'warning', 'CS15 belum lengkap');
            }

            // [5] CS11 cekDuplikat
            if (typeof window.cekDuplikatAkunGlobal === 'function') {
                _addCek('CS11 cekDuplikat', 'ok', 'Delegasi CS11 tersedia');
            } else {
                _addCek('CS11 cekDuplikat', 'warning', 'Fallback lokal dipakai');
            }

            // [6] 3 Pintu lengkap
            var pintu = window.cekPintuFGDA();
            if (pintu.lengkap) {
                _addCek('3 Pintu lengkap', 'ok', '3/3');
            } else {
                _addCek('3 Pintu lengkap', 'warning', pintu.skor);
            }

            // [7] A43 self-register
            if (window.BLOK_GUARD_MAP && window.BLOK_GUARD_MAP['_fgdaDoneV11']) {
                _addCek('A43 self-register', 'ok', 'BLOK_GUARD_MAP terisi');
            } else if (typeof window.blokDaftarkanGuard === 'function') {
                _addCek('A43 self-register', 'warning', 'Entry FGDA belum terdaftar');
            } else {
                _addCek('A43 self-register', 'warning', 'blokDaftarkanGuard belum ada');
            }

            // [8] MFD tidak ada
            if (window.CS_ROLE_MAP && window.CS_ROLE_MAP['MFD']) {
                _addCek('MFD tidak ada', 'warning', 'MFD ada di CS_ROLE_MAP');
            } else {
                _addCek('MFD tidak ada', 'ok', 'MFD tidak ada (benar)');
            }

            // [9] Akun partial count
            var stat = window.fgdaStatistik();
            if (stat.sukses) {
                _addCek('Akun partial detectable', 'ok',
                    stat.data.totalPartial + ' akun parsial');
            } else {
                _addCek('Akun partial detectable', 'warning', 'Statistik gagal');
            }
        } catch (e) {
            hasil.ok = false;
            hasil.detail.push({ cek: 'exception', status: 'error', pesan: e.message });
        }
        return hasil;
    };

    // ═══════════════════════════════════════════════════════════
    // [FGDA.10b] — DEBUG (A5) — debugFGDA v1.1
    // ═══════════════════════════════════════════════════════════
    window.debugFGDA = function() {
        var stat   = window.fgdaStatistik();
        var pintu  = window.cekPintuFGDA();
        var konsis = window.fgdaCekKonsistensi32();
        var total  = window.CS_ROLE_MAP ? Object.keys(window.CS_ROLE_MAP).length : 0;

        var info = {
            blok:  'FGDA',
            versi: window._fgdaVersi,
            guard: {
                v11:  window._fgdaDoneV11,
                v1:   window._fgdaDoneV1,
                done: window._fgdaDone
            },
            statistik:     stat.data,
            pintu:         pintu,
            konsistensi32: konsis,
            cekV11: {
                A25_delegasi_CS15:  typeof window.fbaListRoleBisaDibuat === 'function' &&
                                    typeof window.fbaBuatAkun === 'function',
                A25_delegasi_CS11:  typeof window.cekDuplikatAkunGlobal === 'function',
                A25_delegasi_CS1:   typeof window.csGetRoleInfo === 'function',
                A25_delegasi_GID:   typeof window.gidGetUserById === 'function',
                A11_3Pintu:         pintu.lengkap,
                A13_FormatPaket:    typeof window.ambilFGDA === 'function',
                A43_SelfRegister:   !!(window.BLOK_GUARD_MAP && window.BLOK_GUARD_MAP['_fgdaDoneV11']),
                A44_FixDiSumber:    true,
                totalRole32:        total === 32,
                tidakAdaMFD:        !(window.CS_ROLE_MAP && window.CS_ROLE_MAP['MFD'])
            },
            fungsi: {
                fgdaAmbilPilihanRole:   typeof window.fgdaAmbilPilihanRole,
                fgdaCekUsernameTersedia: typeof window.fgdaCekUsernameTersedia,
                fgdaBuatAkunBaru:       typeof window.fgdaBuatAkunBaru,
                fgdaGenerateAkunMassal: typeof window.fgdaGenerateAkunMassal,
                fgdaStatistik:          typeof window.fgdaStatistik,
                kirimFGDA:              typeof window.kirimFGDA,
                terimaFGDA:             typeof window.terimaFGDA,
                ambilFGDA:              typeof window.ambilFGDA,
                cekPintuFGDA:           typeof window.cekPintuFGDA,
                fgdaCekKonsistensi32:   typeof window.fgdaCekKonsistensi32
            }
        };
        console.log('🔍 debugFGDA v1.1:', info);
        return info;
    };

    // ═══════════════════════════════════════════════════════════
    // [FGDA.10c] — AUTO-REGISTRY + LOG TERPASANG
    // ═══════════════════════════════════════════════════════════
    setTimeout(function() {
        try {
            // A33
            if (typeof window.cpTambahBlok === 'function') {
                var ada = (window.CP_REGISTRY_BLOK || []).some(function(b) {
                    return b && b.kode === 'FGDA';
                });
                var namaFinal = 'Daftar Akun Baru SA v1.1 (32 Role · Delegasi)';
                if (!ada) {
                    window.cpTambahBlok({
                        kode:    'FGDA',
                        nama:    namaFinal,
                        layer:   'L4',
                        status:  'Selesai',
                        tanggal: new Date().toISOString().substring(0, 10)
                    });
                } else if (typeof window.cpUpdateBlok === 'function') {
                    window.cpUpdateBlok('FGDA', { status: 'Selesai', nama: namaFinal });
                }
            }

            // A35
            if (typeof window.cpUpdateFungsi === 'function') {
                window.cpUpdateFungsi('fgda', {
                    nama:   'Daftar Akun Baru SA v1.1',
                    status: 'Selesai',
                    jumlah: 10
                });
            }

            // A34
            if (typeof window.cpTambahRiwayat === 'function') {
                var adaR = (window.CP_RIWAYAT || []).some(function(r) {
                    return r && r.blok === 'FGDA' && r.nama && r.nama.indexOf('v1.1') !== -1;
                });
                if (!adaR) {
                    window.cpTambahRiwayat({
                        blok: 'FGDA',
                        nama: 'FGDA v1.1 — Aturan-Compliant',
                        keterangan: 'FIX aturan produksi: A1/A2/A25 (delegasi fbaListRoleBisaDibuat, ' +
                                    'cekDuplikatAkunGlobal, fbaBuatAkun, csGetRoleInfo) · ' +
                                    'A11/A13 (ambilFGDA format paket) · ' +
                                    'A19 (retry per dependency) · ' +
                                    'A29/A30 (sub-seksi [FGDA.1]-[FGDA.10]) · ' +
                                    'A32 (guard 3 lapis) · A43 (blokDaftarkanGuard) · ' +
                                    'A46 (health sync) · +fgdaStatistik · +cekPintuFGDA · ' +
                                    '+fgdaCekKonsistensi32 (9 titik)'
                    });
                }
            }
        } catch (e) { console.warn('FGDA v1.1: Auto-registry error:', e.message); }
    }, 1000);

    // ── Log terpasang ──
    var _stat   = window.fgdaStatistik();
    var _pintu  = window.cekPintuFGDA();
    var _konsis = window.fgdaCekKonsistensi32();
    var _total  = window.CS_ROLE_MAP ? Object.keys(window.CS_ROLE_MAP).length : 0;

    console.log(
        '%c🇮🇩 BLOK FGDA v1.1 — FUNGSI GLOBAL DAFTAR AKUN BARU SA terpasang.',
        'background:linear-gradient(90deg,#DC3545 0%,#DC3545 50%,#FFFFFF 50%,#FFFFFF 100%);' +
        'color:#000;padding:3px 8px;font-weight:bold;border:2px solid #DC3545;'
    );
    console.log('   🚪 3 Pintu: ' + _pintu.skor + (_pintu.lengkap ? ' ✅' : ' ⚠️'));
    console.log('   🎯 Konsistensi 32: ' + (_konsis.ok ? '✅ ' : '⚠️ ') +
                _konsis.totalCek + ' cek · ' + _konsis.totalWarning + ' warning');
    console.log('   📊 Total akun: ' + (_stat.data ? _stat.data.totalAkun : 0) +
                ' · Partial: ' + (_stat.data ? _stat.data.totalPartial : 0));
    console.log('   🎯 32 ROLE: ' + _total + '/32 ' + (_total === 32 ? '✅' : '⚠️'));
    console.log('   ⭐ v1.1 FIX aturan produksi:');
    console.log('      ✅ A1/A2/A25: Delegasi CS15 (fbaListRoleBisaDibuat + fbaBuatAkun)');
    console.log('      ✅ A1/A2/A25: Delegasi CS11 (cekDuplikatAkunGlobal)');
    console.log('      ✅ A1/A2/A25: Delegasi CS1 (csGetRoleInfo)');
    console.log('      ✅ A11/A13: ambilFGDA format paket {tipe,dari,ke,data,idRef}');
    console.log('      ✅ A19: retry per dependency · A32: guard 3 lapis');
    console.log('      ✅ A43: self-register · A46: health sync');
    console.log('      ✅ +cekPintuFGDA · +fgdaCekKonsistensi32 (9 cek) · +fgdaStatistik');
    console.log('   🔍 Debug: debugFGDA() · cekPintuFGDA() · fgdaCekKonsistensi32()');
})();
</script>
