<script>
(function BLOK_FSF_V13() {
    // ═══════════════════════════════════════════════════════════
    // [FSF.0] — GUARD UTAMA + ALIAS (A32) + SELF-REGISTER (A43)
    // ═══════════════════════════════════════════════════════════
    if (window._fsfDoneV13) {
        console.log('ℹ️ BLOK FSF v1.3 sudah terpasang.');
        return;
    }
    if (!window.CS_ROLE_MAP || !window.csLoadJSON || !window.csSaveJSON) {
        console.warn('⚠️ BLOK FSF v1.3: Core System belum siap. Ditunda.');
        return;
    }
    if (typeof window.gidIdUser !== 'function') {
        console.warn('⚠️ BLOK FSF v1.3: GID belum siap. Ditunda.');
        return;
    }

    // ── Set guard 4 lapis (A32) ──
    window._fsfDoneV13 = true;   // ⭐ GUARD UTAMA v1.3
    window._fsfDoneV12 = true;   // alias backward compat
    window._fsfDoneV11 = true;   // alias
    window._fsfDoneV1  = true;   // alias legacy
    window._fsfVersi   = '1.3';

    // ── [A43/A46] Self-register guard ke BLOK_GUARD_MAP ──
    if (typeof window.blokDaftarkanGuard === 'function') {
        try {
            window.blokDaftarkanGuard('_fsfDoneV13', 'FSF');
        } catch (e) {
            console.warn('[FSF v1.3] blokDaftarkanGuard warn:', e.message);
        }
    }

    // ═══════════════════════════════════════════════════════════
    // [FSF.0b] — REGISTER KEY PREFIX KE CS_KEY (A18 PATTERN)
    // ═══════════════════════════════════════════════════════════
    if (window.CS_KEY) {
        window.CS_KEY.KERANJANG_DEVFIN_PREFIX =
            window.CS_KEY.KERANJANG_DEVFIN_PREFIX || 'dataKeranjangDevFin_';
    }

    // ═══════════════════════════════════════════════════════════
    // [FSF.1] — HELPER INTERNAL (delegasi CS2/CS4/CS5 — A1, A2, A25, A19)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) {
        try {
            var v = window.csLoadJSON(key, def);
            // A19: paksa tipe via CS4 helper jika tersedia
            if (typeof window.csIsArray === 'function' && window.csIsArray(def)) {
                return window.csIsArray(v) ? v : def;
            }
            if (typeof window.csIsObject === 'function' && window.csIsObject(def)) {
                return window.csIsObject(v) ? v : def;
            }
            // Fallback manual
            if (Array.isArray(def) && !Array.isArray(v)) return def;
            if (def && typeof def === 'object' && !Array.isArray(def) &&
                (!v || typeof v !== 'object' || Array.isArray(v))) {
                return def;
            }
            return v;
        } catch (e) { return def; }
    }

    function _save(key, data) {
        try {
            return window.csSaveJSON(key, data, { backup: false });
        } catch (e) { return { sukses: false, pesan: e.message }; }
    }

    function _getKeranjangKey() {
        try {
            var prefix = (window.CS_KEY && window.CS_KEY.KERANJANG_DEVFIN_PREFIX)
                ? window.CS_KEY.KERANJANG_DEVFIN_PREFIX
                : 'dataKeranjangDevFin_';
            var idUser = window.gidIdUser ? window.gidIdUser() : 'GUEST';
            return prefix + idUser;
        } catch (e) {
            return 'dataKeranjangDevFin_GUEST';
        }
    }

    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }

    // A1: pakai generator ID dari CS5
    function _genIdRef() {
        try {
            if (typeof window.csGenerateIdTransaksi === 'function') {
                return window.csGenerateIdTransaksi();
            }
        } catch (e) {}
        return 'ORDER-' + Date.now();
    }

    // ═══════════════════════════════════════════════════════════
    // [FSF.2] — KONSTANTA 3 ROLE DEVFIN: DP · DLR · FIN
    // ═══════════════════════════════════════════════════════════
    // 3 role DevFin RESMI (dari CS_ROLE_MAP kategori Seller):
    //   • DP  — Drop Point      (kode awal 32.1 · alur self_register_verif_surat)
    //   • DLR — Dealer          (kode awal 34.1 · alur self_register_verif_surat)
    //   • FIN — Mitra Finansial (kode awal 33.1 · alur self_register_verif_surat)
    //
    // ❌ TIDAK termasuk:
    //   • JS  — Jasa Servis   → ditangani blok FJS (L4)
    //   • DST — Distributor   → ditangani blok FDS (L4)
    //   • TK  — Toko          → FSS (seller SKU)
    //   • PP  — Pedagang Pasar → FSS
    //   • PM  — Pedagang Makanan → FSS
    //   • COD — Mitra COD     → FSS
    //   • OJ  — Mitra Ojol    → FSO
    //   • GR  — Grosir        → FSS
    // ═══════════════════════════════════════════════════════════
    var ROLE_DEVFIN = ['DP', 'DLR', 'FIN'];

    window.FSF_ROLE_DEVFIN = ROLE_DEVFIN.slice();

    function _isRoleDevFinValid(kodeRole) {
        if (!kodeRole) return false;
        if (ROLE_DEVFIN.indexOf(kodeRole) === -1) return false;
        return !!(window.CS_ROLE_MAP && window.CS_ROLE_MAP[kodeRole]);
    }

    // ── 2.1 fsfListRoleDevFin() — konfirmasi 3 role + JS excluded ──
    window.fsfListRoleDevFin = function() {
        try {
            return ROLE_DEVFIN.map(function(k) {
                var info = window.CS_ROLE_MAP[k];
                return {
                    kode:     k,
                    nama:     info ? info.nama : k,
                    kodeAwal: info ? info.kodeAwal : '-',
                    kategori: info ? info.kategori : '-',
                    alur:     info ? info.alur : '-'
                };
            });
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSF.3] — GETTER KATALOG DEVFIN + VALIDASI
    // ═══════════════════════════════════════════════════════════

    // ── 3.1 fsfGetDaftarDevFin(filter) ──
    window.fsfGetDaftarDevFin = function(filter) {
        filter = filter || {};
        try {
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return [];

            var list = users.filter(function(u) {
                if (!u || !u.kodeRole) return false;
                if (!_isRoleDevFinValid(u.kodeRole)) return false;
                var st = u.status || u.statusVerifikasi || 'Aktif';
                return st === 'Aktif';
            });

            if (filter.kodeRole) {
                list = list.filter(function(u) { return u.kodeRole === filter.kodeRole; });
            }
            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(u) {
                    return String(u.nama || u.namaLengkap || '')
                        .toLowerCase().indexOf(q) !== -1;
                });
            }

            return list.map(function(u) {
                var profil = _load('profil_' + u.idUser, {});
                if (!profil || typeof profil !== 'object') profil = {};
                return {
                    idUser:   u.idUser || u.id,
                    namaToko: profil.namaToko || u.nama || u.namaLengkap || 'Mitra',
                    kodeRole: u.kodeRole,
                    wilayah:  u.alamat || 'Indonesia',
                    fotoUrl:  profil.fotoUrl || u.fotoUrl || '',
                    rating:   profil.rating || 5.0
                };
            });
        } catch (e) {
            console.error('[FSF v1.3] fsfGetDaftarDevFin error:', e);
            return [];
        }
    };

    // ── 3.2 fsfGetProdukDevFin(idOwner) ──
    window.fsfGetProdukDevFin = function(idOwner) {
        try {
            if (!idOwner) return [];
            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) return [];
            return produk.filter(function(p) {
                return p && (p.idOwner === idOwner || p.idUser === idOwner);
            });
        } catch (e) {
            console.error('[FSF v1.3] fsfGetProdukDevFin error:', e);
            return [];
        }
    };

    // ── 3.3 fsfCekDevFinValid(idUser) ──
    window.fsfCekDevFinValid = function(idUser) {
        try {
            if (!idUser) return { valid: false, pesan: 'ID kosong' };
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { valid: false, pesan: 'Data user tidak valid' };
            }

            var u = users.find(function(x) {
                return x && (x.idUser === idUser || x.id === idUser);
            });
            if (!u) return { valid: false, pesan: 'User tidak ditemukan: ' + idUser };

            if (!_isRoleDevFinValid(u.kodeRole)) {
                return {
                    valid: false,
                    pesan: 'Role bukan DevFin: ' + (u.kodeRole || '-') +
                           ' (harus DP/DLR/FIN)'
                };
            }

            var st = u.status || u.statusVerifikasi || 'Aktif';
            if (st !== 'Aktif') {
                return { valid: false, pesan: 'Mitra tidak aktif: ' + st };
            }

            return { valid: true, data: u };
        } catch (e) {
            return { valid: false, pesan: e.message };
        }
    };

    // ── 3.4 fsfStatistikDevFin() — per role count ──
    window.fsfStatistikDevFin = function() {
        try {
            var list = window.fsfGetDaftarDevFin();
            var perRole = {};
            ROLE_DEVFIN.forEach(function(k) { perRole[k] = 0; });
            list.forEach(function(m) {
                if (m && perRole[m.kodeRole] !== undefined) {
                    perRole[m.kodeRole]++;
                }
            });
            return {
                total:   list.length,
                perRole: perRole,
                target:  ROLE_DEVFIN.length   // 3
            };
        } catch (e) {
            return { total: 0, perRole: {}, target: 3 };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSF.4] — MANAJEMEN KERANJANG (CRUD)
    // ═══════════════════════════════════════════════════════════
    window.fsfGetKeranjang = function() {
        try {
            var cart = _load(_getKeranjangKey(), []);
            return Array.isArray(cart) ? cart : [];
        } catch (e) { return []; }
    };

    window.fsfTambahKeranjang = function(idProduk, qty) {
        try {
            if (!idProduk) return { sukses: false, pesan: 'ID kosong' };
            var n = parseInt(qty, 10) || 1;
            if (n < 1) n = 1;

            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) {
                return { sukses: false, pesan: 'Data produk tidak valid' };
            }

            var prod = produk.find(function(p) {
                return p && (p.id === idProduk || p.idProduk === idProduk);
            });
            if (!prod) return { sukses: false, pesan: 'Produk tidak ditemukan' };

            var idOwner = prod.idOwner || prod.idUser;
            var cek = window.fsfCekDevFinValid(idOwner);
            if (!cek.valid) {
                return { sukses: false, pesan: 'Produk bukan milik DevFin aktif: ' + cek.pesan };
            }

            var cart = window.fsfGetKeranjang();
            var existing = cart.find(function(c) { return c.idProduk === idProduk; });

            if (existing) {
                existing.qty += n;
                existing.subtotal = existing.qty * existing.harga;
            } else {
                cart.push({
                    idProduk: idProduk,
                    idOwner:  idOwner,
                    nama:     prod.nama || prod.namaProduk || '-',
                    harga:    parseFloat(prod.harga) || 0,
                    qty:      n,
                    subtotal: (parseFloat(prod.harga) || 0) * n
                });
            }
            var r = _save(_getKeranjangKey(), cart);
            if (!r.sukses) return { sukses: false, pesan: r.pesan };
            return { sukses: true, cart: cart };
        } catch (e) {
            console.error('[FSF v1.3] fsfTambahKeranjang error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    window.fsfHapusItemKeranjang = function(idProduk) {
        try {
            if (!idProduk) return { sukses: false, pesan: 'ID kosong' };
            var cart = window.fsfGetKeranjang().filter(function(c) {
                return c.idProduk !== idProduk;
            });
            var r = _save(_getKeranjangKey(), cart);
            return { sukses: r.sukses, cart: cart };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fsfKosongkanKeranjang = function() {
        try {
            var r = _save(_getKeranjangKey(), []);
            return { sukses: r.sukses, pesan: r.pesan };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSF.5] — CHECKOUT KE CHAT (delegasi MN — A25 murni)
    // ═══════════════════════════════════════════════════════════
    window.fsfCheckoutKeChat = function(idOwner, metode) {
        try {
            if (!idOwner) return { sukses: false, pesan: 'ID owner kosong' };

            // Validasi owner sebelum checkout
            var cekOwner = window.fsfCekDevFinValid(idOwner);
            if (!cekOwner.valid) {
                return { sukses: false, pesan: 'DevFin tidak valid: ' + cekOwner.pesan };
            }

            var cart = window.fsfGetKeranjang().filter(function(c) {
                return c.idOwner === idOwner;
            });
            if (cart.length === 0) {
                return { sukses: false, pesan: 'Keranjang kosong untuk owner ini' };
            }
            var total = cart.reduce(function(s, i) {
                return s + (i.subtotal || 0);
            }, 0);

            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }

            // A1: idRef via CS5
            var idRef = _genIdRef();

            // A13: paket standar lengkap
            var paketPesan = {
                tipe: 'order_devfin',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                    menu:     'FSF',
                    blok:     'L4-FSF'
                },
                ke: {
                    menu:           'chat_seller',
                    idUserTarget:   idOwner,
                    kodeRoleTarget: cekOwner.data.kodeRole
                },
                data: {
                    idOwner:  idOwner,
                    items:    cart,
                    total:    total,
                    metode:   metode || 'Transfer'
                },
                idRef:     idRef,
                timestamp: _now()
            };

            window.mnKirimKeMenu(paketPesan);

            // Hapus keranjang owner ini
            var newCart = window.fsfGetKeranjang().filter(function(c) {
                return c.idOwner !== idOwner;
            });
            _save(_getKeranjangKey(), newCart);

            return {
                sukses: true,
                pesan:  'Pesanan dikirim ke Mitra ' + cekOwner.data.kodeRole,
                idRef:  idRef,
                target: idOwner,
                total:  total
            };
        } catch (e) {
            console.error('[FSF v1.3] fsfCheckoutKeChat error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

            var daftarDevFin = window.fsfGetDaftarDevFin(filter);
            var keranjang    = window.fsfGetKeranjang();

            return {

                daftarDevFin:   daftarDevFin,
                totalKeranjang: keranjang.length,
                keranjang:      keranjang,
                statistik:      statistik

        } catch (e) {
            return {
                totalDevFin: 0, daftarDevFin: [],
                totalKeranjang: 0, keranjang: [],
                statistik: {}
            };
        }
    };

<!-- ═══   [FJS.4]  Card Layanan ready-to-render ⭐ ═══════════ -->

<!-- ═══   [FJS.6]  3 Pintu + cekPintu (A11—A13) ═════════════ -->

<!-- ═══   [A31] IIFE unik BLOK_FJS_V12 ══════════════════════ -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<script>
(function BLOK_FJS_V12() {
    // ═══════════════════════════════════════════════════════════
    // [FJS.0] — GUARD + SELF-REGISTER + CS_KEY (A32/A43/A18)
    // ═══════════════════════════════════════════════════════════
    if (window._fjsDoneV12) {
        console.log('ℹ️ BLOK FJS v1.2 sudah terpasang.');
        return;
    }
    if (!window.CS_ROLE_MAP || !window.csLoadJSON || !window.csSaveJSON) {
        console.warn('⚠️ BLOK FJS v1.2: Core System belum siap. Ditunda.');
        return;
    }
    if (typeof window.gidIdUser !== 'function') {
        console.warn('⚠️ BLOK FJS v1.2: GID belum siap. Ditunda.');
        return;
    }

    window._fjsDoneV12 = true;   // ⭐ GUARD UTAMA v1.2
    window._fjsDoneV11 = true;   // alias
    window._fjsDoneV1  = true;   // alias legacy
    window._fjsVersi   = '1.2';

    // A43/A46 — self-register
    if (typeof window.blokDaftarkanGuard === 'function') {
        try {
            window.blokDaftarkanGuard('_fjsDoneV12', 'FJS');
        } catch (e) {
            console.warn('[FJS v1.2] blokDaftarkanGuard warn:', e.message);
        }
    }

    // ═══════════════════════════════════════════════════════════
    // [FJS.1] — HELPER INTERNAL (A1, A2, A19, A25)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) {
        try {
            var v = window.csLoadJSON(key, def);
            if (typeof window.csIsArray === 'function' && window.csIsArray(def)) {
                return window.csIsArray(v) ? v : def;
            }
            if (typeof window.csIsObject === 'function' && window.csIsObject(def)) {
                return window.csIsObject(v) ? v : def;
            }
            if (Array.isArray(def) && !Array.isArray(v)) return def;
            if (def && typeof def === 'object' && !Array.isArray(def) &&
                (!v || typeof v !== 'object' || Array.isArray(v))) {
                return def;
            }
            return v;
        } catch (e) { return def; }
    }

    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }

    // A1 — pakai CS5 ID generator
    function _genIdRef() {
        try {
            if (typeof window.csGenerateIdVerifikasi === 'function') {
                return window.csGenerateIdVerifikasi('CHAT');
            }
            if (typeof window.csGenerateIdTransaksi === 'function') {
                return window.csGenerateIdTransaksi();
            }
        } catch (e) {}
        return 'CHAT-' + Date.now();
    }

    // ── 1.1 Placeholder foto (SVG inline, A45 fallback) ──
    var _FOTO_PLACEHOLDER = 'data:image/svg+xml;base64,' +
        'PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiB2aWV3Qm94PSIwIDAgMjAwIDIwMCI+' +
        'PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIyMDAiIGZpbGw9IiNGRUYzRTUiLz4+' +
        'PHBhdGggZD0iTTEwMCA2MCBMMTQwIDE0MCBMMTYwIDE0MCBMMTYwIDE2MCBMNDAgMTYwIEw0MCAxNDAgTDYwIDE0MCBMMTAwIDYweiIgZmlsbD0iI0ZGOTgwMCIgb3BhY2l0eT0iMC40Ii8+' +
        'PHRleHQgeD0iMTAwIiB5PSIxODAiIGZvbnQtc2l6ZT0iMTIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM5OTkiPkZvdG8gTGF5YW5hbjwvdGV4dD4+' +
        'PC9zdmc+';

    // ═══════════════════════════════════════════════════════════
    // [FJS.2] — 8 KATEGORI JASA + AUTO-KLASIFIKASI
    // ═══════════════════════════════════════════════════════════
    var KATEGORI_JASA = {
        'elektronik':  { label: 'Servis Elektronik',        ikon: 'fas fa-tv',                 warna: 'info'      },
        'otomotif':    { label: 'Bengkel Motor / Mobil',    ikon: 'fas fa-car',                warna: 'primary'   },
        'tambal-ban':  { label: 'Tambal Ban',               ikon: 'fas fa-circle-notch',       warna: 'warning'   },
        'sewa':        { label: 'Sewa Kendaraan / Alat',    ikon: 'fas fa-key',                warna: 'success'   },
        'urut':        { label: 'Jasa Urut / Pijat',        ikon: 'fas fa-hand-holding-heart', warna: 'danger'    },
        'tukang':      { label: 'Tukang / Perbaikan Rumah', ikon: 'fas fa-hammer',             warna: 'dark'      },
        'kebersihan':  { label: 'Jasa Kebersihan',          ikon: 'fas fa-broom',              warna: 'secondary' },
        'lain':        { label: 'Lain-lain',                ikon: 'fas fa-ellipsis-h',         warna: 'secondary' }
    };
    window.FJS_KATEGORI_JASA = KATEGORI_JASA;

    function _autoKategori(namaLayanan) {
        try {
            var n = String(namaLayanan || '').toLowerCase();
            if (/tambal|ban\b|tubeless/i.test(n)) return 'tambal-ban';
            if (/bengkel|servis motor|servis mobil|tune.?up|ganti oli/i.test(n)) return 'otomotif';
            if (/servis|service|ac\b|kulkas|tv\b|mesin cuci|elektronik|komputer|laptop/i.test(n)) return 'elektronik';
            if (/sewa|rental|pinjam/i.test(n)) return 'sewa';
            if (/urut|pijat|massage|refleksi|bekam/i.test(n)) return 'urut';
            if (/tukang|bangun|renovasi|perbaikan rumah|cat rumah|plafon/i.test(n)) return 'tukang';
            if (/bersih|cleaning|cuci|setrika|laundry/i.test(n)) return 'kebersihan';
            return 'lain';
        } catch (e) { return 'lain'; }
    }

    var ROLE_JASA = ['JS'];
    window.FJS_ROLE_JASA = ROLE_JASA.slice();

    function _isRoleJasaValid(kodeRole) {
        if (!kodeRole) return false;
        if (ROLE_JASA.indexOf(kodeRole) === -1) return false;
        return !!(window.CS_ROLE_MAP && window.CS_ROLE_MAP[kodeRole]);
    }

    // ═══════════════════════════════════════════════════════════
    // [FJS.3] — GETTER KATALOG + FOTO
    // ═══════════════════════════════════════════════════════════

    // ── 3.1 fjsGetKategoriJasa() ──
    window.fjsGetKategoriJasa = function() {
        try {
            return Object.keys(KATEGORI_JASA).map(function(k) {
                return {
                    kode:  k,
                    label: KATEGORI_JASA[k].label,
                    ikon:  KATEGORI_JASA[k].ikon,
                    warna: KATEGORI_JASA[k].warna
                };
            });
        } catch (e) { return []; }
    };

    // ── 3.2 fjsGetDaftarJasa(filter) ──
    window.fjsGetDaftarJasa = function(filter) {
        filter = filter || {};
        try {
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return [];

            var list = users.filter(function(u) {
                if (!u || !u.kodeRole) return false;
                if (!_isRoleJasaValid(u.kodeRole)) return false;
                var st = u.status || u.statusVerifikasi || 'Aktif';
                return st === 'Aktif';
            });

            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(u) {
                    return String(u.nama || u.namaLengkap || '')
                        .toLowerCase().indexOf(q) !== -1;
                });
            }
            if (filter.wilayah) {
                list = list.filter(function(u) {
                    return String(u.alamat || '').toLowerCase()
                        .indexOf(String(filter.wilayah).toLowerCase()) !== -1;
                });
            }

            return list.map(function(u) {
                var profil = _load('profil_' + u.idUser, {});
                if (!profil || typeof profil !== 'object') profil = {};
                return {
                    idUser:   u.idUser || u.id,
                    namaToko: profil.namaToko || u.nama || u.namaLengkap || 'Penyedia Jasa',
                    kodeRole: u.kodeRole,
                    wilayah:  u.alamat || 'Indonesia',
                    fotoUrl:  profil.fotoUrl || u.fotoUrl || '',
                    rating:   profil.rating || 5.0,
                    status:   (profil.statusOnline !== false) ? 'Online' : 'Offline'
                };
            });
        } catch (e) {
            console.error('[FJS v1.2] fjsGetDaftarJasa error:', e);
            return [];
        }
    };

    // ── 3.3 fjsGetLayananJasa(idJasa, filter) — FOTO diutamakan ──
    window.fjsGetLayananJasa = function(idJasa, filter) {
        filter = filter || {};
        try {
            if (!idJasa) return [];
            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) return [];

            var list = produk.filter(function(p) {
                return p && (p.idOwner === idJasa || p.idUser === idJasa);
            });

            var normalized = list.map(function(p) {
                var nama = p.nama || p.namaProduk || '-';
                var kat = p.kategoriJasa || _autoKategori(nama);
                // A45: foto — bisa dari fotoUrl, fotoUtama, atau MD
                var foto = p.fotoUrl || p.fotoUtama || p.thumbnailUrl || '';
                return {
                    id:           p.id || p.idProduk,
                    idOwner:      p.idOwner || p.idUser,
                    nama:         nama,
                    kategoriJasa: kat,
                    deskripsi:    p.deskripsi || '',
                    harga:        parseFloat(p.harga) || 0,
                    satuanHarga:  p.satuanHarga || 'per-unit',
                    durasiMenit:  parseInt(p.durasiMenit, 10) || 0,
                    lokasiKerja:  p.lokasiKerja || 'workshop',
                    fotoUrl:      foto,                    // ⭐ FOTO utama
                    fotoList:     Array.isArray(p.fotoList) ? p.fotoList : [],  // optional galeri
                    rating:       parseFloat(p.rating) || 5.0,
                    status:       p.status || 'aktif'
                };
            });

            if (filter.kategori) {
                normalized = normalized.filter(function(l) {
                    return l.kategoriJasa === filter.kategori;
                });
            }
            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                normalized = normalized.filter(function(l) {
                    return l.nama.toLowerCase().indexOf(q) !== -1 ||
                           (l.deskripsi || '').toLowerCase().indexOf(q) !== -1;
                });
            }
            if (filter.aktifSaja !== false) {
                normalized = normalized.filter(function(l) {
                    return l.status === 'aktif';
                });
            }
            if (filter.hanyaAdaFoto === true) {
                normalized = normalized.filter(function(l) {
                    return !!l.fotoUrl;
                });
            }
            return normalized;
        } catch (e) {
            console.error('[FJS v1.2] fjsGetLayananJasa error:', e);
            return [];
        }
    };

    // ── 3.4 fjsGetKatalogJasa(filter) — semua layanan + foto ──
    window.fjsGetKatalogJasa = function(filter) {
        filter = filter || {};
        try {
            var penyedia = window.fjsGetDaftarJasa(filter);
            var semua = [];

            penyedia.forEach(function(p) {
                var layanan = window.fjsGetLayananJasa(p.idUser, {
                    kategori:     filter.kategori,
                    cari:         filter.cari,
                    hanyaAdaFoto: filter.hanyaAdaFoto
                });
                layanan.forEach(function(l) {
                    semua.push(Object.assign({}, l, {
                        _penyedia: {
                            idUser:   p.idUser,
                            namaToko: p.namaToko,
                            wilayah:  p.wilayah,
                            rating:   p.rating,
                            fotoUrl:  p.fotoUrl,
                            status:   p.status
                        }
                    }));
                });
            });

            if (filter.hargaMax) {
                semua = semua.filter(function(l) { return l.harga <= filter.hargaMax; });
            }
            if (filter.ratingMin) {
                semua = semua.filter(function(l) { return l.rating >= filter.ratingMin; });
            }
            if (filter.lokasiKerja) {
                semua = semua.filter(function(l) {
                    return l.lokasiKerja === filter.lokasiKerja ||
                           l.lokasiKerja === 'keduanya';
                });
            }

            // Sort default: rating tertinggi
            semua.sort(function(a, b) {
                return (b.rating || 0) - (a.rating || 0);
            });
            return semua;
        } catch (e) {
            console.error('[FJS v1.2] fjsGetKatalogJasa error:', e);
            return [];
        }
    };

    // ── 3.5 fjsGetLayananById(idLayanan) — detail + foto ──
    window.fjsGetLayananById = function(idLayanan) {
        try {
            if (!idLayanan) return null;
            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) return null;
            var p = produk.find(function(x) {
                return x && (x.id === idLayanan || x.idProduk === idLayanan);
            });
            if (!p) return null;

            var idOwner = p.idOwner || p.idUser;
            var penyedia = null;
            if (idOwner) {
                var users = _load('dataLoginUser', []);
                var u = (users || []).find(function(x) {
                    return x && (x.idUser === idOwner || x.id === idOwner);
                });
                if (u) {
                    var profil = _load('profil_' + u.idUser, {});
                    if (!profil || typeof profil !== 'object') profil = {};
                    penyedia = {
                        idUser:   u.idUser || u.id,
                        namaToko: profil.namaToko || u.nama || u.namaLengkap || 'Penyedia Jasa',
                        wilayah:  u.alamat || 'Indonesia',
                        rating:   profil.rating || 5.0,
                        hp:       u.hp || '',
                        fotoUrl:  profil.fotoUrl || u.fotoUrl || '',
                        status:   (profil.statusOnline !== false) ? 'Online' : 'Offline'
                    };
                }
            }

            var nama = p.nama || p.namaProduk || '-';
            return {
                id:           p.id || p.idProduk,
                idOwner:      idOwner,
                nama:         nama,
                kategoriJasa: p.kategoriJasa || _autoKategori(nama),
                deskripsi:    p.deskripsi || '',
                harga:        parseFloat(p.harga) || 0,
                satuanHarga:  p.satuanHarga || 'per-unit',
                durasiMenit:  parseInt(p.durasiMenit, 10) || 0,
                lokasiKerja:  p.lokasiKerja || 'workshop',
                fotoUrl:      p.fotoUrl || p.fotoUtama || p.thumbnailUrl || '',   // ⭐ FOTO
                fotoList:     Array.isArray(p.fotoList) ? p.fotoList : [],
                rating:       parseFloat(p.rating) || 5.0,
                status:       p.status || 'aktif',
                _penyedia:    penyedia
            };
        } catch (e) {
            console.error('[FJS v1.2] fjsGetLayananById error:', e);
            return null;
        }
    };

    // ── 3.6 fjsGetLayananByKategori(kategori) — shortcut ──
    window.fjsGetLayananByKategori = function(kategori) {
        return window.fjsGetKatalogJasa({ kategori: kategori });
    };

    // ── 3.7 fjsCekJasaValid(idUser) ──
    window.fjsCekJasaValid = function(idUser) {
        try {
            if (!idUser) return { valid: false, pesan: 'ID kosong' };
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return { valid: false, pesan: 'Data user tidak valid' };
            var u = users.find(function(x) {
                return x && (x.idUser === idUser || x.id === idUser);
            });
            if (!u) return { valid: false, pesan: 'User tidak ditemukan' };
            if (!_isRoleJasaValid(u.kodeRole)) {
                return { valid: false, pesan: 'Role bukan Jasa: ' + (u.kodeRole || '-') };
            }
            var st = u.status || u.statusVerifikasi || 'Aktif';
            if (st !== 'Aktif') {
                return { valid: false, pesan: 'Jasa tidak aktif: ' + st };
            }
            return { valid: true, data: u };
        } catch (e) {
            return { valid: false, pesan: e.message };
        }
    };

    // ── 3.8 fjsCekLayananValid(idLayanan) ──
    window.fjsCekLayananValid = function(idLayanan) {
        try {
            var layanan = window.fjsGetLayananById(idLayanan);
            if (!layanan) return { valid: false, pesan: 'Layanan tidak ditemukan' };
            if (layanan.status !== 'aktif') {
                return { valid: false, pesan: 'Layanan tidak aktif: ' + layanan.status };
            }
            return { valid: true, layanan: layanan };
        } catch (e) {
            return { valid: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FJS.4] — CARD LAYANAN (READY-TO-RENDER) ⭐ PRIMARY
    // ═══════════════════════════════════════════════════════════
    // Mengembalikan 1 objek siap-render untuk UI card:
    //   • FOTO utama (fallback placeholder)
    //   • Info lengkap (nama, kategori, harga, rating)
    //   • Tombol CHAT LANGSUNG (1 aksi saja)
    //
    // UI tinggal: <img src="card.fotoUrl"> + <button onclick="card._aksiHandler()">
    // ═══════════════════════════════════════════════════════════
    window.fjsGetCardLayanan = function(idLayanan) {
        try {
            var layanan = window.fjsGetLayananById(idLayanan);
            if (!layanan) return null;

            var kat = KATEGORI_JASA[layanan.kategoriJasa] || KATEGORI_JASA['lain'];
            var penyedia = layanan._penyedia || {};

            // A45: foto via fotoUrl — fallback placeholder
            var fotoFinal = layanan.fotoUrl || _FOTO_PLACEHOLDER;

            // Format harga via CS4
            var hargaFmt = (typeof window.csFormatRp === 'function')
                ? window.csFormatRp(layanan.harga)
                : 'Rp ' + layanan.harga;

            return {
                // ── FOTO (elemen utama) ──
                fotoUrl:      fotoFinal,
                fotoAsli:     layanan.fotoUrl,          // null/'' kalau pakai placeholder
                fotoList:     layanan.fotoList || [],

                // ── Info layanan ──
                id:           layanan.id,
                nama:         layanan.nama,
                deskripsi:    layanan.deskripsi,
                kategoriJasa: layanan.kategoriJasa,
                kategoriLabel:kat.label,
                kategoriIkon: kat.ikon,
                kategoriWarna:kat.warna,
                harga:        layanan.harga,
                hargaFormat:  hargaFmt,
                satuanHarga:  layanan.satuanHarga,
                durasiMenit:  layanan.durasiMenit,
                lokasiKerja:  layanan.lokasiKerja,
                rating:       layanan.rating,
                status:       layanan.status,

                // ── Penyedia ──
                _penyedia: penyedia,

                // ── ⭐ AKSI: HANYA TOMBOL CHAT LANGSUNG ──
                _aksi:         'chat_langsung',
                _aksiLabel:    'Chat Langsung',
                _aksiIkon:     'fas fa-comments',
                _aksiWarna:    'primary',
                _aksiHandler:  function(opsi) {
                    return window.fjsChatLangsungKeJasa(
                        penyedia.idUser,
                        Object.assign({
                            idLayanan:   layanan.id,
                            namaLayanan: layanan.nama
                        }, opsi || {})
                    );
                }
            };
        } catch (e) {
            console.error('[FJS v1.2] fjsGetCardLayanan error:', e);
            return null;
        }
    };

    // ── 4.1 fjsGetKartuKatalog(filter) — array of cards ──
    window.fjsGetKartuKatalog = function(filter) {
        try {
            var katalog = window.fjsGetKatalogJasa(filter);
            return katalog.map(function(l) {
                return window.fjsGetCardLayanan(l.id);
            }).filter(function(c) { return !!c; });
        } catch (e) {
            console.error('[FJS v1.2] fjsGetKartuKatalog error:', e);
            return [];
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FJS.5] — CHAT LANGSUNG KE JS (PRIMARY ACTION) ⭐
    // ═══════════════════════════════════════════════════════════
    // Delegasi MN (A25). Target: chat_jasa menu ke user JS.
    // Tidak ada cart, tidak ada checkout — hanya chat.
    // ═══════════════════════════════════════════════════════════
    window.fjsChatLangsungKeJasa = function(idJasa, opsi) {
        opsi = opsi || {};
        try {
            if (!idJasa) return { sukses: false, pesan: 'ID jasa kosong' };

            // Validasi penyedia
            var cek = window.fjsCekJasaValid(idJasa);
            if (!cek.valid) {
                return { sukses: false, pesan: 'Penyedia jasa tidak valid: ' + cek.pesan };
            }

            // Cegah chat diri sendiri
            var idSaya = (typeof window.gidIdUser === 'function')
                ? window.gidIdUser() : null;
            if (idSaya && idSaya === idJasa) {
                return { sukses: false, pesan: 'Tidak bisa chat ke diri sendiri' };
            }

            // MN wajib (A25 — murni delegasi)
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }

                target:     idJasa,
                namaTarget: cek.data.nama || cek.data.namaLengkap || 'Penyedia Jasa',

            if (Array.isArray(def) && !Array.isArray(v)) return def;
            if (def && typeof def === 'object' && !Array.isArray(def) &&
                (!v || typeof v !== 'object' || Array.isArray(v))) {
                return def;

    // ═══════════════════════════════════════════════════════════
    // [FDS.2] — KONSTANTA ROLE AKSES DISTRIBUTOR ⭐
    // ═══════════════════════════════════════════════════════════
    // Distributor = B2B wholesale. HANYA role berikut yang boleh
    // melihat katalog produk distributor:
    //
    //   • GR        → Grosir (target pembeli utama) ⭐
    //   • DST       → Distributor (manage produk sendiri)
    //   • SA        → SuperAdmin (admin full)
    //   • SA_STAF   → Staf SuperAdmin (admin staf)
    //
    // Role lain (CT, TK, PP, PM, COD, OJ, FIN, DLR, JS,
    // KDMP_*, KSR_*) → ❌ TIDAK BISA LIHAT
    // ═══════════════════════════════════════════════════════════
    var ROLE_AKSES_DISTRIBUTOR = ['GR', 'DST', 'SA', 'SA_STAF'];
    var ROLE_DST = ['DST'];

    window.FDS_ROLE_AKSES_DISTRIBUTOR = ROLE_AKSES_DISTRIBUTOR.slice();
    window.FDS_ROLE_DST = ROLE_DST.slice();

    function _isRoleDstValid(kodeRole) {
        if (!kodeRole) return false;
        if (ROLE_DST.indexOf(kodeRole) === -1) return false;
        return !!(window.CS_ROLE_MAP && window.CS_ROLE_MAP[kodeRole]);
    }

    function _isRoleBolehLihat(kodeRole) {
        if (!kodeRole) return false;
        if (ROLE_AKSES_DISTRIBUTOR.indexOf(kodeRole) === -1) return false;
        return !!(window.CS_ROLE_MAP && window.CS_ROLE_MAP[kodeRole]);
    }

    // ═══════════════════════════════════════════════════════════
    // [FDS.3] — KONTROL AKSES (3 FUNGSI VALIDASI) ⭐
    // ═══════════════════════════════════════════════════════════

    // ── 3.1 fdsCekRoleBolehLihat(kodeRole) ──
    window.fdsCekRoleBolehLihat = function(kodeRole) {
        try {
            if (!kodeRole) {
                return { boleh: false, pesan: 'Kode role kosong', kodeRole: null };
            }
            if (!_isRoleBolehLihat(kodeRole)) {
                return {
                    boleh: false,
                    pesan: 'Role "' + kodeRole + '" tidak punya akses ke katalog Distributor. ' +
                           'Hanya: ' + ROLE_AKSES_DISTRIBUTOR.join(', '),
                    kodeRole: kodeRole,
                    roleAkses: ROLE_AKSES_DISTRIBUTOR.slice()
                };
            }
            return { boleh: true, kodeRole: kodeRole };
        } catch (e) {
            return { boleh: false, pesan: e.message, kodeRole: null };
        }
    };

    // ── 3.2 fdsCekBolehAkses(idUser) ──
    // Cek apakah user (berdasarkan idUser) boleh akses katalog Distributor.
    // Jika idUser kosong → pakai user aktif (window.gidIdUser).
    window.fdsCekBolehAkses = function(idUser) {
        try {
            var idTarget = idUser || (window.gidIdUser ? window.gidIdUser() : null);
            if (!idTarget) {
                return {
                    boleh: false,
                    pesan: 'Tidak ada user aktif & idUser kosong',
                    idUser: null,
                    kodeRole: null
                };
            }
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { boleh: false, pesan: 'Data user tidak valid', idUser: idTarget };
            }
            var u = users.find(function(x) {
                return x && (x.idUser === idTarget || x.id === idTarget);
            });
            if (!u) {
                return {
                    boleh: false,
                    pesan: 'User tidak ditemukan: ' + idTarget,
                    idUser: idTarget
                };
            }

            var cek = window.fdsCekRoleBolehLihat(u.kodeRole);
            return {
                boleh:    cek.boleh,
                pesan:    cek.pesan || 'OK',
                idUser:   idTarget,
                kodeRole: u.kodeRole,
                user:     cek.boleh ? u : null
            };
        } catch (e) {
            return { boleh: false, pesan: e.message, idUser: null };
        }
    };

    // ── 3.3 fdsGetRoleAkses() — info role yang boleh ──
    window.fdsGetRoleAkses = function() {
        try {
            return ROLE_AKSES_DISTRIBUTOR.map(function(kode) {
                var info = window.CS_ROLE_MAP && window.CS_ROLE_MAP[kode];
                var keterangan = '';
                if (kode === 'GR')       keterangan = 'Grosir — target pembeli utama';
                else if (kode === 'DST') keterangan = 'Distributor — manage produk sendiri';
                else if (kode === 'SA')  keterangan = 'SuperAdmin — admin full';
                else if (kode === 'SA_STAF') keterangan = 'Staf SuperAdmin — admin staf';

                return {
                    kode:       kode,
                    nama:       info ? info.nama : kode,
                    kodeAwal:   info ? info.kodeAwal : '-',
                    kategori:   info ? info.kategori : '-',
                    keterangan: keterangan
                };
            });
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FDS.4] — GETTER KATALOG + FILTER AKSES ⭐
    // ═══════════════════════════════════════════════════════════

    // ── 4.1 fdsGetDaftarDistributor(filter) — filter akses ──
    window.fdsGetDaftarDistributor = function(filter) {
        filter = filter || {};
        try {
            // Cek akses
            var akses = window.fdsCekBolehAkses(filter.idUserPemanggil);
            if (!akses.boleh) {
                if (!filter._silent) {
                    console.warn('[FDS v1.1] akses ditolak:', akses.pesan);
                }
                return [];
            }

            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return [];

            var list = users.filter(function(u) {
                if (!u || !u.kodeRole) return false;
                if (!_isRoleDstValid(u.kodeRole)) return false;
                var st = u.status || u.statusVerifikasi || 'Aktif';
                return st === 'Aktif';
            });

            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(u) {
                    return String(u.nama || u.namaLengkap || '')
                        .toLowerCase().indexOf(q) !== -1;
                });
            }
            if (filter.wilayah) {
                list = list.filter(function(u) {
                    return String(u.alamat || '').toLowerCase()
                        .indexOf(String(filter.wilayah).toLowerCase()) !== -1;
                });
            }

            return list.map(function(u) {
                var profil = _load('profil_' + u.idUser, {});
                if (!profil || typeof profil !== 'object') profil = {};
                return {
                    idUser:   u.idUser || u.id,
                    namaToko: profil.namaToko || u.nama || u.namaLengkap || 'Distributor',
                    kodeRole: u.kodeRole,
                    wilayah:  u.alamat || 'Indonesia',
                    fotoUrl:  profil.fotoUrl || u.fotoUrl || '',
                    rating:   profil.rating || 5.0,
                    status:   (profil.statusOnline !== false) ? 'Online' : 'Offline'
                };
            });
        } catch (e) {
            console.error('[FDS v1.1] fdsGetDaftarDistributor error:', e);
            return [];
        }
    };

    // ── 4.2 fdsGetProdukDistributor(idDst, filter) — filter akses ──
    window.fdsGetProdukDistributor = function(idDst, filter) {
        filter = filter || {};
        try {
            if (!idDst) return [];

            // Cek akses
            var akses = window.fdsCekBolehAkses(filter.idUserPemanggil);
            if (!akses.boleh) {
                if (!filter._silent) {
                    console.warn('[FDS v1.1] akses produk ditolak:', akses.pesan);
                }
                return [];
            }

            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) return [];

            var list = produk.filter(function(p) {
                return p && (p.idOwner === idDst || p.idUser === idDst);
            });

            var normalized = list.map(function(p) {
                return {
                    id:           p.id || p.idProduk,
                    idOwner:      p.idOwner || p.idUser,
                    nama:         p.nama || p.namaProduk || '-',
                    deskripsi:    p.deskripsi || '',
                    harga:        parseFloat(p.harga) || 0,
                    hargaGrosir:  parseFloat(p.hargaGrosir) || parseFloat(p.harga) || 0,
                    minOrder:     parseInt(p.minOrder, 10) || 1,
                    satuan:       p.satuan || 'pcs',
                    stok:         parseInt(p.stok, 10) || 0,
                    fotoUrl:      p.fotoUrl || p.fotoUtama || p.thumbnailUrl || '',
                    fotoList:     Array.isArray(p.fotoList) ? p.fotoList : [],
                    rating:       parseFloat(p.rating) || 5.0,
                    status:       p.status || 'aktif'
                };
            });

            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                normalized = normalized.filter(function(l) {
                    return l.nama.toLowerCase().indexOf(q) !== -1 ||
                           (l.deskripsi || '').toLowerCase().indexOf(q) !== -1;
                });
            }
            if (filter.aktifSaja !== false) {
                normalized = normalized.filter(function(l) {
                    return l.status === 'aktif';
                });
            }
            if (filter.hanyaAdaFoto === true) {
                normalized = normalized.filter(function(l) {
                    return !!l.fotoUrl;
                });
            }
            return normalized;
        } catch (e) {
            console.error('[FDS v1.1] fdsGetProdukDistributor error:', e);
            return [];
        }
    };

    // ── 4.3 fdsGetKatalogDistributor(filter) — semua produk semua DST ──
    window.fdsGetKatalogDistributor = function(filter) {
        filter = filter || {};
        try {
            var akses = window.fdsCekBolehAkses(filter.idUserPemanggil);
            if (!akses.boleh) {
                if (!filter._silent) {
                    console.warn('[FDS v1.1] akses katalog ditolak:', akses.pesan);
                }
                return [];
            }

            var penyedia = window.fdsGetDaftarDistributor(filter);
            var semua = [];

            penyedia.forEach(function(p) {
                var produk = window.fdsGetProdukDistributor(p.idUser, {
                    cari:         filter.cari,
                    hanyaAdaFoto: filter.hanyaAdaFoto,
                    _silent:      true
                });
                produk.forEach(function(l) {
                    semua.push(Object.assign({}, l, {
                        _distributor: {
                            idUser:   p.idUser,
                            namaToko: p.namaToko,
                            wilayah:  p.wilayah,
                            rating:   p.rating,
                            fotoUrl:  p.fotoUrl,
                            status:   p.status
                        }
                    }));
                });
            });

            if (filter.hargaMax) {
                semua = semua.filter(function(l) { return l.harga <= filter.hargaMax; });
            }
            if (filter.ratingMin) {
                semua = semua.filter(function(l) { return l.rating >= filter.ratingMin; });
            }
            if (filter.minOrderMax) {
                semua = semua.filter(function(l) { return l.minOrder <= filter.minOrderMax; });
            }

            // Sort default: rating tertinggi
            semua.sort(function(a, b) {
                return (b.rating || 0) - (a.rating || 0);
            });
            return semua;
        } catch (e) {
            console.error('[FDS v1.1] fdsGetKatalogDistributor error:', e);
            return [];
        }
    };

    // ── 4.4 fdsGetProdukById(idProduk) — detail + filter akses ──
    window.fdsGetProdukById = function(idProduk, filter) {
        filter = filter || {};
        try {
            if (!idProduk) return null;

            // Cek akses
            var akses = window.fdsCekBolehAkses(filter.idUserPemanggil);
            if (!akses.boleh) return null;

            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) return null;
            var p = produk.find(function(x) {
                return x && (x.id === idProduk || x.idProduk === idProduk);
            });
            if (!p) return null;

            var idOwner = p.idOwner || p.idUser;
            var distributor = null;
            if (idOwner) {
                var users = _load('dataLoginUser', []);
                var u = (users || []).find(function(x) {
                    return x && (x.idUser === idOwner || x.id === idOwner);
                });
                if (u) {
                    var profil = _load('profil_' + u.idUser, {});
                    if (!profil || typeof profil !== 'object') profil = {};
                    distributor = {
                        idUser:   u.idUser || u.id,
                        namaToko: profil.namaToko || u.nama || u.namaLengkap || 'Distributor',
                        wilayah:  u.alamat || 'Indonesia',
                        rating:   profil.rating || 5.0,
                        hp:       u.hp || '',
                        fotoUrl:  profil.fotoUrl || u.fotoUrl || '',
                        status:   (profil.statusOnline !== false) ? 'Online' : 'Offline'
                    };
                }
            }

            return {
                id:           p.id || p.idProduk,
                idOwner:      idOwner,
                nama:         p.nama || p.namaProduk || '-',
                deskripsi:    p.deskripsi || '',
                harga:        parseFloat(p.harga) || 0,
                hargaGrosir:  parseFloat(p.hargaGrosir) || parseFloat(p.harga) || 0,
                minOrder:     parseInt(p.minOrder, 10) || 1,
                satuan:       p.satuan || 'pcs',
                stok:         parseInt(p.stok, 10) || 0,
                fotoUrl:      p.fotoUrl || p.fotoUtama || p.thumbnailUrl || '',
                fotoList:     Array.isArray(p.fotoList) ? p.fotoList : [],
                rating:       parseFloat(p.rating) || 5.0,
                status:       p.status || 'aktif',
                _distributor: distributor
            };
        } catch (e) {
            console.error('[FDS v1.1] fdsGetProdukById error:', e);
            return null;
        }
    };

    // ── 4.5 fdsCekDistributorValid(idUser) — validasi + akses ──
    window.fdsCekDistributorValid = function(idUser) {
        try {
            if (!idUser) return { valid: false, pesan: 'ID kosong' };

            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { valid: false, pesan: 'Data user tidak valid' };
            }
            var u = users.find(function(x) {
                return x && (x.idUser === idUser || x.id === idUser);
            });
            if (!u) return { valid: false, pesan: 'User tidak ditemukan: ' + idUser };

            if (!_isRoleDstValid(u.kodeRole)) {
                return { valid: false, pesan: 'Role bukan Distributor: ' + (u.kodeRole || '-') };
            }
            var st = u.status || u.statusVerifikasi || 'Aktif';
            if (st !== 'Aktif') {
                return { valid: false, pesan: 'Distributor tidak aktif: ' + st };
            }
            return { valid: true, data: u };
        } catch (e) {
            return { valid: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FDS.5] — CARD PRODUK (READY-TO-RENDER) ⭐
    // ═══════════════════════════════════════════════════════════
    // Card B2B: foto + info grosir + tombol chat
    // ═══════════════════════════════════════════════════════════
    window.fdsGetCardProduk = function(idProduk, filter) {
        filter = filter || {};
        try {
            var produk = window.fdsGetProdukById(idProduk, filter);
            if (!produk) return null;

            var d = produk._distributor || {};
            var fotoFinal = produk.fotoUrl || _FOTO_PLACEHOLDER;

            var hargaFmt = (typeof window.csFormatRp === 'function')
                ? window.csFormatRp(produk.hargaGrosir || produk.harga)
                : 'Rp ' + (produk.hargaGrosir || produk.harga);

            var hargaRetailFmt = (typeof window.csFormatRp === 'function')
                ? window.csFormatRp(produk.harga)
                : 'Rp ' + produk.harga;

            return {
                // ── FOTO ──
                fotoUrl:      fotoFinal,
                fotoAsli:     produk.fotoUrl,
                fotoList:     produk.fotoList || [],

                // ── Info produk B2B ──
                id:           produk.id,
                nama:         produk.nama,
                deskripsi:    produk.deskripsi,
                harga:        produk.harga,
                hargaFormat:  hargaRetailFmt,
                hargaGrosir:  produk.hargaGrosir,
                hargaGrosirFormat: hargaFmt,
                minOrder:     produk.minOrder,
                satuan:       produk.satuan,
                stok:         produk.stok,
                rating:       produk.rating,
                status:       produk.status,
                isGrosirPrice: produk.hargaGrosir < produk.harga,   // flag harga khusus

                // ── Distributor ──
                _distributor: d,

                // ── ⭐ AKSI: HANYA TOMBOL CHAT LANGSUNG ──
                _aksi:        'chat_langsung_b2b',
                _aksiLabel:   'Chat Distributor',
                _aksiIkon:    'fas fa-comments',
                _aksiWarna:   'primary',
                _aksiHandler: function(opsi) {
                    return window.fdsChatLangsungKeDistributor(
                        d.idUser,
                        Object.assign({
                            idProduk:   produk.id,
                            namaProduk: produk.nama
                        }, opsi || {})
                    );
                }
            };
        } catch (e) {
            console.error('[FDS v1.1] fdsGetCardProduk error:', e);
            return null;
        }
    };

    // ── 5.2 fdsGetKartuKatalog(filter) ──
    window.fdsGetKartuKatalog = function(filter) {
        filter = filter || {};
        try {
            var katalog = window.fdsGetKatalogDistributor(filter);
            return katalog.map(function(l) {
                return window.fdsGetCardProduk(l.id, filter);
            }).filter(function(c) { return !!c; });
        } catch (e) {
            console.error('[FDS v1.1] fdsGetKartuKatalog error:', e);
            return [];
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FDS.6] — CHAT LANGSUNG B2B KE DISTRIBUTOR ⭐
    // ═══════════════════════════════════════════════════════════
    // Delegasi MN (A25). Hanya GR/SA/SA_STAF yang bisa memulai chat.
    // DST tidak bisa chat diri sendiri.
    // ═══════════════════════════════════════════════════════════
    window.fdsChatLangsungKeDistributor = function(idDistributor, opsi) {
        opsi = opsi || {};
        try {
            if (!idDistributor) {
                return { sukses: false, pesan: 'ID distributor kosong' };
            }

            // Validasi distributor
            var cekDst = window.fdsCekDistributorValid(idDistributor);
            if (!cekDst.valid) {
                return { sukses: false, pesan: 'Distributor tidak valid: ' + cekDst.pesan };
            }

            // Cek akses pemanggil
            var akses = window.fdsCekBolehAkses();
            if (!akses.boleh) {
                return {
                    sukses: false,
                    pesan:  'Akses ditolak: ' + akses.pesan,
                    kodeRolePemanggil: akses.kodeRole
                };
            }

            // Cegah chat diri sendiri
            var idSaya = window.gidIdUser ? window.gidIdUser() : null;
            if (idSaya && idSaya === idDistributor) {
                return { sukses: false, pesan: 'Tidak bisa chat ke diri sendiri' };
            }

            // MN wajib
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }

            // Validasi produk (jika dikirim)
            if (opsi.idProduk) {
                var prod = window.fdsGetProdukById(opsi.idProduk);
                if (!prod) {
                    return { sukses: false, pesan: 'Produk tidak ditemukan' };
                }
                if (prod.idOwner !== idDistributor) {
                    return { sukses: false, pesan: 'Produk bukan milik distributor ini' };
                }
            }

            // Pesan awal default (B2B tone)
            var pesanAwal = String(opsi.pesan || '').trim();
            if (!pesanAwal) {
                if (opsi.namaProduk) {
                    pesanAwal = 'Halo, saya Grosir. Ingin tanya harga grosir untuk "' +
                                opsi.namaProduk + '". Mohon info minimal order & harga.';
                } else {
