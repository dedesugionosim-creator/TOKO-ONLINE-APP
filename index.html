<script>
// ============================================================
// BLOK R 10.2 – JS PROFIL SUPERADMIN (REVISI FINAL)
// ------------------------------------------------------------
// Perbaikan:
//   - loadSuratPerusahaan / saveSuratPerusahaan:
//     getDataIdUser() TANPA parameter → getIdUserAktif()
//     (sebelumnya key 'suratPerusahaan_null' → tercampur antar-SA)
//   - Tambah catatAktivitasGlobal di upload & hapus surat
//   - Tambah guard null di semua akses userAktif
// ------------------------------------------------------------
// Fungsi global yang dipakai (mengacu BLOK R 01.0 REVISI):
//   - generateKodeUnik()         -> BLOK R 01.0 (1)
//   - getIdUserAktif()           -> BLOK R 01.0 (2)
//   - getDataIdUser()            -> BLOK R 01.0 (3)
//   - getFotoProfilAkun()        -> BLOK R 01.0 (4)
//   - tutupMenu()                -> BLOK R 01.0 (6)
//   - kembaliKeDasbor()          -> BLOK R 01.0 (7)
//   - tampilkanPlaceholderMenu() -> BLOK R 01.0 (8)
//   - catatAktivitasGlobal()     -> BLOK R 01.0 (12)
// ------------------------------------------------------------
// Variabel global yang dipakai:
//   - userAktif                  -> BLOK Deklarasi Variabel Global
//   - kontenAsliDasbor           -> BLOK Deklarasi Variabel Global
//   - dataSuratPerusahaan        -> BLOK Fungsi Global PROFIL R 0.10.2 (1)
// ============================================================

// Variabel global lokal blok ini
var dataSuratPerusahaan = [];

// --- 1. LOAD SURAT PERUSAHAAN (FIX BUG) ---
function loadSuratPerusahaan() {
    var idUser = getIdUserAktif();
    if (!idUser) {
        dataSuratPerusahaan = [];
        return;
    }

    try {
        var stored = localStorage.getItem('suratPerusahaan_' + idUser);
        dataSuratPerusahaan = stored ? JSON.parse(stored) : [];
        if (!Array.isArray(dataSuratPerusahaan)) dataSuratPerusahaan = [];
    } catch (e) {
        console.warn('loadSuratPerusahaan parse error:', e);
        dataSuratPerusahaan = [];
    }
}

// --- 2. SAVE SURAT PERUSAHAAN (FIX BUG) ---
function saveSuratPerusahaan() {
    var idUser = getIdUserAktif();
    if (!idUser) return;
    localStorage.setItem('suratPerusahaan_' + idUser, JSON.stringify(dataSuratPerusahaan || []));
}

// --- 3. TAMPILKAN HALAMAN PROFIL ---
function tampilkanProfilSuperAdmin() {
    var konten = document.getElementById('kontenDasbor');
    if (!kontenAsliDasbor) kontenAsliDasbor = konten.innerHTML;
    var container = document.getElementById('profilSuperAdminContainer');
    if (container) {
        konten.innerHTML = container.innerHTML;
        loadSuratPerusahaan();
        renderTabelSuratPerusahaan();
        tutupMenu();
    } else {
        tampilkanPlaceholderMenu('Profil SuperAdmin', '10.2');
    }
}

// --- 4. RENDER TABEL SURAT PERUSAHAAN ---
function renderTabelSuratPerusahaan() {
    var tbody = document.getElementById('tabelSuratPerusahaan');
    if (!tbody) return;

    if (dataSuratPerusahaan.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Belum ada surat perusahaan.</td></tr>';
        return;
    }

    var html = '';
    dataSuratPerusahaan.forEach(function(item, index) {
        var fileType = item.fileType || 'file';
        var iconFile = 'fas fa-file';
        if (fileType === 'pdf') iconFile = 'fas fa-file-pdf text-danger';
        else if (fileType === 'image') iconFile = 'fas fa-file-image text-success';
        else if (fileType === 'word') iconFile = 'fas fa-file-word text-primary';

        html +=
            '<tr>' +
                '<td>' + (index + 1) + '</td>' +
                '<td><strong>' + (item.nama || '-') + '</strong></td>' +
                '<td>' + (item.keterangan || '-') + '</td>' +
                '<td><i class="' + iconFile + '"></i> ' + (item.fileName || '-') + '</td>' +
                '<td>' + (item.tanggal || '-') + '</td>' +
                '<td>' +
                    '<button class="btn btn-sm btn-outline-info me-1" onclick="previewSuratPerusahaan(' + index + ')" title="Preview"><i class="fas fa-eye"></i></button>' +
                    '<button class="btn btn-sm btn-outline-success me-1" onclick="downloadSuratPerusahaan(' + index + ')" title="Download"><i class="fas fa-download"></i></button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="hapusSuratPerusahaan(' + index + ')" title="Hapus"><i class="fas fa-trash"></i></button>' +
                '</td>' +
            '</tr>';
    });
    tbody.innerHTML = html;
}

// --- 5. TAMPILKAN MODAL UPLOAD ---
function tampilkanModalUploadSurat() {
    var modal = document.getElementById('modalUploadSurat');
    if (!modal) return;
    document.getElementById('formUploadSurat').reset();
    var bsModal = new bootstrap.Modal(modal);
    bsModal.show();
}

// --- 6. PROSES UPLOAD SURAT ---
function prosesUploadSurat(event) {
    if (event) event.preventDefault();

    var idUser = getIdUserAktif();
    if (!idUser) { alert('❌ User tidak valid.'); return false; }

    var nama = document.getElementById('suratNama').value.trim();
    var keterangan = document.getElementById('suratKeterangan').value.trim();
    var fileInput = document.getElementById('suratFile');
    var file = fileInput.files[0];

    if (!nama || !file) {
        alert('Nama surat dan file wajib diisi!');
        return false;
    }

    if (file.size > 5 * 1024 * 1024) {
        alert('Ukuran file maksimal 5MB!');
        return false;
    }

    var reader = new FileReader();
    reader.onload = function(e) {
        var fileBase64 = e.target.result;
        var fileType = 'file';
        var ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'pdf') fileType = 'pdf';
        else if (['jpg','jpeg','png','gif','bmp'].indexOf(ext) !== -1) fileType = 'image';
        else if (['doc','docx'].indexOf(ext) !== -1) fileType = 'word';

        var suratBaru = {
            id: generateKodeUnik('SRT'),
            nama: nama,
            keterangan: keterangan,
            fileName: file.name,
            fileType: fileType,
            fileBase64: fileBase64,
            tanggal: new Date().toLocaleDateString('id-ID')
        };

        dataSuratPerusahaan.push(suratBaru);
        saveSuratPerusahaan();
        renderTabelSuratPerusahaan();

        // ✅ Catat aktivitas global (aturan D.5)
        if (typeof catatAktivitasGlobal === 'function') {
            catatAktivitasGlobal(idUser, 'Upload Surat Perusahaan', 'Surat "' + nama + '" (' + file.name + ')');
        }

        var modal = bootstrap.Modal.getInstance(document.getElementById('modalUploadSurat'));
        if (modal) modal.hide();

        alert('✅ Surat berhasil diupload!');
    };
    reader.readAsDataURL(file);
    return false;
}

// --- 7. PREVIEW SURAT PERUSAHAAN ---
function previewSuratPerusahaan(index) {
    var item = dataSuratPerusahaan[index];
    if (!item) return;

    var title = document.getElementById('previewSuratTitle');
    var content = document.getElementById('previewSuratContent');

    if (title) title.textContent = 'Preview: ' + item.nama;

    if (item.fileType === 'pdf') {
        content.innerHTML = '<iframe src="' + item.fileBase64 + '" style="width:100%;height:70vh;border:none;"></iframe>';
    } else if (item.fileType === 'image') {
        content.innerHTML = '<img src="' + item.fileBase64 + '" style="max-width:100%;max-height:70vh;border-radius:8px;">';
    } else if (item.fileType === 'word') {
        content.innerHTML = '<p class="text-muted">Preview Word belum didukung. Silakan download untuk melihat.</p>';
    } else {
        content.innerHTML = '<p class="text-muted">Preview tidak tersedia untuk tipe file ini.</p>';
    }

    var modal = new bootstrap.Modal(document.getElementById('modalPreviewSurat'));
    modal.show();
}

// --- 8. DOWNLOAD SURAT PERUSAHAAN ---
function downloadSuratPerusahaan(index) {
    var item = dataSuratPerusahaan[index];
    if (!item || !item.fileBase64) return;

    var a = document.createElement('a');
    a.href = item.fileBase64;
    a.download = item.fileName || 'surat.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// --- 9. HAPUS SURAT PERUSAHAAN ---
function hapusSuratPerusahaan(index) {
    if (!confirm('Hapus surat ini?')) return;

    var item = dataSuratPerusahaan[index];
    if (!item) return;

    dataSuratPerusahaan.splice(index, 1);
    saveSuratPerusahaan();
    renderTabelSuratPerusahaan();

    // ✅ Catat aktivitas global
    var idUser = getIdUserAktif();
    if (idUser && typeof catatAktivitasGlobal === 'function') {
        catatAktivitasGlobal(idUser, 'Hapus Surat Perusahaan', 'Surat "' + (item.nama || '-') + '" dihapus');
    }

    alert('✅ Surat berhasil dihapus.');
}

// --- 10. GANTI PASSWORD SUPERADMIN ---
function gantiPasswordSA(event) {
    if (event) event.preventDefault();

    var passwordBaru = document.getElementById('newPasswordSA').value;
    var konfirmasi = document.getElementById('confirmPasswordSA').value;
    var notif = document.getElementById('notifGantiPasswordSA');

    if (passwordBaru.length < 6) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Password minimal 6 karakter!';
        notif.classList.remove('d-none');
        return false;
    }

    if (passwordBaru !== konfirmasi) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Password dan konfirmasi tidak cocok!';
        notif.classList.remove('d-none');
        return false;
    }

    // Simpan password baru
    localStorage.setItem('SUPERADMIN_PASSWORD', passwordBaru);
    SUPERADMIN_PASSWORD = passwordBaru;

    // Catat aktivitas global
    var idUser = getIdUserAktif();
    if (idUser && typeof catatAktivitasGlobal === 'function') {
        catatAktivitasGlobal(idUser, 'Ganti Password SA', 'Password SuperAdmin diperbarui');
    }

    notif.className = 'alert alert-success';
    notif.innerHTML = '✅ Password berhasil diganti!';
    notif.classList.remove('d-none');

    document.getElementById('newPasswordSA').value = '';
    document.getElementById('confirmPasswordSA').value = '';

    setTimeout(function() { notif.classList.add('d-none'); }, 3000);
    return false;
}
</script>
