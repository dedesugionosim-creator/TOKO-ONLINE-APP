    // ═══════════════════════════════════════════════════════════
    var _loadingEl = null;

    // ═══════════════════════════════════════════════════════════
    // [CS6.1] — csToast (standar tema merah)
    // ═══════════════════════════════════════════════════════════
    window.csToast = function(pesan, tipe, opts) {
        opts = opts || {};
        try {
            var warna = {
                success: '#28A745',
                danger:  '#DC3545',
                warning: '#DC3545',
                info:    '#17A2B8'
            }[tipe] || '#333';

            var ikon = {
                success: 'fas fa-check-circle',
                danger:  'fas fa-times-circle',
                warning: 'fas fa-exclamation-triangle',
                info:    'fas fa-info-circle'
            }[tipe] || 'fas fa-info-circle';

            var el = document.createElement('div');
            el.className = 'cs-toast';
            el.innerHTML = '<i class="' + ikon + ' me-2"></i>' +
                           window.csEscHtml(pesan);
            el.style.cssText =
                'position:fixed;bottom:24px;right:24px;' +
                'background:' + warna + ';color:#fff;' +
                'padding:12px 20px;border-radius:8px;' +
                'font-size:14px;font-weight:600;z-index:99999;' +
                'box-shadow:0 6px 20px rgba(0,0,0,0.25);' +
                'max-width:340px;opacity:0;' +
                'transform:translateY(20px);' +
                'transition:all .3s ease;' +
                'display:flex;align-items:center;' +
                'border-left:4px solid #FFFFFF;';

            document.body.appendChild(el);
            requestAnimationFrame(function() {
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            });

            setTimeout(function() {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                setTimeout(function() {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 350);
            }, opts.duration || window.CS_LIMIT.TOAST_DURATION_MS);

            return true;
        } catch (e) {
            console.error('csToast error:', e);
            return false;
        }
    };

    if (typeof window.tampilkanToastUser !== 'function') {
        window.tampilkanToastUser = window.csToast;
    }
    if (typeof window.mptToast !== 'function') {
        window.mptToast = window.csToast;
    }

    // ═══════════════════════════════════════════════════════════
    // [CS6.2] — csToastMerahPutih + csToastBendera
    // ═══════════════════════════════════════════════════════════
    window.csToastMerahPutih = function(pesan, tipe, opts) {
        opts = opts || {};
        try {
            var warna = {
                success: 'linear-gradient(90deg,#DC3545 0%,#FFFFFF 100%)',
                danger:  'linear-gradient(90deg,#DC3545 0%,#8B0000 100%)',
                warning: 'linear-gradient(90deg,#DC3545 0%,#FFC107 100%)',
                info:    'linear-gradient(90deg,#DC3545 0%,#17A2B8 100%)'
            }[tipe] || 'linear-gradient(90deg,#DC3545 0%,#B71C1C 100%)';

            var warnaTeks = tipe === 'success' ? '#000' : '#fff';

            var el = document.createElement('div');
            el.className = 'cs-toast-mp';
            el.innerHTML =
                '<div style="display:flex;align-items:center;">' +
                    '<span style="font-size:18px;margin-right:8px;">🇮🇩</span>' +
                    '<span>' + window.csEscHtml(pesan) + '</span>' +
                '</div>';
            el.style.cssText =
                'position:fixed;bottom:24px;right:24px;' +
                'background:' + warna + ';color:' + warnaTeks + ';' +
                'padding:14px 22px;border-radius:10px;' +
                'font-size:14px;font-weight:700;z-index:99999;' +
                'box-shadow:0 8px 24px rgba(220,53,69,0.4);' +
                'max-width:360px;opacity:0;' +
                'transform:translateY(20px);' +
                'transition:all .3s ease;' +
                'border:2px solid #DC3545;';

            document.body.appendChild(el);
            requestAnimationFrame(function() {
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            });

            setTimeout(function() {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                setTimeout(function() {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 350);
            }, opts.duration || 3500);

            return true;
        } catch (e) {
            console.error('csToastMerahPutih error:', e);
            return false;
        }
    };

    window.csToastBendera = function(pesan, tipe) {
        return window.csToastMerahPutih(pesan, tipe, { duration: 4000 });
    };

    // ═══════════════════════════════════════════════════════════
    // [CS6.3] — csKonfirmasi + csKonfirmasiGanda
    // ═══════════════════════════════════════════════════════════
    window.csKonfirmasi = function(pesan, opts) {
        opts = opts || {};
        return new Promise(function(resolve) {
            try {
                var hasil = window.confirm(pesan);
                resolve(hasil);
            } catch (e) {
                resolve(false);
            }
        });
    };

    window.csKonfirmasiGanda = function(pesan, teksWajib, opts) {
        opts = opts || {};
        return new Promise(function(resolve) {
            try {
                var input = window.prompt(pesan + '\n\nKetik "' + teksWajib + '" untuk konfirmasi:');
                resolve(input === teksWajib);
            } catch (e) {
                resolve(false);
            }
        });
    };

    // ═══════════════════════════════════════════════════════════
    // [CS6.4] — csShowLoading + csHideLoading
    // ═══════════════════════════════════════════════════════════
    window.csShowLoading = function(pesan) {
        try {
            if (_loadingEl) return;
            _loadingEl = document.createElement('div');
            _loadingEl.id = 'csLoadingOverlay';
            _loadingEl.innerHTML =
                '<div style="position:fixed;inset:0;background:rgba(0,0,0,0.55);' +
                'z-index:99998;display:flex;align-items:center;justify-content:center;">' +
                '<div style="background:#fff;padding:24px 40px;border-radius:12px;' +
                'text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.3);' +
                'border-top:4px solid #DC3545;">' +
                '<i class="fas fa-spinner fa-spin fa-3x mb-3" ' +
                'style="color:#DC3545;"></i>' +
                '<p class="mb-0 fw-bold">' +
                window.csEscHtml(pesan || 'Memuat...') + '</p>' +
                '</div></div>';
            document.body.appendChild(_loadingEl);
            return true;
        } catch (e) {
            console.error('csShowLoading error:', e);
            return false;
        }
    };

    window.csHideLoading = function() {
        try {
            if (_loadingEl && _loadingEl.parentNode) {
                _loadingEl.parentNode.removeChild(_loadingEl);
            }
            _loadingEl = null;
            return true;
        } catch (e) {
            return false;
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS6.5] — csShowLoadingKopdes (4 tingkat A40)
    // ═══════════════════════════════════════════════════════════
    window.csShowLoadingKopdes = function(pesan, level) {
        try {
            if (_loadingEl) return;
            var levelInfo = {
                1: { nama: 'Pusat',      ikon: 'fas fa-flag',           warna: '#8B0000' },
                2: { nama: 'Kabupaten',  ikon: 'fas fa-building',       warna: '#B71C1C' },
                3: { nama: 'Kecamatan',  ikon: 'fas fa-map-marker-alt', warna: '#DC3545' },
                4: { nama: 'Desa',       ikon: 'fas fa-home',           warna: '#FF6B6B' }
            }[level] || { nama: 'Kopdes', ikon: 'fas fa-flag', warna: '#DC3545' };

            _loadingEl = document.createElement('div');
            _loadingEl.id = 'csLoadingOverlay';
            _loadingEl.innerHTML =
                '<div style="position:fixed;inset:0;background:rgba(0,0,0,0.65);' +
                'z-index:99998;display:flex;align-items:center;justify-content:center;">' +
                '<div style="background:#fff;padding:28px 48px;border-radius:14px;' +
                'text-align:center;box-shadow:0 12px 48px rgba(220,53,69,0.35);' +
                'border-top:5px solid ' + levelInfo.warna + ';min-width:280px;">' +
                '<div style="font-size:36px;margin-bottom:8px;">🇮🇩</div>' +
                '<i class="' + levelInfo.ikon + ' fa-2x mb-3" ' +
                'style="color:' + levelInfo.warna + ';"></i>' +
                '<p class="mb-1 fw-bold" style="font-size:15px;">' +
                window.csEscHtml(pesan || 'Memuat Data Kopdes ' + levelInfo.nama + '...') + '</p>' +
                '<small class="text-muted">Tingkat ' + level + ' — ' + levelInfo.nama + '</small>' +
                '</div></div>';
            document.body.appendChild(_loadingEl);
            return true;
        } catch (e) {
            console.error('csShowLoadingKopdes error:', e);
            return false;
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS6.6] — csLoadingFast (bar atas)
    // ═══════════════════════════════════════════════════════════
    window.csLoadingFast = function(pesan) {
        try {
            if (_loadingEl) return;
            _loadingEl = document.createElement('div');
            _loadingEl.id = 'csLoadingOverlay';
            _loadingEl.innerHTML =
                '<div style="position:fixed;top:0;left:0;right:0;height:3px;' +
                'background:#DC3545;z-index:99999;overflow:hidden;">' +
                '<div style="width:40%;height:100%;background:rgba(255,255,255,0.5);' +
                'animation:csLoadingBar 1s ease-in-out infinite;"></div></div>' +
                '<style>@keyframes csLoadingBar{' +
                '0%{transform:translateX(-100%);}' +
                '50%{transform:translateX(150%);}' +
                '100%{transform:translateX(300%);}}</style>';
            document.body.appendChild(_loadingEl);
            return true;
        } catch (e) { return false; }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS6.7] — tampilkanHalaman + kembaliKeDasbor
    // ═══════════════════════════════════════════════════════════
    window.tampilkanHalaman = function(namaHalaman) {
        try {
            document.querySelectorAll('.page-section').forEach(function(el) {
                el.classList.remove('active');
            });
            var mapId = {
                'login':        'halamanLogin',
                'daftar':       'halamanDaftar',
                'lupaPassword': 'halamanLupaPassword',
                'dasbor':       'halamanDasbor'
            };
            var id = mapId[namaHalaman] ||
                     ('halaman' + namaHalaman.charAt(0).toUpperCase() +
                      namaHalaman.slice(1));
            var target = document.getElementById(id);
            if (target) {
                target.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                window.halamanAktif = namaHalaman;
                return true;
            }
            console.warn('⚠️ Halaman tidak ditemukan:', namaHalaman);
            return false;
        } catch (e) {
            console.error('tampilkanHalaman error:', e);
            return false;
        }
    };

        try {
            var konten = document.getElementById('kontenDasbor');

            if (window.kontenAsliDasbor) {
                konten.innerHTML = window.kontenAsliDasbor;
            } else if (typeof window.renderMenuUntukRole === 'function') {
                window.renderMenuUntukRole(
                    window.getKodeRoleUserAktif() || 'SA'
                );
            }
            window.menuAktifSaatIni = null;
            return true;
        } catch (e) {
            console.error('kembaliKeDasbor error:', e);
            return false;
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS6.8] — tutupMenu + 3 Placeholder
    // ═══════════════════════════════════════════════════════════
    window.tutupMenu = function() {
        try {
            var offcanvas = document.getElementById('offcanvasMenu');
            if (offcanvas && typeof bootstrap !== 'undefined') {
                var inst = bootstrap.Offcanvas.getInstance(offcanvas);
                if (inst) inst.hide();
            }
            return true;
        } catch (e) { return false; }
    };

    // Placeholder standar
    window.tampilkanPlaceholderMenu = function(namaMenu, kodeBlok) {
        try {
            var konten = document.getElementById('kontenDasbor');
            if (!konten) return false;
            if (!window.kontenAsliDasbor) {
                try { window.kontenAsliDasbor = konten.innerHTML; } catch (e) {}
            }
            konten.innerHTML =
                '<div class="container-fluid px-4 py-4">' +
                    '<div class="d-flex justify-content-between align-items-center ' +
                    'mb-3 flex-wrap gap-2">' +

                            '<i class="fas fa-tools me-2"></i>' +
                            window.csEscHtml(namaMenu) +
                        '</h4>' +
                        '<button class="btn btn-outline-light btn-sm" ' +
                                'onclick="kembaliKeDasbor()">' +
                            '<i class="fas fa-arrow-left me-1"></i>Kembali' +
                        '</button>' +
                    '</div>' +
                    '<div class="card border-0 shadow-sm">' +
                        '<div class="card-body text-center py-5">' +
                            '<i class="fas fa-tools fa-4x text-muted ' +
                            'opacity-25 mb-3 d-block"></i>' +
                            '<h5 class="fw-bold text-muted">Menu Belum Tersedia</h5>' +
                            '<p class="text-muted small mb-3">' +
                                'Menu sedang dalam pengembangan.</p>' +
                            '<div class="d-inline-block text-start small">' +
                                '<div class="mb-1"><span class="text-muted">Nama:</span> ' +
                                    '<strong>' + window.csEscHtml(namaMenu) + '</strong></div>' +
                                '<div><span class="text-muted">Blok:</span> ' +
                                    '<code>' + window.csEscHtml(kodeBlok || '-') + '</code></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            return true;
        } catch (e) {
            console.error('tampilkanPlaceholderMenu error:', e);
            return false;
        }
    };

    // Placeholder Kopdes (4 tingkat A40)
    window.tampilkanPlaceholderMenuKopdes = function(namaMenu, kodeBlok, level) {
        try {
            var konten = document.getElementById('kontenDasbor');
            if (!konten) return false;
            if (!window.kontenAsliDasbor) {
                try { window.kontenAsliDasbor = konten.innerHTML; } catch (e) {}
            }
            var levelInfo = {
                1: { nama: 'Pusat',      ikon: 'fas fa-flag',           warna: '#8B0000' },
                2: { nama: 'Kabupaten',  ikon: 'fas fa-building',       warna: '#B71C1C' },
                3: { nama: 'Kecamatan',  ikon: 'fas fa-map-marker-alt', warna: '#DC3545' },
                4: { nama: 'Desa',       ikon: 'fas fa-home',           warna: '#FF6B6B' }
            }[level] || { nama: 'Kopdes', ikon: 'fas fa-flag', warna: '#DC3545' };

            konten.innerHTML =
                '<div class="container-fluid px-4 py-4">' +
                    '<div class="d-flex justify-content-between align-items-center ' +
                    'mb-3 flex-wrap gap-2">' +
                        '<h4 class="fw-bold text-white mb-0">' +
                            '<i class="' + levelInfo.ikon + ' me-2"></i>' +
                            window.csEscHtml(namaMenu) +
                            ' <span class="badge bg-warning text-dark ms-2">' +
                            '<i class="fas fa-flag me-1"></i>Kopdes ' + levelInfo.nama +
                            '</span></h4>' +
                        '<button class="btn btn-outline-light btn-sm" ' +
                                'onclick="kembaliKeDasbor()">' +
                            '<i class="fas fa-arrow-left me-1"></i>Kembali</button>' +
                    '</div>' +
                    '<div class="card border-0 shadow-sm" ' +
                    'style="border-left:5px solid ' + levelInfo.warna + ' !important;">' +
                        '<div class="card-body text-center py-5">' +
                            '<div style="font-size:56px;margin-bottom:8px;">🇮🇩</div>' +
                            '<i class="' + levelInfo.ikon + ' fa-4x mb-3 d-block" ' +
                            'style="color:' + levelInfo.warna + ';opacity:0.4;"></i>' +
                            '<h5 class="fw-bold" style="color:' + levelInfo.warna + ';">' +
                            'Menu Kopdes ' + levelInfo.nama + ' Belum Tersedia</h5>' +
                            '<p class="text-muted small mb-3">' +
                            'Menu ini sedang dalam pengembangan (Blok ' +
                            window.csEscHtml(kodeBlok || '45.3') + ').</p>' +
                            '<div class="d-inline-block text-start small">' +
                                '<div class="mb-1"><span class="text-muted">Nama:</span> ' +
                                    '<strong>' + window.csEscHtml(namaMenu) + '</strong></div>' +
                                '<div class="mb-1"><span class="text-muted">Level:</span> ' +
                                    '<strong>' + level + ' — ' + levelInfo.nama + '</strong></div>' +
                                '<div><span class="text-muted">Blok:</span> ' +
                                    '<code>' + window.csEscHtml(kodeBlok || '45.3') + '</code></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            return true;
        } catch (e) {
            console.error('tampilkanPlaceholderMenuKopdes error:', e);
            return false;
        }
    };

    // Placeholder otomatis per role
    window.csRenderPlaceholderByRole = function(namaMenu, kodeBlok) {
        try {
            var kodeRole = window.getKodeRoleUserAktif();
            if (!kodeRole) return window.tampilkanPlaceholderMenu(namaMenu, kodeBlok);
            var levelKopdes = {
                'KDMP_PUSAT': 1, 'KDMP_KAB': 2, 'KDMP_KEC': 3, 'KDMP_DESA': 4
            }[kodeRole];
            if (levelKopdes) {
                return window.tampilkanPlaceholderMenuKopdes(
                    namaMenu, kodeBlok, levelKopdes
                );
            }
            return window.tampilkanPlaceholderMenu(namaMenu, kodeBlok);
        } catch (e) { return false; }
    };

    // Info role via toast
    window.csTampilkanInfoRole = function(kodeRole) {
        try {
            kodeRole = kodeRole || window.getKodeRoleUserAktif();
            if (!kodeRole) return false;
            var info = window.csGetRoleInfo ? window.csGetRoleInfo(kodeRole) : null;
            if (!info) return false;

            var ikonKategori = {
                'Sistem':     'fas fa-cog',
                'Staf':       'fas fa-user-tie',
                'Organisasi': 'fas fa-users',
                'Seller':     'fas fa-store',
                'Customer':   'fas fa-user',
                'Kopdes':     'fas fa-flag',
                'Kasir':      'fas fa-cash-register'
            }[info.kategori] || 'fas fa-user';

            var pesan =
                '👤 <strong>' + window.csEscHtml(info.nama) + '</strong><br>' +
                '<small><i class="' + ikonKategori + ' me-1"></i>' +
                info.kategori + ' · ' + kodeRole +
                (info.kodeAwal ? ' · Kode Awal: ' + info.kodeAwal : '') +
                '</small>';
            return window.csToastMerahPutih(pesan, 'info', { duration: 4000 });
        } catch (e) { return false; }

    // ═══════════════════════════════════════════════════════════
    // [ROLE32.12] — role32CekKonsistensi32 (10 titik cek)
    // ═══════════════════════════════════════════════════════════
    window.role32CekKonsistensi32 = function() {
        var hasil = {
            ok: true, totalCek: 0, totalWarning: 0, detail: []
        };

        function _addCek(nama, status, pesan) {
            hasil.totalCek++;
            if (status !== 'ok') hasil.totalWarning++;
            hasil.detail.push({ cek: nama, status: status, pesan: pesan || '-' });
            if (status !== 'ok') hasil.ok = false;
        }

        try {
            // ── 1. CS_ROLE_MAP = 32 role ──
            if (!window.CS_ROLE_MAP) {
                _addCek('CS_ROLE_MAP ada', 'warning', 'Tidak ditemukan');
            } else {
                var total = Object.keys(window.CS_ROLE_MAP).length;
                if (total === 32) {
                    _addCek('CS_ROLE_MAP = 32', 'ok', '32 role ✓');
                } else {
                    _addCek('CS_ROLE_MAP = 32', 'warning', 'Ada ' + total);
                }
            }

            // ── 2. ROLE32_MAP sinkron ──
            var totalRole32 = Object.keys(window.ROLE32_MAP).length;
            if (totalRole32 === 32) {
                _addCek('ROLE32_MAP = 32', 'ok', '32 role ✓');
            } else {
                _addCek('ROLE32_MAP = 32', 'warning', 'Ada ' + totalRole32);
            }

            // ── 3. 7 kategori ──
            var totalKat = Object.keys(window.ROLE32_KATEGORI).length;
            if (totalKat === 7) {
                _addCek('7 Kategori', 'ok', '7 kategori ✓');
            } else {
                _addCek('7 Kategori', 'warning', 'Ada ' + totalKat);
            }

            // ── 4. Total per kategori = 32 ──
            var perKat = {};
            Object.keys(window.ROLE32_MAP).forEach(function(kode) {
                var info = window.ROLE32_MAP[kode];
                if (!info || !info.kategori) return;
                perKat[info.kategori] = (perKat[info.kategori] || 0) + 1;
            });
            var targetKat = {
                'Sistem': 2, 'Staf': 6, 'Organisasi': 2,
                'Seller': 11, 'Customer': 1, 'Kopdes': 4, 'Kasir': 6
            };
            var katSalah = [];
            Object.keys(targetKat).forEach(function(k) {
                if ((perKat[k] || 0) !== targetKat[k]) katSalah.push(k + ':' +
                    (perKat[k] || 0) + '/' + targetKat[k]);
            });
            if (katSalah.length === 0) {
                _addCek('Total per kategori', 'ok', '2+6+2+11+1+4+6 = 32');
            } else {
                _addCek('Total per kategori', 'warning', katSalah.join(', '));
            }

            // ── 5. 32 prefix unik ──
            var totalPrefix = Object.keys(window.ROLE32_PREFIX).length;
            if (totalPrefix >= 32) {
                _addCek('Prefix unik ≥ 32', 'ok', totalPrefix + ' prefix');
            } else {
                _addCek('Prefix unik ≥ 32', 'warning', 'Ada ' + totalPrefix);
            }

            // ── 6. 4 hierarki Kopdes ──
            var totalKopdes = Object.keys(window.ROLE32_HIERARKI_KOPDES).length;
            if (totalKopdes === 4) {
                _addCek('4 Hierarki Kopdes', 'ok', 'Pusat/Kab/Kec/Desa');
            } else {
                _addCek('4 Hierarki Kopdes', 'warning', 'Ada ' + totalKopdes);
            }

            // ── 7. 6 varian Kasir ──
            var totalKasir = Object.keys(window.ROLE32_VARIAN_KASIR).length;
            if (totalKasir === 6) {
                _addCek('6 Varian Kasir', 'ok',
                    'TK/PP/PM/DST/GR/KDMP');
            } else {
                _addCek('6 Varian Kasir', 'warning', 'Ada ' + totalKasir);
            }

            // ── 8. 15 role verif ──
            if (window.ROLE32_VERIF_15.length === 15) {
                _addCek('15 Role Verif', 'ok', '11 seller + 4 Kopdes');
            } else {
                _addCek('15 Role Verif', 'warning',
                    'Ada ' + window.ROLE32_VERIF_15.length);
            }

            // ── 9. 4 role aktif langsung ──
            if (window.ROLE32_AKTIF_DIRECT.length === 4) {
                _addCek('4 Role Aktif Direct', 'ok', 'CT/ORG/IND/EO');
            } else {
                _addCek('4 Role Aktif Direct', 'warning',
                    'Ada ' + window.ROLE32_AKTIF_DIRECT.length);
            }

            // ── 10. Tidak ada MFD ──
            if (window.ROLE32_MAP['MFD']) {
                _addCek('MFD tidak ada', 'warning', 'MFD ada di ROLE32_MAP');
            } else {
                _addCek('MFD tidak ada', 'ok', 'MFD tidak ada (benar)');
            }
        } catch (e) {
            hasil.ok = false;
            hasil.detail.push({ cek: 'exception', status: 'error', pesan: e.message });
        }

        return hasil;
    };

    window.role32Statistik = function() {

                perKategori[k] = 0;

            var perTipe = {};
            var perAlur = {};
            var butuhVerif = 0, butuhNik = 0, aktifDirect = 0;

            Object.keys(window.ROLE32_MAP).forEach(function(kode) {
                var info = window.ROLE32_MAP[kode];
                if (!info) return;

                if (info.kategori) {
                    perKategori[info.kategori] = (perKategori[info.kategori] || 0) + 1;
                }
                if (info.tipe) {
                    perTipe[info.tipe] = (perTipe[info.tipe] || 0) + 1;
                }
                if (info.alur) {
                    perAlur[info.alur] = (perAlur[info.alur] || 0) + 1;
                }
                if (window.role32ButuhVerif(kode)) butuhVerif++;
                if (window.role32ButuhNik(kode)) butuhNik++;
                if (window.role32AktifDirect(kode)) aktifDirect++;
            });

            return {
                total:           Object.keys(window.ROLE32_MAP).length,
                target:          32,
                lengkap:         Object.keys(window.ROLE32_MAP).length === 32,
                perKategori:     perKategori,
                perTipe:         perTipe,
                perAlur:         perAlur,
                butuhVerif:      butuhVerif,
                butuhNik:        butuhNik,
                aktifDirect:     aktifDirect,
                totalPrefix:     Object.keys(window.ROLE32_PREFIX).length,
                totalKopdes:     Object.keys(window.ROLE32_HIERARKI_KOPDES).length,
                totalVarianKasir: Object.keys(window.ROLE32_VARIAN_KASIR).length,
                totalVerif15:    window.ROLE32_VERIF_15.length,
                totalAktif4:     window.ROLE32_AKTIF_DIRECT.length

        } catch (e) {
            return {
                total: 0, target: 32, lengkap: false,
                perKategori: {}, perTipe: {}, perAlur: {},
                butuhVerif: 0, butuhNik: 0, aktifDirect: 0,
                totalPrefix: 0, totalKopdes: 0, totalVarianKasir: 0,
