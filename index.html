<!DOCTYPE html>
<html lang="id">
<head>
    <!-- ============================================================ -->
    <!-- ===== BLOK 1.1 – Meta & Library Eksternal ===== -->
    <!-- ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Toko Online 2R - Login">
    <meta name="author" content="Toko Online 2R">
    <title>Login - Toko Online 2R</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- ===== AKHIR BLOK 1.1 ===== -->

    <!-- ============================================================ -->
    <!-- ===== BLOK 1.2 – Custom CSS & Global Style ===== -->
    <!-- ============================================================ -->
    <style>
        body {
            background: linear-gradient(135deg, #FF8C00 0%, #FF6B00 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            max-width: 400px;
            margin: 80px auto;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .brand-icon {
            font-size: 3.5rem;
            color: #FF8C00;
        }
        .btn-login {
            background-color: #FF8C00;
            border: none;
            color: #fff;
            font-weight: bold;
        }
        .btn-login:hover {
            background-color: #e67e00;
        }
        #notifikasiLogin {
            display: none;
        }
        @media (max-width: 576px) {
            .login-card {
                margin: 40px auto;
            }
        }
    </style>
    <!-- ===== AKHIR BLOK 1.2 ===== -->
</head>
<body>

    <!-- ============================================================ -->
    <!-- ===== BLOK 2 – Halaman Login ===== -->
    <!-- ============================================================ -->
    <div class="container">
        <div class="card login-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fas fa-store-alt brand-icon"></i>
                    <h3 class="mt-2 fw-bold">Toko Online 2R</h3>
                    <p class="text-muted">Silakan login ke akun Anda</p>
                </div>

                <!-- Notifikasi -->
                <div id="notifikasiLogin" class="alert" role="alert"></div>

                <form id="formLogin" onsubmit="return prosesLogin(event)">
                    <div class="mb-3">
                        <label for="usernameLogin" class="form-label fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="usernameLogin" placeholder="Masukkan username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="passwordLogin" class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="passwordLogin" placeholder="Masukkan password" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordLogin()">
                                <i class="fas fa-eye" id="iconToggleLogin"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100 py-2">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <a href="#" class="text-decoration-none text-muted">Lupa Password?</a>
                </div>
            </div>
        </div>
    </div>
    <!-- ===== AKHIR BLOK 2 ===== -->

    <!-- ============================================================ -->
    <!-- ===== BLOK 9.2.1.1 – Konstanta Sistem & Deklarasi Variabel Global ===== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // KONSTANTA SISTEM
        // ============================================================
        var SUPERADMIN_USERNAME = 'AppTokoOnLine2R';
        var SUPERADMIN_PASSWORD = 'MyHand0286';

        // ============================================================
        // DATA LOGIN USER (DUMMY UNTUK DEMO)
        // ============================================================
        var dataLoginUser = [
            { username: 'superadmin', password: 'admin123', nama: 'Super Admin', role: 'SuperAdmin' },
            { username: 'toko1', password: '123456', nama: 'Toko Sederhana', role: 'Toko' },
            { username: 'customer1', password: '123456', nama: 'Customer Satu', role: 'Customer' }
        ];

        // ============================================================
        // VARIABEL GLOBAL LAINNYA (DIPERLUKAN UNTUK LOGIN)
        // ============================================================
        var userAktif = null;           // User yang sedang login
        var intervalTimer = null;       // Timer untuk auto-logout (jika ada)
        var waktuSisa = 0;              // Sisa waktu auto-logout
    </script>
    <!-- ===== AKHIR BLOK 9.2.1.1 ===== -->

    <!-- ============================================================ -->
    <!-- ===== BLOK 9.2.3.1 – Fungsi Navigasi Dasar & Toggle Password ===== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FUNGSI TOGGLE PASSWORD (LOGIN)
        // ============================================================
        function togglePasswordLogin() {
            var pw = document.getElementById('passwordLogin');
            var icon = document.getElementById('iconToggleLogin');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pw.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // ============================================================
        // FUNGSI NAVIGASI DASAR (DIPERLUKAN AGAR TIDAK ERROR)
        // ============================================================
        function tampilkanHalaman(halaman) {
            // Fungsi ini tidak digunakan dalam versi login saja,
            // tapi disertakan agar struktur mirip aslinya.
            // Implementasi sederhana: hanya alert.
            alert('Navigasi ke halaman "' + halaman + '" (belum tersedia).');
        }
    </script>
    <!-- ===== AKHIR BLOK 9.2.3.1 ===== -->

    <!-- ============================================================ -->
    <!-- ===== BLOK 9.2.5.1 – Fungsi Proses Login ===== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FUNGSI PROSES LOGIN
        // ============================================================
        function prosesLogin(event) {
            event.preventDefault();

            var username = document.getElementById('usernameLogin').value.trim();
            var password = document.getElementById('passwordLogin').value;
            var notif = document.getElementById('notifikasiLogin');

            // Cek SuperAdmin
            if (username === SUPERADMIN_USERNAME && password === SUPERADMIN_PASSWORD) {
                userAktif = {
                    nama: 'SuperAdmin',
                    role: 'SuperAdmin',
                    idUser: 'ID_SA-0001'
                };
                notif.className = 'alert alert-success';
                notif.innerHTML = '✅ Login SuperAdmin berhasil! Selamat datang, ' + userAktif.nama;
                notif.style.display = 'block';

                // Placeholder: tidak pindah ke dasbor
                setTimeout(function() {
                    alert('Anda berhasil login sebagai SuperAdmin. Dasbor belum dibuat.');
                }, 500);
                return false;
            }

            // Cek user biasa
            var foundUser = dataLoginUser.find(function(u) {
                return u.username === username && u.password === password;
            });

            if (foundUser) {
                userAktif = {
                    nama: foundUser.nama,
                    role: foundUser.role,
                    idUser: foundUser.username
                };
                notif.className = 'alert alert-success';
                notif.innerHTML = '✅ Login berhasil! Selamat datang, ' + foundUser.nama + ' (' + foundUser.role + ')';
                notif.style.display = 'block';

                // Placeholder: tidak pindah ke dasbor
                setTimeout(function() {
                    alert('Anda berhasil login sebagai ' + foundUser.role + '. Dasbor belum dibuat.');
                }, 500);
            } else {
                notif.className = 'alert alert-danger';
                notif.innerHTML = '❌ Username atau password salah!';
                notif.style.display = 'block';
            }

            return false;
        }
    </script>
    <!-- ===== AKHIR BLOK 9.2.5.1 ===== -->

    <!-- ============================================================ -->
    <!-- ===== BLOK 9.2.5.2 – Fungsi Masuk Dasbor (Placeholder) ===== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FUNGSI MASUK DASBOR (TIDAK DIGUNAKAN PADA VERSI INI)
        // ============================================================
        function masukDasbor() {
            // Fungsi ini tidak digunakan karena kita hanya sampai login.
            // Jika dipanggil, tampilkan pesan bahwa dasbor belum tersedia.
            alert('Dasbor belum tersedia pada file ini.');
        }
    </script>
    <!-- ===== AKHIR BLOK 9.2.5.2 ===== -->

    <!-- ============================================================ -->
    <!-- ===== BLOK 9.2.4.1 – Fungsi Jam Real-time & Auto-Logout (Opsional) ===== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // AUTO-LOGOUT (Jika ingin digunakan, aktifkan timer)
        // ============================================================
        // (Di sini tidak diaktifkan agar fokus pada login)
        // Fungsi resetTimerLogout dan mulaiIntervalLogout bisa ditambahkan nanti.
    </script>
    <!-- ===== AKHIR BLOK 9.2.4.1 ===== -->

    <!-- ============================================================ -->
    <!-- ===== BLOK 9.2.2.1 – DOMContentLoaded (Muat Data & Cek Session) ===== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // SAAT HALAMAN DIMUAT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Tidak ada session yang disimpan, hanya tampilkan halaman login.
            // Jika ingin memulihkan session, tambahkan logika di sini.
            console.log('Halaman login siap digunakan.');
        });
    </script>
    <!-- ===== AKHIR BLOK 9.2.2.1 ===== -->

    <!-- Bootstrap JS (diperlukan untuk komponen interaktif) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
