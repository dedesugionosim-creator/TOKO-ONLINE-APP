<!-- ═══════════════════════════════════════════════════════════════ -->
<script>
(function BLOK_FGBA_V11() {

    // ═══════════════════════════════════════════════════════════
    // [FGBA.1] — GUARD 3 LAPIS + DEP RETRY + A43 SELF-REGISTER
    // ═══════════════════════════════════════════════════════════
    if (window._fgbaDoneV11) return;

    // ── A19: CS1 ──
    if (!window.CS_ROLE_MAP) {
        window._fgbaRetryCS1 = (window._fgbaRetryCS1 || 0) + 1;
        if (window._fgbaRetryCS1 < 20) { setTimeout(BLOK_FGBA_V11, 500); return; }
        console.warn('⚠️ FGBA v1.1: CS1 tidak tersedia. Ditunda.');
        return;
    }

    // ── A19: GID ──
    if (typeof window.gidIdUser !== 'function' ||
        typeof window.gidKodeRoleUser !== 'function' ||
        typeof window.gidGetUserById !== 'function') {
        window._fgbaRetryGID = (window._fgbaRetryGID || 0) + 1;
        if (window._fgbaRetryGID < 20) { setTimeout(BLOK_FGBA_V11, 500); return; }
        console.warn('⚠️ FGBA v1.1: GID tidak tersedia. Ditunda.');
        return;
    }

    // ── A19: CS11 (WAJIB — source of truth pengajuan) ──
    if (typeof window.csLoadPengajuan !== 'function' ||
        typeof window.csSavePengajuan !== 'function') {
        window._fgbaRetryCS11 = (window._fgbaRetryCS11 || 0) + 1;
        if (window._fgbaRetryCS11 < 20) { setTimeout(BLOK_FGBA_V11, 500); return; }
        console.warn('⚠️ FGBA v1.1: CS11 (pengajuan helper) tidak tersedia. Ditunda.');
        return;
    }

    // ── A19: CS16 FKA (WAJIB) ──
    if (typeof window.fkaAktifkan !== 'function') {
        window._fgbaRetryCS16 = (window._fgbaRetryCS16 || 0) + 1;
        if (window._fgbaRetryCS16 < 20) { setTimeout(BLOK_FGBA_V11, 500); return; }
        console.warn('⚠️ FGBA v1.1: CS16 (FKA) tidak tersedia. Ditunda.');
        return;
    }

    // ── A19: CS2 storage ──
    if (typeof window.csLoadJSON !== 'function' || typeof window.csSaveJSON !== 'function') {
        console.warn('⚠️ FGBA v1.1: csLoadJSON/csSaveJSON bukan function. Ditunda.');
        return;
    }

    // ── Guard 3 lapis ──
    window._fgbaDoneV11 = true;   // ⭐ UTAMA v1.1
    window._fgbaDoneV1  = true;   // ← alias legacy + CPAJ detection
    window._fgbaDone    = true;   // ← general alias
    window._fgbaVersi   = '1.1';

    // ── A43: Self-register guard ──
    if (typeof window.blokDaftarkanGuard === 'function') {
        window.blokDaftarkanGuard('_fgbaDoneV11', 'FGBA');
    }

    // ═══════════════════════════════════════════════════════════
    // [FGBA.2] — KONSTANTA DELEGASI (A1, A2, A25)
    // ═══════════════════════════════════════════════════════════
    function _getStatusMap() {
        if (window.CS_STATUS) return window.CS_STATUS;
        return {
            AKTIF:    'Aktif',
            PENDING:  'Pending',
            REJECTED: 'Ditolak',
            REVISI:   'Revisi',
            BLOKIR:   'Diblokir',
            NONAKTIF: 'Nonaktif',
            ARSIP:    'Diarsipkan'
        };
    }

    // ═══════════════════════════════════════════════════════════
    // [FGBA.3] — HELPER INTERNAL (DELEGASI A1/A2/A25)
    // ═══════════════════════════════════════════════════════════

    // A25: Delegasi ke CS11 csLoadPengajuan/csSavePengajuan
    function _loadPengajuan() {
        if (typeof window.csLoadPengajuan === 'function') {
            return window.csLoadPengajuan();
        }
        return window.csLoadJSON('dataPengajuanBukaAkun', []) || [];
    }
    function _savePengajuan(list) {
        if (typeof window.csSavePengajuan === 'function') {
            return window.csSavePengajuan(list);
        }
        return window.csSaveJSON('dataPengajuanBukaAkun', list, { backup: false });
    }

    // A25: Delegasi ke GID gidGetUserById
    function _getUser(idUser) {
        if (!idUser) return null;
        if (typeof window.gidGetUserById === 'function') {
            return window.gidGetUserById(idUser);
        }
        var users = window.csLoadJSON('dataLoginUser', []) || [];
        return users.find(function(u) {
            return u && (u.idUser === idUser || u.id === idUser);
        }) || null;
    }

    // A25: Delegasi ke CS1 csGetRoleInfo
    function _infoRole(kodeRole) {
        if (!kodeRole) return null;
        if (typeof window.csGetRoleInfo === 'function') {
            var info = window.csGetRoleInfo(kodeRole);
            if (info) return info;
        }
        if (typeof window.role32Info === 'function') {
            return window.role32Info(kodeRole);
        }
        return window.CS_ROLE_MAP[kodeRole] || null;
    }

    // ═══════════════════════════════════════════════════════════
    // [FGBA.4] — USER SIDE: KirimPengajuan, CekStatus
    // ═══════════════════════════════════════════════════════════

    // ── fgbaKirimPengajuan ──
    window.fgbaKirimPengajuan = function(alasan) {
        try {
            var idUser = window.gidIdUser();
            if (!idUser) return { sukses: false, pesan: 'Sesi habis' };
            if (!alasan || alasan.trim().length < 10) {
                return { sukses: false, pesan: 'Alasan minimal 10 karakter' };
            }

            var user = _getUser(idUser);
            if (!user) return { sukses: false, pesan: 'User tidak ditemukan' };

            var S = _getStatusMap();
            var statusAsli = user.status || user.statusVerifikasi || S.AKTIF;
            if (statusAsli === S.AKTIF) {
                return { sukses: false, pesan: 'Akun masih aktif, tidak perlu mengajukan.' };
            }

            var list = _loadPengajuan();
            var sudahAda = list.some(function(p) {
                return p.id === idUser && p.status === 'Menunggu';
            });
            if (sudahAda) {
                return { sukses: false, pesan: 'Anda sudah mengirim pengajuan. Tunggu respon Admin.' };
            }

            var idPengajuan = (typeof window.generateKodeUnik === 'function')
                ? window.generateKodeUnik('REG')
                : 'REG-' + Date.now();

            var pengajuanBaru = {
                id:               idUser,
                idPengajuan:      idPengajuan,
                nama:             user.nama || user.namaLengkap || '-',
                username:         user.username || '-',
                roleKode:         user.kodeRole || '-',
                alasanDiblokir:   user.alasanPerubahanStatus || '-',
                alasanPengajuan:  alasan,
                status:           'Menunggu',
                tgl:              window.csNow ? window.csNow().split('T')[0]
                                              : new Date().toISOString().split('T')[0],
                createdAt:        window.csNow ? window.csNow() : new Date().toISOString()
            };

            list.push(pengajuanBaru);
            _savePengajuan(list);

            // A34: catat via CS7
            if (typeof window.catatAktivitasGlobal === 'function') {
                try {
                    window.catatAktivitasGlobal(
                        idUser, 'Kirim Pengajuan Buka Akun', alasan,
                        { kategori: 'Akun', idRef: idPengajuan }
                    );
                } catch (e) {}
            }

            // Notifikasi ke SA (CS9)
            if (typeof window.csNotifBroadcast === 'function') {
                try {
                    window.csNotifBroadcast({
                        judul:        'Pengajuan Buka Akun Baru',
                        pesan:        user.nama + ' mengajukan buka akun.',
                        ikon:         'fas fa-unlock',
                        warna:        'warning',
                        kategori:     'Akun',
                        kategoriRole: 'Sistem'
                    });
                } catch (e) {}
            }

            return {
                sukses:      true,
                pesan:       'Pengajuan berhasil dikirim. Mohon tunggu persetujuan Admin.',
                idPengajuan: idPengajuan
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ── fgbaCekStatusSaya ──
    window.fgbaCekStatusSaya = function() {
        try {
            var idUser = window.gidIdUser();
            if (!idUser) return { sukses: false, pesan: 'Sesi habis', data: null };

            var list = _loadPengajuan();
            var myPengajuan = list
                .filter(function(p) { return p.id === idUser; })
                .sort(function(a, b) {
                    return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
                });

            if (myPengajuan.length === 0) {
                return { sukses: true, data: { status: 'Belum Ada' } };
            }
            return { sukses: true, data: myPengajuan[0] };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGBA.5] — SA SIDE: ListAntrean, DetailPengajuan
    // ═══════════════════════════════════════════════════════════

    // ── fgbaListAntrean ──
    window.fgbaListAntrean = function(filter) {
        filter = filter || {};
        try {
            var list = _loadPengajuan();

            // Default: hanya "Menunggu"
            if (!filter.semuaStatus) {
                list = list.filter(function(p) { return p.status === 'Menunggu'; });
            }
            if (filter.kodeRole) {
                list = list.filter(function(p) { return p.roleKode === filter.kodeRole; });
            }
            if (filter.status) {
                list = list.filter(function(p) { return p.status === filter.status; });
            }
            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(p) {
                    return (String(p.nama || '').toLowerCase().indexOf(q) !== -1) ||
                           (String(p.username || '').toLowerCase().indexOf(q) !== -1) ||
                           (String(p.id || '').toLowerCase().indexOf(q) !== -1);
                });
            }

            list.sort(function(a, b) {
                return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
            });

            return { sukses: true, total: list.length, data: list };
        } catch (e) {
            console.error('[FGBA v1.1] fgbaListAntrean error:', e);
            return { sukses: false, pesan: e.message, data: [] };
        }
    };

    // ── fgbaDetailPengajuan ──
    window.fgbaDetailPengajuan = function(idPengajuan) {
        try {
            if (!idPengajuan) return { sukses: false, pesan: 'idPengajuan kosong', data: null };

            var list = _loadPengajuan();
            var found = list.find(function(p) {
                return p.idPengajuan === idPengajuan || p.id === idPengajuan;
            });
            if (!found) return { sukses: false, pesan: 'Pengajuan tidak ditemukan', data: null };

            var user = _getUser(found.id);
            return { sukses: true, data: { pengajuan: found, user: user } };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGBA.6] — SA SIDE: Setujui, Tolak, MintaRevisi
    // ═══════════════════════════════════════════════════════════

    // ── fgbaSetujui ──
    window.fgbaSetujui = function(idPengajuan, catatanSA) {
        try {
            if (!idPengajuan) return { sukses: false, pesan: 'idPengajuan kosong' };

            var list = _loadPengajuan();
            var idx = list.findIndex(function(p) {
                return p.idPengajuan === idPengajuan || p.id === idPengajuan;
            });
            if (idx === -1) return { sukses: false, pesan: 'Pengajuan tidak ditemukan' };

            var p = list[idx];
            if (p.status !== 'Menunggu') {
                return { sukses: false, pesan: 'Pengajuan sudah diproses sebelumnya' };
            }

            // A25: delegasi CS16 fkaAktifkan
            var resAktif = window.fkaAktifkan(p.id, catatanSA || 'Buka blokir disetujui');
            if (!resAktif.sukses) {
                return { sukses: false, pesan: 'Gagal aktifkan user: ' + resAktif.pesan };
            }

            // Update status pengajuan
            list[idx].status        = 'Disetujui';
            list[idx].catatanSA     = catatanSA || '-';
            list[idx].diprosesPada  = window.csNow ? window.csNow() : new Date().toISOString();
            list[idx].diprosesOleh  = window.gidIdUser();
            _savePengajuan(list);

            // Notif ke user (CS9)
            if (typeof window.csNotifSukses === 'function') {
                try {
                    window.csNotifSukses(
                        'Akun Aktif Kembali',
                        'Pengajuan buka akun Anda telah disetujui. Silakan login.',
                        { idUser: p.id }
                    );
                } catch (e) {}
            }
            // A12: notif via MN paralel
            if (typeof window.mnKirimKeUser === 'function') {
                try {
                    window.mnKirimKeUser(p.id, 'notif', {
                        judul: 'Akun Aktif Kembali',
                        pesan: 'Pengajuan Anda disetujui'
                    }, { menu: 'FGBA' });
                } catch (e) {}
            }

            return { sukses: true, pesan: 'Pengajuan disetujui. Akun user telah diaktifkan.' };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ── fgbaTolak ──
    window.fgbaTolak = function(idPengajuan, alasanPenolakan) {
        try {
            if (!idPengajuan) return { sukses: false, pesan: 'idPengajuan kosong' };
            if (!alasanPenolakan) return { sukses: false, pesan: 'Alasan penolakan wajib' };

            var list = _loadPengajuan();
            var idx = list.findIndex(function(p) {
                return p.idPengajuan === idPengajuan || p.id === idPengajuan;
            });
            if (idx === -1) return { sukses: false, pesan: 'Pengajuan tidak ditemukan' };

            var p = list[idx];
            if (p.status !== 'Menunggu') {
                return { sukses: false, pesan: 'Pengajuan sudah diproses sebelumnya' };
            }

            list[idx].status        = 'Ditolak';
            list[idx].catatanSA     = alasanPenolakan;
            list[idx].diprosesPada  = window.csNow ? window.csNow() : new Date().toISOString();
            list[idx].diprosesOleh  = window.gidIdUser();
            _savePengajuan(list);

            // Notif ke user
            if (typeof window.csNotifWarning === 'function') {
                try {
                    window.csNotifWarning(
                        'Pengajuan Ditolak',
                        'Maaf, pengajuan buka akun Anda ditolak: ' + alasanPenolakan,
                        { idUser: p.id, prioritas: 'high' }
                    );
                } catch (e) {}
            }
            // A12: notif via MN
            if (typeof window.mnKirimKeUser === 'function') {
                try {
                    window.mnKirimKeUser(p.id, 'notif', {
                        judul: 'Pengajuan Ditolak',
                        pesan: alasanPenolakan
                    }, { menu: 'FGBA' });
                } catch (e) {}
            }

            return { sukses: true, pesan: 'Pengajuan berhasil ditolak.' };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ── fgbaMintaRevisi ──
    window.fgbaMintaRevisi = function(idPengajuan, catatan) {
        try {
            if (!idPengajuan) return { sukses: false, pesan: 'idPengajuan kosong' };
            if (!catatan) return { sukses: false, pesan: 'Catatan revisi wajib' };

            var list = _loadPengajuan();
            var idx = list.findIndex(function(p) {
                return p.idPengajuan === idPengajuan || p.id === idPengajuan;
            });
            if (idx === -1) return { sukses: false, pesan: 'Pengajuan tidak ditemukan' };

            var p = list[idx];
            if (p.status !== 'Menunggu') {
                return { sukses: false, pesan: 'Pengajuan sudah diproses' };
            }

            list[idx].status        = 'Revisi';
            list[idx].catatanSA     = catatan;
            list[idx].diprosesPada  = window.csNow ? window.csNow() : new Date().toISOString();
            list[idx].diprosesOleh  = window.gidIdUser();
            _savePengajuan(list);

            if (typeof window.csNotifWarning === 'function') {
                try {
                    window.csNotifWarning(
                        'Perbaikan Pengajuan',
                        'Pengajuan Anda perlu direvisi: ' + catatan,
                        { idUser: p.id, prioritas: 'high' }
                    );
                } catch (e) {}
            }

            return { sukses: true, pesan: 'Permintaan revisi terkirim.' };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGBA.7] — BATCH: SetujuiBatch, TolakBatch
    // ═══════════════════════════════════════════════════════════
    window.fgbaSetujuiBatch = function(listIdPengajuan, catatanSA) {
        try {
            if (!Array.isArray(listIdPengajuan) || listIdPengajuan.length === 0) {
                return { sukses: false, pesan: 'List kosong' };
            }
            if (listIdPengajuan.length > 50) {
                return { sukses: false, pesan: 'Maksimal 50 per batch' };
            }
            var hasil = { sukses: 0, gagal: 0, list: [] };
            listIdPengajuan.forEach(function(id) {
                var r = window.fgbaSetujui(id, catatanSA);
                if (r.sukses) {
                    hasil.sukses++;
                    hasil.list.push({ id: id, status: 'ok' });
                } else {
                    hasil.gagal++;
                    hasil.list.push({ id: id, pesan: r.pesan });
                }
            });
            return hasil;
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.fgbaTolakBatch = function(listIdPengajuan, alasan) {
        try {
            if (!Array.isArray(listIdPengajuan) || listIdPengajuan.length === 0) {
                return { sukses: false, pesan: 'List kosong' };
            }
            if (!alasan) return { sukses: false, pesan: 'Alasan wajib' };
            if (listIdPengajuan.length > 50) {
                return { sukses: false, pesan: 'Maksimal 50 per batch' };
            }
            var hasil = { sukses: 0, gagal: 0, list: [] };
            listIdPengajuan.forEach(function(id) {
                var r = window.fgbaTolak(id, alasan);
                if (r.sukses) {
                    hasil.sukses++;
                    hasil.list.push({ id: id, status: 'ok' });
                } else {
                    hasil.gagal++;
                    hasil.list.push({ id: id, pesan: r.pesan });
                }
            });
            return hasil;
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGBA.8] — STATISTIK
    // ═══════════════════════════════════════════════════════════
    window.fgbaStatistik = function() {
        try {
            var list = _loadPengajuan();
            var perStatus = {
                Menunggu:  0,
                Disetujui: 0,
                Ditolak:   0,
                Revisi:    0
            };
            var perKodeRole = {};
            list.forEach(function(p) {
                if (!p) return;
                if (perStatus[p.status] !== undefined) perStatus[p.status]++;
                if (p.roleKode) perKodeRole[p.roleKode] = (perKodeRole[p.roleKode] || 0) + 1;
            });
            return {
                sukses: true,
                data: {
                    total:         list.length,
                    perStatus:     perStatus,
                    perKodeRole:   perKodeRole,
                    perluTindakan: perStatus.Menunggu
                }
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGBA.9] — PINTU 1: KIRIM (A11, A13)
    // ═══════════════════════════════════════════════════════════
    window.kirimFGBA = function(tipe, ke, data, idRef) {
        try {
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }
            return window.mnKirimKeMenu({
                tipe: tipe || 'info',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser(),
                    menu:     'FGBA',
                    blok:     'L4-FGBA'
                },
                ke:        ke || { menu: 'FGBA' },
                data:      data || {},
                idRef:     idRef || null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()
            });
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGBA.10] — PINTU 2 & 3: TERIMA & AMBIL (FIXED A13)
    // ═══════════════════════════════════════════════════════════
    window.terimaFGBA = function(aksiMenu, opts) {
        try {
            if (typeof window.mnInboxMenu !== 'function') return [];
            return window.mnInboxMenu(aksiMenu || 'FGBA', opts);
        } catch (e) { return []; }
    };

    // FIX A13: return format paket
    window.ambilFGBA = function(idPaket, aksiMenu, opts) {
        opts = opts || {};
        try {
            // Mode 1: ambil MN paket
            if (idPaket && aksiMenu && typeof window.mnAmbilPaket === 'function') {
                return window.mnAmbilPaket(aksiMenu, idPaket, opts);
            }
            // Mode 2: snapshot paket (A13 compliant)
            var antrean = window.fgbaListAntrean(opts.filter || {});
            var stat    = window.fgbaStatistik();
            return {
                tipe: 'snapshot-fgba',
                dari: { menu: 'FGBA', blok: 'L4-FGBA' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: {
                    antrean:   antrean.data || [],
                    total:     antrean.total || 0,
                    statistik: stat.data,
                    pengirim: {
                        idUser:   window.gidIdUser(),
                        kodeRole: window.gidKodeRoleUser()
                    }
                },
                idRef:     null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()
            };
        } catch (e) {
            return {
                tipe: 'error',
                dari: { menu: 'FGBA', blok: 'L4-FGBA' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: null,
                pesan: e.message
            };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FGBA.11a] — cekPintuFGBA + fgbaCekKonsistensi32
    // ═══════════════════════════════════════════════════════════
    window.cekPintuFGBA = function() {
        var skor =
            (typeof window.kirimFGBA  === 'function' ? 1 : 0) +
            (typeof window.terimaFGBA === 'function' ? 1 : 0) +
            (typeof window.ambilFGBA  === 'function' ? 1 : 0);
        return {
            blok:    'FGBA',
            kirim:   typeof window.kirimFGBA  === 'function',
            terima:  typeof window.terimaFGBA === 'function',
            ambil:   typeof window.ambilFGBA  === 'function',
            skor:    skor + '/3',
            lengkap: skor === 3
        };
    };

    window.fgbaCekKonsistensi32 = function() {
        var hasil = { ok: true, totalCek: 0, totalWarning: 0, detail: [] };

        if (!kodeRole) return false;
        if (!window.CS_ROLE_MAP[kodeRole]) return false;   // A36: role harus di CS_ROLE_MAP
        return _getRoleOwnerList().indexOf(kodeRole) !== -1;
    }

    // A25 + A40: info owner lengkap (kategori + level Kopdes)
    function _infoOwnerLengkap(u) {
        var info = _infoRole(u.kodeRole);
        var isKopdes = u.kodeRole && u.kodeRole.indexOf('KDMP_') === 0;
        var levelKopdes = null;
        if (isKopdes && window.CS_HIERARKI_KOPDES && window.CS_HIERARKI_KOPDES[u.kodeRole]) {
            levelKopdes = window.CS_HIERARKI_KOPDES[u.kodeRole].level || null;
        }
        return { infoRole: info, levelKopdes: levelKopdes };
    }

    // ═══════════════════════════════════════════════════════════
    // [FMO.4] — GETTER: fmoListOwner (grid 15 role owner)
    // ═══════════════════════════════════════════════════════════
    window.fmoListOwner = function(filter) {
        filter = filter || {};
        try {
            var S = _getStatusMap();
            var users = _loadUsers({ limit: 9999 });
            var hasil = [];

            users.forEach(function(u) {
                if (!u || !u.kodeRole) return;

                // A36: skip role invalid (stale data)
                if (!window.CS_ROLE_MAP[u.kodeRole]) return;

                // A25: hanya 15 role owner (11 seller + 4 Kopdes)
                if (!_isOwner(u.kodeRole)) return;

                // Filter status (default: hanya Aktif)
                var st = (u.status || u.statusVerifikasi || S.AKTIF);
                var stLower = String(st).toLowerCase();
                if (filter.status) {
                    if (stLower !== String(filter.status).toLowerCase()) return;
                } else {
                    if (stLower !== S.AKTIF.toLowerCase()) return;
                }

                // Filter role spesifik
                if (filter.kodeRole && u.kodeRole !== filter.kodeRole) return;

                // Filter cari
                if (filter.cari) {
                    var q = String(filter.cari).toLowerCase();
                    var namaCek = (u.nama || u.namaLengkap || '') + ' ' + (u.username || '');
                    if (String(namaCek).toLowerCase().indexOf(q) === -1) return;
                }

                // Data profil (A45-safe)
                var profil = _getProfilData(u.idUser || u.id);
                var namaToko = profil.namaToko || u.nama || u.namaLengkap || 'Toko Tanpa Nama';

                // Info owner lengkap (A25 + A40)
                var infoLengkap = _infoOwnerLengkap(u);

                hasil.push({
                    idUser:      u.idUser || u.id,
                    namaToko:    namaToko,
                    noHp:        u.hp || '-',
                    kodeRole:    u.kodeRole,
                    kategori:    infoLengkap.infoRole ? infoLengkap.infoRole.kategori : '-',
                    levelKopdes: infoLengkap.levelKopdes,
                    fotoUrl:     profil.fotoUrl || u.fotoUrl || '',
                    alamat:      u.alamat || '-',
                    status:      st,
                    _isOwner:    true
                });
            });

            // Sort A-Z
            hasil.sort(function(a, b) { return a.namaToko.localeCompare(b.namaToko); });

            var limit = parseInt(filter.limit, 10) || 200;
            return { sukses: true, total: hasil.length, data: hasil.slice(0, limit) };
        } catch (e) {
            console.error('[FMO v1.2] fmoListOwner error:', e);
            return { sukses: false, pesan: e.message, data: [] };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FMO.5] — GETTER: fmoDetailOwner
    // ═══════════════════════════════════════════════════════════
    window.fmoDetailOwner = function(idOwner) {
        try {
            if (!idOwner) return { sukses: false, pesan: 'ID kosong', data: null };
            var u = window.gidGetUserById(idOwner);
            if (!u) return { sukses: false, pesan: 'Owner tidak ditemukan', data: null };

            var profil = _getProfilData(idOwner);
            var infoLengkap = _infoOwnerLengkap(u);

            return {
                sukses: true,
                data: Object.assign({}, u, {
                    namaToko:       profil.namaToko || u.nama || '-',
                    fotoUrl:        profil.fotoUrl || u.fotoUrl || '',
                    deskripsi:      profil.deskripsi || 'Belum ada deskripsi toko.',
                    jamOperasional: profil.jamOperasional || '08:00 - 20:00',
                    rating:         profil.rating || 5.0,
                    infoRole:       infoLengkap.infoRole,
                    levelKopdes:    infoLengkap.levelKopdes
                })
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FMO.6] — GETTER: fmoAmbilProdukOwner
    // ═══════════════════════════════════════════════════════════
    window.fmoAmbilProdukOwner = function(idOwner, filter) {
        filter = filter || {};
        try {
            if (!idOwner) return { sukses: false, pesan: 'ID Owner kosong', data: [] };

            var produk = _loadProduk();
            var list = produk.filter(function(p) {
                return p && (p.idOwner === idOwner || p.idUser === idOwner);
            });

            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(p) {
                    return String(p.nama || p.namaProduk || '').toLowerCase().indexOf(q) !== -1;
                });
            }

            list.sort(function(a, b) {
                return new Date(b.createdAt || 0).getTime() -
                       new Date(a.createdAt || 0).getTime();
            });

            var limit = parseInt(filter.limit, 10) || 100;
            return { sukses: true, total: list.length, data: list.slice(0, limit) };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: [] };
        }
    };

            list.forEach(function(o) {

            return res;

    window.fmoVerifikasiToko = function(idOwner) {

    // A13 FIX: return paket format {tipe,dari,ke,data,idRef,timestamp}
    window.ambilFMO = function(idPaket, aksiMenu, opts) {

            if (idPaket && aksiMenu && typeof window.mnAmbilPaket === 'function') {
                return window.mnAmbilPaket(aksiMenu, idPaket, opts);

    // ═══════════════════════════════════════════════════════════
    // [FMO.12] — cekPintuFMO + fmoCekKonsistensi32 (A11/A19)
    // ═══════════════════════════════════════════════════════════
    window.cekPintuFMO = function() {
        var skor =
            (typeof window.kirimFMO  === 'function' ? 1 : 0) +
            (typeof window.terimaFMO === 'function' ? 1 : 0) +
            (typeof window.ambilFMO  === 'function' ? 1 : 0);
        return {
            blok:    'FMO',
            kirim:   typeof window.kirimFMO  === 'function',
            terima:  typeof window.terimaFMO === 'function',
            ambil:   typeof window.ambilFMO  === 'function',
            skor:    skor + '/3',
            lengkap: skor === 3
        };
    };

    window.fmoCekKonsistensi32 = function() {
        var hasil = { ok: true, totalCek: 0, totalWarning: 0, detail: [] };
        function _addCek(nama, status, pesan) {
            hasil.totalCek++;
            if (status !== 'ok') hasil.totalWarning++;
            hasil.detail.push({ cek: nama, status: status, pesan: pesan || '-' });
            if (status !== 'ok') hasil.ok = false;
        }

        try {
            // [1] CS_ROLE_MAP = 32
            var total = window.CS_ROLE_MAP ? Object.keys(window.CS_ROLE_MAP).length : 0;
            if (total === 32) {
                _addCek('CS_ROLE_MAP = 32', 'ok', 'Benar: 32 role');
            } else {
                _addCek('CS_ROLE_MAP = 32', 'warning', 'Ada ' + total);
            }

            // [2] CS_STATUS lengkap
            var S = _getStatusMap();
            if (typeof S.AKTIF === 'string' && typeof S.BLOKIR === 'string') {
                _addCek('CS_STATUS lengkap', 'ok', 'Delegasi CS1');
            } else {
                _addCek('CS_STATUS lengkap', 'warning', 'Beberapa status hilang');
            }

            // [3] GID helper
            if (typeof window.gidGetUserById === 'function' &&
                typeof window.gidIdUser === 'function') {
                _addCek('GID helper tersedia', 'ok', 'gidGetUserById + gidIdUser');
            } else {
                _addCek('GID helper tersedia', 'warning', 'GID belum v6.1+');
            }

            // [4] CS16 FKA
            if (typeof window.fkaListAkun === 'function' &&
                typeof window.fkaBlokir === 'function' &&
                typeof window.fkaAktifkan === 'function') {
                _addCek('CS16 FKA tersedia', 'ok', 'list + blokir + aktifkan');
            } else {
                _addCek('CS16 FKA tersedia', 'warning', 'CS16 belum lengkap');
            }

            // [5] 🔴 FIX v1.2: 15 ROLE OWNER (bukan 12)
            //     11 seller + 4 Kopdes = 15
            var owners = _getRoleOwnerList();
            var sellerCount = owners.filter(function(k) {
                var r = window.CS_ROLE_MAP[k];
                return r && r.kategori === 'Seller';
            }).length;
            var kopdesCount = owners.filter(function(k) {
                var r = window.CS_ROLE_MAP[k];
                return r && r.kategori === 'Kopdes';
            }).length;

            if (owners.length === 15) {
                _addCek('15 Role Owner terdeteksi', 'ok',
                    '11 seller + 4 Kopdes');
            } else if (owners.length > 0) {
                _addCek('15 Role Owner terdeteksi', 'warning',
                    'Ada ' + owners.length + ' (target 15)');
            } else {
                _addCek('15 Role Owner terdeteksi', 'warning',
                    'Kosong — CS_ROLE_MAP belum siap');
            }

            // [6] 11 Seller terdeteksi
            if (sellerCount === 11) {
                _addCek('11 Seller terdeteksi', 'ok', 'TK..FIN');
            } else {
                _addCek('11 Seller terdeteksi', 'warning',
                    'Ada ' + sellerCount + ' (target 11)');
            }

            // [7] 4 Kopdes terdeteksi
            if (kopdesCount === 4) {
                _addCek('4 Kopdes terdeteksi', 'ok',
                    'KDMP_PUSAT/KAB/KEC/DESA');
            } else {
                _addCek('4 Kopdes terdeteksi', 'warning',
                    'Ada ' + kopdesCount + ' (target 4)');
            }

            // [8] 3 Pintu lengkap
            var pintu = window.cekPintuFMO();
            if (pintu.lengkap) {
                _addCek('3 Pintu lengkap', 'ok', '3/3');
            } else {
                _addCek('3 Pintu lengkap', 'warning', pintu.skor);
            }

            // [9] A43 self-register
            if (window.BLOK_GUARD_MAP && window.BLOK_GUARD_MAP['_fmoDoneV12']) {
                _addCek('A43 self-register', 'ok', 'BLOK_GUARD_MAP terisi');
            } else if (typeof window.blokDaftarkanGuard === 'function') {
                _addCek('A43 self-register', 'warning', 'Entry FMO belum terdaftar');
            } else {
                _addCek('A43 self-register', 'warning', 'blokDaftarkanGuard belum ada');
            }

            // [10] MFD tidak ada
            if (window.CS_ROLE_MAP && window.CS_ROLE_MAP['MFD']) {
                _addCek('MFD tidak ada', 'warning', 'MFD ada di CS_ROLE_MAP');
            } else {
                _addCek('MFD tidak ada', 'ok', 'MFD tidak ada (benar)');
            }

            // [11] A45 safe: no base64 in profil_*
            var adaBase64 = false;
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k && k.indexOf('profil_') === 0) {
                        var data = window.csLoadJSON(k, {});
                        if (data && data.fotoUrl &&
                            String(data.fotoUrl).indexOf('data:image') === 0) {
                            adaBase64 = true;
                            break;
                        }
                    }
                }
            } catch (e) {}
            if (!adaBase64) {
                _addCek('A45 no base64 in storage', 'ok',
                    'Tidak ada base64 foto lama');
            } else {
                _addCek('A45 no base64 in storage', 'warning',
                    'Ada base64 foto lama — perlu migrasi ke MD');
            }
        } catch (e) {
            hasil.ok = false;
            hasil.detail.push({ cek: 'exception', status: 'error', pesan: e.message });
        }
        return hasil;
    };

        window._fseRetryFGD = (window._fseRetryFGD || 0) + 1;

                'sampai FGD load.');

        window._fseRetryFGD = 0;   // resolved
    }

    // ── Guard 4 lapis ──

    function _now() { return window.csNow ? window.csNow() : new Date().toISOString(); }

            Object.keys(window.CS_ROLE_MAP).forEach(function(k) {
                var r = window.CS_ROLE_MAP[k];
                if (!r) return;
                if (r.tipe === 'seller') hasil.push(k);
            });
        }
        if (window.CS_HIERARKI_KOPDES && window.CS_HIERARKI_KOPDES['KDMP_DESA']) {
            if (hasil.indexOf('KDMP_DESA') === -1) hasil.push('KDMP_DESA');
        } else if (window.CS_ROLE_MAP && window.CS_ROLE_MAP['KDMP_DESA']) {
            if (hasil.indexOf('KDMP_DESA') === -1) hasil.push('KDMP_DESA');
        }
        return hasil;

            var data = _load('r2c_setting_ekonomi', def);
            return {

                coinWajib:      parseInt(data.coinWajib, 10) || def.coinWajib,

                hargaBeli:      parseInt(data.hargaBeli, 10) || def.hargaBeli
            };

        try {
            if (!data) return { sukses: false, pesan: 'Data kosong' };
            var cur = window.getSettingEkonomiLengkapGlobal();

                minimalBelanja: parseInt(data.minimalBelanja, 10) || cur.minimalBelanja,
                coinWajib:      parseInt(data.coinWajib, 10) || cur.coinWajib,
                hargaJual:      parseInt(data.hargaJual, 10) || cur.hargaJual,
                hargaBeli:      parseInt(data.hargaBeli, 10) || cur.hargaBeli
            });
            if (typeof window.catatAktivitasGlobal === 'function') {
                try { window.catatAktivitasGlobal(window.gidIdUser(),
                    'Update Ekonomi Coin', 'Setting ekonomi diperbarui',
                    { kategori: 'Sistem' }); } catch (e) {}
            }
            return { sukses: true, pesan: 'Setting Ekonomi Coin tersimpan' };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════
    // [FSE.5] — TAB 2: TARIF OJEK
    // ═══════════════════════════════════════════════════════
    window.getTarifOjekGlobal = function() {
        var def = {
            tarifPerKm: 2000, biayaBase: 5000, tarifMinimum: 8000,
            biayaJasaPersen: 10, radiusDefaultKm: 5, maksimalJarakOjekKm: 30
        };
        try {
            var data = _load('r2c_setting_ojek', def);
            return {
                tarifPerKm:          parseFloat(data.tarifPerKm) || def.tarifPerKm,
                biayaBase:           parseFloat(data.biayaBase) || def.biayaBase,
                tarifMinimum:        parseFloat(data.tarifMinimum) || def.tarifMinimum,
                biayaJasaPersen:     parseFloat(data.biayaJasaPersen) || def.biayaJasaPersen,
                radiusDefaultKm:     parseFloat(data.radiusDefaultKm) || def.radiusDefaultKm,
                maksimalJarakOjekKm: parseFloat(data.maksimalJarakOjekKm) || def.maksimalJarakOjekKm
            };
        } catch (e) { return def; }
    };

    window.saveTarifOjekGlobal = function(data) {
        try {
            if (!data) return { sukses: false, pesan: 'Data kosong' };

                tarifPerKm:          parseFloat(data.tarifPerKm) || cur.tarifPerKm,
                biayaBase:           parseFloat(data.biayaBase) || cur.biayaBase,
                tarifMinimum:        parseFloat(data.tarifMinimum) || cur.tarifMinimum,

                radiusDefaultKm:     parseFloat(data.radiusDefaultKm) || cur.radiusDefaultKm,
                maksimalJarakOjekKm: parseFloat(data.maksimalJarakOjekKm) || cur.maksimalJarakOjekKm
            });
            if (typeof window.catatAktivitasGlobal === 'function') {
                try { window.catatAktivitasGlobal(window.gidIdUser(),
                    'Update Tarif Ojek', 'Tarif ojek diperbarui',
                    { kategori: 'Sistem' }); } catch (e) {}
            }
            return { sukses: true, pesan: 'Tarif Ojek tersimpan' };

    // [FSE.6] — TAB 3: SEWA APLIKASI
    // ═══════════════════════════════════════════════════════
    window.getDaftarRoleBisaSewa = function() {
        try {
            var list = [];
            if (!window.CS_ROLE_MAP) return list;
            var excludeKat = ['Sistem', 'Staf', 'Customer', 'Kasir', 'Organisasi'];
            Object.keys(window.CS_ROLE_MAP).forEach(function(kode) {
                var r = window.CS_ROLE_MAP[kode];
                if (!r || !r.kategori) return;
                if (excludeKat.indexOf(r.kategori) !== -1) return;
                list.push({
                    role: kode, nama: r.nama, kategori: r.kategori,
                    ikon: r.kategori === 'Kopdes' ? 'fas fa-flag' : 'fas fa-store'
                });
            });
            return list;

    window.getSewaAplikasiSettingGlobal = function() {
        var def = {
            roleKenaSewa: _deriveRoleKenaSewa(),

                '1_bulan':  { label: '1 Bulan', durasiHari: 30,  harga: 15000 },

                sukses: true,
                pesan: 'Top Up berhasil. Coin: ' + coinDidapat,

            var nominal = parseInt(nominalRp, 10);

                return { sukses: false, pesan: 'Nominal tidak valid' };

            var setting = window.getSettingEkonomiLengkapGlobal();
            var coinDibutuhkan = Math.ceil(nominal / setting.hargaBeli);

                keterangan: 'Withdraw Rp ' + nominal,
                kategori:   'withdraw'

            //   Format baru 3-param: (idPaket, aksiMenu, opts)
            //     - arg1 = idPaket | null

            //     - arg3 = opts | undefined
            //   Format lama 4-param: (tipe, idPaket, aksiMenu, opts)
            //     - arg1 = tipe ('ekonomi' | 'ojek' | 'sewa' | 'statistik')
            //     - arg2 = idPaket | null

                idPaket      = arg2;
                aksiMenu     = arg3;
                opts         = arg4 || {};
            } else {
                // ── Format baru 3-param ──
                idPaket      = arg1;
                aksiMenu     = arg2;
                opts         = arg3 || {};

            if (idPaket && aksiMenu && typeof window.mnAmbilPaket === 'function') {
                return window.mnAmbilPaket(aksiMenu, idPaket, opts);
            }

            // Mode 2: snapshot paket
            var data = null;
            if (tipeSnapshot === 'ekonomi')     data = window.getSettingEkonomiLengkapGlobal();
            else if (tipeSnapshot === 'ojek')   data = window.getTarifOjekGlobal();
            else if (tipeSnapshot === 'sewa')   data = window.getSewaAplikasiSettingGlobal();

            return {
                tipe:      'snapshot-fse',
                dari:      { menu: 'FSE', blok: 'L4-FSE' },
                ke:        { menu: opts.keMenu || 'caller' },
                data:      data,
                idRef:     null,
                timestamp: _now()

        } catch (e) {
            return {
                tipe: 'error',
                dari: { menu: 'FSE', blok: 'L4-FSE' },
                ke:   { menu: 'caller' },
                data: null, idRef: null, pesan: e.message

    if (typeof window.gidIdUser !== 'function' || typeof window.gidGetUserById !== 'function') {
        window._fgdRetryGID = (window._fgdRetryGID || 0) + 1;

        // ═══════════════════════════════════════════════════════════
    // [FGD.1] — HELPER (DELEGASI)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) { return window.csLoadJSON(key, def); }
    function _save(key, data) { return window.csSaveJSON(key, data, { backup: false }); }

    function _getUser(idUser) {
        if (!idUser) return null;
        if (typeof window.gidGetUserById === 'function') return window.gidGetUserById(idUser);
        var users = _load('dataLoginUser', []);
        return users.find(function(u) { return u && (u.idUser === idUser || u.id === idUser); }) || null;
    }

        // ═══════════════════════════════════════════════════════════
    // [FGD.2] — KONSTANTA DELEGASI
    // ═══════════════════════════════════════════════════════════
    function _getStatusMap() {
        if (window.CS_STATUS) return window.CS_STATUS;
        return {
            AKTIF: 'Aktif', PENDING: 'Pending', REJECTED: 'Ditolak',
            REVISI: 'Revisi', BLOKIR: 'Diblokir', NONAKTIF: 'Nonaktif', ARSIP: 'Diarsipkan'
        };
    }

    // A25: FGD_ROLE_BERHAK derive dari CS_ROLE_MAP (bukan hardcode)
    // Roles dengan wallet: SA + semua seller + CT + KDMP_DESA
    function _deriveRoleBerhak() {
        var hasil = ['SA']; // SA selalu boleh
        if (window.CS_ROLE_MAP) {
            Object.keys(window.CS_ROLE_MAP).forEach(function(k) {
                var r = window.CS_ROLE_MAP[k];
                if (!r) return;
                if (hasil.indexOf(k) !== -1) return;
                // Seller (11) — tipe seller
                if (r.tipe === 'seller') hasil.push(k);
                // Customer
                else if (k === 'CT') hasil.push(k);
                // KDMP_DESA
                else if (k === 'KDMP_DESA') hasil.push(k);
            });
        }
        return hasil;
    }

    // Expose as fresh getter (A25)
    Object.defineProperty(window, 'FGD_ROLE_BERHAK', {
        get: function() { return _deriveRoleBerhak(); },
        configurable: true
    });

    window.fgdCekBolehPunyaDompet = function(kodeRole) {
        if (!kodeRole) return false;
        return _deriveRoleBerhak().indexOf(kodeRole) !== -1;
    };

    // A45: Foto profil — DELEGASI ke Profil-Universal (bukan baca base64)
    window.getFotoProfilAkun = function(idUser) {
        try {
            if (!idUser) return '';
            // Priority 1: via PU
            if (typeof window.puAmbilProfil === 'function') {
                try {
                    var pu = window.puAmbilProfil();
                    if (pu && pu.sukses && pu.data && pu.data.fotoUrl) {
                        // Kalau idUser adalah user aktif, PU return foto
                        if (window.gidIdUser() === idUser) {
                            return pu.data.fotoUrl;
                        }
                    }
                } catch (e) {}
            }
            // Priority 2: baca profil_, resolve via MD
            var profil = _load('profil_' + idUser, {});
            if (profil.fotoUrl && String(profil.fotoUrl).indexOf('data:image') !== 0) {
                return profil.fotoUrl;
            }
            if (profil.idMediaFoto && typeof window.mdGetUrlPublik === 'function') {
                try { return window.mdGetUrlPublik(profil.idMediaFoto) || ''; } catch (e) {}
            }
            // Priority 3: user.fotoUrl
            var u = _getUser(idUser);
            return (u && u.fotoUrl && String(u.fotoUrl).indexOf('data:image') !== 0) ? u.fotoUrl : '';
        } catch (e) { return ''; }
    };

    // ═══════════════════════════════════════════════════════════
    // ⭐ CRITICAL: tambahTransaksiDompet (A1, A25) — WAJIB
    // ═══════════════════════════════════════════════════════════
    // Fungsi ini TIDAK ADA di v1.0 padahal dipanggil dari:
    //   - FGD intervensiCoinSA (internal)
    //   - FGV prosesSetujuiTopUp/Withdraw
    //   - FSE fseTopUpDompet/fseWithdrawDompet (inconsistent)
    // ═══════════════════════════════════════════════════════════
    window.tambahTransaksiDompet = function(idUser, opts) {
        opts = opts || {};
        try {
            if (!idUser) return { sukses: false, pesan: 'idUser kosong' };
            if (!opts.tipe || ['credit', 'debit'].indexOf(opts.tipe) === -1) {
                return { sukses: false, pesan: 'tipe harus credit/debit' };
            }
            var jumlah = parseFloat(opts.jumlah);
            if (isNaN(jumlah) || jumlah <= 0) {
                return { sukses: false, pesan: 'jumlah tidak valid' };
            }

            // Validasi role
            var user = _getUser(idUser);
            if (user && user.kodeRole && !window.fgdCekBolehPunyaDompet(user.kodeRole)) {
                return { sukses: false, pesan: 'Role ' + user.kodeRole + ' tidak berhak punya dompet' };
            }

            var list = _load('dataDompet', []);
            var idx = list.findIndex(function(d) { return d.idUser === idUser; });
            var dompet;

            if (idx === -1) {
                dompet = {
                    idUser: idUser, saldo: 0, totalMasuk: 0, totalKeluar: 0,
                    jmlTransaksi: 0, updatedAt: new Date().toISOString()
                };
                list.push(dompet);
                idx = list.length - 1;
            } else {
                dompet = list[idx];
            }

            var saldoLama = parseFloat(dompet.saldo) || 0;
            var saldoBaru = opts.tipe === 'credit'
                ? saldoLama + jumlah
                : saldoLama - jumlah;

            if (saldoBaru < 0) {
                return { sukses: false, pesan: 'Saldo tidak cukup. Saldo: ' + saldoLama + ', butuh: ' + jumlah };
            }

            dompet.saldo = saldoBaru;
            if (opts.tipe === 'credit') {
                dompet.totalMasuk = (parseFloat(dompet.totalMasuk) || 0) + jumlah;
            } else {
                dompet.totalKeluar = (parseFloat(dompet.totalKeluar) || 0) + jumlah;
            }
            dompet.jmlTransaksi = (parseInt(dompet.jmlTransaksi) || 0) + 1;
            dompet.updatedAt = new Date().toISOString();
            list[idx] = dompet;
            _save('dataDompet', list);

            // Catat riwayat
            try {
                if (typeof window.fseCatatRiwayatCoin === 'function') {
                    window.fseCatatRiwayatCoin(
                        idUser,
                        opts.kategori || (opts.tipe === 'credit' ? 'credit' : 'debit'),
                        opts.tipe === 'credit' ? jumlah : -jumlah,
                        opts.keterangan || '-'
                    );
                }
            } catch (e) {}

            return {
                sukses: true,
                saldo: saldoBaru,
                saldoLama: saldoLama,
                tipe: opts.tipe,
                jumlah: jumlah
            };
        } catch (e) {
            console.error('[FGD v1.1] tambahTransaksiDompet error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

        // ═══════════════════════════════════════════════════════════
    // [FGD.3] — GETTER SALDO
    // ═══════════════════════════════════════════════════════════
    window.getSaldoDompet = function(idUser) {
        try {
            if (!idUser) return 0;
            var user = _getUser(idUser);
            if (user && user.kodeRole && !window.fgdCekBolehPunyaDompet(user.kodeRole)) return 0;
            var list = _load('dataDompet', []);
            var d = list.find(function(x) { return x.idUser === idUser; });
            return d ? (parseFloat(d.saldo) || 0) : 0;
        } catch (e) { return 0; }
    };

        // ═══════════════════════════════════════════════════════════
    // getDompetUser — SINGLE SOURCE OF TRUTH = dataDompet
    // ═══════════════════════════════════════════════════════════
    // totalMasuk/totalKeluar/jmlTransaksi dibaca dari dataDompet
    // (sumber yang SAMA dengan tambahTransaksiDompet). Riwayat hanya
    // untuk display, bukan untuk menghitung total. Fallback hitung
    // dari riwayat HANYA kalau data lama belum punya total.
    // ═══════════════════════════════════════════════════════════
    window.getDompetUser = function(idUser) {
        try {
            if (!idUser) {
                return { balance: 0, totalMasuk: 0, totalKeluar: 0,
                         jmlTransaksi: 0, transactions: [] };
            }
            var semua = _load('dataDompet', []);
            if (!Array.isArray(semua)) semua = [];
            var d = semua.find(function(x) { return x.idUser === idUser; });

            var saldo       = d ? (parseFloat(d.saldo)       || 0) : 0;
            var totalMasuk  = d ? (parseFloat(d.totalMasuk)  || 0) : 0;
            var totalKeluar = d ? (parseFloat(d.totalKeluar) || 0) : 0;
            var jmlTrx      = d ? (parseInt(d.jmlTransaksi, 10) || 0) : 0;

            var riwayat = window.loadRiwayatDompetUser(idUser);

            // Fallback: data legacy yang belum punya total di dompet
            if (totalMasuk === 0 && totalKeluar === 0 && riwayat.length > 0) {
                riwayat.forEach(function(t) {
                    if (!t) return;
                    var nominal = parseFloat(t.nominal || t.jumlah || 0);
                    if (t.tipe === 'credit') totalMasuk  += nominal;
                    if (t.tipe === 'debit')  totalKeluar += nominal;
                });
            }
            return {
                balance:      saldo,
                totalMasuk:   totalMasuk,
                totalKeluar:  totalKeluar,
                jmlTransaksi: jmlTrx,
                transactions: riwayat
            };
        } catch (e) {
            return { balance: 0, totalMasuk: 0, totalKeluar: 0,
                     jmlTransaksi: 0, transactions: [], error: e.message };
        }
    };

    window.getDaftarSaldoUserGlobal = function(filter) {
        filter = filter || {};
        try {
            // A25: delegasi CS16
            var users = (typeof window.fkaListAkun === 'function')
                ? window.fkaListAkun({ limit: 9999 })
                : _load('dataLoginUser', []);
            var dompet = _load('dataDompet', []);
            var dompetMap = {};
            dompet.forEach(function(d) { dompetMap[d.idUser] = d; });

            var hasil = [];
            users.forEach(function(u) {
                if (!u || !(u.idUser || u.id)) return;
                var idU = u.idUser || u.id;
                if (u.role === 'SuperAdmin' || u.kodeRole === 'SA') return;
                if (filter.role && u.role !== filter.role) return;
                if (filter.cari) {
                    var q = filter.cari.toLowerCase();
                    var s = (u.nama || '') + ' ' + idU + ' ' + (u.username || '');
                    if (s.toLowerCase().indexOf(q) === -1) return;
                }
                var d = dompetMap[idU] || { saldo: 0, totalMasuk: 0, totalKeluar: 0, jmlTransaksi: 0 };
                var saldo = parseFloat(d.saldo) || 0;
                if (filter.saldo === 'ada' && saldo <= 0) return;
                if (filter.saldo === 'kosong' && saldo > 0) return;
                hasil.push({
                    idUser: idU, nama: u.nama || u.namaLengkap || '-', role: u.role || '-',
                    saldo: saldo, totalMasuk: parseFloat(d.totalMasuk) || 0,
                    totalKeluar: parseFloat(d.totalKeluar) || 0,
                    jmlTransaksi: parseInt(d.jmlTransaksi) || 0
                });
            });
            return hasil;
        } catch (e) { return []; }
    };

    // ═══ STATISTIK ═══
    window.hitungStatistikDompetGlobal = function() {
        try {
            var dompet = _load('dataDompet', []);
            var topup = _load('dataTopUpHistory', []);
            var withdraw = _load('dataWithdrawHistory', []);
            var setting = (typeof window.getSettingEkonomiLengkapGlobal === 'function')
                ? window.getSettingEkonomiLengkapGlobal() : { hargaJual: 1000 };

            var totalCoin = 0;
            dompet.forEach(function(d) { totalCoin += parseFloat(d.saldo) || 0; });
            var totalTopUpRp = 0;
            topup.forEach(function(t) {
                if (t.status === 'Lunas' || t.status === 'Disetujui') totalTopUpRp += parseFloat(t.totalRupiah) || 0;
            });
            var totalWithdrawRp = 0;
            withdraw.forEach(function(w) {
                if (w.status === 'Sukses' || w.status === 'Disetujui') totalWithdrawRp += parseFloat(w.totalRupiah) || 0;
            });
            var saldoKas = totalCoin * (parseInt(setting.hargaJual, 10) || 1000);

            return {
                totalCoinBeredar: totalCoin,
                totalTopUpRupiah: totalTopUpRp,
                totalWithdrawRupiah: totalWithdrawRp,
                saldoKasRupiah: saldoKas
            };
        } catch (e) {
            return { totalCoinBeredar: 0, totalTopUpRupiah: 0, totalWithdrawRupiah: 0, saldoKasRupiah: 0 };
        }
    };

    window.hitungStatistikDompetPerRole = function() {
        try {
            var list = window.getDaftarSaldoUserGlobal({});
            var perRole = {}, totalCoin = 0, totalUser = 0;
            list.forEach(function(u) {
                if (!perRole[u.role]) {
                    perRole[u.role] = { totalCoin: 0, jumlahUser: 0, aktifCoin: 0, suspendCoin: 0 };
                }
                perRole[u.role].totalCoin += u.saldo;
                perRole[u.role].jumlahUser++;
                totalCoin += u.saldo;
                var userDb = _getUser(u.idUser);
                var S = _getStatusMap();
                if (userDb && (userDb.status === S.AKTIF || userDb.statusVerifikasi === S.AKTIF)) {
                    perRole[u.role].aktifCoin += u.saldo;
                } else {
                    perRole[u.role].suspendCoin += u.saldo;
                }
                totalUser++;
            });
            return { perRole: perRole, totalCoin: totalCoin, totalUser: totalUser };
        } catch (e) { return { perRole: {}, totalCoin: 0, totalUser: 0 }; }
    };

    // ═══════════════════════════════════════════════════════════
    window.intervensiCoinSA = function(idUser, aksi, jumlah, keterangan) {
        try {
            var user = _getUser(idUser);
            if (user && user.kodeRole && !window.fgdCekBolehPunyaDompet(user.kodeRole)) {
                return { sukses: false, pesan: 'Role ' + user.kodeRole + ' tidak berhak memiliki Dompet R2Coin' };
            }
            var tipe = aksi === 'tambah' ? 'credit' : 'debit';
            var saldoLama = window.getSaldoDompet(idUser);

            // A25: delegasi ke tambahTransaksiDompet (sudah ada sekarang)
            var res = window.tambahTransaksiDompet(idUser, {
                tipe: tipe, jumlah: jumlah,
                keterangan: '[Intervensi SA] ' + keterangan,
                kategori: 'intervensi_sa'
            });

            var log = _load('dataIntervensiCoinLog', []);
            log.unshift({
                id: 'INT-' + Date.now(),
                waktu: new Date().toISOString(),
                adminId: window.gidIdUser(),
                adminNama: window.getNamaUserAktif ? window.getNamaUserAktif() : 'SuperAdmin',
                userId: idUser,
                userNama: user ? (user.nama || user.namaLengkap || idUser) : idUser,
                aksi: aksi, jumlah: jumlah,
                saldoSebelum: saldoLama, saldoSesudah: res.saldo,
                keterangan: keterangan
            });
            _save('dataIntervensiCoinLog', log);

            return { sukses: true, saldo: res.saldo, saldoSebelum: saldoLama };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.fgdCekKonsistensi32 = function() {
        var hasil = { ok: true, totalCek: 0, totalWarning: 0, detail: [] };
        function _addCek(n, s, p) {
            hasil.totalCek++; if (s !== 'ok') hasil.totalWarning++;
            hasil.detail.push({ cek: n, status: s, pesan: p || '-' });
            if (s !== 'ok') hasil.ok = false;
        }
        try {
            var total = window.CS_ROLE_MAP ? Object.keys(window.CS_ROLE_MAP).length : 0;
            if (total === 32) _addCek('CS_ROLE_MAP = 32', 'ok', 'Benar: 32 role');
            else _addCek('CS_ROLE_MAP = 32', 'warning', 'Ada ' + total);

        if (filter.role) list = list.filter(function(x) { return x.role === filter.role; });

            var tgl = x.createdAt || x.tanggal || '';
            return tgl.substring(0, 10) === filter.tanggal;
        });
        if (filter.cari) {

                // Role baru di CS tapi belum di sub-group → masukkan ke 'seller'
                if (!config['seller']) config['seller'] = [];
                config['seller'].push(kode);
                _sudahAda[kode] = 'seller';
            });
        }

        return config;
    }

    // Fresh getter (A25)
    Object.defineProperty(window, 'FSDU_KATEGORI', {
        get: function() { return _deriveFsduKategori(); },
        configurable: true
    });

    // ── Helper: reverse lookup (tipeDasbor dari kodeRole) ──
    function _getKategoriForRole(kodeRole) {
        if (!kodeRole) return null;
        var katMap = _deriveFsduKategori();
        var keys = Object.keys(katMap);
        for (var i = 0; i < keys.length; i++) {
            if (katMap[keys[i]].indexOf(kodeRole) !== -1) return keys[i];
        }
        return null;
    }

    // ═══════════════════════════════════════════════════════════
    // [FSDU.3] — STATE MANAGEMENT (per-block, A12-safe)
    // ═══════════════════════════════════════════════════════════
    // State FSDU bersifat lokal per-block. Untuk sinkronisasi antar blok,
    // gunakan MN (Event Bus) — bukan global mutation.
    // ═══════════════════════════════════════════════════════════

    window._fsduState = {
        tipe:     'seller',
        mode:     'grid',
        idOwner:  null,
        updatedAt: null
    };

    function _setState(tipe, mode, idOwner) {
        window._fsduState.tipe      = tipe || 'seller';
        window._fsduState.mode      = mode || 'grid';
        window._fsduState.idOwner   = idOwner || null;
        window._fsduState.updatedAt = window.csNow ? window.csNow() : new Date().toISOString();

        // A12: emit event untuk blok lain yang listen
        try {
            window.dispatchEvent(new CustomEvent('fsdu:state-changed', {
                detail: Object.assign({}, window._fsduState)
            }));
        } catch (e) {}

        return window._fsduState;
    }

    window.fsduSetState = function(tipe, mode, idOwner) {
        return _setState(tipe, mode, idOwner);
    };

    window.fsduGetState = function() {
        return Object.assign({}, window._fsduState);
    };

    window.fsduKembaliKeGrid = function() {
        return _setState(window._fsduState.tipe, 'grid', null);
    };

    // ═══════════════════════════════════════════════════════════
    // [FSDU.4] — HELPER INTERNAL (DELEGASI A25)
    // ═══════════════════════════════════════════════════════════

    // A25: Delegasi ke CS1 csGetRoleInfo
    function _infoRole(kodeRole) {
        if (!kodeRole) return null;
        if (typeof window.csGetRoleInfo === 'function') {
            var info = window.csGetRoleInfo(kodeRole);
            if (info) return info;
        }
        if (typeof window.role32Info === 'function') {
            return window.role32Info(kodeRole);
        }
        return window.CS_ROLE_MAP[kodeRole] || null;
    }

    // A25 + A45: Helper saldo dompet delegasi FGD v1.1
    function _getSaldoDompetSafe(idUser) {
        try {
            if (!idUser) return 0;
            // Prioritas 1: getSaldoDompet (FGD v1.1)
            if (typeof window.getSaldoDompet === 'function') {
                var s = window.getSaldoDompet(idUser);
                return parseFloat(s) || 0;
            }
            // Prioritas 2: getDompetUser (FGD v1.1)
            if (typeof window.getDompetUser === 'function') {
                var d = window.getDompetUser(idUser);
                return d ? (parseFloat(d.balance) || 0) : 0;
            }
            return 0;
        } catch (e) { return 0; }
    }

    // ═══════════════════════════════════════════════════════════
    // [FSDU.5] — GETTER: ListOwner (grid per kategori)
    // ═══════════════════════════════════════════════════════════
    window.fsduListOwner = function(tipeDasbor, filter) {
        filter = filter || {};
        try {
            // Validate kategori
            var katMap = _deriveFsduKategori();
            var roles = katMap[tipeDasbor];
            if (!roles) {
                return { sukses: false, pesan: 'Kategori dasbor tidak valid: ' + tipeDasbor, data: [] };
            }

            // Set state
            _setState(tipeDasbor, 'grid', null);

            // A25: delegasi FMO (WAJIB)
            var res = window.fmoListOwner({
                status: filter.status || 'Aktif',
                cari:   filter.cari || '',
                limit:  9999
            });

            if (!res || !res.sukses) {
                return { sukses: false, pesan: (res && res.pesan) || 'FMO gagal', data: [] };
            }

            // Filter berdasarkan roles di kategori ini
            var filtered = (res.data || []).filter(function(u) {
                return roles.indexOf(u.kodeRole) !== -1;
            });

            var limit = parseInt(filter.limit, 10) || 200;
            return {
                sukses: true,
                total:  filtered.length,
                data:   filtered.slice(0, limit),
                _kategori: tipeDasbor,
                _rolesTarget: roles.slice()
            };
        } catch (e) {
            console.error('[FSDU v1.1] fsduListOwner error:', e);
            return { sukses: false, pesan: e.message, data: [] };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSDU.6] — GETTER: DetailOwner (🔴 FIX fgdGetDompet BUG)
    // ═══════════════════════════════════════════════════════════
    // 🔴 FIX v1.1: v1.0 memanggil `window.fgdGetDompet(idOwner)` yang
    // TIDAK ADA di FGD v1.1. FGD v1.1 hanya punya:
    //   • getSaldoDompet(idUser) → number
    //   • getDompetUser(idUser)  → object { balance, ... }
    //   • fgdGetDompet TIDAK ADA — sudah dihapus/diganti nama
    // FIX: gunakan _getSaldoDompetSafe() yang delegasi ke FGD v1.1
    // ═══════════════════════════════════════════════════════════
    window.fsduDetailOwner = function(idOwner) {
        try {
            if (!idOwner) return { sukses: false, pesan: 'ID Owner kosong', data: null };

            // Set state
            _setState(window._fsduState.tipe, 'detail', idOwner);

            // A25: delegasi FMO
            var res = window.fmoDetailOwner(idOwner);
            if (!res || !res.sukses) return res || { sukses: false, pesan: 'FMO gagal', data: null };

            // A25 + A45: tambahan info dompet untuk SA
            var isSA = typeof window.gidIsSA === 'function' && window.gidIsSA();
            if (isSA) {
                // 🔴 FIX: gunakan _getSaldoDompetSafe (bukan fgdGetDompet)
                res.data.saldoDompet = _getSaldoDompetSafe(idOwner);

                // Tambah info saldo lengkap jika tersedia
                if (typeof window.getDompetUser === 'function') {
                    try {
                        var du = window.getDompetUser(idOwner);
                        if (du) {
                            res.data.infoDompet = {
                                balance:     du.balance     || 0,
                                totalMasuk:  du.totalMasuk  || 0,
                                totalKeluar: du.totalKeluar || 0,
                                jmlTransaksi: du.jmlTransaksi || 0
                            };
                        }
                    } catch (e) {}
                }
            }

            // Tambah info kategori (A36)
            res.data.kategoriDasbor = _getKategoriForRole(res.data.kodeRole);

            return res;
        } catch (e) {
            console.error('[FSDU v1.1] fsduDetailOwner error:', e);
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSDU.7] — GETTER: ProdukOwner
    // ═══════════════════════════════════════════════════════════
    window.fsduProdukOwner = function(idOwner, filter) {
        try {
            if (!idOwner) return { sukses: false, pesan: 'ID kosong', data: [] };
            // A25: delegasi FMO
            return window.fmoAmbilProdukOwner(idOwner, filter || {});
        } catch (e) {
            return { sukses: false, pesan: e.message, data: [] };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSDU.8] — GETTER: StatistikOwner
    // ═══════════════════════════════════════════════════════════
    // A25: Saldo via FGD (delegasi), Order via CS2 csLoadJSON
    // (csLoadJSON = CS2 helper — bukan duplikasi A25)
    // ═══════════════════════════════════════════════════════════
    window.fsduStatistikOwner = function(idOwner) {
        try {
            if (!idOwner) return { sukses: false, data: null };

            // Produk via FMO
            var produk = window.fsduProdukOwner(idOwner);
            var totalProduk = produk.sukses ? produk.total : 0;

            // Order via CS2 (csLoadJSON — delegasi CS)
            var orders = window.csLoadJSON('dataOrder', []) || [];
            if (!Array.isArray(orders)) orders = [];
            var totalTrx = orders.filter(function(o) {
                return o && (o.idOwner === idOwner || o.idOwner === idOwner);
            }).length;

            // Saldo via FGD (fix: pakai _getSaldoDompetSafe)
            var saldo = _getSaldoDompetSafe(idOwner);

            return {
                sukses: true,
                data: {
                    totalProduk:    totalProduk,
                    totalTransaksi: totalTrx,
                    saldoDompet:    saldo
                }
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSDU.9] — GETTER: ListKategori + GetKategoriForRole
    // ═══════════════════════════════════════════════════════════
    window.fsduListKategori = function() {
        try {
            var katMap = _deriveFsduKategori();
            var hasil = [];
            Object.keys(katMap).forEach(function(kat) {
                hasil.push({
                    kode:     kat,
                    label:    _labelKategori(kat),
                    ikon:     _ikonKategori(kat),
                    warna:    _warnaKategori(kat),
                    roles:    katMap[kat].slice(),
                    totalRole: katMap[kat].length
                });
            });
            return hasil;
        } catch (e) { return []; }
    };

    window.fsduGetKategoriForRole = function(kodeRole) {
        return _getKategoriForRole(kodeRole);
    };

    function _labelKategori(kat) {
        return {
            'kopdes': 'Kopdes 🇮🇩',
            'seller': 'Toko & Seller',
            'ojek':   'Ojek Online',
            'devfin': 'Dev / Dealer / Fin',
            'jasa':   'Jasa Servis'
        }[kat] || kat;

    function _ikonKategori(kat) {
        return {
            'kopdes': 'fas fa-flag',
            'seller': 'fas fa-store',
            'ojek':   'fas fa-motorcycle',
            'devfin': 'fas fa-building',

        }[kat] || 'fas fa-circle';
    }

    function _warnaKategori(kat) {
        return {
            'kopdes': 'danger',
            'seller': 'warning',
            'ojek':   'success',
            'devfin': 'primary',
            'jasa':   'info'
