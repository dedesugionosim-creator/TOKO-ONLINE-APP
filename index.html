    // ═══════════════════════════════════════════════════════════
    // [0.1.j.13] — cpJalankanAutoUpdate (Full Cycle)
    // ═══════════════════════════════════════════════════════════
    window.cpJalankanAutoUpdate = function(opts) {
        opts = opts || {};
        var cycle = {
            timestamp: new Date().toISOString(),
            scanBlok: null, scanFungsi: null,
            autoBlok: null, autoFungsi: null, autoRiwayat: null,
            validasi: null, refresh: null, anomali: []
        };

        try {
            cycle.scanBlok = window.cpScanBlokBaru();
            if (!opts.skipAuto) cycle.autoBlok = window.cpAutoCatatBlokBaru();
            cycle.scanFungsi = window.cpScanFungsiGlobal();
            if (!opts.skipAuto) cycle.autoFungsi = window.cpAutoCatatFungsiBaru();
            if (!opts.skipAuto) cycle.autoRiwayat = window.cpAutoCatatRiwayatBaru();
            if (!opts.skipValidasi) cycle.validasi = window.cpValidasiKonsistensi32();
            cycle.refresh = window.cpAutoRefreshAll();

            if (cycle.validasi && !cycle.validasi.ok) {
                cycle.validasi.detail.forEach(function(d) {
                    if (d.status === 'error') {
                        cycle.anomali.push(d.cek + ': ' + d.pesan);
                    }
                });
            }
            if (cycle.anomali.length > 0) {
                _anomali(cycle.anomali.length + ' masalah terdeteksi', cycle.anomali);
            }

            if (!opts.silent) {
                var s = '';
                if (cycle.autoBlok && cycle.autoBlok.ditambah > 0) {
                    s += ' +' + cycle.autoBlok.ditambah + ' blok';
                }
                if (cycle.autoFungsi && cycle.autoFungsi.ditambah > 0) {
                    s += ' +' + cycle.autoFungsi.ditambah + ' domain';
                }
                if (cycle.autoRiwayat && cycle.autoRiwayat.ditambah > 0) {
                    s += ' +' + cycle.autoRiwayat.ditambah + ' riwayat';
                }
                if (s) _log('🔄 Auto-cycle:' + s, 'success');
            }
            return cycle;
        } catch (e) {
            console.error('cpJalankanAutoUpdate error:', e);
            cycle.anomali.push('Exception: ' + e.message);
            return cycle;
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [0.1.j.14] — MONITOR: Start / Stop / Status
    // ═══════════════════════════════════════════════════════════
    var _intervalId = null;
    var _observer = null;
    var _cycleCount = 0;
    var _cycleAktif = false;

    window.cpStartAutoMonitor = function(opts) {
        opts = opts || {};
        try {
            window.cpStopAutoMonitor();
            var intervalMs = parseInt(opts.intervalMs, 10) ||
                             window.CPAJ_KONFIG.INTERVAL_MS;

            if (window.CPAJ_KONFIG.USE_INTERVAL) {
                _intervalId = setInterval(function() {
                    _cycleCount++;
                    window.cpJalankanAutoUpdate({ silent: true });
                }, intervalMs);
            }

            if (window.CPAJ_KONFIG.USE_OBSERVER &&
                typeof MutationObserver !== 'undefined') {
                try {
                    var target = document.body || document.documentElement;
                    if (target) {
                        _observer = new MutationObserver(function() {
                            if (_observer._debounce) clearTimeout(_observer._debounce);
                            _observer._debounce = setTimeout(function() {
                                window.cpJalankanAutoUpdate({
                                    silent: true,
                                    skipValidasi: true
                                });
                            }, 2000);
                        });
                        _observer.observe(target, { childList: true, subtree: true });
                    }
                } catch (e) {}
            }

            _cycleAktif = true;
            _log('🟢 Auto-monitor AKTIF (interval ' + (intervalMs/1000) + 's)', 'success');
            return { sukses: true, intervalMs: intervalMs, aktif: true };
        } catch (e) {
            console.error('cpStartAutoMonitor error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    window.cpStopAutoMonitor = function() {
        try {
            if (_intervalId) { clearInterval(_intervalId); _intervalId = null; }
            if (_observer) {
                try { _observer.disconnect(); } catch (e) {}
                _observer = null;
            }
            if (_cycleAktif) _log('🔴 Auto-monitor STOPPED', 'warning');
            _cycleAktif = false;
            return { sukses: true, aktif: false };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.cpMonitorStatus = function() {
        return {
            aktif: _cycleAktif,
            intervalId: !!_intervalId,
            observerId: !!_observer,
            cycleCount: _cycleCount,
            konfig: Object.assign({}, window.CPAJ_KONFIG)
        };
    };

    };

    window.csGetPrefixRole = function(kodeRole) {
        try {
            if (!kodeRole) return 'XX';

        } catch (e) { return 'XX'; }

            var hasil = [];
            Object.keys(window.CS_ALUR_PENDAFTARAN).forEach(function(kode) {

                total: total,

<!-- ═══   [CS2.8]   csMigrasiKasirOwnerId (auto-fix A42) ═════ -->
<!-- ═══   [CS2.9]   csLoadArsip + csSaveArsip ════════════════ -->
<!-- ═══   [CS2.10]  csLoadKasir + csSaveKasir ════════════════ -->
<!-- ═══   [CS2.11]  csCekKonsistensiStorage32 (10 titik) ═════ -->
<!-- ═══   [CS2.12]  csBersihkanStorageAman + Debug + Log ═════ -->
<!-- ═══ ⚠️ Auto-backup sebelum save (jika CS_FLAG.AUTO_BACKUP) -->
<!-- ═══ ⚠️ Emergency cleanup jika quota exceeded ═════════════ -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<script>
(function BLOK_CS2_STORAGE_V4() {
    // ═══════════════════════════════════════════════════════════
    // [A32] — GUARD FLAG UNIK + ALIAS BACKWARD COMPAT
    // ═══════════════════════════════════════════════════════════
    if (window._coreSystem2DoneV4) {
        console.log('ℹ️ CS2 v' + (window._coreSystem2Versi || '?') + ' sudah terpasang.');
        return;
    }

    // ── Cek dependency CS1 ──
    var cs1Ok = window._coreSystem1DoneV4_2 ||
                window._coreSystem1DoneV4 ||
                window._coreSystem1DoneV3;
    if (!cs1Ok) {
        console.warn('⚠️ CS1 belum terpasang. CS2 v4.0 ditunda.');
        return;
    }
    if (!window.CS_KEY || !window.CS_LIMIT || !window.CS_FLAG) {
        console.warn('⚠️ CS_KEY/CS_LIMIT/CS_FLAG tidak ada. CS2 v4.0 ditunda.');
        return;
    }

    // ── Guard + alias ──
    window._coreSystem2DoneV4 = true;
    window._coreSystem2DoneV3 = true;
    window._coreSystem2DoneV2 = true;
    window._coreSystem2DoneV1 = true;
    window._coreSystem2Done   = true;
    window._coreSystem2Versi  = '4.0';

    // ═══════════════════════════════════════════════════════════
    // [CS2.1] — csLoadJSON (dengan fallback)
    // ═══════════════════════════════════════════════════════════
    window.csLoadJSON = function(key, fallback) {
        try {
            if (!key) return fallback;
            var s = localStorage.getItem(key);
            if (!s) return fallback;
            var parsed = JSON.parse(s);
            return (parsed === null || parsed === undefined) ? fallback : parsed;
        } catch (e) {
            console.warn('csLoadJSON error "' + key + '":', e.message);
            return fallback;
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.2] — csSaveJSON (quota handling + auto-backup)
    // ═══════════════════════════════════════════════════════════
    window.csSaveJSON = function(key, data, opts) {
        opts = opts || {};
        try {
            if (!key) return { sukses: false, pesan: 'Key kosong' };

            // ── Backup otomatis (kalau diaktifkan) ──
            if (window.CS_FLAG && window.CS_FLAG.AUTO_BACKUP && opts.backup !== false) {
                try {
                    var existing = localStorage.getItem(key);
                    if (existing) {
                        localStorage.setItem(
                            (window.CS_KEY ? window.CS_KEY.BACKUP_PREFIX : 'backup_') + key,
                            existing.substring(0, 2000)
                        );
                    }
                } catch (e) {}
            }

            var json = JSON.stringify(data);
            var sizeKB = Math.round(json.length / 1024);

            if (window.CS_LIMIT && sizeKB > window.CS_LIMIT.MAX_STORAGE_MB * 1024) {
                console.warn('⚠️ Data terlalu besar: ' + sizeKB + ' KB');
            }

            try {
                localStorage.setItem(key, json);
                return { sukses: true, sizeKB: sizeKB };
            } catch (e) {
                if (e.name === 'QuotaExceededError' ||
                    (e.message && e.message.indexOf('quota') !== -1)) {
                    console.warn('⚠️ Storage penuh — emergency cleanup…');
                    window.csEmergencyCleanup();
                    try {
                        localStorage.setItem(key, json);
                        return { sukses: true, afterCleanup: true, sizeKB: sizeKB };
                    } catch (e2) {
                        return { sukses: false, pesan: 'Storage penuh setelah cleanup' };
                    }
                }
                return { sukses: false, pesan: e.message };
            }
        } catch (e) {
            console.error('csSaveJSON error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.3] — csRemoveJSON
    // ═══════════════════════════════════════════════════════════
    window.csRemoveJSON = function(key) {
        try {
            localStorage.removeItem(key);
            return true;
        } catch (e) {
            return false;
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.4] — csEmergencyCleanup
    // ═══════════════════════════════════════════════════════════
    window.csEmergencyCleanup = function() {
        try {
            var freed = 0;

            // 1. Hapus semua backup
            Object.keys(localStorage).forEach(function(k) {
                if (k.indexOf('backup_') === 0) {
                    freed += (localStorage.getItem(k) || '').length;
                    try { localStorage.removeItem(k); } catch (e) {}
                }
            });

            // 2. Trim log audit
            try {
                var la = window.csLoadJSON(window.CS_KEY.LOG_AUDIT_SA, { log: [] });
                if (la.log && la.log.length > 100) {
                    la.log = la.log.slice(0, 100);
                    localStorage.setItem(window.CS_KEY.LOG_AUDIT_SA, JSON.stringify(la));
                }
            } catch (e) {}

            // 3. Trim histori aktivitas
            try {
                var ha = window.csLoadJSON(window.CS_HISTORI_KEY || 'dataHistoriAktivitas', []);
                if (ha.length > 100) {
                    ha = ha.slice(0, 100);
                    localStorage.setItem(window.CS_KEY.HISTORI_AKTIVITAS, JSON.stringify(ha));
                }
            } catch (e) {}

            console.log('🧹 Emergency cleanup: ~' + Math.round(freed / 1024) + ' KB dibebaskan');
            return { sukses: true, freedKB: Math.round(freed / 1024) };
        } catch (e) {
            console.error('csEmergencyCleanup error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.5] — csHitungSizeStorage
    // ═══════════════════════════════════════════════════════════
    window.csHitungSizeStorage = function() {
        try {
            var total = 0;
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                var v = localStorage.getItem(k) || '';
                total += (k.length + v.length) * 2;
            }
            return {
                bytes: total,
                KB: Math.round(total / 1024),
                MB: Math.round(total / 1024 / 1024 * 100) / 100
            };
        } catch (e) {
            return { bytes: 0, KB: 0, MB: 0 };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.6] — simpanDataKeLocalStorage (19 KEY)
    // ═══════════════════════════════════════════════════════════
    // Simpan semua variabel global VG ke localStorage.
    // +DATA_ARSIP_AKUN +DATA_KASIR (sinkron 32 role).
    // ═══════════════════════════════════════════════════════════
    window.simpanDataKeLocalStorage = function() {
        try {
            var hasil = { sukses: 0, gagal: 0, listGagal: [] };

            var map = [
                { var: 'dataLoginUser',         key: 'dataLoginUser' },
                { var: 'dataAkunAktif',         key: 'dataAkunAktif' },
                { var: 'dataWilayah',           key: 'dataWilayah' },
                { var: 'dataPengajuanBukaAkun', key: 'dataPengajuanBukaAkun' },
                { var: 'dataVerifikasiDokumen', key: 'dataVerifikasiDokumen' },
                { var: 'dataLogAuditSA',        key: 'dataLogAuditSA' },
                { var: 'dataHistoriAktivitas',  key: 'dataHistoriAktivitas' },
                { var: 'dataRekening',          key: 'dataRekening' },
                { var: 'dataTopUpHistory',      key: 'dataTopUpHistory' },
                { var: 'dataWithdrawHistory',   key: 'dataWithdrawHistory' },
                { var: 'dataKasir',             key: 'dataKasir' },
                { var: 'dataArsipAkun',         key: 'dataArsipAkun' },
                { var: 'dataOrder',             key: 'dataOrder' },
                { var: 'dataProduk',            key: 'dataProduk' },
                { var: 'dataKategoriProduk',    key: 'dataKategoriProduk' },
                { var: 'dataNotifikasi',        key: 'dataNotifikasi' },
                { var: 'dataChat',              key: 'dataChat' },
                { var: 'dataKoleksiGif',        key: 'dataKoleksiGif' },
                { var: 'dataMediaIndex',        key: 'dataMediaIndex' }
            ];

            map.forEach(function(m) {
                try {
                    var val = window[m.var];
                    if (val === undefined) return;
                    var r = window.csSaveJSON(m.key, val, { backup: false });
                    if (r && r.sukses) hasil.sukses++;
                    else {
                        hasil.gagal++;
                        hasil.listGagal.push(m.key);
                    }
                } catch (e) {
                    hasil.gagal++;
                    hasil.listGagal.push(m.key + ' (' + e.message + ')');
                }
            });

            return hasil;
        } catch (e) {
            console.error('simpanDataKeLocalStorage error:', e);
            return { sukses: 0, gagal: 1, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.7] — loadDataDariLocalStorage (19 KEY)
    // ═══════════════════════════════════════════════════════════
    window.loadDataDariLocalStorage = function() {
        try {
            var map = [
                { var: 'dataLoginUser',         key: 'dataLoginUser',         def: [] },
                { var: 'dataAkunAktif',         key: 'dataAkunAktif',         def: [] },
                { var: 'dataWilayah',           key: 'dataWilayah',           def: [] },
                { var: 'dataPengajuanBukaAkun', key: 'dataPengajuanBukaAkun', def: [] },
                { var: 'dataVerifikasiDokumen', key: 'dataVerifikasiDokumen', def: [] },
                { var: 'dataLogAuditSA',        key: 'dataLogAuditSA',        def: { log: [] } },
                { var: 'dataHistoriAktivitas',  key: 'dataHistoriAktivitas',  def: [] },
                { var: 'dataRekening',          key: 'dataRekening',          def: [] },
                { var: 'dataTopUpHistory',      key: 'dataTopUpHistory',      def: [] },
                { var: 'dataWithdrawHistory',   key: 'dataWithdrawHistory',   def: [] },
                { var: 'dataKasir',             key: 'dataKasir',             def: [] },
                { var: 'dataArsipAkun',         key: 'dataArsipAkun',         def: [] },
                { var: 'dataOrder',             key: 'dataOrder',             def: [] },
                { var: 'dataProduk',            key: 'dataProduk',            def: [] },
                { var: 'dataKategoriProduk',    key: 'dataKategoriProduk',    def: [] },
                { var: 'dataNotifikasi',        key: 'dataNotifikasi',        def: [] },
                { var: 'dataChat',              key: 'dataChat',              def: [] },
                { var: 'dataKoleksiGif',        key: 'dataKoleksiGif',        def: [] },
                { var: 'dataMediaIndex',        key: 'dataMediaIndex',        def: {} }
            ];

            var hasil = {};
            map.forEach(function(m) {
                try {
                    var loaded = window.csLoadJSON(m.key, m.def);
                    var target = window[m.var];

                    if (Array.isArray(target) && Array.isArray(loaded)) {
                        target.length = 0;
                        loaded.forEach(function(x) { target.push(x); });
                    } else if (target && typeof target === 'object' &&
                               !Array.isArray(target) && typeof loaded === 'object') {
                        Object.keys(target).forEach(function(k) { delete target[k]; });
                        Object.assign(target, loaded);
                    }
                    if (Array.isArray(loaded)) hasil[m.var] = loaded.length;
                    else if (typeof loaded === 'object') hasil[m.var] = Object.keys(loaded).length;
                    else hasil[m.var] = 0;
                } catch (e) {
                    hasil[m.var] = 0;
                }
            });

            // ── AUTO-MIGRASI: perbaiki kasir tanpa idOwner (data lama) ──
            try {
                window.csMigrasiKasirOwnerId();
            } catch (_e) {
                console.warn('Migrasi kasir warning:', _e.message);
            }

            return hasil;
        } catch (e) {
            console.error('loadDataDariLocalStorage error:', e);
            return {};
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.8] — csMigrasiKasirOwnerId (auto-fix A42)
    // ═══════════════════════════════════════════════════════════
    // Perbaiki kasir lama yang belum punya idOwner/ownerId/idInduk.
    // Sinkron dengan 6 varian kasir.
    // ═══════════════════════════════════════════════════════════
    window.csMigrasiKasirOwnerId = function() {
        try {
            var _KASIR_KODE = ['KSR_TK','KSR_PP','KSR_PM','KSR_DST','KSR_GR','KSR_KDMP'];
            var _lu = window.dataLoginUser || [];
            if (!Array.isArray(_lu) || _lu.length === 0) return { sukses: true, fixed: 0 };

            var _fixed = 0;
            for (var _i = 0; _i < _lu.length; _i++) {
                var _u = _lu[_i];
                if (!_u || _KASIR_KODE.indexOf(_u.kodeRole) === -1) continue;
                if (_u.idOwner) continue;

                // Cari induk
                var _induk = 'TK';
                if (_u.kodeRole === 'KSR_KDMP') _induk = 'KDMP_DESA';
                else if (_u.kodeRole && _u.kodeRole.indexOf('KSR_') === 0) {
                    _induk = _u.kodeRole.replace('KSR_', '');
                }

                var _kandidat = _lu.filter(function(x) {
                    return x && x.kodeRole === _induk;
                });
                if (_kandidat.length === 0) continue;

                var _chosen = _kandidat[0];
                _u.idOwner = _chosen.idUser || _chosen.id;
                _u.ownerId = _u.idOwner;
                _u.idInduk = _u.idOwner;
                if (_chosen.kodeToko) _u.kodeOwner = _chosen.kodeToko;
                if (!_u.createdBy) _u.createdBy = _u.idOwner;
                _fixed++;
            }

            if (_fixed > 0) {
                window.csSaveJSON('dataLoginUser', _lu, { backup: false });
                console.log('%c🔧 Migrasi kasir: ' + _fixed +
                    ' akun diperbaiki (idOwner)',
                    'background:#DC3545;color:#fff;padding:2px 6px;');
            }
            return { sukses: true, fixed: _fixed };
        } catch (e) {
            console.warn('csMigrasiKasirOwnerId error:', e.message);
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.9] — csLoadArsip + csSaveArsip
    // ═══════════════════════════════════════════════════════════
    window.csLoadArsip = function() {
        try {
            var v = window.csLoadJSON('dataArsipAkun', []);
            return Array.isArray(v) ? v : [];
        } catch (e) { return []; }
    };

    window.csSaveArsip = function(list) {
        try {
            if (!Array.isArray(list)) return { sukses: false, pesan: 'Bukan array' };
            var r = window.csSaveJSON('dataArsipAkun', list, { backup: false });
            if (Array.isArray(window.dataArsipAkun)) {
                window.dataArsipAkun.length = 0;
                list.forEach(function(x) { window.dataArsipAkun.push(x); });
            }
            return r;
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.10] — csLoadKasir + csSaveKasir
    // ═══════════════════════════════════════════════════════════
    window.csLoadKasir = function() {
        try {
            var v = window.csLoadJSON('dataKasir', []);
            return Array.isArray(v) ? v : [];
        } catch (e) { return []; }
    };

    window.csSaveKasir = function(list) {
        try {
            if (!Array.isArray(list)) return { sukses: false, pesan: 'Bukan array' };
            var r = window.csSaveJSON('dataKasir', list, { backup: false });
            if (Array.isArray(window.dataKasir)) {
                window.dataKasir.length = 0;
                list.forEach(function(x) { window.dataKasir.push(x); });
            }
            return r;
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.11] — csCekKonsistensiStorage32 (10 TITIK CEK)
    // ═══════════════════════════════════════════════════════════
    window.csCekKonsistensiStorage32 = function() {
        var hasil = { ok: true, totalCek: 0, totalWarning: 0, detail: [] };

        function _addCek(nama, status, pesan) {
            hasil.totalCek++;
            if (status !== 'ok') hasil.totalWarning++;
            hasil.detail.push({ cek: nama, status: status, pesan: pesan || '-' });
            if (status !== 'ok') hasil.ok = false;
        }

        try {
            // ── 1. Key storage utama ada ──
            var keyUtama = [
                'dataLoginUser', 'dataAkunAktif', 'dataKasir',
                'dataArsipAkun', 'dataPengajuanBukaAkun', 'dataVerifikasiDokumen'
            ];
            var keyHilang = keyUtama.filter(function(k) {
                try { return localStorage.getItem(k) === null; }
                catch (e) { return true; }
            });
            if (keyHilang.length === 0) {
                _addCek('Key storage utama', 'ok', '6 key utama ada');
            } else {
                _addCek('Key storage utama', 'warning',
                    'Belum ada: ' + keyHilang.join(', '));
            }

            // ── 2. dataLoginUser ter-load ──
            if (Array.isArray(window.dataLoginUser)) {
                _addCek('dataLoginUser ter-load', 'ok',
                    window.dataLoginUser.length + ' user');
            } else {
                _addCek('dataLoginUser ter-load', 'warning', 'Bukan array');
            }

            // ── 3. dataKasir ter-load ──
            if (Array.isArray(window.dataKasir)) {
                _addCek('dataKasir ter-load', 'ok',
                    window.dataKasir.length + ' kasir (6 varian)');
            } else {
                _addCek('dataKasir ter-load', 'warning', 'Bukan array');
            }

            // ── 4. dataArsipAkun ter-load ──
            if (Array.isArray(window.dataArsipAkun)) {
                _addCek('dataArsipAkun ter-load', 'ok',
                    window.dataArsipAkun.length + ' akun diarsipkan');
            } else {
                _addCek('dataArsipAkun ter-load', 'warning', 'Bukan array');
            }

            // ── 5. Storage size < limit ──
            var size = window.csHitungSizeStorage();
            if (size.MB < window.CS_LIMIT.MAX_STORAGE_MB) {
                _addCek('Storage size', 'ok',
                    size.KB + ' KB (limit ' + (window.CS_LIMIT.MAX_STORAGE_MB * 1024) + ' KB)');
            } else {
                _addCek('Storage size', 'warning',
                    'Hampir penuh: ' + size.KB + ' KB');
            }

            // ── 6. Auto-backup aktif ──
            if (window.CS_FLAG.AUTO_BACKUP) {
                _addCek('Auto-backup aktif', 'ok', 'Backup otomatis saat save');
            } else {
                _addCek('Auto-backup aktif', 'warning', 'Auto-backup nonaktif');
            }

            // ── 7. Total key R2C ──
            var totalKeyR2C = 0;
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && (k.indexOf('r2c_') === 0 ||
                          k.indexOf('data') === 0 ||
                          k.indexOf('profil_') === 0)) {
                    totalKeyR2C++;
                }
            }
            _addCek('Total key R2C', 'ok', totalKeyR2C + ' key terdaftar');

            // ── 8. CS_KEY punya DATA_ARSIP_AKUN ──
            if (window.CS_KEY.DATA_ARSIP_AKUN) {
                _addCek('CS_KEY.DATA_ARSIP_AKUN', 'ok', window.CS_KEY.DATA_ARSIP_AKUN);
            } else {
                _addCek('CS_KEY.DATA_ARSIP_AKUN', 'warning', 'Belum ada');
            }

            // ── 9. CS_KEY punya DATA_KASIR ──
            if (window.CS_KEY.DATA_KASIR) {
                _addCek('CS_KEY.DATA_KASIR', 'ok', window.CS_KEY.DATA_KASIR);
            } else {
                _addCek('CS_KEY.DATA_KASIR', 'warning', 'Belum ada');
            }

            // ── 10. CS1 v4.2 sinkron ──
            if (window._coreSystem1DoneV4_2) {
                _addCek('CS1 v4.2 sinkron', 'ok', 'Guard _coreSystem1DoneV4_2');
            } else {
                _addCek('CS1 v4.2 sinkron', 'warning', 'CS1 belum v4.2');
            }
        } catch (e) {
            hasil.ok = false;
            hasil.detail.push({ cek: 'exception', status: 'error', pesan: e.message });
        }

        return hasil;
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.12a] — csBersihkanStorageAman
    // ═══════════════════════════════════════════════════════════
    // Bersihkan storage dengan backup otomatis dulu.
    // ═══════════════════════════════════════════════════════════
    window.csBersihkanStorageAman = function(opts) {
        opts = opts || {};
        try {
            // ── Backup dulu ──
            var backup = {
                timestamp: window.csNow ? window.csNow() : new Date().toISOString(),
                dataLoginUser:         window.dataLoginUser || [],
                dataAkunAktif:         window.dataAkunAktif || [],
                dataKasir:             window.dataKasir || [],
                dataArsipAkun:         window.dataArsipAkun || [],
                dataPengajuanBukaAkun: window.dataPengajuanBukaAkun || [],
                dataVerifikasiDokumen: window.dataVerifikasiDokumen || []
            };
            try {
                localStorage.setItem('r2c_backup_bersih_' + Date.now(),
                    JSON.stringify(backup).substring(0, 100000));
            } catch (e) {}

            // ── Hapus key tertentu ──
            var hapus = 0;
            if (Array.isArray(opts.target)) {
                opts.target.forEach(function(k) {
                    try { localStorage.removeItem(k); hapus++; } catch (e) {}
                });
            } else {
                // Default: hapus backup lama saja
                Object.keys(localStorage).forEach(function(k) {
                    if (k.indexOf('backup_') === 0 ||
                        k.indexOf('r2c_backup_') === 0) {
                        try { localStorage.removeItem(k); hapus++; } catch (e) {}
                    }
                });
            }

            return { sukses: true, hapus: hapus };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.12b] — Alias kompatibilitas
    // ═══════════════════════════════════════════════════════════
    window.hfLoadJSON   = window.csLoadJSON;
    window.hfSaveJSON   = window.csSaveJSON;
    window.hfRemoveJSON = window.csRemoveJSON;

    // ═══════════════════════════════════════════════════════════
    // [CS2.12c] — Helper: csCekKeyStorage, csListKeyR2C, csHapusKeyR2C
    // ═══════════════════════════════════════════════════════════
    window.csCekKeyStorage = function(key) {
        try {
            return localStorage.getItem(key) !== null;
        } catch (e) {
            return false;
        }
    };

    window.csListKeyR2C = function() {
        try {
            var hasil = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && (k.indexOf('r2c_') === 0 ||
                          k.indexOf('data') === 0 ||
                          k.indexOf('profil_') === 0 ||
                          k.indexOf('mpp_') === 0 ||
                          k.indexOf('md_') === 0)) {
                    hasil.push(k);
                }
            }
            return hasil.sort();
        } catch (e) {
            return [];
        }
    };

    window.csHapusKeyR2C = function() {
        try {
            var list = window.csListKeyR2C();
            var hapus = 0;
            list.forEach(function(k) {
                try { localStorage.removeItem(k); hapus++; } catch (e) {}
            });
            return { sukses: true, dihapus: hapus };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.12d] — DEBUG (A5) — v4.0
    // ═══════════════════════════════════════════════════════════
    window.debugCS2 = function() {
        var info = {
            blok: 'CS2',
            versi: '4.0-R2COIN',
            guard: {
                v4: window._coreSystem2DoneV4,

                v2: window._coreSystem2DoneV2,

                alias: window._coreSystem2Done
            },
            storage: window.csHitungSizeStorage(),
            limit: window.CS_LIMIT.MAX_STORAGE_MB + ' MB',
            autoBackup: window.CS_FLAG.AUTO_BACKUP,
            emergencyMode: window.CS_FLAG.EMERGENCY,
            totalKeyR2C: window.csListKeyR2C().length,
            konsistensi32: window.csCekKonsistensiStorage32(),
            dataAktif: {
                dataLoginUser:  Array.isArray(window.dataLoginUser)  ? window.dataLoginUser.length  : 0,
                dataAkunAktif:  Array.isArray(window.dataAkunAktif)  ? window.dataAkunAktif.length  : 0,
                dataKasir:      Array.isArray(window.dataKasir)      ? window.dataKasir.length      : 0,
                dataArsipAkun:  Array.isArray(window.dataArsipAkun)  ? window.dataArsipAkun.length  : 0,
                dataPengajuan:  Array.isArray(window.dataPengajuanBukaAkun)  ? window.dataPengajuanBukaAkun.length  : 0,
                dataVerifikasi: Array.isArray(window.dataVerifikasiDokumen)  ? window.dataVerifikasiDokumen.length  : 0
            },
            fungsi: {
                csLoadJSON:                 typeof window.csLoadJSON,
                csSaveJSON:                 typeof window.csSaveJSON,
                csRemoveJSON:               typeof window.csRemoveJSON,
                csEmergencyCleanup:         typeof window.csEmergencyCleanup,
                csHitungSizeStorage:        typeof window.csHitungSizeStorage,
                simpanDataKeLocalStorage:   typeof window.simpanDataKeLocalStorage,
                loadDataDariLocalStorage:   typeof window.loadDataDariLocalStorage,
                csMigrasiKasirOwnerId:      typeof window.csMigrasiKasirOwnerId,
                csLoadArsip:                typeof window.csLoadArsip,
                csSaveArsip:                typeof window.csSaveArsip,
                csLoadKasir:                typeof window.csLoadKasir,
                csSaveKasir:                typeof window.csSaveKasir,
                csCekKonsistensiStorage32:  typeof window.csCekKonsistensiStorage32,
                csBersihkanStorageAman:     typeof window.csBersihkanStorageAman,
                csCekKeyStorage:            typeof window.csCekKeyStorage,
                csListKeyR2C:               typeof window.csListKeyR2C,
                csHapusKeyR2C:              typeof window.csHapusKeyR2C,
                hfLoadJSON:                 typeof window.hfLoadJSON,
                hfSaveJSON:                 typeof window.hfSaveJSON,
                hfRemoveJSON:               typeof window.hfRemoveJSON
            }
        };
        console.log('🔍 debugCS2 v4.0-R2COIN:', info);
        return info;
    };

    // ═══════════════════════════════════════════════════════════
    // [CS2.12e] — AUTO-REGISTRY KE 3 REGISTRY
    // ═══════════════════════════════════════════════════════════
    setTimeout(function() {
        try {
            if (typeof window.cpUpdateBlok === 'function') {
                window.cpUpdateBlok('CS2', {
                    status: 'Selesai',
                    tanggal: new Date().toISOString().substring(0, 10),
                    nama: 'Storage Engine v4.0'
                });
            }
            if (typeof window.cpTambahRiwayat === 'function') {
                var ada = (window.CP_RIWAYAT || []).some(function(r) {
                    return r && r.blok === 'CS2';
                });
                if (!ada) {
                    window.cpTambahRiwayat({
                        blok: 'CS2',
                        nama: 'Storage Engine v4.0',
                        keterangan: 'csLoadJSON · csSaveJSON · csRemoveJSON · ' +
                                    'csEmergencyCleanup · csHitungSizeStorage · ' +
                                    'simpan/load 19 key · csMigrasiKasirOwnerId · ' +
                                    'csCekKonsistensiStorage32 (10 titik)'
                    });
                }
            }
            if (typeof window.cpUpdateFungsi === 'function') {
                window.cpUpdateFungsi('cs', {
                    nama: 'Core System (L1)',
                    status: 'Selesai',
                    jumlah: '~250'
                });
            }
        } catch (e) {
            console.warn('CS2 auto-registry error:', e.message);
        }
    }, 1000);

    // ═══════════════════════════════════════════════════════════
    // [CS2.12f] — LOG TERPASANG (A5) — v4.0
    // ═══════════════════════════════════════════════════════════
    var _stat = window.csHitungSizeStorage();
    var _konsis = window.csCekKonsistensiStorage32();

    console.log('%c🇮🇩 BLOK CS2 v4.0 — STORAGE ENGINE terpasang.',
        'background:linear-gradient(90deg,#DC3545 0%,#DC3545 50%,#FFFFFF 50%,#FFFFFF 100%);' +
        'color:#000;padding:4px 8px;font-weight:bold;border:2px solid #DC3545;');
    console.log('   📤 Exported:');
    console.log('      • csLoadJSON, csSaveJSON, csRemoveJSON');
    console.log('      • hfLoadJSON, hfSaveJSON, hfRemoveJSON (alias)');
    console.log('   💾 Auto-backup  : ' + (window.CS_FLAG.AUTO_BACKUP ? 'Aktif' : 'Nonaktif'));
    console.log('   📊 Storage      : ' + _stat.KB + ' KB / ' +
                (window.CS_LIMIT.MAX_STORAGE_MB * 1024) + ' KB');
    console.log('   🔑 Total key R2C: ' + window.csListKeyR2C().length);
    console.log('   🎯 Konsistensi  : ' + (_konsis.ok ? '✅ ' : '⚠️ ') +
                _konsis.totalCek + ' cek · ' + _konsis.totalWarning + ' warning');
    console.log('');
    console.log('   📦 19 Key Storage:');
    console.log('      • dataLoginUser, dataAkunAktif, dataKasir, dataArsipAkun');
    console.log('      • dataWilayah, dataPengajuanBukaAkun, dataVerifikasiDokumen');
    console.log('      • dataLogAuditSA, dataHistoriAktivitas');
    console.log('      • dataRekening, dataTopUpHistory, dataWithdrawHistory');
    console.log('      • dataOrder, dataProduk, dataKategoriProduk');
    console.log('      • dataNotifikasi, dataChat, dataKoleksiGif, dataMediaIndex');
    console.log('');
    console.log('   ⭐ v4.0 FINAL:');
    console.log('      • Guard 3 lapis: _coreSystem2DoneV4 → V3 → V2 → V1');
    console.log('      • Dep check: CS1 v4.2 (fallback v4/v3)');
    console.log('      • simpan/load: 19 key (+dataKasir +dataArsipAkun)');
    console.log('      • +csMigrasiKasirOwnerId() — auto-fix kasir tanpa idOwner');
    console.log('      • +csLoadArsip() + csSaveArsip() — soft delete');
    console.log('      • +csLoadKasir() + csSaveKasir() — 6 varian kasir');
    console.log('      • +csBersihkanStorageAman() — backup dulu sebelum hapus');
    console.log('      • +csCekKonsistensiStorage32() — 10 titik cek');
    console.log('   🔍 Debug: debugCS2()');
})();
</script>

<!-- ═══ Guard: _coreSystem3DoneV4 (UTAMA) ═════════════════════ -->
<!-- ═══        + alias _coreSystem3DoneV3 + V2 + V1 ═══════════ -->
<!-- ═══ Versi: 4.0 — R2COIN Merah Putih (32 Role Session) ═════ -->
<!-- ═══ Aturan: A3, A5, A21—A25, A32, A33, A34, A35, A36, A40 -->
<!-- ═══ Isi: 12 modul [CS3.1]—[CS3.12] ═══════════════════════ -->
<!-- ═══   [CS3.1]   Getter user aktif (8 fungsi) ═════════════ -->
<!-- ═══   [CS3.2]   Cek role user aktif (5 fungsi) ═══════════ -->
<!-- ═══   [CS3.3]   13 flag role spesifik ════════════════════ -->
<!-- ═══   [CS3.4]   Setter: setUserAktif + clearUserAktif ════ -->
<!-- ═══   [CS3.5]   Auto-logout timer (10 menit) ═════════════ -->
<!-- ═══   [CS3.6]   Heartbeat online (30 detik) ══════════════ -->
<!-- ═══   [CS3.7]   csCekSessionValid (32 role + A40 + A42) ══ -->
<!-- ═══   [CS3.8]   csCekUserOnline + csListUserOnline ═══════ -->
<!-- ═══   [CS3.9]   Kepemilikan & owner (3 fungsi) ═══════════ -->
<!-- ═══   [CS3.10]  csGetKodeRoleOwner + prefix user aktif ═══ -->

<!-- ═══ ⚠️ Peta: PETA_OWNER_KASIR (6) + PETA_INDUK_KOPDES (4) -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<script>
(function BLOK_CS3_SESSION_V4() {
    // ═══════════════════════════════════════════════════════════
    // [A32] — GUARD FLAG UNIK + ALIAS BACKWARD COMPAT
    // ═══════════════════════════════════════════════════════════
    if (window._coreSystem3DoneV4) {
        console.log('ℹ️ CS3 v' + (window._coreSystem3Versi || '?') + ' sudah terpasang.');
        return;
    }

    var cs2Ok = window._coreSystem2DoneV4 || window._coreSystem2DoneV3;
    if (!cs2Ok) {
        console.warn('⚠️ CS2 belum terpasang. CS3 v4.0 ditunda.');
        return;
    }

    window._coreSystem3DoneV4 = true;
    window._coreSystem3DoneV3 = true;
    window._coreSystem3DoneV2 = true;
    window._coreSystem3DoneV1 = true;
    window._coreSystem3Done   = true;
    window._coreSystem3Versi  = '4.0';

    // ═══════════════════════════════════════════════════════════
    // [CS3.0] — VARIABEL INTERNAL + PETA
    // ═══════════════════════════════════════════════════════════
    var _autoLogoutTimer = null;
    var _heartbeatTimer  = null;
    var _lastActivity    = Date.now();

    // ── Peta Owner Kasir (6 varian) ──
    var PETA_OWNER_KASIR = {
        'KSR_TK':   'TK',
        'KSR_PP':   'PP',
        'KSR_PM':   'PM',
        'KSR_DST':  'DST',
        'KSR_GR':   'GR',
        'KSR_KDMP': 'KDMP_DESA'
    };

    // ── Peta Induk Kopdes (4 tingkat A40) ──
    var PETA_INDUK_KOPDES = {
        'KDMP_PUSAT': null,
        'KDMP_KAB':   'KDMP_PUSAT',
        'KDMP_KEC':   'KDMP_KAB',
        'KDMP_DESA':  'KDMP_KEC'
    };

    // ═══════════════════════════════════════════════════════════
    // [CS3.1] — GETTER USER AKTIF (8 fungsi)
    // ═══════════════════════════════════════════════════════════
    window.getUserAktif = function() {
        try {
            if (typeof window.userAktif !== 'undefined' && window.userAktif) {
                return window.userAktif;
            }
            return window.csLoadJSON(window.CS_KEY.USER_AKTIF, null);
        } catch (e) {
            console.error('getUserAktif error:', e);
            return null;
        }
    };

    window.getDataIdUser = function(idUser) {
        try {
            if (idUser !== undefined && idUser !== null && idUser !== '') {
                if (typeof window.gidGetUserById === 'function') {
                    var found = window.gidGetUserById(idUser);
                    return found ? (found.idUser || found.id || idUser) : null;
                }
                var list = window.csLoadJSON('dataLoginUser', []);
                if (Array.isArray(list)) {
                    for (var i = 0; i < list.length; i++) {
                        var u = list[i];
                        if (u && (u.idUser === idUser || u.id === idUser)) {
                            return u.idUser || u.id;
                        }
                    }
                }
                return null;
            }
            var ua = window.getUserAktif();
            return ua ? (ua.idUser || ua.id || null) : null;
        } catch (e) {
            console.error('getDataIdUser error:', e);
            return null;
        }
    };

    window.getIdUserAktif    = function() { return window.getDataIdUser(); };
    window.getRoleUserAktif  = function() {
        var u = window.getUserAktif(); return u ? (u.role || null) : null;
    };
    window.getKodeRoleUserAktif = function() {
        var u = window.getUserAktif(); return u ? (u.kodeRole || null) : null;
    };
    window.getNamaUserAktif = function() {
        var u = window.getUserAktif();
        if (!u) return 'Anonim';
        return u.nama || u.namaLengkap || u.username || 'User';
    };
    window.getUsernameUserAktif = function() {
        var u = window.getUserAktif(); return u ? (u.username || null) : null;
    };
    window.isLogin = function() { return !!window.getDataIdUser(); };

    // ═══════════════════════════════════════════════════════════
    // [CS3.2] — CEK ROLE USER AKTIF (5 fungsi)
    // ═══════════════════════════════════════════════════════════
    window.csCekRoleUserAktif = function() {
        try {
            var kodeRole = window.getKodeRoleUserAktif();
            if (!kodeRole) return null;
            return window.csGetRoleInfo ? window.csGetRoleInfo(kodeRole) : null;
        } catch (e) { return null; }
    };

    window.csIsRole = function(kodeRoleTarget) {
        return window.getKodeRoleUserAktif() === kodeRoleTarget;
    };

    window.csIsKategoriRole = function(kategoriTarget) {
        try {
            var info = window.csCekRoleUserAktif();
            return info ? info.kategori === kategoriTarget : false;
        } catch (e) { return false; }
    };

    window.csIsTipeRole = function(tipeTarget) {
        try {
            var info = window.csCekRoleUserAktif();
            return info ? info.tipe === tipeTarget : false;
        } catch (e) { return false; }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS3.3] — 13 FLAG ROLE SPESIFIK
    // ═══════════════════════════════════════════════════════════
    window.csIsSA      = function() { return window.csIsRole('SA'); };
    window.csIsSA_STAF = function() { return window.csIsRole('SA_STAF'); };
    window.csIsMKT     = function() { return window.csIsRole('MKT'); };
    window.csIsTGH     = function() { return window.csIsRole('TGH'); };
    window.csIsCS      = function() { return window.csIsRole('CS'); };
    window.csIsEO      = function() { return window.csIsRole('EO'); };
    window.csIsSOT     = function() { return window.csIsRole('SOT'); };
    window.csIsSOO     = function() { return window.csIsRole('SOO'); };
    window.csIsORG     = function() { return window.csIsRole('ORG'); };
    window.csIsIND     = function() { return window.csIsRole('IND'); };
    window.csIsCT      = function() { return window.csIsRole('CT'); };
    window.csIsFIN     = function() { return window.csIsRole('FIN'); };

    window.csIsKasir = function() {
        try {
            var kr = window.getKodeRoleUserAktif();
            return kr ? kr.indexOf('KSR') === 0 : false;
        } catch (e) { return false; }
    };

    window.csIsKopdes = function() {
        try {
            var kr = window.getKodeRoleUserAktif();
            if (!kr) return false;
            return kr.indexOf('KDMP_') === 0 || kr === 'KSR_KDMP';
        } catch (e) { return false; }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS3.4] — SETTER: setUserAktif + clearUserAktif
    // ═══════════════════════════════════════════════════════════
    window.setUserAktif = function(user, opts) {
        opts = opts || {};
        try {
            if (!user) return { sukses: false, pesan: 'User kosong' };

            // Validasi kodeRole terhadap 32 role (A36)
            if (user.kodeRole && window.csCekRole && !window.csCekRole(user.kodeRole)) {
                console.warn('⚠️ setUserAktif: kodeRole tidak dikenal:', user.kodeRole);
            }

            window.userAktif = user;
            window.csSaveJSON(window.CS_KEY.USER_AKTIF, user);

            // Update UI elemen (kalau ada)
            try {
                var elNama = document.getElementById('namaUserDisplay');
                if (elNama) elNama.textContent = user.nama || user.username || 'User';
                var elOffNama = document.getElementById('offcanvasNamaUser');
                if (elOffNama) elOffNama.textContent = user.nama || 'User';
                var elOffRole = document.getElementById('offcanvasRoleUser');
                if (elOffRole) elOffRole.textContent = user.role || 'Role';
            } catch (e) {}

            // Simpan fingerprint
            try {
                window.csSaveJSON(window.CS_KEY.FINGERPRINT, {
                    idUser: user.idUser || user.id,
                    role: user.role,
                    kodeRole: user.kodeRole,
                    timestamp: Date.now()
                });
            } catch (e) {}

            // Emit event
            try {
                window.dispatchEvent(new CustomEvent('r2coin:user-login', {
                    detail: { user: user }
                }));
            } catch (e) {}

            return { sukses: true };
        } catch (e) {
            console.error('setUserAktif error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    window.clearUserAktif = function() {
        try {
            window.userAktif = null;
            window.csRemoveJSON(window.CS_KEY.USER_AKTIF);
            window.csRemoveJSON(window.CS_KEY.SESSION);
            window.csRemoveJSON(window.CS_KEY.FINGERPRINT);

            try {
                window.dispatchEvent(new CustomEvent('r2coin:user-logout', {}));
            } catch (e) {}

            return { sukses: true };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS3.5] — AUTO-LOGOUT TIMER (10 menit)
    // ═══════════════════════════════════════════════════════════
    window.csResetTimerAktivitas = function() { _lastActivity = Date.now(); };

    window.csMulaiAutoLogout = function() {
        try {
            if (_autoLogoutTimer) clearInterval(_autoLogoutTimer);
            ['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(function(evt) {
                document.addEventListener(evt, window.csResetTimerAktivitas, { passive: true });
            });
            _autoLogoutTimer = setInterval(function() {
                if (!window.isLogin()) return;
                var idle = Date.now() - _lastActivity;
                if (idle >= window.CS_LIMIT.SESSION_TIMEOUT_MS) {
                    console.warn('⏱️ Auto-logout: idle ' +
                        Math.round(idle / 60000) + ' menit');
                    if (typeof window.prosesLogout === 'function') {
                        window.prosesLogout(true);
                    }
                }
            }, 60 * 1000);
            console.log('⏱️ Auto-logout dimulai (' +
                window.CS_LIMIT.AUTO_LOGOUT_MENIT + ' menit)');
            return { sukses: true };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.csStopAutoLogout = function() {
        if (_autoLogoutTimer) {
            clearInterval(_autoLogoutTimer);
            _autoLogoutTimer = null;
        }
        return { sukses: true };
    };

    // ═══════════════════════════════════════════════════════════
    // [CS3.6] — HEARTBEAT ONLINE (30 detik)
    // ═══════════════════════════════════════════════════════════
    window.csMulaiHeartbeat = function() {
        try {
            if (_heartbeatTimer) clearInterval(_heartbeatTimer);
            var idUser = window.getDataIdUser();
            if (!idUser) return { sukses: false, pesan: 'Belum login' };

            _heartbeatTimer = setInterval(function() {
                try {
                    var key = (window.CS_KEY.ONLINE_PREFIX || 'r2c_online_') + idUser;
                    localStorage.setItem(key, JSON.stringify({
                        idUser: idUser,
                        nama: window.getNamaUserAktif(),
                        role: window.getRoleUserAktif(),
                        kodeRole: window.getKodeRoleUserAktif(),
                        timestamp: Date.now()
                    }));
                } catch (e) {}
            }, window.CS_LIMIT.HEARTBEAT_DETIK * 1000);

            console.log('💓 Heartbeat online dimulai untuk: ' + idUser);
            return { sukses: true };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.csStopHeartbeat = function() {
        if (_heartbeatTimer) clearInterval(_heartbeatTimer);
        _heartbeatTimer = null;
        return { sukses: true };
    };

    // ═══════════════════════════════════════════════════════════
    // [CS3.7] — csCekSessionValid (32 role + A40 + A42)
    // ═══════════════════════════════════════════════════════════
    window.csCekSessionValid = function() {
        try {
            var u = window.getUserAktif();
            if (!u) return { valid: false, alasan: 'Tidak ada user aktif' };
            if (!u.idUser && !u.id) return { valid: false, alasan: 'ID user kosong' };
            if (!u.role) return { valid: false, alasan: 'Role kosong' };
            if (!u.kodeRole) return { valid: false, alasan: 'Kode role kosong' };

            // Cek kodeRole valid di CS_ROLE_MAP (32 role)
            if (window.CS_ROLE_MAP && !window.CS_ROLE_MAP[u.kodeRole]) {
                return { valid: false, alasan: 'Kode role tidak dikenal: ' + u.kodeRole };
            }

            // Cek idInduk untuk Kopdes (A40)
            if (u.kodeRole && u.kodeRole.indexOf('KDMP_') === 0) {
                if (u.kodeRole !== 'KDMP_PUSAT' && !u.idInduk) {
                    return { valid: false, alasan: 'Kopdes ' + u.kodeRole + ' wajib punya idInduk' };
                }
            }

            // Cek idOwner untuk Kasir (A42)
            if (u.kodeRole && u.kodeRole.indexOf('KSR_') === 0) {
                if (!u.idOwner && !u.ownerId && !u.idInduk) {
                    return { valid: false, alasan: 'Kasir ' + u.kodeRole + ' wajib punya idOwner' };
                }
            }

            return { valid: true, user: u };
        } catch (e) {
            return { valid: false, alasan: e.message };

            if (abs < 1000000)    return sign + 'Rp ' + (abs / 1000).toFixed(1).replace('.0', '') + 'K';
            if (abs < 1000000000) return sign + 'Rp ' + (abs / 1000000).toFixed(1).replace('.0', '') + 'JT';
            return sign + 'Rp ' + (abs / 1000000000).toFixed(1).replace('.0', '') + 'M';
        } catch (e) { return 'Rp 0'; }

    if (typeof window.formatRupiahProdukGlobal !== 'function') {

    window.csHitungJarak = function(lat1, lng1, lat2, lng2) {

            var a1 = parseFloat(lat1), b1 = parseFloat(lng1);
            var a2 = parseFloat(lat2), b2 = parseFloat(lng2);
            if ([a1, b1, a2, b2].some(isNaN)) return null;
            var R = 6371;
            var dLat = (a2 - a1) * Math.PI / 180;
            var dLng = (b2 - b1) * Math.PI / 180;
            var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(a1 * Math.PI / 180) * Math.cos(a2 * Math.PI / 180) *
                    Math.sin(dLng / 2) * Math.sin(dLng / 2);

            if (k < 1) angka = Math.round(k * 1000) + ' m';
            else if (k < 100) angka = k.toFixed(1).replace('.', ',') + ' km';

            if (opts.pendek) {

    // ═══════════════════════════════════════════════════════════
    window.generateKodeUnik = function(roleKode) {
        try {
            var kode = String(roleKode || 'XX').toUpperCase().trim();

            // Validasi kodeRole terhadap 32 role
            if (window.CS_ROLE_MAP && !window.CS_ROLE_MAP[kode]) {
                var alias = window.csAliasRoleLama ? window.csAliasRoleLama(kode) : null;
                if (alias && window.CS_ROLE_MAP[alias]) {
                    kode = alias;
                } else {
                    console.warn('⚠️ generateKodeUnik: kodeRole tidak dikenal:', kode);
                }
            }

            var prefix = _getPrefix(kode);
            var existingIds = _ambilIdExisting();

            // Loop max 50× cari ID yang belum dipakai
            var idBaru = null;
            for (var i = 0; i < 50; i++) {
                var kandidat = 'ID_R2C_' + prefix + '-' + _randomDigit(6);
                if (!existingIds[kandidat]) {
                    idBaru = kandidat;
                    break;
                }
            }
            if (!idBaru) {
                var fallback = String(Date.now() % 1000000).padStart(6, '0');
                idBaru = 'ID_R2C_' + prefix + '-' + fallback;
            }
            return idBaru;
        } catch (e) {
            console.error('generateKodeUnik error:', e);
            return 'ID_R2C_XX-' + _randomDigit(6);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS5.2] — generateKodeKopdes (4 tingkat A40)
    // ═══════════════════════════════════════════════════════════
    // [A40] — Format khusus Kopdes untuk hierarki:
    //   KDP  = Pusat (kode awal 100)
    //   KDK  = Kabupaten (kode awal 101)
    //   KDKC = Kecamatan (kode awal 102)
    //   KDD  = Desa (kode awal 103)
    // Format: ID_R2C_{PREFIX}-{KODE_WILAYAH}-{6 digit}
    // ═══════════════════════════════════════════════════════════
    window.generateKodeKopdes = function(level, kodeWilayah) {
        try {
            var validLevels = ['KDMP_PUSAT', 'KDMP_KAB', 'KDMP_KEC', 'KDMP_DESA'];
            if (validLevels.indexOf(level) === -1) {
                console.warn('⚠️ generateKodeKopdes: level tidak valid:', level);
                level = 'KDMP_PUSAT';
            }
            var prefix = _getPrefix(level);
            var wil = String(kodeWilayah || 'NAS').toUpperCase().substring(0, 4);
            var existingIds = _ambilIdExisting();

            var idBaru = null;
            for (var i = 0; i < 50; i++) {
                var kandidat = 'ID_R2C_' + prefix + '-' + wil + '-' + _randomDigit(6);
                if (!existingIds[kandidat]) {
                    idBaru = kandidat;
                    break;
                }
            }
            if (!idBaru) {
                var fallback = String(Date.now() % 1000000).padStart(6, '0');
                idBaru = 'ID_R2C_' + prefix + '-' + wil + '-' + fallback;
            }
            return idBaru;
        } catch (e) {
            console.error('generateKodeKopdes error:', e);
            return 'ID_R2C_KDP-NAS-' + _randomDigit(6);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS5.3] — csGenerateIdKopdes4Tingkat
    // ═══════════════════════════════════════════════════════════
    window.csGenerateIdKopdes4Tingkat = function(kodeRole, kodeWilayah) {
        try {
            var validRole = ['KDMP_PUSAT', 'KDMP_KAB', 'KDMP_KEC', 'KDMP_DESA'];
            if (validRole.indexOf(kodeRole) === -1) {
                return { sukses: false, pesan: 'Kode role bukan Kopdes: ' + kodeRole };
            }
            var id = window.generateKodeKopdes(kodeRole, kodeWilayah);
            var level = {
                'KDMP_PUSAT': 1, 'KDMP_KAB': 2, 'KDMP_KEC': 3, 'KDMP_DESA': 4
            }[kodeRole];
            return {
                sukses: true,
                id: id,
                kodeRole: kodeRole,
                level: level,
                prefix: _getPrefix(kodeRole),
                wilayah: kodeWilayah || 'NAS'
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.csGenerateKodeToko = function(kodeRole, wilayah) {
        try {
            var r = String(kodeRole || 'TK').toUpperCase();
            var w = String(wilayah || 'BJR').toUpperCase().substring(0, 3);

    window.csGenerateKodeKoleksi = function(prefix) {

    // ═══════════════════════════════════════════════════════════
    // [CS5.7] — csValidasiFormatId
    // ═══════════════════════════════════════════════════════════
    window.csValidasiFormatId = function(id) {
        try {
            if (!id) return { valid: false, pesan: 'ID kosong' };
            var s = String(id);

            // Format R2C (ID_R2C_...)
            if (s.indexOf('ID_R2C_') === 0) {
                // Cek Kopdes (4 bagian)
                var mKopdes = s.match(/^ID_R2C_([A-Z_]+)-([A-Z]{2,4})-([0-9]{6})$/);
                if (mKopdes) {
                    return {
                        valid: true,
                        prefix: mKopdes[1],
                        wilayah: mKopdes[2],
                        angka: mKopdes[3],
                        tipe: 'kopdes'
                    };
                }
                // Cek biasa (3 bagian)
                var mBiasa = s.match(/^ID_R2C_([A-Z_]+)-([0-9]{6})$/);
                if (mBiasa) {
                    return {
                        valid: true,
                        prefix: mBiasa[1],
                        angka: mBiasa[2],
                        tipe: 'user'
                    };
                }
                return { valid: false, pesan: 'Format ID_R2C tidak valid' };
            }

            // Format lama (backward compat)
            if (s.indexOf('ID_TK2R_') === 0) {
                var mOld = s.match(/^ID_TK2R_([A-Z_]+)-([A-Z0-9]+)$/);
                if (mOld) {
                    return { valid: true, prefix: mOld[1], bagian: mOld[2], tipe: 'user-lama' };
                }
            }

            // Format entitas (XXX-YYY-ZZZ)
            var mEnt = s.match(/^([A-Z]+)-([A-Z0-9]+)-([A-Z0-9]+)$/);
            if (mEnt) {
                return { valid: true, prefix: mEnt[1], ts: mEnt[2], rnd: mEnt[3], tipe: 'entitas' };
            }
            return { valid: false, pesan: 'Format ID tidak dikenal' };
        } catch (e) {
            return { valid: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS5.8] — csEkstrakPrefixId + csDeteksiKodeRoleDariId
    // ═══════════════════════════════════════════════════════════
    window.csEkstrakPrefixId = function(id) {
        try {
            var v = window.csValidasiFormatId(id);
            return v.valid ? v.prefix : null;
        } catch (e) { return null; }
    };

    window.csDeteksiKodeRoleDariId = function(id) {
        try {
            var prefix = window.csEkstrakPrefixId(id);
            if (!prefix || !window.CS_PREFIX_MAP) return null;

            var kodeRole = null;
            Object.keys(window.CS_PREFIX_MAP).forEach(function(k) {
                if (window.CS_PREFIX_MAP[k] === prefix && !kodeRole) {
                    if (window.CS_ROLE_MAP && window.CS_ROLE_MAP[k]) {
                        kodeRole = k;
                    } else if (!kodeRole) {
                        kodeRole = k;
                    }
                }
            });
            return kodeRole;
        } catch (e) { return null; }
    };

    // ═══════════════════════════════════════════════════════════
    // [CS5.9] — csDeteksiLevelKopdesDariId
    // ═══════════════════════════════════════════════════════════
    window.csDeteksiLevelKopdesDariId = function(id) {
        try {
            var prefix = window.csEkstrakPrefixId(id);
            if (!prefix) return null;
            var map = {
                'KDP':  { kodeRole: 'KDMP_PUSAT', level: 1, nama: 'Pusat' },
                'KDK':  { kodeRole: 'KDMP_KAB',   level: 2, nama: 'Kabupaten' },
                'KDKC': { kodeRole: 'KDMP_KEC',   level: 3, nama: 'Kecamatan' },
                'KDD':  { kodeRole: 'KDMP_DESA',  level: 4, nama: 'Desa' }
            };
            return map[prefix] || null;
        } catch (e) { return null; }
    };

    // [CS5.10] — csGenerateIdBatch32Role
    // ═══════════════════════════════════════════════════════════
    window.csGenerateIdBatch = function(roleKode, jumlah) {
        try {
            var n = parseInt(jumlah, 10) || 1;
            if (n > 100) n = 100;
            var hasil = [];
            for (var i = 0; i < n; i++) {
                hasil.push(window.generateKodeUnik(roleKode));
            }
            return hasil;
        } catch (e) { return []; }
    };

    window.csGenerateIdBatch32Role = function(kodeRole, jumlah) {
        try {
            if (window.CS_ROLE_MAP && !window.CS_ROLE_MAP[kodeRole]) {
                return { sukses: false, pesan: 'Kode role tidak valid: ' + kodeRole, list: [] };
            }
            var n = parseInt(jumlah, 10) || 1;
            if (n > 100) n = 100;
            var list = [];
            for (var i = 0; i < n; i++) {
                list.push(window.generateKodeUnik(kodeRole));
            }
            return {
                sukses: true,
                kodeRole: kodeRole,
                jumlah: n,
                prefix: _getPrefix(kodeRole),
                list: list
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, list: [] };
        }
    };

    // ═══════════════════════════════════════════════════════════
    window.csCekPrefixValid = function(kode) {
        try {
            if (window.CS_PREFIX_MAP) {
                return !!window.CS_PREFIX_MAP[String(kode || '').toUpperCase()];
            }
            return false;
        } catch (e) { return false; }
    };

    window.csGetPrefixMap = function() {
        return Object.assign({}, window.CS_PREFIX_MAP || {});
    };

    window.csGenerateIdStaf = function(kodeRole) {
        try {
            var rolePrefix = _getPrefix(kodeRole);
            var existingIds = _ambilIdExisting();
            for (var i = 0; i < 50; i++) {
                var kandidat = 'ID_R2C_STF-' + rolePrefix + '-' + _randomDigit(6);
                if (!existingIds[kandidat]) return kandidat;
            }
            return 'ID_R2C_STF-' + rolePrefix + '-' +
                   String(Date.now() % 1000000).padStart(6, '0');
        } catch (e) {
            return 'ID_R2C_STF-XX-' + _randomDigit(6);
        }
    };

    window.csGenerateIdKasir = function(kodeKasir) {

        } catch (e) {

    window.csStatistikPrefix32 = function() {
        try {
            var map = window.CS_PREFIX_MAP || {};
            var keys = Object.keys(map);
            var unikPrefix = {};
            var perKategori = {};

            keys.forEach(function(k) {
                var p = map[k];
                unikPrefix[p] = (unikPrefix[p] || 0) + 1;
                if (window.CS_ROLE_MAP && window.CS_ROLE_MAP[k]) {
                    var kat = window.CS_ROLE_MAP[k].kategori;
                    perKategori[kat] = (perKategori[kat] || 0) + 1;
                }
            });

            var sample32 = {};
            if (window.CS_ROLE_MAP) {
                Object.keys(window.CS_ROLE_MAP).forEach(function(k) {
                    sample32[k] = _getPrefix(k);
                });
            }

            return {
                totalKodeRole: keys.length,
                totalPrefixUnik: Object.keys(unikPrefix).length,
                perKategori: perKategori,
                sample32: sample32,
                cek32: {
                    adaKSR_TK:   !!map['KSR_TK'],
                    adaKSR_PP:   !!map['KSR_PP'],
                    adaKSR_PM:   !!map['KSR_PM'],
                    adaKSR_DST:  !!map['KSR_DST'],
                    adaKSR_GR:   !!map['KSR_GR'],
                    adaKSR_KDMP: !!map['KSR_KDMP'],
                    adaKDP:      !!map['KDMP_PUSAT'],
                    adaKDK:      !!map['KDMP_KAB'],
                    adaKDKC:     !!map['KDMP_KEC'],
                    adaKDD:      !!map['KDMP_DESA']
                }
            };
        } catch (e) {
            return { totalKodeRole: 0, totalPrefixUnik: 0, perKategori: {}, sample32: {}, cek32: {} };
        }
    };

<script>
(function BLOK_CS6_UIHELPER_V4() {
    // ═══════════════════════════════════════════════════════════
    // [A32] — GUARD FLAG UNIK + ALIAS
    // ═══════════════════════════════════════════════════════════
    if (window._coreSystem6DoneV4) {
        console.log('ℹ️ CS6 v' + (window._coreSystem6Versi || '?') + ' sudah terpasang.');
        return;
    }

    if (!cs5Ok) {
        console.warn('⚠️ CS5 belum terpasang. CS6 v4.0 ditunda.');
        return;
    }
    window._coreSystem6DoneV4 = true;
    window._coreSystem6DoneV3 = true;
    window._coreSystem6DoneV2 = true;
    window._coreSystem6DoneV1 = true;

    // ═══════════════════════════════════════════════════════════
