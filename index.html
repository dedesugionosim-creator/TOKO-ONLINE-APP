<script>
/* ============================================================

// 1. TUTUP MENU
function tutupMenu() {
    try {
        if (typeof bootstrap !== 'undefined' && bootstrap.Offcanvas) {
            var offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasMenu'));
            if (offcanvas) offcanvas.hide();
        }
    } catch (e) {
        var menu = document.getElementById('offcanvasMenu');
        if (menu) menu.classList.remove('show');
    }
}

// 2. GET STATUS ONLINE AKUN
function getStatusOnlineAkun(idAkun) {
    var storedStatus = localStorage.getItem('dataStatusOnline');
    var dataStatusOnline = {};
    if (storedStatus) {
        try { dataStatusOnline = JSON.parse(storedStatus); }
        catch (e) { dataStatusOnline = {}; }
    }
    return dataStatusOnline[idAkun] || 'Online';
}

// 3. GET FOTO PROFIL AKUN
function getFotoProfilAkun(idAkun) {
    var stored = localStorage.getItem('profil_' + idAkun);
    if (stored) {
        try {
            var profil = JSON.parse(stored);
            return profil.fotoUrl || '';
        } catch (e) { return ''; }
    }
    return '';
}

// 4. HITUNG JARAK (KM)
function hitungJarak(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

// 5. FORMAT NOMOR WHATSAPP
function formatNomorWhatsApp(nomor) {
    var clean = nomor.replace(/\D/g, '');
    if (clean.startsWith('0')) clean = '62' + clean.substring(1);
    return clean;
}

// 6. AMBIL SEMUA PRODUK DARI SEMUA TOKO
function getAllProdukDariSemuaToko() {
    var semuaProduk = [];
    var sellerRoles = ['Toko', 'Pedagang Pasar', 'Pedagang Makanan', 'COD Seller', 'Ojek', 'Grosir', 'Distributor'];

    dataAkunAktif.forEach(function(akun) {
        if (!sellerRoles.includes(akun.role)) return;

        var key = '';
        if (akun.role === 'Toko') key = 'dataProdukToko_' + akun.id;
        else if (akun.role === 'Pedagang Pasar') key = 'dataProdukPP_' + akun.id;
        else if (akun.role === 'Pedagang Makanan') key = 'dataProdukPM_' + akun.id;
        else if (akun.role === 'COD Seller') key = 'dataProdukCOD_' + akun.id;
        else if (akun.role === 'Ojek') key = 'dataProdukOJ_' + akun.id;
        else if (akun.role === 'Distributor') key = 'dataProdukDistributor_' + akun.id;
        else if (akun.role === 'Grosir') {
            var keyGrosir = 'dataProdukGrosir_' + akun.id;
            key = localStorage.getItem(keyGrosir) ? keyGrosir : 'dataProdukToko_' + akun.id;
        }

        var stored = localStorage.getItem(key);
        if (stored) {
            try {
                var produkList = JSON.parse(stored);
                produkList.forEach(function(produk) {
                    produk.sellerId = akun.id;
                    produk.sellerNama = akun.nama;
                    produk.sellerRole = akun.role;
                    semuaProduk.push(produk);
                });
            } catch (e) { console.warn('Data produk rusak dari ' + akun.nama); }
        }
    });

    return semuaProduk;
}

// 7. AMBIL SEMUA TRANSAKSI GLOBAL
function getAllTransaksiGlobal() {
    var semuaTransaksi = [];
    var sellerRoles = ['Toko', 'Pedagang Pasar', 'Pedagang Makanan', 'COD Seller', 'Ojek', 'Grosir', 'Distributor'];

    dataAkunAktif.forEach(function(akun) {
        if (!sellerRoles.includes(akun.role)) return;

        var key = 'dataTransaksiOffline_' + akun.id;
        var stored = localStorage.getItem(key);
        if (stored) {
            try {
                var transaksiList = JSON.parse(stored);
                transaksiList.forEach(function(trx) {
                    trx.namaToko = akun.nama;
                    trx.idToko = akun.id;
                    trx.roleToko = akun.role;
                    trx.statusLanggananToko = akun.statusLangganan || 'Free';
                    if (!trx.metodePembayaran) trx.metodePembayaran = 'Tunai';
                    semuaTransaksi.push(trx);
                });
            } catch (e) { console.warn('Data transaksi rusak dari ' + akun.nama); }
        }
    });

    return semuaTransaksi;
}

// 9. RENDER RUNNING TEXT
function renderRunningText() {
    var container = document.getElementById('runningTextContent');
    if (!container) return;
    var aktif = dataRunningText.filter(function(item) { return item.status === 'Aktif'; });
    if (aktif.length === 0) {
        container.textContent = '';
        return;
    }
    var teks = aktif.map(function(item) { return item.teks; }).join(' • ');
    container.textContent = teks;
}

// 10. LOAD INFORMASI (PAPAN INFORMASI)
function loadInformasi() {
    var stored = localStorage.getItem('papanInformasi');
    if (stored) {
        try { dataInformasi = JSON.parse(stored); }
        catch (e) { dataInformasi = []; }
    } else {
        dataInformasi = [];
    }
}

// 11. SAVE INFORMASI
function saveInformasi() {
    localStorage.setItem('papanInformasi', JSON.stringify(dataInformasi));
}

// 12. RENDER INFORMASI
function renderInformasi() {
    var listContainer = document.getElementById('listInformasi');
    if (!listContainer) return;
    if (dataInformasi.length === 0) {
        listContainer.innerHTML = '<div class="text-center text-muted py-4">Belum ada pengumuman.</div>';
        return;
    }
    var html = '';
    dataInformasi.slice().reverse().forEach(function(item, idx) {
        var indexAsli = dataInformasi.length - 1 - idx;
        html += `
            <div class="card mb-2 border-0 shadow-sm bg-light">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <p class="mb-1">${item.isi}</p>
                            <small class="text-muted">Dipublikasikan: ${item.tanggal}</small>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="hapusInformasi(${indexAsli})">
                            <i class="fas fa-trash"></i> Hapus
                        </button>
                    </div>
                </div>
            </div>`;
    });
    listContainer.innerHTML = html;
}

<script>

function updateWaktu() {
    const s = new Date();
    const opt = { weekday:'long', year:'numeric', month:'long', day:'numeric', timeZone:'Asia/Jakarta' };
    const tgl = s.toLocaleDateString('id-ID', opt);
    const jam = s.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'Asia/Jakarta' });
    const elTgl = document.getElementById('tanggalSekarang');

    if (elJam) elJam.textContent = jam + ' WIB';

    if (typeof cekTanggalTagihan === 'function') {
        cekTanggalTagihan();
    }
}

// ============================================================
// 2. SISTEM AUTO-LOGOUT 10 MENIT
// ============================================================

    if (userAktif) { waktuSisa = WAKTU_LOGOUT_OTOMATIS; }

document.addEventListener('mousemove', resetTimerLogout);
document.addEventListener('mousedown', resetTimerLogout);
document.addEventListener('keydown', resetTimerLogout);
document.addEventListener('touchstart', resetTimerLogout);

function mulaiIntervalLogout() {
    if (intervalTimer) clearInterval(intervalTimer);
    intervalTimer = setInterval(function() {
        if (userAktif) {
            waktuSisa--;
            if (waktuSisa <= 0) { prosesLogoutOtomatis(); }

    if (userAktif) {
        alert('Sesi Anda berakhir karena tidak ada aktivitas selama 10 menit. Silakan login kembali.');

<!--- ===== BLOK 9.2.5.3 – DEVICE MANAGER (PENGELOLAAN PERANGKAT) ===== --->
<script>
// CATATAN: Fungsi-fungsi ini mungkin dipakai di modul lain. Jika iya, pindahkan ke global.
// ============================================================
// 1. FUNGSI GENERATE & GET DEVICE ID
// ============================================================
function generateDeviceId() {
    return 'DEV-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
}

function getDeviceId() {
    var deviceId = localStorage.getItem('deviceId');
    if (!deviceId) {
        deviceId = generateDeviceId();
        localStorage.setItem('deviceId', deviceId);
    }
    return deviceId;
}

// ============================================================
// 2. LOAD & SAVE TRUSTED DEVICES
// ============================================================
function loadTrustedDevices() {
    var stored = localStorage.getItem('trustedDevices');
    if (stored) {
        try { return JSON.parse(stored); }
        catch(e) { return { masterDeviceId: null, devices: [] }; }
    }
    return { masterDeviceId: null, devices: [] };
}

function saveTrustedDevices(data) {
    localStorage.setItem('trustedDevices', JSON.stringify(data));
}

// ============================================================
// 3. CEK APAKAH PERANGKAT SUDAH DIPERCAYA
// ============================================================
function isDeviceTrusted() {
    var deviceId = getDeviceId();
    var data = loadTrustedDevices();
    if (!data.masterDeviceId) {
        data.masterDeviceId = deviceId;
        data.devices.push({ deviceId: deviceId, nama: 'Master Device', ip: '-', lastLogin: new Date().toISOString(), approved: true, isMaster: true });
        saveTrustedDevices(data);
        return true;
    }
    var device = data.devices.find(function(d) { return d.deviceId === deviceId; });
    return device && device.approved;
}

// ============================================================
// 4. TAMBAH PERANGKAT BARU
// ============================================================
function addTrustedDevice(deviceId, nama, ip) {
    var data = loadTrustedDevices();
    if (!data.devices.find(function(d) { return d.deviceId === deviceId; })) {
        data.devices.push({ deviceId: deviceId, nama: nama || 'Perangkat Baru', ip: ip || '-', lastLogin: new Date().toISOString(), approved: true, isMaster: false });
        saveTrustedDevices(data);
    }
}

// ============================================================
// 5. HAPUS PERANGKAT
// ============================================================
function removeTrustedDevice(deviceId) {
    var data = loadTrustedDevices();
    data.devices = data.devices.filter(function(d) { return d.deviceId !== deviceId; });
    if (data.masterDeviceId === deviceId) {
        data.masterDeviceId = data.devices.length > 0 ? data.devices[0].deviceId : null;
        if (data.devices.length > 0) {
            data.devices[0].isMaster = true;
            data.devices[0].approved = true;
        }
    }
    saveTrustedDevices(data);
}

// ============================================================
// 6. GENERATE KODE VERIFIKASI & VALIDASI
// ============================================================
function generateVerificationCode() {
    var code = Math.floor(100000 + Math.random() * 900000).toString();
    localStorage.setItem('verificationCode', code);
    localStorage.setItem('verificationCodeTime', Date.now().toString());
    return code;
}

function verifyVerificationCode(inputCode) {
    var storedCode = localStorage.getItem('verificationCode');
    var storedTime = parseInt(localStorage.getItem('verificationCodeTime'));
    if (!storedCode) return false;
    if (Date.now() - storedTime > 10 * 60 * 1000) return false;
    return inputCode === storedCode;
}

// ============================================================
// 7. DAPATKAN DAFTAR PERANGKAT UNTUK TAMPILAN
// ============================================================
function getDeviceList() {
    var data = loadTrustedDevices();
    return data.devices;
}
</script>

<!--- ===== BLOK 9.2.6.2 – FUNGSI LUPA PASSWORD (REVISI: PREFIX UNIK `lp_`) ===== --->
<script>
// ============================================================
// BLOK 9.2.6.2 – FITUR LUPA PASSWORD (PREFIX: lp_)
// ------------------------------------------------------------
// Semua fungsi di modul ini diberi prefiks `lp_` agar tidak
// bentrok dengan modul lain.
// ============================================================

// --- Variabel khusus modul ini ---
var lp_intervalOtpTimer = null;

// ============================================================
// 1. FUNGSI KIRIM OTP / LINK RESET (TAHAP 1)
// ============================================================
function lp_prosesLupaPassword(event) {
    event.preventDefault();
    
    var identitas = document.getElementById('identitasLupa').value.trim();
    var notif = document.getElementById('notifikasiLupaPassword');
    var tahap1 = document.getElementById('tahapSatuLupaPassword');
    var tahap2 = document.getElementById('tahapDuaLupaPassword');

    // --- VALIDASI INPUT ---
    if (!identitas) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Nomor HP atau email wajib diisi!';
        notif.classList.remove('d-none');
        return false;
    }

    // --- CARI USER BERDASARKAN IDENTITAS ---
    var foundUser = null;
    for (var i = 0; i < dataLoginUser.length; i++) {
        var user = dataLoginUser[i];
        if (user.hp === identitas || user.email === identitas) {
            foundUser = user;
            break;
        }
    }

    // --- JIKA USER TIDAK DITEMUKAN ---
    if (!foundUser) {
        notif.className = 'alert alert-danger';
        notif.innerHTML = 'Nomor HP atau email tidak terdaftar!';
        notif.classList.remove('d-none');
        return false;
    }

    // --- GENERATE OTP (6 DIGIT) & SIMPAN KE LOCALSTORAGE ---
    var otp = Math.floor(100000 + Math.random() * 900000).toString();
    var token = 'TOKEN-' + Date.now() + '-' + Math.random().toString(36).substr(2, 8);
    
    localStorage.setItem('otpReset_' + foundUser.username, otp);
    localStorage.setItem('tokenReset_' + foundUser.username, token);
    localStorage.setItem('otpExpired_' + foundUser.username, (Date.now() + 10 * 60 * 1000).toString());

    // --- SIMPAN USERNAME YANG SEDANG RESET (UNTUK TAHAP 2) ---
    localStorage.setItem('resetUsername', foundUser.username);

    // --- TAMPILKAN OTP (SIMULASI KIRIM KE HP/EMAIL) ---
    alert('📱 Kode OTP Anda: ' + otp + '\n(Kode berlaku 10 menit)');

    // --- PINDAH KE TAHAP 2 ---
    tahap1.classList.add('d-none');
    tahap2.classList.remove('d-none');
    document.getElementById('otpLupa').value = '';

    // --- MULAI TIMER OTP (10 MENIT) ---
    lp_mulaiTimerOtp(foundUser.username);

    // --- NOTIFIKASI SUKSES ---
    notif.className = 'alert alert-success';
    notif.innerHTML = '✅ Kode OTP telah dikirim ke ' + identitas + '. Silakan masukkan kode.';
    notif.classList.remove('d-none');

    return false;
}

// ============================================================
// 2. FUNGSI MULAI TIMER OTP (COUNTDOWN 10 MENIT)
// ============================================================
function lp_mulaiTimerOtp(username) {
    // Hentikan timer lama jika ada
    if (lp_intervalOtpTimer) clearInterval(lp_intervalOtpTimer);

    var expiredStr = localStorage.getItem('otpExpired_' + username);
    var expiredTime = parseInt(expiredStr);
    var timerElement = document.getElementById('timerOtp');

    lp_intervalOtpTimer = setInterval(function() {
        var sisa = expiredTime - Date.now();
        if (sisa <= 0) {
            clearInterval(lp_intervalOtpTimer);
            if (timerElement) timerElement.textContent = 'Kode OTP telah kedaluwarsa!';
            alert('⏰ Kode OTP telah kedaluwarsa. Silakan kirim ulang.');
            // Kembalikan ke tahap 1
            document.getElementById('tahapSatuLupaPassword').classList.remove('d-none');
            document.getElementById('tahapDuaLupaPassword').classList.add('d-none');
            return;
        }

        var menit = Math.floor(sisa / 60000);
        var detik = Math.floor((sisa % 60000) / 1000);
        if (timerElement) timerElement.textContent = 'Sisa waktu: ' + menit + ':' + (detik < 10 ? '0' : '') + detik;
    }, 1000);
}

// ============================================================
// 3. FUNGSI KIRIM ULANG OTP
// ============================================================
function lp_resendOtp() {
    var username = localStorage.getItem('resetUsername');
    var notif = document.getElementById('notifikasiLupaPassword');
    var identitas = document.getElementById('identitasLupa').value.trim();

    if (!username) {
        alert('Sesi reset password sudah berakhir. Silakan ulangi dari awal.');
        // Kembalikan ke tahap 1
        document.getElementById('tahapSatuLupaPassword').classList.remove('d-none');
        document.getElementById('tahapDuaLupaPassword').classList.add('d-none');
        return;
    }

    // --- GENERATE OTP BARU ---
    var otp = Math.floor(100000 + Math.random() * 900000).toString();
    localStorage.setItem('otpReset_' + username, otp);
    localStorage.setItem('otpExpired_' + username, (Date.now() + 10 * 60 * 1000).toString());

    // --- TAMPILKAN OTP (SIMULASI) ---
    alert('📱 Kode OTP baru: ' + otp + '\n(Kode berlaku 10 menit)');

    // --- RESTART TIMER ---
    lp_mulaiTimerOtp(username);

    // --- NOTIFIKASI ---
    notif.className = 'alert alert-success';
    notif.innerHTML = '✅ Kode OTP baru telah dikirim.';
    notif.classList.remove('d-none');
}

// ============================================================
// 4. FUNGSI PROSES RESET PASSWORD (TAHAP 2)
// ============================================================
function lp_prosesResetPassword(event) {
    event.preventDefault();

    var otpInput = document.getElementById('otpLupa').value.trim();
    var passwordBaru = document.getElementById('passwordBaru').value;
    var konfirmasi = document.getElementById('konfirmasiPasswordBaru').value;
    var notif = document.getElementById('notifikasiLupaPassword');

    var username = localStorage.getItem('resetUsername');

    // --- VALIDASI ---
    if (!otpInput || !passwordBaru || !konfirmasi) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Semua field wajib diisi!';
        notif.classList.remove('d-none');
        return false;
    }

    if (passwordBaru !== konfirmasi) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Password dan konfirmasi tidak cocok!';
        notif.classList.remove('d-none');
        return false;
    }

    if (passwordBaru.length < 6) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Password minimal 6 karakter!';
        notif.classList.remove('d-none');
        return false;
    }

    // --- VALIDASI OTP ---
    var storedOtp = localStorage.getItem('otpReset_' + username);
    var expiredTime = parseInt(localStorage.getItem('otpExpired_' + username));

    if (!storedOtp || !expiredTime) {
        notif.className = 'alert alert-danger';
        notif.innerHTML = 'Sesi OTP tidak ditemukan. Silakan ulangi dari awal.';
        notif.classList.remove('d-none');
        return false;
    }

    if (Date.now() > expiredTime) {
        notif.className = 'alert alert-danger';
        notif.innerHTML = 'Kode OTP telah kedaluwarsa!';
        notif.classList.remove('d-none');
        return false;
    }

    if (otpInput !== storedOtp) {
        notif.className = 'alert alert-danger';
        notif.innerHTML = 'Kode OTP salah!';
        notif.classList.remove('d-none');
        return false;
    }

    // --- UPDATE PASSWORD DI DATA USER ---
    var userIndex = -1;
    for (var i = 0; i < dataLoginUser.length; i++) {
        if (dataLoginUser[i].username === username) {
            userIndex = i;
            break;
        }
    }

    if (userIndex === -1) {
        notif.className = 'alert alert-danger';
        notif.innerHTML = 'User tidak ditemukan!';
        notif.classList.remove('d-none');
        return false;
    }

    // Update password di dataLoginUser
    dataLoginUser[userIndex].password = passwordBaru;

    // Update password di dataAkunAktif (jika ada)
    var akunAktifIndex = dataAkunAktif.findIndex(function(akun) {
        return akun.username === username;
    });
    if (akunAktifIndex !== -1) {
        dataAkunAktif[akunAktifIndex].password = passwordBaru;
    }

    // --- SIMPAN KE LOCALSTORAGE ---
    simpanDataKeLocalStorage();

    // --- HAPUS SESSION RESET ---
    localStorage.removeItem('otpReset_' + username);
    localStorage.removeItem('tokenReset_' + username);
    localStorage.removeItem('otpExpired_' + username);
    localStorage.removeItem('resetUsername');

    // --- HENTIKAN TIMER ---
    if (lp_intervalOtpTimer) {
        clearInterval(lp_intervalOtpTimer);
        lp_intervalOtpTimer = null;
    }

    // --- NOTIFIKASI SUKSES ---
    notif.className = 'alert alert-success';
    notif.innerHTML = '✅ Password berhasil direset! Silakan login dengan password baru.';
    notif.classList.remove('d-none');

    // --- KEMBALI KE HALAMAN LOGIN SETELAH 2 DETIK ---
    setTimeout(function() {
        tampilkanHalaman('login');
    }, 2000);

    return false;
}
</script>

// ============================================================
function loadMenuNavigasi(kodeRole, statusVerifikasi) {
    var menuContainer = document.getElementById('menuNavigasi');
    if (!menuContainer) return;

    var daftarMenu = [];

    if (userAktif && userAktif.role === 'SuperAdmin') {
        var config = menuConfig['SA'];
        daftarMenu = config ? config.menu.slice() : [
            { nama: 'Dasbor', ikon: 'fas fa-tachometer-alt', aksi: 'dashboardUtama' },
            { nama: 'Profil', ikon: 'fas fa-user', aksi: 'profil' }
        ];
    }
    else if (userAktif.status === 'Nonaktif' || userAktif.statusVerifikasi === 'Ditolak') {
        daftarMenu = [
            { nama: 'Profil Saya', ikon: 'fas fa-user', aksi: 'profil' },
            { nama: 'Pengajuan Aktifkan Akun', ikon: 'fas fa-unlock-alt', aksi: 'pengajuanAktifkanAkun' }
        ];
    }
    else if (statusVerifikasi === 'Pending') {
        daftarMenu = [
            { nama: 'Profil Saya', ikon: 'fas fa-user', aksi: 'profil' },
            { nama: 'Pengajuan Verifikasi', ikon: 'fas fa-file-upload', aksi: 'pengajuanVerifikasi' },
            { nama: 'Download Form SKU', ikon: 'fas fa-download', aksi: 'downloadSKU' }
        ];
    }
    else if (userAktif && userAktif.statusVerifikasi === 'Aktif') {
        var config = menuConfig[kodeRole];
        if (config) {
            daftarMenu = config.menu.slice().filter(function(item) {
                if (item.onlyPending) return false;
                if (item.aksi === 'pengajuanVerifikasi' || item.aksi === 'downloadSKU') return false;
                return true;
            });
        } else {
            var fallbackConfig = menuConfig['CT'];
            if (fallbackConfig) {
                daftarMenu = fallbackConfig.menu.slice().filter(function(item) {
                    if (item.onlyPending) return false;
                    if (item.aksi === 'pengajuanVerifikasi' || item.aksi === 'downloadSKU') return false;
                    return true;
                });
            } else {
                daftarMenu = [
                    { nama: 'Dasbor', ikon: 'fas fa-tachometer-alt', aksi: 'dashboardUtama' },
                    { nama: 'Profil', ikon: 'fas fa-user', aksi: 'profil' }
                ];
            }
        }
    }
    else {
        daftarMenu = [
            { nama: 'Dasbor', ikon: 'fas fa-tachometer-alt', aksi: 'dashboardUtama' },
            { nama: 'Profil', ikon: 'fas fa-user', aksi: 'profil' }
        ];
    }

    // RENDER MENU
    var htmlMenu = '';
    for (var i = 0; i < daftarMenu.length; i++) {
        var item = daftarMenu[i];
        var handler = menuHandlers[item.aksi];
        if (handler) {
            htmlMenu += '<a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="menuHandlers[\'' + item.aksi + '\'](); tutupMenu();"><i class="' + item.ikon + ' me-2" style="color: var(--primary-color);"></i>' + item.nama + '</a>';
        } else {
            htmlMenu += '<a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="tampilkanPlaceholderMenu(\'' + item.nama + '\', \'' + (item.blok || '0') + '\')"><i class="' + item.ikon + ' me-2" style="color: var(--primary-color);"></i>' + item.nama + '</a>';
        }
    }

    // LOGOUT SELALU MUNCUL
    htmlMenu += '<hr class="border-secondary">';
    htmlMenu += '<a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="prosesLogout()">';
    htmlMenu += '<i class="fas fa-sign-out-alt me-2 text-danger"></i>Logout';
    htmlMenu += '</a>';

    menuContainer.innerHTML = htmlMenu;
}

    if (status === 'Aktif') {

        if (config) {

                if (item.aksi === 'pengajuanVerifikasi' || item.aksi === 'downloadSKU') return false;
                return true;

    return [

<script>

// ============================================================
// 2. FUNGSI BACKUP SISTEM (MENYIMPAN KE FILE JSON)
// ============================================================
function lakukanBackupSistem() {
    // Kumpulkan semua data dari variabel global
    var backupData = {
        versi: '1.0',
        tanggal: new Date().toISOString(),
        dataLoginUser: dataLoginUser,
        dataAkunAktif: dataAkunAktif,
        dataPending: dataPending,
        dataWilayah: dataWilayah,
        dataPengajuanBukaAkun: dataPengajuanBukaAkun,
        dataVerifikasiDokumen: dataVerifikasiDokumen,
        dataEO: dataEO,
        dataReferral: dataReferral,
        dataStatusOnline: dataStatusOnline,
        dataEvent: dataEvent,
        dataPeserta: dataPeserta,
        dataKasir: dataKasir,
        dataPengajuanUser: dataPengajuanUser,
        dataLaporanStok: dataLaporanStok,
        dataProdukDistributor: dataProdukDistributor,
        dataPesananDistributor: dataPesananDistributor,
        dataIklan: dataIklan,
        dataInformasi: dataInformasi,
        dataBroadcast: dataBroadcast,
        dataKupon: dataKupon,
        dataUlasanRating: dataUlasanRating,
        dataHistoriAktivitas: dataHistoriAktivitas,
        notepadData: notepadData,
        dataCustomCode: dataCustomCode,
        dataRunningText: dataRunningText,
        dataSKU: dataSKU,
        dataR2CoinConfig: dataR2CoinConfig,
        dataR2CoinHistory: dataR2CoinHistory,
        dataWithdrawalRequests: dataWithdrawalRequests,
        dataTopUpHistory: dataTopUpHistory,
        aiKnowledgeBase: aiKnowledgeBase,
        aiConversations: aiConversations,
        aiSettings: aiSettings,
        keamananConfig: keamananConfig,
        pengaturanUmum: pengaturanUmum,
        trustedDevices: trustedDevices,
        allowedSuperAdminIPs: allowedSuperAdminIPs
    };

    // Buat file JSON dan download
    var jsonString = JSON.stringify(backupData, null, 2);
    var blob = new Blob([jsonString], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'backup_toko2r_' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Tambahkan riwayat backup
    var backupBaru = {
        id: 'BK-' + Date.now(),
        tanggal: new Date().toISOString(),
        ukuran: (jsonString.length / 1024).toFixed(2) + ' KB',
        keterangan: 'Backup manual'
    };
    dataBackupHistory.unshift(backupBaru);
    localStorage.setItem('dataBackupHistory', JSON.stringify(dataBackupHistory));

    // Perbarui tabel
    renderTabelBackupHistory();

    alert('✅ Backup berhasil dibuat dan diunduh!');
}

// ============================================================
// 3. FUNGSI RESTORE DARI FILE
// ============================================================
function restoreDariFile() {
    var fileInput = document.getElementById('fileRestoreInput');
    var statusRestore = document.getElementById('statusRestore');

    if (!fileInput.files || fileInput.files.length === 0) {
        statusRestore.innerHTML = '<span class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i>Pilih file backup terlebih dahulu.</span>';
        return;
    }

    var file = fileInput.files[0];
    var reader = new FileReader();

    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);

            // Validasi struktur minimal
            if (!data.dataLoginUser || !data.dataAkunAktif) {
                throw new Error('File tidak valid atau bukan file backup 2R.');
            }

            // Konfirmasi sebelum restore
            if (!confirm('⚠️ Restore akan MENGGANTI seluruh data saat ini. Lanjutkan?')) return;

            // Pulihkan semua data
            dataLoginUser = data.dataLoginUser || [];
            dataAkunAktif = data.dataAkunAktif || [];
            dataPending = data.dataPending || [];
            dataWilayah = data.dataWilayah || [];
            dataPengajuanBukaAkun = data.dataPengajuanBukaAkun || [];
            dataVerifikasiDokumen = data.dataVerifikasiDokumen || [];
            dataEO = data.dataEO || [];
            dataReferral = data.dataReferral || [];
            dataStatusOnline = data.dataStatusOnline || {};
            dataEvent = data.dataEvent || [];
            dataPeserta = data.dataPeserta || [];
            dataKasir = data.dataKasir || [];
            dataPengajuanUser = data.dataPengajuanUser || [];
            dataLaporanStok = data.dataLaporanStok || [];
            dataProdukDistributor = data.dataProdukDistributor || [];
            dataPesananDistributor = data.dataPesananDistributor || [];
            dataIklan = data.dataIklan || [];
            dataInformasi = data.dataInformasi || [];
            dataBroadcast = data.dataBroadcast || [];
            dataKupon = data.dataKupon || [];
            dataUlasanRating = data.dataUlasanRating || [];
            dataHistoriAktivitas = data.dataHistoriAktivitas || [];
            notepadData = data.notepadData || { namaProject: '', keterangan: '', bloks: [] };
            dataCustomCode = data.dataCustomCode || [];
            dataRunningText = data.dataRunningText || [];
            dataSKU = data.dataSKU || [];
            dataR2CoinConfig = data.dataR2CoinConfig || { buyRate: 1000, sellRate: 750, cashbackMinimal: 50000 };
            dataR2CoinHistory = data.dataR2CoinHistory || [];
            dataWithdrawalRequests = data.dataWithdrawalRequests || [];
            dataTopUpHistory = data.dataTopUpHistory || [];
            aiKnowledgeBase = data.aiKnowledgeBase || [];
            aiConversations = data.aiConversations || [];
            aiSettings = data.aiSettings || { provider: 'openai', model: 'gpt-4o-mini', apiKey: '', maxTokens: 2000, temperature: 0.7 };
            keamananConfig = data.keamananConfig || {};
            pengaturanUmum = data.pengaturanUmum || {};
            trustedDevices = data.trustedDevices || { masterDeviceId: null, devices: [] };
            allowedSuperAdminIPs = data.allowedSuperAdminIPs || ['202.46.68.81'];

            // Simpan semua data ke localStorage
            simpanDataKeLocalStorage();

            // Perbarui tampilan
            statusRestore.innerHTML = '<span class="text-success"><i class="fas fa-check-circle me-1"></i>✅ Restore berhasil! Data telah dipulihkan.</span>';
            
            // Refresh halaman agar data baru aktif
            setTimeout(function() {
                location.reload();
            }, 1500);

        } catch (err) {
            statusRestore.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle me-1"></i>❌ Gagal restore: ' + err.message + '</span>';
        }
    };

    reader.readAsText(file);
}

// ============================================================
// 4. FUNGSI RENDER TABEL RIWAYAT BACKUP
// ============================================================
function renderTabelBackupHistory() {
    var tbody = document.getElementById('tabelBackupHistory');
    var totalSpan = document.getElementById('totalBackupHistory');
    if (!tbody) return;

    if (dataBackupHistory.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Belum ada riwayat backup.</td></tr>';
        totalSpan.textContent = '0';
        return;
    }

    var html = '';
    dataBackupHistory.forEach(function(item, index) {
        var tgl = new Date(item.tanggal);
        var tglStr = tgl.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + tgl.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        html += `
            <tr>
                <td>${index + 1}</td>
                <td>${tglStr} WIB</td>
                <td>${item.ukuran}</td>
                <td>${item.keterangan}</td>
                <td>
                    <button class="btn btn-sm btn-outline-info" onclick="downloadBackupFile('${item.id}')">
                        <i class="fas fa-download"></i> Unduh
                    </button>
                </td>
            </tr>
        `;
    });
    tbody.innerHTML = html;
    totalSpan.textContent = dataBackupHistory.length;
}

// ============================================================
// 5. FUNGSI DOWNLOAD ULANG FILE BACKUP DARI RIWAYAT
// ============================================================
function downloadBackupFile(id) {
    var backup = dataBackupHistory.find(function(b) { return b.id === id; });
    if (!backup) {
        alert('Backup tidak ditemukan.');
        return;
    }

    lakukanBackupSistem(); // Memaksa backup baru (tidak sesuai id)
}
</script>

<!-- BLOK R 9.3.3(3).1 – KONFIGURASI & FUNGSI DASAR               -->
<!-- ============================================================ -->
<script>
/* ============================================================
   BLOK R 9.3.3(3).1 – KONFIGURASI & FUNGSI DASAR
   ------------------------------------------------------------
   - Kunci penyimpanan per role
   - Dispatcher manajemen produk
   - Load / save produk ke localStorage
   - Render tabel produk
   - Helper hitung harga coin otomatis (pembulatan ke atas)
   ============================================================ */

// ============================================================
// 1. KONFIGURASI KUNCI LOCALSTORAGE PER ROLE
// ============================================================
var PRODUK_STORAGE_KEY = {
    'Toko': 'dataProdukToko',
    'Pedagang Pasar': 'dataProdukPP',
    'Pedagang Makanan': 'dataProdukPM',
    'COD Seller': 'dataProdukCOD',
    'Ojek': 'dataProdukOJ',
    'Grosir': 'dataProdukGrosir',
    'Distributor': 'dataProdukDistributor'
};

// ============================================================
// 2. FUNGSI GLOBAL: TAMPILKAN MANAJEMEN PRODUK (DISPATCHER)
// ============================================================
function tampilkanManajemenProduk() {
    var role = userAktif.role;
    switch (role) {
        case 'Toko':            tampilkanManajemenProdukTK(); break;
        case 'Pedagang Pasar':  tampilkanManajemenProdukPP(); break;
        case 'Pedagang Makanan': tampilkanManajemenProdukPM(); break;
        case 'COD Seller':      tampilkanManajemenProdukCOD(); break;
        case 'Ojek':            tampilkanManajemenProdukOJ(); break;
        case 'Grosir':          tampilkanManajemenProdukGrosir(); break;
        case 'Distributor':     tampilkanManajemenProdukDistributor(); break;
        default:                tampilkanPlaceholderMenu('Manajemen Produk', '0'); break;
    }
}

// ============================================================
// 3. FUNGSI GENERIK: LOAD PRODUK DARI LOCALSTORAGE
// ============================================================
function loadProdukDariLocal(role) {
    var key = PRODUK_STORAGE_KEY[role] || 'dataProdukToko';
    var sellerId = userAktif.idUser;
    var stored = localStorage.getItem(key + '_' + sellerId);
    if (stored) {
        try { return JSON.parse(stored); }
        catch(e) { return []; }
    }
    return [];
}

// ============================================================
// 4. FUNGSI GENERIK: SIMPAN PRODUK KE LOCALSTORAGE
// ============================================================
function simpanProdukKeLocal(role, produkList) {
    var key = PRODUK_STORAGE_KEY[role] || 'dataProdukToko';
    var sellerId = userAktif.idUser;
    localStorage.setItem(key + '_' + sellerId, JSON.stringify(produkList));
}

// ============================================================
// 5. FUNGSI HELPER: HITUNG HARGA COIN OTOMATIS (PEMBULATAN KE ATAS)
// ============================================================
function hitungHargaCoinOtomatis(hargaRupiah) {
    var HARGACOIN = (JSON.parse(localStorage.getItem('settingEkonomiCoin') || '{}').hargaJual) || 750;
    if (!hargaRupiah || hargaRupiah <= 0) return 0;
    return Math.ceil(hargaRupiah / HARGACOIN);
}

// ============================================================
// 6. FUNGSI GENERIK: RENDER TABEL PRODUK (DENGAN KOLOM COIN & SATUAN)
// ============================================================
function renderTabelProduk(role, produkList, tableId) {
    var tbody = document.getElementById(tableId);
    var totalSpan = document.getElementById('totalProduk_' + role);
    if (!tbody) return;

    if (produkList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">Belum ada produk. Tambahkan produk pertama Anda.</td></tr>';
        if (totalSpan) totalSpan.textContent = '0';
        return;
    }

    var html = '';
    produkList.forEach(function(p, index) {
        var imgUrl = p.foto && p.foto !== '' ? p.foto : 'https://placehold.co/80x60/FF8C00/ffffff?text=No+Img';
        var hargaFormat = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(p.harga);
        var hargaCoin = (p.hargaCoin && p.hargaCoin > 0) ? p.hargaCoin : hitungHargaCoinOtomatis(p.harga);
        var bonusCoin = p.bonusCoin || 0;
        var satuan = p.satuan || 'pcs';
        var kode = p.kodeProduk || p.kode || '-';
        var tglInput = p.tanggalInput || '-';
        html += `
            <tr>
                <td>${index + 1}</td>
                <td>
                    <img src="${imgUrl}" alt="${p.nama}" style="width: 60px; height: 45px; object-fit: cover; border-radius: 5px;">
                </td>
                <td><strong>${p.nama}</strong></td>
                <td><small>${kode}</small></td>
                <td>${p.kategori || '-'}</td>
                <td>${hargaFormat}</td>
                <td>${hargaCoin} Coin</td>
                <td>${bonusCoin}</td>
                <td>${satuan}</td>
                <td>${p.stok || 0}</td>
                <td>${tglInput}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="editProduk('${role}', ${index})">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="hapusProduk('${role}', ${index})">
                        <i class="fas fa-trash"></i> Hapus
                    </button>
                </td>
            </tr>
        `;
    });
    tbody.innerHTML = html;
    if (totalSpan) totalSpan.textContent = produkList.length;
}
</script>
<!-- ===== AKHIR BLOK R 9.3.3(3).1 ===== -->

<!-- ============================================================ -->
<!-- BLOK R 9.3.3(3).2 – FUNGSI FORM TAMBAH/EDIT & CRUD           -->
<!-- ============================================================ -->
<script>
/* ============================================================
   BLOK R 9.3.3(3).2 – FUNGSI FORM TAMBAH/EDIT & CRUD
   ------------------------------------------------------------
   - Modal Tambah/Edit Produk
   - Simpan, Edit, Hapus Produk
   - Scan Barcode & Foto Produk
   - Perhitungan Harga Coin Otomatis (Pembulatan KE ATAS)
   - KHUSUS DISTRIBUTOR: Produk TIDAK BISA DIBELI DENGAN COIN
   - Bonus Coin per Produk untuk Distributor TETAP ADA (default 10)
   - Satuan 'Pcs' khusus untuk role TK, PP, PM, COD
   ============================================================ */

// ============================================================
// 6. FUNGSI GENERIK: FORM TAMBAH/EDIT PRODUK (MODAL LENGKAP)
// ============================================================
function tampilkanFormProduk(role, editIndex = null) {
    var produkList = loadProdukDariLocal(role);
    var produk = null;
    if (editIndex !== null && produkList[editIndex]) {
        produk = produkList[editIndex];
    }

    // AMBIL HARGA COIN DARI SETTING EKONOMI
    var HARGACOIN = (JSON.parse(localStorage.getItem('settingEkonomiCoin') || '{}').hargaJual) || 750;

    // ===== MODIFIKASI KHUSUS DISTRIBUTOR =====
    var isDistributor = (role === 'Distributor');
    var hargaCoinDefault = 0;
    if (!isDistributor) {
        if (produk && produk.hargaCoin) {
            hargaCoinDefault = produk.hargaCoin;
        } else if (produk && produk.harga) {
            // REVISI: Gunakan Math.ceil untuk pembulatan ke atas
            hargaCoinDefault = Math.ceil(produk.harga / HARGACOIN);
        }
    } else {
        hargaCoinDefault = 0;
    }
    // ===== AKHIR MODIFIKASI DISTRIBUTOR =====

    // Opsi Kategori
    var kategoriOptions = ['Makanan', 'Minuman', 'Obat-obatan', 'Pakaian / Fashion', 'Sembako', 'Elektronik', 'Rokok', 'Kebersihan', 'Rumah Tangga', 'Kosmetik', 'Lainnya'];
    var kategoriSelect = '';
    kategoriOptions.forEach(function(kat) {
        var selected = (produk && produk.kategori === kat) ? 'selected' : '';
        kategoriSelect += `<option value="${kat}" ${selected}>${kat}</option>`;
    });

    // Opsi Satuan (REVISI: tambahkan 'Pcs' untuk TK, PP, PM, COD)
    var satuanOptions = ['Karton', 'Dus', 'Box', 'Ball', 'Paket', 'Lusin', 'Rim', 'Kg', 'Gram', 'Liter', 'Ml', 'Botol', 'Lainnya'];
    if (role === 'Toko' || role === 'Pedagang Pasar' || role === 'Pedagang Makanan' || role === 'COD Seller') {
        satuanOptions.unshift('Pcs');
    }
    var satuanSelect = '';
    satuanOptions.forEach(function(sat) {
        var selected = (produk && produk.satuan === sat) ? 'selected' : '';
        satuanSelect += `<option value="${sat}" ${selected}>${sat}</option>`;
    });

    // BONUS COIN DEFAULT: Distributor = 10, lainnya = 1
    var bonusDefault = (role === 'Distributor') ? 10 : 1;
    if (produk && produk.bonusCoin !== undefined) {
        bonusDefault = produk.bonusCoin;
    }

    var tanggalInputDefault = (produk && produk.tanggalInput) ? produk.tanggalInput : new Date().toISOString().split('T')[0];
    var kadaluarsaValue = (produk && produk.tanggalKadaluarsa) ? produk.tanggalKadaluarsa : '';
    var petugasValue = (produk && produk.petugasInput) ? produk.petugasInput : (userAktif.nama || '');
    var kodeValue = (produk && produk.kodeProduk) ? produk.kodeProduk : '';

    // Kolom coin dinonaktifkan untuk distributor
    var coinFieldReadonly = isDistributor ? 'readonly' : '';
    var coinFieldPlaceholder = isDistributor ? 'Tidak dapat dibeli dengan Coin' : '';
    var coinFieldKeterangan = isDistributor 
        ? '<small class="text-warning">Produk Distributor HANYA bisa dibeli dengan Rupiah</small>' 
        : `<small class="text-muted">Mengikuti setting ekonomi R2Coin (Rp ${HARGACOIN} / Coin)</small>`;

    // Modal HTML
    var modalHtml = `
        <div class="modal fade" id="modalProduk" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header" style="background-color: var(--primary-color); color: white;">
                        <h5 class="modal-title"><i class="fas fa-box me-2"></i>${editIndex !== null ? 'Edit' : 'Tambah'} Produk</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formProdukModal" onsubmit="return simpanProdukModal(event, '${role}', ${editIndex})">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Kode Produk</label>
                                    <div class="input-group">
                                        <input type="text" id="produkKode" class="form-control" value="${kodeValue}" placeholder="Otomatis / Scan">
                                        <button class="btn btn-outline-secondary" type="button" onclick="scanBarcodeProduk()" title="Scan Barcode">
                                            <i class="fas fa-camera"></i>
                                        </button>
                                    </div>
                                    <small class="text-muted">Kosongkan untuk generate otomatis, atau scan barcode produk.</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nama Produk</label>
                                    <input type="text" id="produkNama" class="form-control" value="${produk ? produk.nama : ''}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Kategori Produk</label>
                                    <select id="produkKategori" class="form-select">
                                        ${kategoriSelect}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Satuan</label>
                                    <select id="produkSatuan" class="form-select">
                                        ${satuanSelect}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Harga Jual (Rp)</label>
                                    <input type="number" id="produkHarga" class="form-control" value="${produk ? produk.harga : ''}" min="0" required oninput="updateHargaCoinOtomatis()">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Harga (Coin) (Otomatis)</label>
                                    <input type="number" id="produkHargaCoin" class="form-control" value="${hargaCoinDefault}" min="0" ${coinFieldReadonly} placeholder="${coinFieldPlaceholder}">
                                    ${coinFieldKeterangan}
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Bonus Coin per Produk</label>
                                    <input type="number" id="produkBonusCoin" class="form-control" value="${bonusDefault}" min="${bonusDefault}" required>
                                    <small class="text-muted">Default ${bonusDefault} Coin. Tidak dapat dikurangi.</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Stok</label>
                                    <input type="number" id="produkStok" class="form-control" value="${produk ? produk.stok : 0}" min="0" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Tanggal Input</label>
                                    <input type="date" id="produkTanggalInput" class="form-control" value="${tanggalInputDefault}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Tanggal Kadaluarsa</label>
                                    <input type="date" id="produkKadaluarsa" class="form-control" value="${kadaluarsaValue}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Petugas Input</label>
                                    <input type="text" id="produkPetugas" class="form-control" value="${petugasValue}" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-bold">Foto Produk</label>
                                    <div class="d-flex gap-2">
                                        <button type="button" class="btn btn-outline-secondary" onclick="ambilFotoProduk()">
                                            <i class="fas fa-camera me-1"></i> Ambil Foto
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" onclick="uploadFotoProduk()">
                                            <i class="fas fa-upload me-1"></i> Upload Foto
                                        </button>
                                    </div>
                                    <input type="file" id="produkFoto" class="d-none" accept="image/*" capture="environment" onchange="previewFotoProduk(this)">
                                    <div id="previewFotoProduk" class="mt-2">
                                        ${produk && produk.foto ? `<img src="${produk.foto}" style="width:100px;height:100px;object-fit:cover;border-radius:5px;">` : ''}
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-bold">Deskripsi</label>
                                    <textarea id="produkDeskripsi" class="form-control" rows="3">${produk ? produk.deskripsi : ''}</textarea>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" form="formProdukModal" class="btn btn-success">
                            <i class="fas fa-save me-1"></i> Simpan
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;

    // Hapus modal lama jika ada
    var existingModal = document.getElementById('modalProduk');
    if (existingModal) existingModal.remove();

    // Sisipkan modal ke body
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = modalHtml;
    document.body.appendChild(tempDiv.firstElementChild);

    // Tampilkan modal
    var modal = new bootstrap.Modal(document.getElementById('modalProduk'));
    modal.show();
}

// ============================================================
// 7. FUNGSI GENERIK: SIMPAN PRODUK DARI MODAL
// ============================================================
function simpanProdukModal(event, role, editIndex) {
    event.preventDefault();

    var kode = document.getElementById('produkKode').value.trim();
    var nama = document.getElementById('produkNama').value.trim();
    var kategori = document.getElementById('produkKategori').value;
    var satuan = document.getElementById('produkSatuan').value;
    var harga = parseInt(document.getElementById('produkHarga').value);
    var hargaCoin = parseInt(document.getElementById('produkHargaCoin').value) || 0;
    var bonusCoin = parseInt(document.getElementById('produkBonusCoin').value) || 0;
    var stok = parseInt(document.getElementById('produkStok').value);
    var tanggalInput = document.getElementById('produkTanggalInput').value;
    var tanggalKadaluarsa = document.getElementById('produkKadaluarsa').value;
    var petugas = document.getElementById('produkPetugas').value.trim();
    var deskripsi = document.getElementById('produkDeskripsi').value.trim();
    var fotoInput = document.getElementById('produkFoto');
    var foto = (fotoInput.files.length > 0) ? fotoInput.files[0] : null;
    var fotoUrl = '';

    // VALIDASI BONUS COIN
    var bonusDefault = (role === 'Distributor') ? 10 : 1;
    if (bonusCoin < bonusDefault) {
        alert('Bonus Coin minimal ' + bonusDefault + ' untuk role ini! Tidak dapat dikurangi.');
        return false;
    }

    // ===== MODIFIKASI KHUSUS DISTRIBUTOR & PEMBULATAN KE ATAS =====
    var isDistributor = (role === 'Distributor');
    var HARGACOIN = (JSON.parse(localStorage.getItem('settingEkonomiCoin') || '{}').hargaJual) || 750;
    if (isDistributor) {
        hargaCoin = 0;
    } else {
        // REVISI: Gunakan Math.ceil agar tidak merugikan seller
        hargaCoin = Math.ceil(harga / HARGACOIN);
    }
    // ===== AKHIR MODIFIKASI =====

    // Validasi wajib
    if (!nama || isNaN(harga) || harga < 0 || isNaN(stok) || stok < 0 || !tanggalInput || !petugas) {
        alert('Data produk tidak valid. Periksa kembali!');
        return false;
    }

    // Generate kode otomatis jika kosong
    if (!kode) {
        kode = 'PRD-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
    }

    // Fungsi akhir penyimpanan
    var finalize = function() {
        var produkList = loadProdukDariLocal(role);
        var produkData = {
            id: editIndex !== null && produkList[editIndex] ? produkList[editIndex].id : 'PRD-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
            kodeProduk: kode,
            nama: nama,
            kategori: kategori,
            satuan: satuan,
            harga: harga,
            hargaCoin: hargaCoin,
            bonusCoin: bonusCoin,
            stok: stok,
            tanggalInput: tanggalInput,
            tanggalKadaluarsa: tanggalKadaluarsa,
            petugasInput: petugas,
            deskripsi: deskripsi,
            foto: fotoUrl || (produkList[editIndex] ? produkList[editIndex].foto : ''),
            tanggal: new Date().toISOString().split('T')[0]
        };

        if (editIndex !== null && produkList[editIndex]) {
            produkList[editIndex] = produkData;
        } else {
            produkList.unshift(produkData);
        }

        simpanProdukKeLocal(role, produkList);

        // Tutup modal
        var modal = bootstrap.Modal.getInstance(document.getElementById('modalProduk'));
        if (modal) modal.hide();

        // Render ulang tabel manajemen produk
        var tableId = 'tabelProduk_' + role;
        renderTabelProduk(role, produkList, tableId);

        // Refresh halaman Tampil Produk jika sedang dibuka
        if (role === 'Toko' && document.getElementById('tabelTampilProdukToko')) {
            if (typeof renderTampilProdukToko === 'function') renderTampilProdukToko();
        }
        if (role === 'Pedagang Pasar' && document.getElementById('tabelTampilProdukPP')) {
            if (typeof renderTampilProdukPP === 'function') renderTampilProdukPP();
        }
        if (role === 'Pedagang Makanan' && document.getElementById('tabelTampilProdukPM')) {
            if (typeof renderTampilProdukPM === 'function') renderTampilProdukPM();
        }
        if (role === 'COD Seller' && document.getElementById('tabelTampilProdukCOD')) {
            if (typeof renderTampilProdukCOD === 'function') renderTampilProdukCOD();
        }
        if (role === 'Distributor' && document.getElementById('tabelTampilProdukDistributor')) {
            if (typeof renderTampilProdukDistributor === 'function') renderTampilProdukDistributor();
        }
        if (role === 'Grosir' && document.getElementById('tabelTampilProdukGrosir')) {
            if (typeof renderTampilProdukGrosir === 'function') renderTampilProdukGrosir();
        }

        alert('✅ Produk berhasil disimpan!');
    };

    // Jika ada foto, baca sebagai base64
    if (foto) {
        var reader = new FileReader();
        reader.onload = function(e) {
            fotoUrl = e.target.result;
            finalize();
        };
        reader.readAsDataURL(foto);
    } else {
        finalize();
    }

    return false;
}

// ============================================================
// 8. FUNGSI GENERIK: EDIT PRODUK
// ============================================================
function editProduk(role, index) {
    tampilkanFormProduk(role, index);
}

// ============================================================
// 9. FUNGSI GENERIK: HAPUS PRODUK
// ============================================================
function hapusProduk(role, index) {
    if (!confirm('Yakin ingin menghapus produk ini?')) return;

    var produkList = loadProdukDariLocal(role);
    produkList.splice(index, 1);
    simpanProdukKeLocal(role, produkList);

    var tableId = 'tabelProduk_' + role;
    renderTabelProduk(role, produkList, tableId);
    alert('✅ Produk berhasil dihapus.');
}

// ============================================================
// TAMBAHAN: FUNGSI UPDATE HARGA COIN OTOMATIS (REVISI)
// ============================================================
function updateHargaCoinOtomatis() {
    var coinInput = document.getElementById('produkHargaCoin');
    if (coinInput && coinInput.readOnly) {
        // Distributor: jangan update
        return;
    }
    var HARGACOIN = (JSON.parse(localStorage.getItem('settingEkonomiCoin') || '{}').hargaJual) || 750;
    var hargaRupiah = parseFloat(document.getElementById('produkHarga').value) || 0;
    // REVISI: Gunakan Math.ceil untuk pembulatan ke atas
    var hargaCoin = Math.ceil(hargaRupiah / HARGACOIN);
    coinInput.value = hargaCoin;
}

// ============================================================
// 10. FUNGSI SCAN BARCODE PRODUK (DENGAN LIBRARY HTML5-QRCODE)
// ============================================================
function scanBarcodeProduk() {
    if (typeof Html5Qrcode === 'undefined') {
        alert('Library scanner tidak tersedia. Silakan input manual.');
        return;
    }

    var areaScan = document.getElementById('areaScanProdukModal');
    if (!areaScan) {
        var div = document.createElement('div');
        div.id = 'areaScanProdukModal';
        div.style.width = '100%';
        div.style.height = '300px';
        div.innerHTML = '<div style="text-align:center; padding-top:120px;"><i class="fas fa-camera fa-3x text-muted"></i><p class="mt-2">Arahkan kamera ke barcode</p></div>';
        document.body.appendChild(div);
        var modalHtml = `
            <div class="modal fade" id="modalScanProduk" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header" style="background-color: #1976D2; color: white;">
                            <h5 class="modal-title"><i class="fas fa-camera me-2"></i>Scan Barcode Produk</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div id="areaScanProdukModal" style="width:100%; height:300px;"></div>
                            <div class="text-center mt-2">
                                <button class="btn btn-danger btn-sm" onclick="stopScanProduk()"><i class="fas fa-stop me-1"></i>Stop</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        var temp = document.createElement('div');
        temp.innerHTML = modalHtml;
        document.body.appendChild(temp.firstElementChild);
    }

    var modal = new bootstrap.Modal(document.getElementById('modalScanProduk'));
    modal.show();
    setTimeout(function() {
        var scanner = new Html5Qrcode('areaScanProdukModal');
        scanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            function(decodedText) {
                document.getElementById('produkKode').value = decodedText;
                stopScanProduk();
                modal.hide();
                alert('Kode produk terisi otomatis: ' + decodedText);
            },
            function(errorMessage) {
                // Abaikan error
            }
        );
        window._scannerProduk = scanner;
    }, 500);
}

function stopScanProduk() {
    if (window._scannerProduk) {
        window._scannerProduk.stop().then(function() {
            window._scannerProduk = null;
        }).catch(function(err) {
            console.log(err);
        });
    }
}

    var input = document.getElementById('produkFoto');

function previewFotoProduk(input) {
    var file = input.files[0];

    var reader = new FileReader();

        var preview = document.getElementById('previewFotoProduk');
        preview.innerHTML = '<img src="' + e.target.result + '" style="width:100px;height:100px;object-fit:cover;border-radius:5px;">';
    };
    reader.readAsDataURL(file);
}

// --- FUNGSI FILTER UNTUK KATALOG PUBLIK ---
function filterKatalogPublik() {
    const cari = document.getElementById('cariKatalogPublik').value.toLowerCase().trim();
    const kategori = document.getElementById('filterKategoriPublik').value;
    const grid = document.getElementById('gridKatalogPublik');

    // Ambil data produk dari variable global dataProdukToko (yang sudah dibatasi sebelumnya)
    let produk = dataProdukToko || [];

    // Terapkan filter
    let filtered = produk.filter(p => {
        const matchNama = cari === '' || p.nama.toLowerCase().includes(cari);
        const matchKategori = kategori === '' || p.kategori === kategori;
        return matchNama && matchKategori;
    });

    // Render ulang grid dengan hasil filter (tetap batasi berdasarkan status)
    let maxProduk = 999;
    if (userAktif && userAktif.statusLangganan === 'Free') maxProduk = 5;
    else if (userAktif && userAktif.statusLangganan === 'Pro') maxProduk = 25;

    if (filtered.length > maxProduk) filtered = filtered.slice(0, maxProduk);

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="fas fa-box-open fa-4x text-white mb-3 opacity-50"></i>
                <h4 class="text-white opacity-75">Tidak ada produk yang sesuai.</h4>
            </div>
        `;
        return;
    }

    grid.innerHTML = filtered.map(p => {
        const imgUrl = p.foto && p.foto !== '' ? p.foto : 'https://placehold.co/300x200/FF8C00/ffffff?text=No+Image';
        const hargaFormat = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(p.harga);
        return `
            <div class="col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm hover-card border-0 bg-white">
                    <div style="position: relative;">
                        <img src="${imgUrl}" class="card-img-top" style="height: 160px; object-fit: cover;" alt="${p.nama}">
                        <span class="badge bg-secondary position-absolute top-0 end-0 m-2">${p.kategori || 'Umum'}</span>
                    </div>
                    <div class="card-body p-3">
                        <h6 class="fw-bold mb-1 text-truncate" title="${p.nama}">${p.nama}</h6>
                        <div class="d-flex justify-content-between align-items-end">
                            <div>
                                <span class="fw-bold text-success">${hargaFormat}</span>
                                <br>
                                <small class="text-muted text-truncate d-block" style="font-size: 0.75rem;">
                                    <i class="fas fa-store me-1"></i> Toko Anda
                                </small>
                            </div>
                            <small class="text-muted" style="font-size: 0.7rem;">
                                <i class="fas fa-box me-1"></i> Stok: ${p.stok || 0}
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

<script>
// ============================================================
// 1. FUNGSI AMBIL KOORDINAT LOKASI (Geolokasi)
// ============================================================
function ambilKoordinat() {
    var status = document.getElementById('statusKoordinat');
    var tombol = document.getElementById('tombolAmbilKoordinat');

    if (!navigator.geolocation) {
        status.innerHTML = 'Geolokasi tidak didukung';
        return;
    }

    status.innerHTML = 'Mengambil lokasi...';
    tombol.disabled = true;

    navigator.geolocation.getCurrentPosition(
        function(pos) {
            document.getElementById('latitude').value = pos.coords.latitude;
            document.getElementById('longitude').value = pos.coords.longitude;
            document.getElementById('textLatitude').textContent = pos.coords.latitude;
            document.getElementById('textLongitude').textContent = pos.coords.longitude;
            status.innerHTML = 'Lokasi berhasil!';
            status.style.color = 'green';
            document.getElementById('koordinatText').classList.remove('d-none');
            tombol.disabled = false;
            cekTombolDaftarAktif();
        },
        function() {
            status.innerHTML = 'Gagal mengambil lokasi';
            status.style.color = 'red';
            tombol.disabled = false;
        }
    );
}

// ============================================================
// 3. FUNGSI RESET FORM DAFTAR
// ============================================================
function resetFormDaftar() {
    document.getElementById('formDaftar').reset();
    document.getElementById('idOtomatis').value = '';
    document.getElementById('tombolDaftar').disabled = true;
    document.getElementById('tombolAjukan').disabled = true;
    document.getElementById('koordinatText').classList.add('d-none');
    document.getElementById('statusKoordinat').innerHTML = '<i class="fas fa-exclamation-circle text-danger me-1"></i>Koordinat belum diambil. Wajib diisi!';
    document.getElementById('statusKoordinat').style.color = '';
    document.getElementById('bagianNIK').style.display = 'none';
    document.getElementById('notifikasiDaftar').classList.add('d-none');
    document.getElementById('previewFotoKtp').style.display = 'none';
}

// ============================================================
// 4. FUNGSI PROSES DAFTAR (VALIDASI & SIMPAN) - Password Polos
// ============================================================
function prosesDaftar(event) {
    event.preventDefault();

    var role = document.getElementById('roleAkun').value;
    var notif = document.getElementById('notifikasiDaftar');

    // --- AMBIL DATA FORM ---
    var nama = document.getElementById('namaLengkap').value.trim();
    var hp = document.getElementById('nomorHp').value.trim();
    var email = document.getElementById('email').value.trim();
    var alamat = document.getElementById('alamat').value.trim();
    var username = document.getElementById('usernameDaftar').value.trim();
    var password = document.getElementById('passwordDaftar').value;     // Password polos
    var konfirmasi = document.getElementById('konfirmasiPassword').value;
    var nik = document.getElementById('nikKtp').value.trim();
    var lat = document.getElementById('latitude').value;
    var lng = document.getElementById('longitude').value;
    var kodeReferral = document.getElementById('kodeReferralDaftar').value.trim();
    var fotoKtp = document.getElementById('fotoKtp').files[0];

    // --- VALIDASI PASSWORD ---
    if (password !== konfirmasi) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Password dan konfirmasi tidak cocok!';
        notif.classList.remove('d-none');
        return false;
    }

    // --- VALIDASI USERNAME DUPLIKAT ---
    var usernameAda = dataLoginUser.some(function(u) {
        return u.username === username;
    });
    if (usernameAda) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Username sudah digunakan. Silakan pilih username lain.';
        notif.classList.remove('d-none');
        return false;
    }

    // --- VALIDASI KODE REFERRAL (jika diisi) ---
    var eoId = null;
    if (kodeReferral) {
        var foundEO = dataEO.find(function(eo) {
            return eo.kodeReferral === kodeReferral && eo.status === 'Aktif';
        });
        if (!foundEO) {
            notif.className = 'alert alert-warning';
            notif.innerHTML = 'Kode referral tidak valid atau EO/Organisasi tidak aktif!';
            notif.classList.remove('d-none');
            return false;
        }
        eoId = foundEO.id;
    }

    // --- GENERATE ID OTOMATIS (ambil dari input yang sudah diisi oleh cekRolePendaftaran) ---
    var idOtomatis = document.getElementById('idOtomatis').value;
    if (!idOtomatis) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'ID otomatis belum terisi. Pilih role terlebih dahulu.';
        notif.classList.remove('d-none');
        return false;
    }

    // --- TENTUKAN ROLE DISPLAY DAN KODE ROLE ---
    var roleDisplay = '';
    var kodeRole = '';
    switch(role) {
        case 'TK': roleDisplay = 'Toko'; kodeRole = 'TK'; break;
        case 'OJ': roleDisplay = 'Ojek'; kodeRole = 'OJ'; break;
        case 'PP': roleDisplay = 'Pedagang Pasar'; kodeRole = 'PP'; break;
        case 'PM': roleDisplay = 'Pedagang Makanan'; kodeRole = 'PM'; break;
        case 'COD': roleDisplay = 'COD Seller'; kodeRole = 'COD'; break;
        case 'CT': roleDisplay = 'Customer'; kodeRole = 'CT'; break;
        case 'GR': roleDisplay = 'Grosir'; kodeRole = 'GR'; break;
        default: roleDisplay = 'Customer'; kodeRole = 'CT';
    }

    // --- SIMPAN FOTO KTP (jika ada) ---
    var fotoKtpUrl = '';
    if (fotoKtp) {
        // Konversi ke base64 (simulasi)
        var reader = new FileReader();
        reader.onload = function(e) {
            fotoKtpUrl = e.target.result;
            simpanAkunBaru();
        };
        reader.readAsDataURL(fotoKtp);
        return false; // tunggu proses async
    } else {
        simpanAkunBaru();
    }

    function simpanAkunBaru() {
        // ============================================================
        // JIKA ROLE CUSTOMER (CT) - LANGSUNG AKTIF
        // ============================================================
        if (role === 'CT') {
            dataAkunAktif.push({
                id: idOtomatis,
                nama: nama,
                role: roleDisplay,
                username: username,
                password: password,
                hp: hp,
                email: email,
                alamat: alamat,
                alamatKtp: alamat,
                lat: lat,
                lng: lng,
                status: 'Aktif',
                nik_ktp: nik,
                eoId: eoId,
                statusLangganan: 'Free'
            });

            dataLoginUser.push({
                username: username,
                password: password,
                nama: nama,
                role: roleDisplay,
                kodeRole: kodeRole,
                idUser: idOtomatis,
                statusVerifikasi: 'Aktif',
                hp: hp,
                email: email,
                alamat: alamat,
                alamatKtp: alamat,
                lat: lat,
                lng: lng,
                nik_ktp: nik,
                eoId: eoId,
                statusLangganan: 'Free'
            });

            localStorage.setItem('profil_' + idOtomatis, JSON.stringify({
                namaToko: nama,
                namaLengkap: nama,
                nikKtp: nik,
                email: email,
                hp: hp,
                alamat: alamat,
                alamatKtp: alamat,
                fotoUrl: fotoKtpUrl,
                dragX: 0,
                dragY: 0
            }));

            notif.className = 'alert alert-success';
            notif.innerHTML = 'Pendaftaran Customer berhasil! Akun langsung AKTIF.';
            notif.classList.remove('d-none');

            resetFormDaftar();
            simpanDataKeLocalStorage();
        }
        // ============================================================
        // JIKA ROLE SELLER / GROSIR - MENUNGGU PERSETUJUAN
        // ============================================================
        else {
            dataPending.push({
                id: idOtomatis,
                nama: nama,
                role: roleDisplay,
                hp: hp,
                email: email,
                tgl: new Date().toISOString().split('T')[0],
                status: 'Pending'
            });

            dataLoginUser.push({
                username: username,
                password: password,
                nama: nama,
                role: roleDisplay,
                kodeRole: kodeRole,
                idUser: idOtomatis,
                statusVerifikasi: 'Pending',
                hp: hp,
                email: email,
                alamat: alamat,
                alamatKtp: alamat,
                lat: lat,
                lng: lng,
                nik_ktp: nik,
                eoId: eoId,
                statusLangganan: 'Free'
            });

            localStorage.setItem('profil_' + idOtomatis, JSON.stringify({
                namaToko: nama,
                namaLengkap: nama,
                nikKtp: nik,
                email: email,
                hp: hp,
                alamat: alamat,
                alamatKtp: alamat,
                fotoUrl: fotoKtpUrl,
                dragX: 0,
                dragY: 0
            }));

            notif.className = 'alert alert-info';
            notif.innerHTML = 'Pendaftaran berhasil dikirim. Menunggu persetujuan Admin.';
            notif.classList.remove('d-none');

            resetFormDaftar();
            simpanDataKeLocalStorage();
        }
    }

    return false;
}

// ============================================================
// 5. FUNGSI AJUKAN PENDAFTARAN (MENGIRIM KE PENGAJUAN BUKA AKUN)
// ============================================================
function ajukanPendaftaran() {
    var notif = document.getElementById('notifikasiDaftar');

    // --- VALIDASI FORM ---
    var role = document.getElementById('roleAkun').value;
    var nama = document.getElementById('namaLengkap').value.trim();
    var hp = document.getElementById('nomorHp').value.trim();
    var email = document.getElementById('email').value.trim();
    var alamat = document.getElementById('alamat').value.trim();
    var username = document.getElementById('usernameDaftar').value.trim();
    var password = document.getElementById('passwordDaftar').value;
    var konfirmasi = document.getElementById('konfirmasiPassword').value;
    var nik = document.getElementById('nikKtp').value.trim();
    var lat = document.getElementById('latitude').value;
    var lng = document.getElementById('longitude').value;
    var setuju = document.getElementById('setujuSyarat').checked;

    if (!role || !nama || !hp || !email || !alamat || !username || !password || !lat || !lng || !setuju) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Semua field wajib diisi, termasuk koordinat lokasi dan persetujuan syarat!';
        notif.classList.remove('d-none');
        return;
    }

    if (password !== konfirmasi) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Password dan konfirmasi tidak cocok!';
        notif.classList.remove('d-none');
        return;
    }

    // --- BUAT OBJEK PENGAJUAN ---
    var pengajuan = {
        id: 'PENGAJUAN-' + Date.now(),
        id_otomatis: document.getElementById('idOtomatis').value || '',
        nama: nama,
        role: role,
        hp: hp,
        email: email,
        alamat: alamat,
        alamatKtp: alamat,
        lat: lat,
        lng: lng,
        nik: nik,
        username: username,
        password: password,
        tgl: new Date().toISOString().split('T')[0],
        status: 'Menunggu'
    };

    // --- SIMPAN KE DATA PENGAJUAN BUKA AKUN ---
    dataPengajuanBukaAkun.push(pengajuan);
    localStorage.setItem('dataPengajuanBukaAkun', JSON.stringify(dataPengajuanBukaAkun));

    // --- NOTIFIKASI SUKSES ---
    notif.className = 'alert alert-success';
    notif.innerHTML = '✅ Pengajuan berhasil dikirim ke Admin. Tunggu persetujuan.';
    notif.classList.remove('d-none');

    // --- RESET FORM ---
    resetFormDaftar();
}
</script>
