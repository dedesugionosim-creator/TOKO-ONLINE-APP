<!-- ═══════════════════════════════════════════════════════════ -->
<!-- BLOK R 10.38 – PENYIMPANAN MEDIA (JS HANDLER) -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script>
(function BLOK_R_10_38_PENYIMPANAN_MEDIA() {
    if (window._blokR1038Done) {
        console.log('ℹ️ BLOK 10.38 sudah terpasang.');
        return;
    }
    window._blokR1038Done = true;

    var pmHapusTabAktif = 'kategori';
    var pmDetailIdAktif = null;

    // ═══════════════════════════════════════════════════════════
    // HELPER
    // ═══════════════════════════════════════════════════════════
    function pmEsc(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    function pmSetText(id, val) {
        var el = document.getElementById(id);
        if (el) el.textContent = val;
    }

    function pmSetVal(id, val) {
        var el = document.getElementById(id);
        if (el) el.value = val;
    }

    function pmGetVal(id) {
        var el = document.getElementById(id);
        return el ? el.value : '';
    }

    function pmRupiahKB(kb) {
        if (kb >= 1024) return (Math.round(kb / 1024 * 100) / 100) + ' MB';
        return Math.round(kb * 10) / 10 + ' KB';
    }

    function pmTgl(iso) {
        if (!iso) return '-';
        try {
            return new Date(iso).toLocaleString('id-ID', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit', hour12: false
            });
        } catch (e) { return '-'; }
    }

    // ═══════════════════════════════════════════════════════════
    // (1) TAMPILKAN HALAMAN
    // ═══════════════════════════════════════════════════════════
    window.tampilkanPenyimpananMedia = function() {
        try {
            if (typeof tutupMenu === 'function') tutupMenu();

            var konten = document.getElementById('kontenDasbor');
            if (!konten) return;
            if (!kontenAsliDasbor) kontenAsliDasbor = konten.innerHTML;

            if (!window._tplPenyimpananMedia) {
                var c = document.getElementById('penyimpananMediaContainer');
                if (!c) {
                    if (typeof tampilkanPlaceholderMenu === 'function') {
                        tampilkanPlaceholderMenu('Penyimpanan Media', '10.38');
                    }
                    return;
                }
                window._tplPenyimpananMedia = c.innerHTML;
                c.remove();
            }

            konten.innerHTML = window._tplPenyimpananMedia;

            setTimeout(function() {
                pmIsiDropdownKategori();
                pmRenderStatistik();
                pmRenderLastSync();
                pmRenderGrid();

                // Auto-scan kalau library kosong atau > 1 jam
                pmAutoScanJikaPerlu();

                console.log('✅ BLOK 10.38 — Penyimpanan Media rendered');
            }, 200);
        } catch (e) {
            console.error('tampilkanPenyimpananMedia error:', e);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (2) AUTO-SCAN JIKA PERLU
    // ═══════════════════════════════════════════════════════════
    function pmAutoScanJikaPerlu() {
        var lib = (typeof getMediaLibraryGlobal === 'function')
            ? getMediaLibraryGlobal() : { items: [], lastSyncAt: null };

        var perluScan = false;
        if (!lib.items || lib.items.length === 0) perluScan = true;
        else if (!lib.lastSyncAt) perluScan = true;
        else {
            var elapsed = Date.now() - new Date(lib.lastSyncAt).getTime();
            if (elapsed > 60 * 60 * 1000) perluScan = true;
        }

        if (perluScan) {
            setTimeout(function() {
                pmSinkronisasi(true);
            }, 500);
        }
    }

    // ═══════════════════════════════════════════════════════════
    // (3) SINKRONISASI
    // ═══════════════════════════════════════════════════════════
    window.pmSinkronisasi = function(silent) {
        if (!silent) {
            if (!confirm('Scan semua media dari sistem?\n\n' +
                         'Proses bisa memakan 2-5 detik tergantung jumlah data.')) {
                return;
            }
        }

        try {
            var hasil = (typeof sinkronisasiMediaLibrary === 'function')
                ? sinkronisasiMediaLibrary()
                : { sukses: false, pesan: 'Fungsi sync tidak tersedia.' };

            if (hasil.sukses) {
                pmIsiDropdownKategori();
                pmRenderStatistik();
                pmRenderLastSync();
                pmRenderGrid();

                if (!silent) {
                    alert('✅ Sinkronisasi selesai!\n\n' +
                        'Total: ' + hasil.total + ' media\n' +
                        'Baru: ' + hasil.baru + '\n' +
                        'Duplikat: ' + hasil.duplikat);
                }
            } else {
                if (!silent) alert('❌ ' + hasil.pesan);
            }
        } catch (e) {
            console.error('pmSinkronisasi error:', e);
            if (!silent) alert('❌ Error: ' + e.message);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (4) ISI DROPDOWN KATEGORI
    // ═══════════════════════════════════════════════════════════
    function pmIsiDropdownKategori() {
        var sel = document.getElementById('pmFilterKategori');
        if (!sel) return;

        var lib = (typeof getMediaLibraryGlobal === 'function')
            ? getMediaLibraryGlobal() : { items: [] };

        var kategori = {};
        lib.items.forEach(function(m) {
            var k = m.kategori || 'manual';
            kategori[k] = (kategori[k] || 0) + 1;
        });

        var labels = window.MEDIA_KATEGORI_LABEL || {};

        var html = '<option value="">Semua Kategori</option>';
        Object.keys(kategori).sort().forEach(function(k) {
            var info = labels[k] || { label: k };
            html += '<option value="' + pmEsc(k) + '">' +
                    pmEsc(info.label) + ' (' + kategori[k] + ')' +
                    '</option>';
        });
        sel.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════════════
    // (5) RENDER STATISTIK
    // ═══════════════════════════════════════════════════════════
    function pmRenderStatistik() {
        var stat = (typeof hitungStatistikMediaLibrary === 'function')
            ? hitungStatistikMediaLibrary() : null;
        if (!stat) return;

        pmSetText('pmStatTotal', stat.total);
        pmSetText('pmStatFoto', stat.totalFoto);
        pmSetText('pmStatVideo', stat.totalVideo);
        pmSetText('pmStatUkuran', pmRupiahKB(stat.totalKB));
    }

    // ═══════════════════════════════════════════════════════════
    // (6) RENDER LAST SYNC
    // ═══════════════════════════════════════════════════════════
    function pmRenderLastSync() {
        var lib = (typeof getMediaLibraryGlobal === 'function')
            ? getMediaLibraryGlobal() : { lastSyncAt: null };

        pmSetText('pmLastSync',
            lib.lastSyncAt ? pmTgl(lib.lastSyncAt) : 'Belum pernah');
    }

    // ═══════════════════════════════════════════════════════════
    // (7) RENDER GRID MEDIA
    // ═══════════════════════════════════════════════════════════
    window.pmRenderGrid = function() {
        var grid = document.getElementById('pmGridMedia');
        if (!grid) return;

        try {
            var cari = (pmGetVal('pmFilterCari') || '').toLowerCase().trim();
            var filterTipe = pmGetVal('pmFilterTipe');
            var filterKategori = pmGetVal('pmFilterKategori');
            var filterSumber = pmGetVal('pmFilterSumber');
            var hanyaFavorit = document.getElementById('pmFilterFavorit')?.checked || false;

            var hasil = (typeof cariMediaLibrary === 'function')
                ? cariMediaLibrary({
                    cari: cari,
                    tipe: filterTipe,
                    kategori: filterKategori,
                    sumber: filterSumber,
                    hanyaFavorit: hanyaFavorit
                }) : [];

            pmSetText('pmInfoJumlah', hasil.length + ' media');

            if (hasil.length === 0) {
                var lib = getMediaLibraryGlobal();
                var isEmpty = lib.items.length === 0;
                grid.innerHTML =
                    '<div class="col-12 text-center text-white py-5">' +
                        '<i class="fas fa-photo-video fa-4x d-block mb-3 opacity-50"></i>' +
                        '<h5>' + (isEmpty ? 'Library Kosong' : 'Tidak Ada Media Cocok') + '</h5>' +
                        '<p class="small">' +
                            (isEmpty
                                ? 'Klik tombol <strong>Scan / Sync</strong> untuk memuat media dari sistem.'
                                : 'Coba ubah filter atau reset.') +
                        '</p>' +
                    '</div>';
                return;
            }

            var labels = window.MEDIA_KATEGORI_LABEL || {};
            var html = '';

            hasil.forEach(function(m) {
                var url = (typeof ambilDataMedia === 'function')
                    ? ambilDataMedia(m) : null;

                var mediaHtml = '';
                if (url) {
                    if (m.tipe === 'video') {
                        mediaHtml =
                            '<video src="' + url + '" ' +
                                   'style="width:100%;height:160px;object-fit:cover;background:#000;" ' +
                                   'muted preload="metadata"></video>' +
                            '<div style="position:absolute;top:50%;left:50%;' +
                                 'transform:translate(-50%,-50%);pointer-events:none;">' +
                                '<i class="fas fa-play-circle text-white" ' +
                                   'style="font-size:42px;text-shadow:0 2px 8px rgba(0,0,0,0.5);"></i>' +
                            '</div>';
                    } else {
                        mediaHtml =
                            '<img src="' + url + '" ' +
                                 'style="width:100%;height:160px;object-fit:cover;background:#000;" ' +
                                 'loading="lazy" ' +
                                 'onerror="this.style.opacity=0.3;">';
                    }
                } else {
                    mediaHtml =
                        '<div style="height:160px;background:#f0f0f0;display:flex;' +
                             'align-items:center;justify-content:center;">' +
                            '<i class="fas fa-image text-muted" style="font-size:36px;"></i>' +
                        '</div>';
                }

                var infoKat = labels[m.kategori] || { label: m.kategori || 'Manual', warna: '#6C757D', ikon: 'fas fa-file' };
                var badgeFavorit = m.favorit
                    ? '<span style="position:absolute;top:6px;right:6px;background:rgba(255,193,7,0.95);' +
                      'border-radius:50%;width:28px;height:28px;display:flex;' +
                      'align-items:center;justify-content:center;">' +
                        '<i class="fas fa-star text-dark"></i></span>'
                    : '';
                var badgeTipe = m.tipe === 'video'
                    ? '<span class="badge bg-danger" style="position:absolute;bottom:6px;left:6px;">' +
                        '<i class="fas fa-video me-1"></i>Video</span>'
                    : '<span class="badge bg-success" style="position:absolute;bottom:6px;left:6px;">' +
                        '<i class="fas fa-image me-1"></i>Foto</span>';

                var idEsc = (m.id || '').replace(/'/g, "\\'");

                html +=
                '<div class="col-md-4 col-lg-3 col-6">' +
                    '<div class="card border-0 shadow-sm h-100" style="overflow:hidden;">' +
                        '<div style="position:relative;cursor:pointer;" ' +
                             'onclick="pmBukaDetail(\'' + idEsc + '\')">' +
                            mediaHtml +
                            badgeFavorit +
                            badgeTipe +
                        '</div>' +
                        '<div class="card-body p-2">' +
                            '<div class="d-flex align-items-start justify-content-between gap-1 mb-1">' +
                                '<strong class="small text-truncate" style="flex:1;min-width:0;" ' +
                                        'title="' + pmEsc(m.nama) + '">' +
                                    pmEsc((m.nama || '-').substring(0, 40)) +
                                '</strong>' +
                            '</div>' +
                            '<div class="d-flex flex-wrap gap-1 mb-1">' +
                                '<span class="badge" style="background:' + infoKat.warna + ';font-size:9px;">' +
                                    '<i class="' + infoKat.ikon + ' me-1"></i>' +
                                    pmEsc(infoKat.label) +
                                '</span>' +
                            '</div>' +
                            '<div class="d-flex justify-content-between align-items-center small text-muted">' +
                                '<span>' + pmRupiahKB(m.ukuran || 0) + '</span>' +
                                '<span class="text-truncate" style="max-width:60%;" ' +
                                      'title="' + pmEsc(m.namaUser || '-') + '">' +
                                    '<i class="fas fa-user me-1"></i>' +
                                    pmEsc((m.namaUser || '-').substring(0, 15)) +
                                '</span>' +
                            '</div>' +
                            '<div class="d-flex gap-1 mt-2">' +
                                '<button class="btn btn-sm btn-outline-primary flex-fill" ' +
                                        'onclick="pmBukaDetail(\'' + idEsc + '\')" title="Detail">' +
                                    '<i class="fas fa-eye"></i>' +
                                '</button>' +
                                '<button class="btn btn-sm btn-outline-warning flex-fill" ' +
                                        'onclick="pmBukaEdit(\'' + idEsc + '\')" title="Edit">' +
                                    '<i class="fas fa-edit"></i>' +
                                '</button>' +
                                '<button class="btn btn-sm btn-outline-danger flex-fill" ' +
                                        'onclick="pmHapusSingle(\'' + idEsc + '\')" title="Hapus">' +
                                    '<i class="fas fa-trash"></i>' +
                                '</button>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            });

            grid.innerHTML = html;
        } catch (e) {
            console.error('pmRenderGrid error:', e);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (8) RESET FILTER
    // ═══════════════════════════════════════════════════════════
    window.pmResetFilter = function() {
        pmSetVal('pmFilterCari', '');
        pmSetVal('pmFilterTipe', '');
        pmSetVal('pmFilterKategori', '');
        pmSetVal('pmFilterSumber', '');
        var chk = document.getElementById('pmFilterFavorit');
        if (chk) chk.checked = false;
        pmRenderGrid();
    };

    // ═══════════════════════════════════════════════════════════
    // (9) EXPORT CSV
    // ═══════════════════════════════════════════════════════════
    window.pmExportCSV = function() {
        var cari = (pmGetVal('pmFilterCari') || '').toLowerCase().trim();
        var filterTipe = pmGetVal('pmFilterTipe');
        var filterKategori = pmGetVal('pmFilterKategori');
        var filterSumber = pmGetVal('pmFilterSumber');
        var hanyaFavorit = document.getElementById('pmFilterFavorit')?.checked || false;

        var hasil = cariMediaLibrary({
            cari: cari,
            tipe: filterTipe,
            kategori: filterKategori,
            sumber: filterSumber,
            hanyaFavorit: hanyaFavorit
        });

        if (typeof exportMediaLibraryCSV === 'function') {
            exportMediaLibraryCSV(hasil);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (10) BUKA MODAL UPLOAD
    // ═══════════════════════════════════════════════════════════
    window.pmBukaModalUpload = function() {
        pmSetVal('pmUploadNama', '');
        pmSetVal('pmUploadKategori', 'logo');
        pmSetVal('pmUploadCatatan', '');
        var fileInput = document.getElementById('pmUploadFile');
        if (fileInput) fileInput.value = '';
        var preview = document.getElementById('pmUploadPreview');
        if (preview) preview.innerHTML = '';
        var notif = document.getElementById('pmUploadNotif');
        if (notif) notif.classList.add('d-none');

        new bootstrap.Modal(document.getElementById('modalPMUpload')).show();
    };

    // ═══════════════════════════════════════════════════════════
    // (11) PREVIEW UPLOAD
    // ═══════════════════════════════════════════════════════════
    window.pmPreviewUpload = function(input) {
        var file = input.files && input.files[0];
        if (!file) return;

        var preview = document.getElementById('pmUploadPreview');
        if (!preview) return;

        // Validasi dasar
        if (file.size > 500 * 1024) {
            preview.innerHTML = '<div class="alert alert-warning small">' +
                '⚠️ File > 500 KB. Foto akan dikompres otomatis. Video harus ≤ 500 KB.' +
                '</div>';
        } else {
            preview.innerHTML = '<div class="alert alert-info small">' +
                '<i class="fas fa-info-circle me-1"></i>' +
                'File: <strong>' + pmEsc(file.name) + '</strong> (' +
                Math.round(file.size / 1024) + ' KB)' +
                '</div>';
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (12) PROSES UPLOAD MANUAL
    // ═══════════════════════════════════════════════════════════
    window.pmProsesUpload = function() {
        var notif = document.getElementById('pmUploadNotif');
        var nama = pmGetVal('pmUploadNama').trim();
        var kategori = pmGetVal('pmUploadKategori');
        var catatan = pmGetVal('pmUploadCatatan').trim();
        var fileInput = document.getElementById('pmUploadFile');
        var file = fileInput && fileInput.files ? fileInput.files[0] : null;

        if (!nama) {
            notif.className = 'alert alert-warning';
            notif.innerHTML = '⚠️ Nama media wajib diisi.';
            notif.classList.remove('d-none');
            return;
        }
        if (!file) {
            notif.className = 'alert alert-warning';
            notif.innerHTML = '⚠️ Pilih file dulu.';
            notif.classList.remove('d-none');
            return;
        }

        notif.className = 'alert alert-info';
        notif.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Memproses file...';
        notif.classList.remove('d-none');

        var tipe = file.type.indexOf('video') === 0 ? 'video' : 'foto';

        kompresFileMedia(file, 500, tipe).then(function(res) {
            if (!res.sukses) {
                notif.className = 'alert alert-danger';
                notif.innerHTML = '❌ ' + res.pesan;
                return;
            }

            var hasil = tambahMediaManual({
                nama: nama,
                dataUrl: res.base64,
                kategori: kategori,
                catatan: catatan
            });

            if (hasil.sukses) {
                notif.className = 'alert alert-success';
                notif.innerHTML = '✅ Media berhasil disimpan!';

                setTimeout(function() {
                    var modal = bootstrap.Modal.getInstance(
                        document.getElementById('modalPMUpload'));
                    if (modal) modal.hide();

                    pmIsiDropdownKategori();
                    pmRenderStatistik();
                    pmRenderGrid();
                }, 1200);
            } else {
                notif.className = 'alert alert-danger';
                notif.innerHTML = '❌ ' + hasil.pesan;
            }
        }).catch(function(err) {
            notif.className = 'alert alert-danger';
            notif.innerHTML = '❌ ' + (err.pesan || err.message || 'Gagal proses file.');
        });
    };

    // ═══════════════════════════════════════════════════════════
    // (13) BUKA DETAIL
    // ═══════════════════════════════════════════════════════════
    window.pmBukaDetail = function(idMedia) {
        var lib = getMediaLibraryGlobal();
        var item = lib.items.find(function(m) { return m.id === idMedia; });
        if (!item) { alert('Media tidak ditemukan.'); return; }

        pmDetailIdAktif = idMedia;

        var body = document.getElementById('pmDetailBody');
        if (!body) return;

        var url = (typeof ambilDataMedia === 'function') ? ambilDataMedia(item) : null;
        var labels = window.MEDIA_KATEGORI_LABEL || {};
        var infoKat = labels[item.kategori] || { label: item.kategori, warna: '#6C757D', ikon: 'fas fa-file' };

        var mediaHtml = '';
        if (url) {
            if (item.tipe === 'video') {
                mediaHtml = '<video src="' + url + '" controls ' +
                            'style="width:100%;max-height:400px;border-radius:8px;background:#000;"></video>';
            } else {
                mediaHtml = '<img src="' + url + '" class="img-fluid rounded" ' +
                            'style="max-height:400px;width:100%;object-fit:contain;background:#000;">';
            }
        } else {
            mediaHtml = '<div class="alert alert-warning small">Preview tidak tersedia (data sumber hilang).</div>';
        }

        var html = '';
        html += '<div class="text-center mb-3">' + mediaHtml + '</div>';

        html += '<table class="table table-sm table-borderless small">';
        html += '<tr><td class="fw-bold text-muted" style="width:130px;">ID</td><td><code>' + pmEsc(item.id) + '</code></td></tr>';
        html += '<tr><td class="fw-bold text-muted">Nama</td><td>' + pmEsc(item.nama) + '</td></tr>';
        html += '<tr><td class="fw-bold text-muted">Tipe</td><td>' +
            (item.tipe === 'video'
                ? '<span class="badge bg-danger">Video</span>'
                : '<span class="badge bg-success">Foto</span>') + '</td></tr>';
        html += '<tr><td class="fw-bold text-muted">Kategori</td><td>' +
            '<span class="badge" style="background:' + infoKat.warna + ';">' +
            pmEsc(infoKat.label) + '</span></td></tr>';
        html += '<tr><td class="fw-bold text-muted">Sumber</td><td>' +
            (item.sumber === 'user' ? 'User' : 'Sistem') + '</td></tr>';
        html += '<tr><td class="fw-bold text-muted">Pemilik</td><td>' +
            pmEsc(item.namaUser || '-') +
            ' <span class="badge bg-secondary">' + pmEsc(item.role || '-') + '</span></td></tr>';
        if (item.idUser) {
            html += '<tr><td class="fw-bold text-muted">ID User</td><td><code>' + pmEsc(item.idUser) + '</code></td></tr>';
        }
        if (item.refId) {
            html += '<tr><td class="fw-bold text-muted">Ref ID</td><td><code>' + pmEsc(item.refId) + '</code></td></tr>';
        }
        html += '<tr><td class="fw-bold text-muted">Ukuran</td><td>' + pmRupiahKB(item.ukuran || 0) + '</td></tr>';
        html += '<tr><td class="fw-bold text-muted">Favorit</td><td>' +
            (item.favorit ? '⭐ Ya' : 'Tidak') + '</td></tr>';
        html += '<tr><td class="fw-bold text-muted">Dibuat</td><td>' + pmTgl(item.createdAt) + '</td></tr>';
        if (item.catatan) {
            html += '<tr><td class="fw-bold text-muted">Catatan</td><td>' + pmEsc(item.catatan) + '</td></tr>';
        }
        html += '</table>';

        body.innerHTML = html;
        new bootstrap.Modal(document.getElementById('modalPMDetail')).show();
    };

    // ═══════════════════════════════════════════════════════════
    // (14) HAPUS DARI DETAIL
    // ═══════════════════════════════════════════════════════════
    window.pmHapusDariDetail = function() {
        if (!pmDetailIdAktif) return;
        if (!confirm('Hapus media ini dari library?\n\n' +
                     'Data asli di sistem TIDAK dihapus.')) return;

        var hasil = hapusMediaLibrary(pmDetailIdAktif);
        if (hasil.sukses) {
            var modal = bootstrap.Modal.getInstance(document.getElementById('modalPMDetail'));
            if (modal) modal.hide();

            pmIsiDropdownKategori();
            pmRenderStatistik();
            pmRenderGrid();
        } else {
            alert('❌ ' + hasil.pesan);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (15) BUKA MODAL EDIT
    // ═══════════════════════════════════════════════════════════
    window.pmBukaEdit = function(idMedia) {
        var lib = getMediaLibraryGlobal();
        var item = lib.items.find(function(m) { return m.id === idMedia; });
        if (!item) { alert('Media tidak ditemukan.'); return; }

        pmSetVal('pmEditId', idMedia);
        pmSetVal('pmEditNama', item.nama || '');
        pmSetVal('pmEditCatatan', item.catatan || '');

        // Isi dropdown kategori
        var selKat = document.getElementById('pmEditKategori');
        if (selKat) {
            var labels = window.MEDIA_KATEGORI_LABEL || {};
            var html = '';
            Object.keys(labels).forEach(function(k) {
                html += '<option value="' + pmEsc(k) + '">' + pmEsc(labels[k].label) + '</option>';
            });
            selKat.innerHTML = html;
            selKat.value = item.kategori || 'manual';
        }

        var chk = document.getElementById('pmEditFavorit');
        if (chk) chk.checked = !!item.favorit;

        var notif = document.getElementById('pmEditNotif');
        if (notif) notif.classList.add('d-none');

        new bootstrap.Modal(document.getElementById('modalPMEdit')).show();
    };

    // ═══════════════════════════════════════════════════════════
    // (16) PROSES EDIT
    // ═══════════════════════════════════════════════════════════
    window.pmProsesEdit = function() {
        var notif = document.getElementById('pmEditNotif');
        var idMedia = pmGetVal('pmEditId');

        var payload = {
            nama:     pmGetVal('pmEditNama').trim(),
            kategori: pmGetVal('pmEditKategori'),
            catatan:  pmGetVal('pmEditCatatan').trim(),
            favorit:  document.getElementById('pmEditFavorit')?.checked || false
        };

        var hasil = updateMediaLibrary(idMedia, payload);
        if (hasil.sukses) {
            notif.className = 'alert alert-success';
            notif.innerHTML = '✅ Perubahan tersimpan.';

            setTimeout(function() {
                var modal = bootstrap.Modal.getInstance(document.getElementById('modalPMEdit'));
                if (modal) modal.hide();

                pmIsiDropdownKategori();
                pmRenderGrid();
            }, 1000);
        } else {
            notif.className = 'alert alert-danger';
            notif.innerHTML = '❌ ' + hasil.pesan;
            notif.classList.remove('d-none');
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (17) HAPUS SINGLE (DARI GRID)
    // ═══════════════════════════════════════════════════════════
    window.pmHapusSingle = function(idMedia) {
        if (!confirm('Hapus media ini dari library?\n\n' +
                     'Data asli di sistem TIDAK dihapus.\n' +
                     'Media akan muncul lagi saat scan berikutnya.')) return;

        var hasil = hapusMediaLibrary(idMedia);
        if (hasil.sukses) {
            pmIsiDropdownKategori();
            pmRenderStatistik();
            pmRenderGrid();
        } else {
            alert('❌ ' + hasil.pesan);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (18) BUKA MODAL HAPUS MANUAL
    // ═══════════════════════════════════════════════════════════
    window.pmBukaModalHapus = function() {
        pmHapusSetTab('kategori');
        new bootstrap.Modal(document.getElementById('modalPMHapus')).show();
    };

    // ═══════════════════════════════════════════════════════════
    // (19) SET TAB HAPUS
    // ═══════════════════════════════════════════════════════════
    window.pmHapusSetTab = function(tab) {
        pmHapusTabAktif = tab;

        document.querySelectorAll('#pmHapusTabs .nav-link').forEach(function(a) {
            if (a.getAttribute('data-pm-tab') === tab) a.classList.add('active');
            else a.classList.remove('active');
        });

        var container = document.getElementById('pmHapusTabContent');
        if (!container) return;

        if (tab === 'kategori')      container.innerHTML = pmRenderHapusKategori();
        else if (tab === 'tipe')     container.innerHTML = pmRenderHapusTipe();
        else if (tab === 'user')     container.innerHTML = pmRenderHapusUser();
        else if (tab === 'umur')     container.innerHTML = pmRenderHapusUmur();
        else if (tab === 'besar')    container.innerHTML = pmRenderHapusBesar();
    };

    // ── TAB: Per Kategori ──
    function pmRenderHapusKategori() {
        var rekap = getRekapMediaUntukHapus();
        var labels = window.MEDIA_KATEGORI_LABEL || {};

        var keys = Object.keys(rekap.perKategori).sort();
        if (keys.length === 0) {
            return '<p class="text-muted text-center py-4">Library kosong.</p>';
        }

        var html = '<div class="alert alert-light border small">' +
            '<i class="fas fa-info-circle me-1"></i>' +
            'Pilih kategori yang ingin dihapus. Semua media dalam kategori tsb akan dihapus dari library.' +
            '</div>';

        html += '<div class="list-group">';
        keys.forEach(function(k) {
            var info = labels[k] || { label: k, warna: '#6C757D', ikon: 'fas fa-file' };
            var d = rekap.perKategori[k];

            html +=
                '<div class="list-group-item d-flex justify-content-between align-items-center">' +
                    '<div>' +
                        '<i class="' + info.ikon + ' me-1" style="color:' + info.warna + ';"></i>' +
                        '<strong>' + pmEsc(info.label) + '</strong>' +
                        '<br>' +
                        '<small class="text-muted">' +
                            d.jumlah + ' media • ' + pmRupiahKB(d.kb) +
                        '</small>' +
                    '</div>' +
                    '<button class="btn btn-sm btn-danger" ' +
                            'onclick="pmProsesHapusKategori(\'' + pmEsc(k) + '\')">' +
                        '<i class="fas fa-trash me-1"></i>Hapus' +
                    '</button>' +
                '</div>';
        });
        html += '</div>';

        return html;
    }

    // ── TAB: Per Tipe ──
    function pmRenderHapusTipe() {
        var rekap = getRekapMediaUntukHapus();

        return '' +
        '<div class="alert alert-warning small">' +
            '<i class="fas fa-exclamation-triangle me-1"></i>' +
            'Hati-hati: akan menghapus SEMUA foto / video dari library.' +
        '</div>' +

        '<div class="row g-3">' +
            '<div class="col-md-6">' +
                '<div class="card border-0 shadow-sm">' +
                    '<div class="card-body text-center">' +
                        '<i class="fas fa-image fa-3x mb-2 text-success"></i>' +
                        '<h5 class="fw-bold mb-0">' + rekap.perTipe.foto + '</h5>' +
                        '<small class="text-muted">Total Foto</small>' +
                        '<button class="btn btn-danger w-100 mt-3" ' +
                                'onclick="pmProsesHapusTipe(\'foto\')">' +
                            '<i class="fas fa-trash me-1"></i>Hapus Semua Foto' +
                        '</button>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="col-md-6">' +
                '<div class="card border-0 shadow-sm">' +
                    '<div class="card-body text-center">' +
                        '<i class="fas fa-video fa-3x mb-2 text-danger"></i>' +
                        '<h5 class="fw-bold mb-0">' + rekap.perTipe.video + '</h5>' +
                        '<small class="text-muted">Total Video</small>' +
                        '<button class="btn btn-danger w-100 mt-3" ' +
                                'onclick="pmProsesHapusTipe(\'video\')">' +
                            '<i class="fas fa-trash me-1"></i>Hapus Semua Video' +
                        '</button>' +
                    '</div>' +
                '</div>' +
            '</div>' +
        '</div>';
    }

    // ── TAB: Per User ──
    function pmRenderHapusUser() {
        var rekap = getRekapMediaUntukHapus();
        var keys = Object.keys(rekap.perUser).sort(function(a, b) {
            return rekap.perUser[b].jumlah - rekap.perUser[a].jumlah;
        });

        if (keys.length === 0) {
            return '<p class="text-muted text-center py-4">Belum ada media user.</p>';
        }

        var html = '<div class="alert alert-info small">' +
            '<i class="fas fa-info-circle me-1"></i>' +
            'Hapus semua media milik user tertentu dari library.' +
            '</div>';

        html += '<div class="list-group" style="max-height:400px;overflow-y:auto;">';
        keys.slice(0, 100).forEach(function(idUser) {
            var u = rekap.perUser[idUser];
            var idEsc = idUser.replace(/'/g, "\\'");
            var namaEsc = (u.nama || idUser).replace(/'/g, "\\'");

            html +=
                '<div class="list-group-item d-flex justify-content-between align-items-center">' +
                    '<div style="flex:1;min-width:0;">' +
                        '<strong class="text-truncate d-block">' + pmEsc(u.nama) + '</strong>' +
                        '<small class="text-muted">' + pmEsc(u.role) + ' • ' + pmEsc(idUser) + '</small>' +
                        '<br>' +
                        '<small class="text-muted">' +
                            u.jumlah + ' media • ' + pmRupiahKB(u.kb) +
                        '</small>' +
                    '</div>' +
                    '<button class="btn btn-sm btn-danger ms-2" ' +
                            'onclick="pmProsesHapusUser(\'' + idEsc + '\', \'' + namaEsc + '\')">' +
                        '<i class="fas fa-trash me-1"></i>Hapus' +
                    '</button>' +
                '</div>';
        });
        html += '</div>';

        return html;
    }

    // ── TAB: Berdasarkan Umur ──
    function pmRenderHapusUmur() {
        return '' +
        '<div class="alert alert-info small">' +
            '<i class="fas fa-info-circle me-1"></i>' +
            'Hapus media yang lebih lama dari X hari.' +
        '</div>' +

        '<div class="mb-3">' +
            '<label class="fw-bold">Lebih lama dari (hari):</label>' +
            '<div class="input-group">' +
                '<input type="number" id="pmHapusUmur" class="form-control" ' +
                       'value="90" min="1" max="3650">' +
                '<span class="input-group-text">hari</span>' +
                '<button class="btn btn-outline-secondary" ' +
                        'onclick="pmPreviewHapusUmur()">' +
                    '<i class="fas fa-search"></i> Preview' +
                '</button>' +
            '</div>' +
        '</div>' +

        '<div class="form-check form-switch mb-3">' +
            '<input class="form-check-input" type="checkbox" id="pmHapusUmurFavorit">' +
            '<label class="form-check-label small" for="pmHapusUmurFavorit">' +
                'Lewati media favorit' +
            '</label>' +
        '</div>' +

        '<div id="pmHapusUmurPreview" class="alert alert-light border small">' +
            'Klik Preview untuk melihat berapa media yang akan dihapus.' +
        '</div>' +

        '<button class="btn btn-danger w-100" onclick="pmProsesHapusUmur()">' +
            '<i class="fas fa-trash me-1"></i>Hapus Media Lama' +
        '</button>';
    }

    // ── TAB: Terbesar ──
    function pmRenderHapusBesar() {
        var rekap = getRekapMediaUntukHapus();

        if (rekap.topBesar.length === 0) {
            return '<p class="text-muted text-center py-4">Belum ada media.</p>';
        }

        var html = '<div class="alert alert-warning small">' +
            '<i class="fas fa-exclamation-triangle me-1"></i>' +
            '10 media terbesar di library Anda.' +
            '</div>';

        html += '<div class="list-group">';
        rekap.topBesar.forEach(function(m) {
            var idEsc = (m.id || '').replace(/'/g, "\\'");

            html +=
                '<div class="list-group-item d-flex justify-content-between align-items-center">' +
                    '<div style="flex:1;min-width:0;">' +
                        '<strong class="text-truncate d-block small">' + pmEsc(m.nama) + '</strong>' +
                        '<small class="text-muted">' +
                            pmEsc(m.kategori) + ' • ' + pmEsc(m.tipe) +
                        '</small>' +
                    '</div>' +
                    '<div class="text-end me-2">' +
                        '<span class="badge bg-danger">' + pmRupiahKB(m.ukuran) + '</span>' +
                    '</div>' +
                    '<button class="btn btn-sm btn-outline-danger" ' +
                            'onclick="pmHapusSingle(\'' + idEsc + '\'); pmHapusSetTab(\'besar\');">' +
                        '<i class="fas fa-trash"></i>' +
                    '</button>' +
                '</div>';
        });
        html += '</div>';

        return html;
    }

    // ═══════════════════════════════════════════════════════════
    // (20) PROSES HAPUS PER KATEGORI
    // ═══════════════════════════════════════════════════════════
    window.pmProsesHapusKategori = function(kategori) {
        var preview = previewHapusMedia({ kategori: kategori });
        if (preview.jumlah === 0) {
            alert('Tidak ada media di kategori ini.');
            return;
        }

        if (!confirm('Hapus ' + preview.jumlah + ' media dari kategori "' + kategori + '"?\n\n' +
                     'Ukuran: ' + pmRupiahKB(preview.ukuranKB) + '\n\n' +
                     'Data asli di sistem TIDAK dihapus.')) return;

        var hasil = hapusMediaByKategori(kategori);
        if (hasil.sukses) {
            pmAfterHapus(hasil.dihapus + ' media kategori ' + kategori + ' dihapus');
        } else {
            alert('❌ ' + hasil.pesan);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (21) PROSES HAPUS PER TIPE
    // ═══════════════════════════════════════════════════════════
    window.pmProsesHapusTipe = function(tipe) {
        var preview = previewHapusMedia({ tipe: tipe });
        if (preview.jumlah === 0) {
            alert('Tidak ada media tipe ini.');
            return;
        }

        if (!confirm('⚠️ Hapus SEMUA ' + tipe.toUpperCase() + ' dari library?\n\n' +
                     'Total: ' + preview.jumlah + ' media\n' +
                     'Ukuran: ' + pmRupiahKB(preview.ukuranKB) + '\n\n' +
                     'Lanjut?')) return;

        var hasil = hapusMediaByTipe(tipe);
        if (hasil.sukses) {
            pmAfterHapus(hasil.dihapus + ' media tipe ' + tipe + ' dihapus');
        } else {
            alert('❌ ' + hasil.pesan);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (22) PROSES HAPUS PER USER
    // ═══════════════════════════════════════════════════════════
    window.pmProsesHapusUser = function(idUser, namaUser) {
        var preview = previewHapusMedia({ idUser: idUser });
        if (preview.jumlah === 0) {
            alert('Tidak ada media user ini.');
            return;
        }

        if (!confirm('Hapus ' + preview.jumlah + ' media milik "' + namaUser + '"?\n\n' +
                     'Ukuran: ' + pmRupiahKB(preview.ukuranKB) + '\n\n' +
                     'Lanjut?')) return;

        var hasil = hapusMediaByUser(idUser);
        if (hasil.sukses) {
            pmAfterHapus(hasil.dihapus + ' media milik ' + namaUser + ' dihapus');
        } else {
            alert('❌ ' + hasil.pesan);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (23) PREVIEW HAPUS UMUR
    // ═══════════════════════════════════════════════════════════
    window.pmPreviewHapusUmur = function() {
        var hari = parseInt(pmGetVal('pmHapusUmur'), 10) || 90;
        var hanyaTidakFavorit = document.getElementById('pmHapusUmurFavorit')?.checked || false;

        var preview = previewHapusMedia({
            hariMinimum: hari,
            hanyaTidakFavorit: hanyaTidakFavorit
        });

        var el = document.getElementById('pmHapusUmurPreview');
        if (el) {
            el.className = 'alert alert-info small';
            el.innerHTML =
                '<strong>' + preview.jumlah + ' media</strong> lebih lama dari ' +
                hari + ' hari<br>' +
                'Total ukuran: <strong>' + pmRupiahKB(preview.ukuranKB) + '</strong>';
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (24) PROSES HAPUS UMUR
    // ═══════════════════════════════════════════════════════════
    window.pmProsesHapusUmur = function() {
        var hari = parseInt(pmGetVal('pmHapusUmur'), 10) || 90;
        var hanyaTidakFavorit = document.getElementById('pmHapusUmurFavorit')?.checked || false;

        var preview = previewHapusMedia({
            hariMinimum: hari,
            hanyaTidakFavorit: hanyaTidakFavorit
        });

        if (preview.jumlah === 0) {
            alert('Tidak ada media > ' + hari + ' hari.');
            return;
        }

        if (!confirm('Hapus ' + preview.jumlah + ' media > ' + hari + ' hari?\n\n' +
                     'Ukuran: ' + pmRupiahKB(preview.ukuranKB) + '\n\nLanjut?')) return;

        var hasil = hapusMediaLama(hari, { hanyaTidakFavorit: hanyaTidakFavorit });
        if (hasil.sukses) {
            pmAfterHapus(hasil.dihapus + ' media lama dihapus');
        } else {
            alert('❌ ' + hasil.pesan);
        }
    };

    // ═══════════════════════════════════════════════════════════
    // (25) HELPER AFTER HAPUS
    // ═══════════════════════════════════════════════════════════
    function pmAfterHapus(pesan) {
        pmIsiDropdownKategori();
        pmRenderStatistik();
        pmRenderGrid();
        pmHapusSetTab(pmHapusTabAktif);

        var notif = document.getElementById('pmHapusNotif');
        if (notif) {
            notif.className = 'alert alert-success';
            notif.innerHTML = '✅ ' + pesan;
            notif.classList.remove('d-none');
            setTimeout(function() { notif.classList.add('d-none'); }, 3000);
        }
    }

    // ═══════════════════════════════════════════════════════════
    // (26) HANDLER MENU
    // ═══════════════════════════════════════════════════════════
    window.menuHandlers = window.menuHandlers || {};
    window.menuHandlers['tampilkanPenyimpananMedia'] = window.tampilkanPenyimpananMedia;

    // ═══════════════════════════════════════════════════════════
    // (27) AUTO-INJECT MENU KE menuConfig['SA']
    // ═══════════════════════════════════════════════════════════
    setTimeout(function() {
        if (typeof menuConfig === 'undefined' || !menuConfig['SA']) return;

        var menuSA = menuConfig['SA'].menu;
        var sudah = menuSA.some(function(m) {
            return m.aksi === 'tampilkanPenyimpananMedia';
        });
        if (sudah) return;

        // Cari index "Manajemen Template SKU" (10.38) → ganti
        var idxSKU = menuSA.findIndex(function(m) { return m.blok === '10.38'; });
        if (idxSKU !== -1) {
            menuSA[idxSKU] = {
                nama: 'Penyimpanan Media',
                ikon: 'fas fa-photo-video',
                blok: '10.38',
                aksi: 'tampilkanPenyimpananMedia'
            };
            console.log('✅ Menu 10.38 → "Penyimpanan Media" (replace)');
        } else {
            // Kalau tidak ada, insert setelah 10.45
            var idx = menuSA.findIndex(function(m) { return m.blok === '10.45'; });
            if (idx === -1) idx = menuSA.length - 1;
            menuSA.splice(idx + 1, 0, {
                nama: 'Penyimpanan Media',
                ikon: 'fas fa-photo-video',
                blok: '10.38',
                aksi: 'tampilkanPenyimpananMedia'
            });
            console.log('✅ Menu "Penyimpanan Media" di-inject');
        }
    }, 400);

    console.log('✅ BLOK R 10.38 — Penyimpanan Media (UI) terpasang.');
    console.log('   • Grid thumbnail + filter + auto-scan');
    console.log('   • 4 modal: Upload, Detail, Edit, Hapus Manual');
    console.log('   • Tab hapus: Kategori/Tipe/User/Umur/Terbesar');
    console.log('   • Handler: tampilkanPenyimpananMedia');
})();
</script>
