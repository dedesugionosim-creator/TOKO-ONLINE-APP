    // [FHF.0] — GUARD + DEP CHECK + SELF-REGISTER + CS_KEY
    // ═══════════════════════════════════════════════════════════
    if (window._fhfDoneV34) {
        console.log('ℹ️ BLOK FHF v3.4 sudah terpasang.');
        return;
    }
    if (!window.CS_ROLE_MAP) {
        console.warn('⚠️ BLOK FHF v3.4: CS_ROLE_MAP belum siap. Ditunda.');   // A12
        return;
    }
    if (!window.csLoadJSON || !window.csSaveJSON) {
        console.warn('⚠️ BLOK FHF v3.4: CS2 belum siap. Ditunda.');           // A12
        return;
    }
    if (typeof window.gidIdUser !== 'function') {
        console.warn('⚠️ BLOK FHF v3.4: GID belum siap. Ditunda.');           // A12
        return;
    }

    // A32 — guard 7 lapis
    window._fhfDoneV34 = true;   // ⭐ GUARD UTAMA v3.4
    window._fhfDoneV33 = true;   // alias
    window._fhfDoneV32 = true;
    window._fhfDoneV31 = true;
    window._fhfDoneV3  = true;
    window._fhfDoneV2  = true;
    window._fhfDoneV1  = true;
    window._fhfVersi   = '3.4';

    // [A43] Self-register ke BLOK_GUARD_MAP — dengan fallback manual lengkap
	if (typeof window.blokDaftarkanGuard === 'function') {
		try {
			window.blokDaftarkanGuard('_blok2DoneV41', '2');
			window.blokDaftarkanGuard('_blok2DoneV4', '2');
		} catch (e) {
			console.warn('[BLOK 2 v4.2] blokDaftarkanGuard warn:', e.message);
		}
	}
	// ✅ v4.2 FIX: fallback manual SELALU dipanggil (idempotent)
	// agar blok tetap terdeteksi health check walau 0.1.g.1 belum load
	window.BLOK_GUARD_MAP = window.BLOK_GUARD_MAP || {};
	window.BLOK_GUARD_MAP['_blok2DoneV41'] = '2';
	window.BLOK_GUARD_MAP['_blok2DoneV4']  = '2';

    // A18 — CS_KEY extend (safe)
    if (window.CS_KEY) {
        window.CS_KEY.HF_POSTS    = window.CS_KEY.HF_POSTS    || 'dataHelloFriendsPosts';
        window.CS_KEY.HF_LIVES    = window.CS_KEY.HF_LIVES    || 'dataHelloFriendsLives';
        window.CS_KEY.HF_COMMENTS = window.CS_KEY.HF_COMMENTS || 'dataHelloFriendsComments';
        window.CS_KEY.HF_FOLLOWS  = window.CS_KEY.HF_FOLLOWS  || 'dataHelloFriendsFollows';
        window.CS_KEY.HF_STORIES  = window.CS_KEY.HF_STORIES  || 'dataHelloFriendsStories';
        window.CS_KEY.HF_KONTAK_PREFIX   = window.CS_KEY.HF_KONTAK_PREFIX   || 'dataHfKontak_';
        window.CS_KEY.HF_POST_SAVED_PREFIX = window.CS_KEY.HF_POST_SAVED_PREFIX || 'dataHfPostSaved_';
        window.CS_KEY.HF_WISHLIST_PREFIX = window.CS_KEY.HF_WISHLIST_PREFIX || 'dataHfWishlist_';
    }

    // ═══════════════════════════════════════════════════════════
    // [FHF.1] — HELPER INTERNAL (A1, A2, A19, A25)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) {
        try {
            var v = window.csLoadJSON(key, def);
            // A19 — paksa tipe via CS4
            if (typeof window.csIsArray === 'function' && window.csIsArray(def)) {
                return window.csIsArray(v) ? v : def;
            }
            if (typeof window.csIsObject === 'function' && window.csIsObject(def)) {
                return window.csIsObject(v) ? v : def;
            }
            if (Array.isArray(def) && !Array.isArray(v)) return def;
            if (def && typeof def === 'object' && !Array.isArray(def) &&
                (!v || typeof v !== 'object' || Array.isArray(v))) {
                return def;
            }
            return v;
        } catch (e) { return def; }
    }

    function _save(key, data) {
        try {
            return window.csSaveJSON(key, data, { backup: false });
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    }

    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }

    // A1 — ID generator via CS5 (dengan fallback manual)
    function _genId(prefix) {
        try {
            if (typeof window.csGenerateIdVerifikasi === 'function') {
                return window.csGenerateIdVerifikasi(prefix);
            }
            if (typeof window.csGenerateIdKoleksi === 'function') {
                return window.csGenerateIdKoleksi(prefix);
            }
        } catch (e) {}
        return (prefix || 'ID') + '-' + Date.now().toString(36).toUpperCase() +
               '-' + Math.floor(Math.random() * 1000);
    }

    function _uid() {
        try {
            if (typeof window.gidIdUser === 'function') {
                var id = window.gidIdUser();
                if (id) return id;
            }
        } catch (e) {}
        var p = window.fhfGetProfilSaya && window.fhfGetProfilSaya();
        return p ? p.idUser : null;
    }

    // Key helpers
    function _keyPost()    { return (window.CS_KEY && window.CS_KEY.HF_POSTS)    || 'dataHelloFriendsPosts'; }
    function _keyLive()    { return (window.CS_KEY && window.CS_KEY.HF_LIVES)    || 'dataHelloFriendsLives'; }
    function _keyKomentar(){ return (window.CS_KEY && window.CS_KEY.HF_COMMENTS) || 'dataHelloFriendsComments'; }
    function _keyFollow()  { return (window.CS_KEY && window.CS_KEY.HF_FOLLOWS)  || 'dataHelloFriendsFollows'; }
    function _keyStory()   { return (window.CS_KEY && window.CS_KEY.HF_STORIES)  || 'dataHelloFriendsStories'; }
    function _keyKontak()  {
        var pre = (window.CS_KEY && window.CS_KEY.HF_KONTAK_PREFIX) || 'dataHfKontak_';
        var id = _uid();
        return id ? (pre + id) : null;
    }
    function _keySaved()   {
        var pre = (window.CS_KEY && window.CS_KEY.HF_POST_SAVED_PREFIX) || 'dataHfPostSaved_';
        var id = _uid();
        return id ? (pre + id) : null;
    }
    function _keyWishlist(){
        var pre = (window.CS_KEY && window.CS_KEY.HF_WISHLIST_PREFIX) || 'dataHfWishlist_';
        var id = _uid();
        return id ? (pre + id) : null;
    }

    function _dispatch(evt, detail) {
        try {
            window.dispatchEvent(new CustomEvent(evt, { detail: detail || {} }));
        } catch (e) {}
    }

    // ═══════════════════════════════════════════════════════════
    // [FHF.2] — VISIBILITY & NORMALIZE HELPER
    // ═══════════════════════════════════════════════════════════
    function _validVisibility(v) {
        return ['public', 'followers', 'private'].indexOf(v) !== -1 ? v : 'public';
    }

        function _normalizeMediaUrls(data) {
        var urls = [], types = [];
        var sources = [];
        if (Array.isArray(data.mediaUrls) && data.mediaUrls.length > 0) {
            var n = Math.min(data.mediaUrls.length, 10);
            for (var i = 0; i < n; i++) {
                if (data.mediaUrls[i]) {
                    sources.push({
                        url: data.mediaUrls[i],
                        tipe: (data.mediaTypes && data.mediaTypes[i]) || 'foto'
                    });
                }
            }
        } else if (data.mediaUrl) {
            sources.push({
                url: data.mediaUrl,
                tipe: data.tipeMedia || 'foto'
            });
        }

        // A45: reject base64 & data URL
        for (var j = 0; j < sources.length; j++) {
            var s = String(sources[j].url || '');
            if (s.indexOf('data:') === 0) {
                return {
                    urls: [], types: [],
                    error: 'A45 VIOLATION: mediaUrl base64 tidak diizinkan. ' +
                           'Upload via mdSimpan() di BLOK MD (10.58) dulu, ' +
                           'simpan idMedia atau URL hasil mdGetUrlPublik.'
                };
            }
            if (s.length > 2000 && !/^https?:\/\//.test(s)) {
                return {
                    urls: [], types: [],
                    error: 'A45 VIOLATION: mediaUrl terlalu panjang (' + s.length +
                           ' char) — indikasi base64. Gunakan MD.'
                };
            }
            urls.push(sources[j].url);
            types.push(sources[j].tipe);
        }
        return { urls: urls, types: types };
    }

    function _normalizeTagProduk(data) {
        if (Array.isArray(data.tagProdukList) && data.tagProdukList.length > 0) {
            return data.tagProdukList.slice(0, 5).filter(function(t) {
                return t && t.idProduk;
            });
        }
        if (data.tagProduk && data.tagProduk.idProduk) return [data.tagProduk];
        return [];
    }

    function _normalizeLampiran(data) {
        if (!Array.isArray(data.lampiran)) return [];
        return data.lampiran.slice(0, 5).filter(function(l) {
            return l && l.nama && l.base64;
        });
    }

    // ═══════════════════════════════════════════════════════════
    // [FHF.3] — AUTH (fhfGetProfilSaya)
    // ═══════════════════════════════════════════════════════════
    window.fhfGetProfilSaya = function() {
        try {
            if (typeof window.puAmbilProfil === 'function') {
                var res = window.puAmbilProfil();
                if (res.sukses && res.data) {
                    return {
                        idUser:   res.data.idUser,
                        nama:     res.data.nama || res.data.namaLengkap,
                        fotoUrl:  res.data.fotoUrl || '',
                        kodeRole: res.data.kodeRole
                    };
                }
            }
            var u = window.getUserAktif ? window.getUserAktif() : null;
            if (u) {
                return {
                    idUser:   u.idUser || u.id,
                    nama:     u.nama || u.username,
                    fotoUrl:  u.fotoUrl || '',
                    kodeRole: u.kodeRole || 'CT'
                };
            }
            return null;
        } catch (e) { return null; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FHF.4] — FEED & POST (filter visibility)
    // ═══════════════════════════════════════════════════════════
    window.fhfAmbilFeed = function(filter) {
        filter = filter || {};
        try {
            var posts = _load(_keyPost(), []);
            if (!Array.isArray(posts)) return [];

            var profil = window.fhfGetProfilSaya();
            var viewerId = profil ? profil.idUser : null;

            var followsSet = {};
            if (viewerId) {
                try {
                    _load(_keyFollow(), []).forEach(function(f) {
                        if (f && f.idFollower === viewerId) {
                            followsSet[f.idFollowing] = true;
                        }
                    });
                } catch (e) {}
            }

            // Filter visibility
            posts = posts.filter(function(p) {
                if (!p) return false;
                var vis = p.visibility || 'public';
                if (vis === 'public') return true;
                if (!viewerId) return false;
                if (vis === 'private') return p.idUser === viewerId;
                if (vis === 'followers') {
                    if (p.idUser === viewerId) return true;
                    return followsSet[p.idUser] === true;
                }
                return true;
            });

            if (filter.tipe) {
                posts = posts.filter(function(p) {
                    var types = p.mediaTypes || [p.tipeMedia];
                    return types.indexOf(filter.tipe) !== -1;
                });
            }
            if (filter.kodeRole) {
                posts = posts.filter(function(p) { return p.kodeRole === filter.kodeRole; });
            }
            if (filter.idUser) {
                posts = posts.filter(function(p) { return p.idUser === filter.idUser; });
            }
            if (filter.following && filter.idUserViewer) {
                var fSet = {};
                _load(_keyFollow(), []).forEach(function(f) {
                    if (f && f.idFollower === filter.idUserViewer) {
                        fSet[f.idFollowing] = true;
                    }
                });
                posts = posts.filter(function(p) {
                    return fSet[p.idUser] || p.idUser === filter.idUserViewer;
                });
            }

            posts.sort(function(a, b) {
                return new Date(b.createdAt).getTime() -
                       new Date(a.createdAt).getTime();
            });
            return posts.slice(0, parseInt(filter.limit, 10) || 20);
        } catch (e) {
            console.error('[FHF v3.4] fhfAmbilFeed error:', e);
            return [];
        }
    };

    window.fhfBuatPost = function(data) {
        try {
            if (!data) return { sukses: false, pesan: 'Data kosong' };

                        var mediaNorm = _normalizeMediaUrls(data);
            if (mediaNorm.error) {
                return { sukses: false, pesan: mediaNorm.error };
            }
            if (mediaNorm.urls.length === 0) {
                return { sukses: false, pesan: 'Media wajib diisi' };
            }

            var profil = window.fhfGetProfilSaya();
            if (!profil) return { sukses: false, pesan: 'Harus login' };

            var tagList  = _normalizeTagProduk(data);
            var lampiran = _normalizeLampiran(data);
            var vis      = _validVisibility(data.visibility);

            var posts = _load(_keyPost(), []);
            if (!Array.isArray(posts)) posts = [];

            var newPost = {
                id:            _genId('HF'),                    // A1 — CS5
                idUser:        profil.idUser,
                namaUser:      profil.nama,
                fotoUser:      profil.fotoUrl,
                kodeRole:      profil.kodeRole,
                mediaUrls:     mediaNorm.urls,
                mediaTypes:    mediaNorm.types,
                mediaUrl:      mediaNorm.urls[0],
                tipeMedia:     mediaNorm.types[0],
                caption:       data.caption || '',
                tags:          data.tags || [],
                musik:         data.musik || 'Suara Asli',
                tagProdukList: tagList,
                tagProduk:     tagList[0] || null,
                lampiran:      lampiran,
                visibility:    vis,
                reactions: {
                    like: [], love: [], haha: [], wow: [], sad: [], angry: []
                },
                shares:        0,
                createdAt:     _now()
            };
            posts.unshift(newPost);
            _save(_keyPost(), posts);
            return { sukses: true, pesan: 'Postingan diunggah', data: newPost };
        } catch (e) {
            console.error('[FHF v3.4] fhfBuatPost error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FHF.5] — REACTION
    // ═══════════════════════════════════════════════════════════
    window.fhfReactionPost = function(idPost, tipeReaction) {
        try {
            var posts = _load(_keyPost(), []);
            var idx = posts.findIndex(function(p) { return p && p.id === idPost; });
            if (idx === -1) return { sukses: false, pesan: 'Post tidak ditemukan' };

            var profil = window.fhfGetProfilSaya();
            if (!profil) return { sukses: false, pesan: 'Harus login' };

            if (!posts[idx].reactions) {
                posts[idx].reactions = {
                    like: [], love: [], haha: [], wow: [], sad: [], angry: []
                };
            }
            var rx = posts[idx].reactions;
            Object.keys(rx).forEach(function(k) {
                var pos = rx[k].indexOf(profil.idUser);
                if (pos !== -1) rx[k].splice(pos, 1);
            });
            if (tipeReaction !== 'unlike') {
                if (!rx[tipeReaction]) rx[tipeReaction] = [];
                rx[tipeReaction].push(profil.idUser);
            }
            _save(_keyPost(), posts);
            return { sukses: true, reactions: rx };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FHF.6] — FOLLOW
    // ═══════════════════════════════════════════════════════════
    window.fhfFollowUser = function(idTarget) {
        try {
            var profil = window.fhfGetProfilSaya();
            if (!profil || profil.idUser === idTarget) return { sukses: false };

            var follows = _load(_keyFollow(), []);
            if (!Array.isArray(follows)) follows = [];

            var idx = follows.findIndex(function(f) {
                return f && f.idFollower === profil.idUser &&
                       f.idFollowing === idTarget;
            });
            if (idx !== -1) {
                follows.splice(idx, 1);
                _save(_keyFollow(), follows);
                return { sukses: true, action: 'unfollow' };
            }
            follows.push({
                idFollower: profil.idUser,
                idFollowing: idTarget,
                createdAt: _now()
            });
            _save(_keyFollow(), follows);
            return { sukses: true, action: 'follow' };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fhfCekFollow = function(idTarget) {
        try {
            var profil = window.fhfGetProfilSaya();
            if (!profil) return false;
            return _load(_keyFollow(), []).some(function(f) {
                return f && f.idFollower === profil.idUser &&
                       f.idFollowing === idTarget;
            });
        } catch (e) { return false; }
    };

    window.fhfGetFollowStats = function(idUser) {
        try {
            var f = _load(_keyFollow(), []);
            if (!Array.isArray(f)) return { followers: 0, following: 0 };
            return {
                followers: f.filter(function(x) { return x && x.idFollowing === idUser; }).length,
                following: f.filter(function(x) { return x && x.idFollower === idUser; }).length
            };
        } catch (e) { return { followers: 0, following: 0 }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FHF.7] — KOMENTAR
    // ═══════════════════════════════════════════════════════════
    window.fhfKomentar = function(idPost, teks, idParent) {
        try {
            if (!teks) return { sukses: false, pesan: 'Kosong' };
            var profil = window.fhfGetProfilSaya();
            if (!profil) return { sukses: false, pesan: 'Harus login' };

            var komentar = _load(_keyKomentar(), []);
            if (!Array.isArray(komentar)) komentar = [];

            var newK = {
                id:        _genId('KOM'),                    // A1
                idPost:    idPost,
                idParent:  idParent || null,
                idUser:    profil.idUser,
                namaUser:  profil.nama,
                fotoUser:  profil.fotoUrl,
                teks:      teks,
                createdAt: _now()
            };
            komentar.push(newK);
            _save(_keyKomentar(), komentar);
            return { sukses: true, data: newK };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fhfAmbilKomentar = function(idPost) {
        try {
            return _load(_keyKomentar(), []).filter(function(k) {
                return k && k.idPost === idPost;
            });
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FHF.8] — STORIES
    // ═══════════════════════════════════════════════════════════
        window.fhfBuatStory = function(mediaUrl, tipeMedia) {
        try {
            var profil = window.fhfGetProfilSaya();
            if (!profil) return { sukses: false };

            // A45: reject base64 & data URL
            var s = String(mediaUrl || '');
            if (!s) {
                return { sukses: false, pesan: 'Media wajib diisi' };
            }
            if (s.indexOf('data:') === 0) {
                return {
                    sukses: false,
                    pesan: 'A45 VIOLATION: mediaUrl base64 tidak diizinkan. ' +
                           'Upload via mdSimpan() (BLOK MD 10.58).'
                };
            }
            if (s.length > 2000 && !/^https?:\/\//.test(s)) {
                return {
                    sukses: false,
                    pesan: 'A45 VIOLATION: mediaUrl terlalu panjang (' + s.length +
                           ' char) — indikasi base64.'
                };
            }

            var stories = _load(_keyStory(), []);
            if (!Array.isArray(stories)) stories = [];

            var now = Date.now();
            stories = stories.filter(function(s) {
                return s && (now - new Date(s.createdAt).getTime()) < 86400000;
            });
            stories.unshift({
                id:        _genId('ST'),                     // A1
                idUser:    profil.idUser,
                namaUser:  profil.nama,
                fotoUser:  profil.fotoUrl,
                mediaUrl:  mediaUrl,
                tipeMedia: tipeMedia || 'foto',
                createdAt: _now()
            });
            _save(_keyStory(), stories);
            return { sukses: true };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.fhfAmbilStories = function() {
        try {
            var s = _load(_keyStory(), []);
            if (!Array.isArray(s)) return [];
            var n = Date.now();
            return s.filter(function(x) {
                return x && (n - new Date(x.createdAt).getTime()) < 86400000;
            });
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FHF.9] — SEARCH (filter visibility)
    // ═══════════════════════════════════════════════════════════
    window.fhfSearch = function(keyword) {
        try {
            var q = String(keyword || '').toLowerCase();
            if (!q) return { users: [], posts: [] };

            var users = _load('dataLoginUser', []).filter(function(u) {
                return u && (
                    (u.nama && u.nama.toLowerCase().indexOf(q) !== -1) ||
                    (u.username && u.username.toLowerCase().indexOf(q) !== -1)
                );
            }).slice(0, 5);

            var profil = window.fhfGetProfilSaya();
            var viewerId = profil ? profil.idUser : null;
            var followsSet = {};
            if (viewerId) {
                _load(_keyFollow(), []).forEach(function(f) {
                    if (f && f.idFollower === viewerId) {
                        followsSet[f.idFollowing] = true;
                    }
                });
            }

            var posts = _load(_keyPost(), []).filter(function(p) {
                if (!p) return false;
                var vis = p.visibility || 'public';
                if (vis !== 'public') {
                    if (!viewerId) return false;
                    if (vis === 'private' && p.idUser !== viewerId) return false;
                    if (vis === 'followers' &&
                        p.idUser !== viewerId &&
                        !followsSet[p.idUser]) return false;
                }
                return (p.caption && p.caption.toLowerCase().indexOf(q) !== -1) ||
                       (p.namaUser && p.namaUser.toLowerCase().indexOf(q) !== -1);
            }).slice(0, 10);

            return { users: users, posts: posts };
        } catch (e) {
            return { users: [], posts: [] };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FHF.10] — LIVE & SAWER (guard FGD)
    // ═══════════════════════════════════════════════════════════
    window.fhfMulaiLive = function(judul) {
        try {
            var profil = window.fhfGetProfilSaya();
            if (!profil) return { sukses: false };

            var lives = _load(_keyLive(), []);
            if (!Array.isArray(lives)) lives = [];

            var newLive = {
                id:         _genId('LIVE'),                  // A1
                idHost:     profil.idUser,
                namaHost:   profil.nama,
                fotoHost:   profil.fotoUrl,
                judul:      judul || 'Live',
                status:     'Aktif',
                penonton:   0,
                totalSawer: 0,
                createdAt:  _now()
            };
            lives.unshift(newLive);
            _save(_keyLive(), lives);
            return { sukses: true, data: newLive };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.fhfSawer = function(idLive, jumlahCoin) {
        try {
            if (!idLive) return { sukses: false, pesan: 'ID kosong' };

            var jml = parseInt(jumlahCoin, 10);
            if (!jml || jml <= 0) {
                return { sukses: false, pesan: 'Jumlah > 0' };
            }

            var lives = _load(_keyLive(), []);
            if (!Array.isArray(lives)) lives = [];

            var idx = lives.findIndex(function(l) {
                return l && l.id === idLive && l.status === 'Aktif';
            });
            if (idx === -1) {
                return { sukses: false, pesan: 'Live tidak aktif' };
            }

            var profil = window.fhfGetProfilSaya();
            if (!profil || profil.idUser === lives[idx].idHost) {
                return { sukses: false, pesan: 'Invalid' };
            }

            // A25 — guard FGD ready
            if (typeof window.tambahTransaksiDompet !== 'function') {
                return { sukses: false, pesan: 'FGD belum siap — fungsi dompet belum terpasang' };
            }
            if (typeof window.getSaldoDompet === 'function' &&
                window.getSaldoDompet(profil.idUser) < jml) {
                return { sukses: false, pesan: 'Saldo tidak cukup' };
            }

            // Ambil fee dari FSE
            var feeP = 10;
            try {
                if (typeof window.getSettingEkonomiLengkapGlobal === 'function') {
                    var s = window.getSettingEkonomiLengkapGlobal();
                    if (s && s.feeSawer !== undefined) {
                        var fp = parseInt(s.feeSawer, 10);
                        if (!isNaN(fp) && fp >= 0 && fp <= 100) feeP = fp;
                    }
                }
            } catch (e) {}

            var fee = Math.floor(jml * (feeP / 100));
            var bersih = jml - fee;

            // Debit pengirim
            var resDebit = window.tambahTransaksiDompet(profil.idUser, {
                tipe: 'debit', jumlah: jml,
                keterangan: 'Sawer: ' + lives[idx].judul,
                kategori: 'sawer_live'
            });
            if (!resDebit.sukses) return resDebit;

            // Credit host
            var resCredit = window.tambahTransaksiDompet(lives[idx].idHost, {
                tipe: 'credit', jumlah: bersih,
                keterangan: 'Sawer dari ' + profil.nama,
                kategori: 'pendapatan_sawer'
            });
            if (!resCredit.sukses) {
                // A25 — rollback jika gagal
                try {
                    window.tambahTransaksiDompet(profil.idUser, {
                        tipe: 'credit', jumlah: jml,
                        keterangan: 'Rollback sawer gagal',
                        kategori: 'rollback'
                    });
                } catch (e) {}
                return { sukses: false, pesan: 'Gagal kirim ke host' };
            }

            lives[idx].totalSawer = (lives[idx].totalSawer || 0) + jml;
            _save(_keyLive(), lives);

            return {
                sukses:    true,
                sisaSaldo: resDebit.saldo,
                feePersen: feeP,
                bersihCoin:bersih
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FHF.12] — SIMPAN KONTAK (5 fungsi) + A36 validasi role
    // ═══════════════════════════════════════════════════════════
    var KATEGORI_KONTAK = ['pelanggan', 'reseller', 'supplier', 'keluarga', 'lainnya'];

    function _validKategori(k) {
        return KATEGORI_KONTAK.indexOf(k) !== -1 ? k : 'lainnya';
    }

    window.fhfSimpanKontak = function(idTarget, opts) {
        try {
            opts = opts || {};
            var idUser = _uid();
            if (!idUser) return { sukses: false, pesan: 'Harus login' };
            if (!idTarget) return { sukses: false, pesan: 'ID target kosong' };
            if (idUser === idTarget) {
                return { sukses: false, pesan: 'Tidak bisa simpan diri sendiri' };
            }

            // A36 — validasi target ada di dataLoginUser + role valid
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { sukses: false, pesan: 'Data user tidak valid' };
            }
            var target = users.find(function(u) {
                return u && (u.idUser === idTarget || u.id === idTarget);
            });
            if (!target) {
                return { sukses: false, pesan: 'User target tidak ditemukan' };
            }
            // A36 — validasi kodeRole ada di CS_ROLE_MAP
            if (!target.kodeRole || !window.CS_ROLE_MAP[target.kodeRole]) {
                return {
                    sukses: false,
                    pesan: 'Role target tidak valid: ' + (target.kodeRole || '-')
                };
            }

            var key = _keyKontak();
            if (!key) return { sukses: false, pesan: 'Key invalid' };

            var list = _load(key, []);
            if (!Array.isArray(list)) list = [];

            var idx = list.findIndex(function(k) {
                return k && k.idUser === idTarget;
            });
            var sudahAda = idx !== -1;
            var kategori = _validKategori(opts.kategori);

            if (sudahAda) {
                list[idx].kategori = kategori;
                if (opts.catatan !== undefined) {
                    list[idx].catatan = String(opts.catatan || '');
                }
                list[idx].updatedAt = _now();
            } else {
                list.unshift({
                    idUser:   idTarget,
                    nama:     target.nama || target.namaLengkap ||
                              target.username || idTarget,
                    kodeRole: target.kodeRole,
                    fotoUrl:  target.fotoUrl || '',
                    kategori: kategori,
                    catatan:  String(opts.catatan || ''),
                    addedAt:  _now()
                });
            }
            _save(key, list);
            _dispatch('r2coin:hf-kontak-changed', {
                idTarget: idTarget,
                action: sudahAda ? 'update' : 'add'
            });
            return {
                sukses: true,
                sudahAda: sudahAda,
                kontak: sudahAda ? list[idx] : list[0]
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fhfHapusKontak = function(idTarget) {
        try {
            var key = _keyKontak();
            if (!key || !idTarget) return { sukses: false, pesan: 'Param invalid' };

            var list = _load(key, []);
            if (!Array.isArray(list)) list = [];

            var before = list.length;
            list = list.filter(function(k) { return k && k.idUser !== idTarget; });
            _save(key, list);

            var terhapus = before !== list.length;
            if (terhapus) {
                _dispatch('r2coin:hf-kontak-changed', {
                    idTarget: idTarget,
                    action: 'remove'
                });
            }
            return { sukses: true, terhapus: terhapus };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fhfCekKontak = function(idTarget) {
        try {
            var key = _keyKontak();
            if (!key || !idTarget) return false;
            return _load(key, []).some(function(k) {
                return k && k.idUser === idTarget;
            });
        } catch (e) { return false; }
    };

    window.fhfGetListKontak = function(opts) {
        try {
            opts = opts || {};
            var key = _keyKontak();
            if (!key) return [];

            var list = _load(key, []);
            if (!Array.isArray(list)) return [];

            if (opts.kategori && opts.kategori !== 'all') {
                list = list.filter(function(k) {
                    return k && k.kategori === opts.kategori;
                });
            }
            if (opts.cari) {
                var q = String(opts.cari).toLowerCase();
                list = list.filter(function(k) {
                    return (String(k.nama || '').toLowerCase().indexOf(q) !== -1) ||
                           (String(k.idUser || '').toLowerCase().indexOf(q) !== -1);
                });
            }
            return list.slice(0, parseInt(opts.limit, 10) || 200);
        } catch (e) { return []; }
    };

    window.fhfKontakUpdateKategori = function(idTarget, kategori) {
        try {
            var key = _keyKontak();
            if (!key || !idTarget) return { sukses: false, pesan: 'Param invalid' };

            var list = _load(key, []);
            if (!Array.isArray(list)) list = [];

            var idx = list.findIndex(function(k) {
                return k && k.idUser === idTarget;
            });
            if (idx === -1) return { sukses: false, pesan: 'Kontak tidak ada' };

            list[idx].kategori = _validKategori(kategori);
            list[idx].updatedAt = _now();
            _save(key, list);
            _dispatch('r2coin:hf-kontak-changed', {
                idTarget: idTarget,
                action: 'update'
            });
            return { sukses: true, kontak: list[idx] };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    var FOLDER_SAVED = ['umum', 'resep', 'inspirasi', 'promo'];

    function _validFolder(f) {
        return FOLDER_SAVED.indexOf(f) !== -1 ? f : 'umum';
    }

    window.fhfSimpanPostBookmark = function(idPost, folder) {
        try {
            var idUser = _uid();
            if (!idUser) return { sukses: false, pesan: 'Harus login' };
            if (!idPost) return { sukses: false, pesan: 'ID post kosong' };

            var posts = _load(_keyPost(), []);
            if (!Array.isArray(posts)) posts = [];

            var post = posts.find(function(p) { return p && p.id === idPost; });
            if (!post) return { sukses: false, pesan: 'Postingan tidak ada' };

            var key = _keySaved();
            if (!key) return { sukses: false, pesan: 'Key invalid' };

            var list = _load(key, []);
            if (!Array.isArray(list)) list = [];

            var idx = list.findIndex(function(s) { return s && s.idPost === idPost; });
            var sudahAda = idx !== -1;
            var fFinal = _validFolder(folder);

            if (sudahAda) {
                list[idx].folder = fFinal;
                list[idx].updatedAt = _now();
            } else {
                list.unshift({
                    idPost: idPost,
                    folder: fFinal,
                    savedAt: _now()
                });
            }
            _save(key, list);
            _dispatch('r2coin:hf-saved-changed', {
                idPost: idPost,
                action: sudahAda ? 'update' : 'add',
                folder: fFinal
            });
            return { sukses: true, sudahAda: sudahAda, folder: fFinal };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fhfHapusSimpanPost = function(idPost) {
        try {
            var key = _keySaved();
            if (!key || !idPost) return { sukses: false, pesan: 'Param invalid' };

            var list = _load(key, []);
            if (!Array.isArray(list)) list = [];

            var before = list.length;
            list = list.filter(function(s) { return s && s.idPost !== idPost; });
            _save(key, list);

            var terhapus = before !== list.length;
            if (terhapus) {
                _dispatch('r2coin:hf-saved-changed', {
                    idPost: idPost,
                    action: 'remove'
                });
            }
            return { sukses: true, terhapus: terhapus };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fhfCekSimpanPost = function(idPost) {
        try {
            var key = _keySaved();
            if (!key || !idPost) return false;
            return _load(key, []).some(function(s) {
                return s && s.idPost === idPost;
            });
        } catch (e) { return false; }
    };

    window.fhfGetListSimpanPost = function(folder) {
        try {
            var key = _keySaved();
            if (!key) return [];

            var saved = _load(key, []);
            if (!Array.isArray(saved)) return [];

            if (folder && folder !== 'all') {
                saved = saved.filter(function(s) {
                    return s && (s.folder || 'umum') === folder;
                });
            }

            var posts = _load(_keyPost(), []);
            var byId = {};
            (Array.isArray(posts) ? posts : []).forEach(function(p) {
                if (p && p.id) byId[p.id] = p;
            });

            return saved.map(function(s) {
                if (!s || !s.idPost) return null;
                var post = byId[s.idPost] || null;
                return {
                    idPost:  s.idPost,
                    folder:  s.folder || 'umum',
                    savedAt: s.savedAt,
                    ada:     !!post,
                    post:    post
                };
            }).filter(function(x) { return x !== null; });
        } catch (e) { return []; }
    };

<script>
(function BLOK_FCHATU_BRIDGE_V21() {

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.0] — GUARD + DEP CHECK + SELF-REGISTER + CS_KEY
    // ═══════════════════════════════════════════════════════════
    if (window._fchatuBridgeDoneV21) {
        console.log('ℹ️ FCHATU-BRIDGE v2.1 sudah terpasang.');
        return;
    }
    if (!window.csLoadJSON || !window.csSaveJSON) {
        console.warn('⚠️ FCHATU-BRIDGE v2.1: CS2 belum siap. Ditunda.');
        return;
    }
    if (typeof window.gidIdUser !== 'function') {
        console.warn('⚠️ FCHATU-BRIDGE v2.1: GID belum siap. Ditunda.');
        return;
    }

    // A32 — guard 4 lapis
    window._fchatuBridgeDoneV21 = true;   // ⭐ GUARD UTAMA v2.1
    window._fchatuBridgeDoneV20 = true;   // alias
    window._fchatuBridgeDoneV1  = true;
    window._fchatuBridgeDone    = true;
    window._fchatuBridgeVersi   = '2.1';

        // ═══════════════════════════════════════════════════════════
    // [A43/A46] — SELF-REGISTER GUARD (FIX P1)
    // ═══════════════════════════════════════════════════════════
    // Sebelumnya v2.1 hanya register V21 — V20/V1/Done di-set true
    // tapi TIDAK didaftarkan → orphan flag (invisible ke health check
    // + tidak tercatat di BLOK_GUARD_MAP kecuali via 0.1.g.2 fallback).
    // FIX: register SEMUA 4 alias (A43 compliant + A46 sync).
    // ═══════════════════════════════════════════════════════════
    if (typeof window.blokDaftarkanGuard === 'function') {
        try {
            window.blokDaftarkanGuard('_fchatuBridgeDoneV21', 'FCHATU-BRIDGE');
            window.blokDaftarkanGuard('_fchatuBridgeDoneV20', 'FCHATU-BRIDGE');
            window.blokDaftarkanGuard('_fchatuBridgeDoneV1',  'FCHATU-BRIDGE');
            window.blokDaftarkanGuard('_fchatuBridgeDone',    'FCHATU-BRIDGE');
        } catch (e) {
            console.warn('[FCHATU-BRIDGE v2.1] blokDaftarkanGuard warn:', e.message);
        }
    } else {
        console.warn('⚠️ FCHATU-BRIDGE v2.1: blokDaftarkanGuard belum ada. Fallback manual.');
        window.BLOK_GUARD_MAP = window.BLOK_GUARD_MAP || {};
        window.BLOK_GUARD_MAP['_fchatuBridgeDoneV21'] = 'FCHATU-BRIDGE';
        window.BLOK_GUARD_MAP['_fchatuBridgeDoneV20'] = 'FCHATU-BRIDGE';
        window.BLOK_GUARD_MAP['_fchatuBridgeDoneV1']  = 'FCHATU-BRIDGE';
        window.BLOK_GUARD_MAP['_fchatuBridgeDone']    = 'FCHATU-BRIDGE';
    }

    // A18 — CS_KEY extend (safe)
    if (window.CS_KEY) {
        window.CS_KEY.KEY_ROOM_CHAT =
            window.CS_KEY.KEY_ROOM_CHAT || 'dataChatRooms';
        window.CS_KEY.KEY_PESAN_CHAT_PREFIX =
            window.CS_KEY.KEY_PESAN_CHAT_PREFIX || 'dataChatPesan_';
    }

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.1] — HELPER INTERNAL (A1, A2, A19, A25)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) {
        try {
            var v = window.csLoadJSON(key, def);
            // A19 — paksa tipe via CS4
            if (typeof window.csIsArray === 'function' && window.csIsArray(def)) {
                return window.csIsArray(v) ? v : def;
            }
            if (typeof window.csIsObject === 'function' && window.csIsObject(def)) {
                return window.csIsObject(v) ? v : def;
            }
            if (Array.isArray(def) && !Array.isArray(v)) return def;
            if (def && typeof def === 'object' && !Array.isArray(def) &&
                (!v || typeof v !== 'object' || Array.isArray(v))) {
                return def;
            }
            return v;
        } catch (e) { return def; }
    }

    function _save(key, val) {
        try {
            return window.csSaveJSON(key, val, { backup: false });
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    }

    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }

    function _uid() {
        try {
            if (typeof window.gidIdUser === 'function') {
                return window.gidIdUser();
            }
        } catch (e) {}
        return null;
    }

    // A1 — ID generator via CS5
    function _genId(prefix) {
        try {
            if (typeof window.csGenerateIdVerifikasi === 'function') {
                return window.csGenerateIdVerifikasi(prefix);
            }
            if (typeof window.csGenerateIdKoleksi === 'function') {
                return window.csGenerateIdKoleksi(prefix);
            }
        } catch (e) {}
        return (prefix || 'ID') + '-' + Date.now().toString(36).toUpperCase() +
               '-' + Math.floor(Math.random() * 900 + 100);
    }

    // A18 — key dari CS_KEY
    function _getKeyRoom() {
        return (window.CS_KEY && window.CS_KEY.KEY_ROOM_CHAT)
            || 'dataChatRooms';
    }
    function _getKeyPesan(roomId) {
        var pre = (window.CS_KEY && window.CS_KEY.KEY_PESAN_CHAT_PREFIX)
            || 'dataChatPesan_';
        return pre + roomId;
    }

    // A25 — dispatch guard
    function _dispatch(evt, detail) {
        try {
            if (typeof window.CustomEvent !== 'function') return;
            window.dispatchEvent(new CustomEvent(evt, {
                detail: detail || {}
            }));
        } catch (e) {}
    }

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.2] — NORMALIZE ROOM (backward compat)
    // ═══════════════════════════════════════════════════════════
    function _normalizeRoom(r) {
        if (!r) return r;
        if (!r.tipe) r.tipe = 'user_user';
        if (r.tipe === 'grup') {
            if (!Array.isArray(r.member)) r.member = [];
            if (!Array.isArray(r.admin))  r.admin  = [];
        }
        return r;
    }

    function _getAllRoomsRaw() {
        var rooms = _load(_getKeyRoom(), []);
        if (!Array.isArray(rooms)) return [];
        return rooms.map(_normalizeRoom);
    }

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.3] — fchatuCekRelasi (cek boleh chat 1-1)
    // ═══════════════════════════════════════════════════════════
    window.fchatuCekRelasi = function(idTarget) {
        try {
            var idSaya = _uid();
            if (!idSaya)   return { boleh: false, pesan: 'Sesi habis — silakan login' };
            if (!idTarget) return { boleh: false, pesan: 'ID target kosong' };
            if (idSaya === idTarget) {
                return { boleh: false, pesan: 'Tidak bisa chat ke diri sendiri' };
            }

            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { boleh: false, pesan: 'Data user tidak valid' };
            }
            var target = users.find(function(u) {
                return u && (u.idUser === idTarget || u.id === idTarget);
            });
            if (!target) {
                return { boleh: false, pesan: 'User target tidak ditemukan' };
            }
            if (target.status === 'Diblokir' ||
                target.statusVerifikasi === 'Diblokir') {
                return { boleh: false, pesan: 'User target sedang diblokir' };
            }

            return {
                boleh:  true,
                tipe:   'user_user',
                target: target,
                nama:   target.nama || target.username || idTarget
            };
        } catch (e) {
            return { boleh: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.4] — fchatuBuatRoom 1-1 (existing v1.0)
    // ═══════════════════════════════════════════════════════════
    window.fchatuBuatRoom = function(idTarget, idRoom, tipe) {
        try {
            var idSaya = _uid();
            if (!idSaya)   return { sukses: false, pesan: 'Sesi habis' };
            if (!idTarget) return { sukses: false, pesan: 'Target kosong' };
            if (idSaya === idTarget) {
                return { sukses: false, pesan: 'Tidak bisa chat diri sendiri' };
            }

            var rooms = _getAllRoomsRaw();
            var idA = (String(idSaya) < String(idTarget)) ? idSaya : idTarget;
            var idB = (String(idSaya) < String(idTarget)) ? idTarget : idSaya;
            var roomId = idRoom || ('ROOM-' + idA + '_' + idB);

            var existing = rooms.find(function(r) {
                return r && r.idRoom === roomId && r.tipe === 'user_user';
            });
            if (existing) {
                existing.lastActivity = _now();
                _save(_getKeyRoom(), rooms);
                return {
                    sukses: true,
                    idRoom: existing.idRoom,
                    room:   existing,
                    reused: true
                };
            }

            var newRoom = {
                idRoom:       roomId,
                tipe:         'user_user',
                idUser1:      idA,
                idUser2:      idB,
                createdAt:    _now(),
                lastActivity: _now()
            };
            rooms.push(newRoom);
            var r = _save(_getKeyRoom(), rooms);
            if (!r.sukses) return { sukses: false, pesan: r.pesan };

            _dispatch('r2coin:fchatu-room-changed', {
                idRoom: roomId, action: 'create', tipe: 'user_user'
            });
            return {
                sukses: true,
                idRoom: roomId,
                room:   newRoom,
                reused: false
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.5] — fchatuBuatRoomGrup + A36 validasi role
    // ═══════════════════════════════════════════════════════════
    window.fchatuBuatRoomGrup = function(namaGrup, listIdMember, fotoGrup, opts) {
        opts = opts || {};
        try {
            var idSaya = _uid();
            if (!idSaya) return { sukses: false, pesan: 'Sesi habis' };

            var nama = String(namaGrup || '').trim();
            if (!nama) return { sukses: false, pesan: 'Nama grup wajib diisi' };
            if (nama.length > 60) nama = nama.substring(0, 60);

            if (!Array.isArray(listIdMember)) {
                return { sukses: false, pesan: 'listIdMember harus array' };
            }

            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { sukses: false, pesan: 'Data user tidak valid' };
            }

            var memberSet = {};
            memberSet[idSaya] = true;
            var validMembers = [idSaya];

            // A36 — validasi tiap member: exists + kodeRole valid di CS_ROLE_MAP
            listIdMember.forEach(function(id) {
                if (!id || id === idSaya) return;
                if (memberSet[id]) return;

                var u = users.find(function(x) {
                    return x && (x.idUser === id || x.id === id);
                });
                if (!u) return;
                if (!u.kodeRole || !window.CS_ROLE_MAP ||
                    !window.CS_ROLE_MAP[u.kodeRole]) {
                    console.warn('[FCHATU v2.1] skip member role invalid:', id, u.kodeRole);
                    return;
                }
                memberSet[id] = true;
                validMembers.push(id);
            });

            if (validMembers.length < 2) {
                return {
                    sukses: false,
                    pesan: 'Grup minimal 1 member lain + diri sendiri'
                };
            }

            // A1 — idRoom via CS5
            var idRoom = _genId('GRUP');
            var newRoom = {
                idRoom:       idRoom,
                tipe:         'grup',
                nama:         nama,
                fotoGrup:     String(fotoGrup || ''),
                deskripsi:    String(opts.deskripsi || ''),
                member:       validMembers.slice(),
                admin:        [idSaya],
                createdBy:    idSaya,
                createdAt:    _now(),
                lastActivity: _now()
            };

            var rooms = _getAllRoomsRaw();
            rooms.push(newRoom);
            var r = _save(_getKeyRoom(), rooms);
            if (!r.sukses) return { sukses: false, pesan: r.pesan };

            _dispatch('r2coin:fchatu-room-changed', {
                idRoom: idRoom, action: 'create', tipe: 'grup',
                nama: nama, totalMember: validMembers.length
            });
            return {
                sukses:      true,
                idRoom:      idRoom,
                room:        newRoom,
                totalMember: validMembers.length
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.6] — fchatuGetRooms (support personal + grup)
    // ═══════════════════════════════════════════════════════════
    window.fchatuGetRooms = function() {
        try {
            var idSaya = _uid();
            if (!idSaya) return [];
            var rooms = _getAllRoomsRaw();
            return rooms.filter(function(r) {
                if (!r) return false;
                if (r.tipe === 'grup') {
                    return Array.isArray(r.member) &&
                           r.member.indexOf(idSaya) !== -1;
                }
                return r.idUser1 === idSaya || r.idUser2 === idSaya;
            }).sort(function(a, b) {
                return new Date(b.lastActivity || 0) -
                       new Date(a.lastActivity || 0);
            });
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.7] — fchatuGetRoomsGrup
    // ═══════════════════════════════════════════════════════════
    window.fchatuGetRoomsGrup = function() {
        try {
            var idSaya = _uid();
            if (!idSaya) return [];
            var rooms = _getAllRoomsRaw();
            return rooms.filter(function(r) {
                return r && r.tipe === 'grup' &&
                       Array.isArray(r.member) &&
                       r.member.indexOf(idSaya) !== -1;
            }).sort(function(a, b) {
                return new Date(b.lastActivity || 0) -
                       new Date(a.lastActivity || 0);
            });
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.8] — fchatuGetRoomById
    // ═══════════════════════════════════════════════════════════
    window.fchatuGetRoomById = function(idRoom) {
        try {
            if (!idRoom) return null;
            var rooms = _getAllRoomsRaw();
            return rooms.find(function(r) {
                return r && r.idRoom === idRoom;
            }) || null;
        } catch (e) { return null; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.9] — fchatuKirimPesan (extend + cek member grup)
    // ═══════════════════════════════════════════════════════════
    window.fchatuKirimPesan = function(roomId, teks) {
        try {
            if (!roomId) return { sukses: false, pesan: 'Room ID kosong' };
            if (!teks || String(teks).trim() === '') {
                return { sukses: false, pesan: 'Pesan kosong' };
            }

            var idSaya = _uid();
            if (!idSaya) return { sukses: false, pesan: 'Sesi habis' };

            var room = window.fchatuGetRoomById(roomId);
            if (!room) return { sukses: false, pesan: 'Room tidak ditemukan' };

            // Cek member (khusus grup)
            if (room.tipe === 'grup') {
                if (Array.isArray(room.member) &&
                    room.member.indexOf(idSaya) === -1) {
                    return { sukses: false, pesan: 'Anda bukan member grup ini' };
                }
            } else {
                // user_user: cek 2 pihak
                if (room.idUser1 !== idSaya && room.idUser2 !== idSaya) {
                    return { sukses: false, pesan: 'Anda bukan peserta room ini' };
                }
            }

            var pesanList = _load(_getKeyPesan(roomId), []);
            if (!Array.isArray(pesanList)) pesanList = [];

            // A1 — idPesan via CS5
            var pesan = {
                id:       _genId('MSG'),
                idRoom:   roomId,
                tipeRoom: room.tipe || 'user_user',
                idUser:   idSaya,
                nama:     window.getNamaUserAktif
                            ? window.getNamaUserAktif() : '-',
                kodeRole: window.gidKodeRoleUser
                            ? window.gidKodeRoleUser() : '-',
                teks:     String(teks).trim(),
                waktu:    _now(),
                dibaca:   false
            };
            pesanList.push(pesan);
            if (pesanList.length > 500) pesanList = pesanList.slice(-500);
            _save(_getKeyPesan(roomId), pesanList);

            // Update lastActivity
            var rooms = _getAllRoomsRaw();
            var idx = rooms.findIndex(function(r) {
                return r && r.idRoom === roomId;
            });
            if (idx !== -1) {
                rooms[idx].lastActivity  = _now();
                rooms[idx].lastPesan     = pesan.teks.substring(0, 60);
                rooms[idx].lastPesanOleh = idSaya;
                _save(_getKeyRoom(), rooms);
            }

            _dispatch('r2coin:fchatu-new-message', {
                idRoom:   roomId,
                tipeRoom: room.tipe,
                pesan:    pesan
            });
            return { sukses: true, pesan: pesan };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.10] — fchatuAmbilPesan
    // ═══════════════════════════════════════════════════════════
    window.fchatuAmbilPesan = function(roomId, limit) {
        try {
            if (!roomId) return [];
            var list = _load(_getKeyPesan(roomId), []);
            if (!Array.isArray(list)) return [];
            var n = parseInt(limit, 10) || 100;
            if (n < 1) n = 100;
            return list.slice(-n);
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.11] — fchatuCekMemberGrup + fchatuCekAdminGrup
    // ═══════════════════════════════════════════════════════════
    window.fchatuCekMemberGrup = function(idRoom, idUser) {
        try {
            if (!idRoom) return false;
            var idTarget = idUser || _uid();
            if (!idTarget) return false;
            var room = window.fchatuGetRoomById(idRoom);
            if (!room || room.tipe !== 'grup') return false;
            return Array.isArray(room.member) &&
                   room.member.indexOf(idTarget) !== -1;
        } catch (e) { return false; }
    };

    window.fchatuCekAdminGrup = function(idRoom, idUser) {
        try {
            if (!idRoom) return false;
            var idTarget = idUser || _uid();
            if (!idTarget) return false;
            var room = window.fchatuGetRoomById(idRoom);
            if (!room || room.tipe !== 'grup') return false;
            return Array.isArray(room.admin) &&
                   room.admin.indexOf(idTarget) !== -1;
        } catch (e) { return false; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.12] — fchatuListMemberGrup (dengan info user)
    // ═══════════════════════════════════════════════════════════
    window.fchatuListMemberGrup = function(idRoom) {
        try {
            if (!idRoom) return [];
            var room = window.fchatuGetRoomById(idRoom);
            if (!room || room.tipe !== 'grup') return [];

            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) users = [];

            var adminSet = {};
            (room.admin || []).forEach(function(id) { adminSet[id] = true; });

            return (room.member || []).map(function(id) {
                var u = users.find(function(x) {
                    return x && (x.idUser === id || x.id === id);
                });
                return {
                    idUser:   id,
                    nama:     u ? (u.nama || u.namaLengkap || u.username || id) : id,
                    kodeRole: u ? (u.kodeRole || 'CT') : 'CT',
                    fotoUrl:  u ? (u.fotoUrl || '') : '',
                    isAdmin:  adminSet[id] === true
                };
            });
        } catch (e) { return []; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.13] — fchatuTambahMemberGrup + A36 validasi role
    // ═══════════════════════════════════════════════════════════
    window.fchatuTambahMemberGrup = function(idRoom, idUser) {
        try {
            var idSaya = _uid();
            if (!idSaya)   return { sukses: false, pesan: 'Sesi habis' };
            if (!idRoom)   return { sukses: false, pesan: 'ID room kosong' };
            if (!idUser)   return { sukses: false, pesan: 'ID user kosong' };
            if (idUser === idSaya) {
                return { sukses: false, pesan: 'Tidak bisa tambah diri sendiri' };
            }

            var rooms = _getAllRoomsRaw();
            var idx = rooms.findIndex(function(r) {
                return r && r.idRoom === idRoom;
            });
            if (idx === -1) {
                return { sukses: false, pesan: 'Room tidak ditemukan' };
            }
            if (rooms[idx].tipe !== 'grup') {
                return { sukses: false, pesan: 'Bukan grup' };
            }
            if (rooms[idx].member.indexOf(idSaya) === -1) {
                return { sukses: false, pesan: 'Anda bukan member grup ini' };
            }
            if (rooms[idx].member.indexOf(idUser) !== -1) {
                return { sukses: false, pesan: 'User sudah menjadi member' };
            }

            // A36 — validasi user exists + role valid
            var users = _load('dataLoginUser', []);
            var target = users.find(function(u) {
                return u && (u.idUser === idUser || u.id === idUser);
            });
            if (!target) {
                return { sukses: false, pesan: 'User tidak ditemukan' };
            }
            if (!target.kodeRole || !window.CS_ROLE_MAP ||
                !window.CS_ROLE_MAP[target.kodeRole]) {
                return {
                    sukses: false,
                    pesan: 'Role user tidak valid: ' + (target.kodeRole || '-')
                };
            }

            rooms[idx].member.push(idUser);
            rooms[idx].lastActivity = _now();
            var r = _save(_getKeyRoom(), rooms);
            if (!r.sukses) return { sukses: false, pesan: r.pesan };

            _dispatch('r2coin:fchatu-room-changed', {
                idRoom: idRoom,
                action: 'add-member',
                idTarget: idUser,
                totalMember: rooms[idx].member.length
            });
            return {
                sukses: true,
                totalMember: rooms[idx].member.length
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.14] — fchatuHapusMemberGrup
    // ═══════════════════════════════════════════════════════════
    window.fchatuHapusMemberGrup = function(idRoom, idUser) {
        try {
            var idSaya = _uid();
            if (!idSaya)   return { sukses: false, pesan: 'Sesi habis' };
            if (!idRoom)   return { sukses: false, pesan: 'ID room kosong' };
            if (!idUser)   return { sukses: false, pesan: 'ID user kosong' };

            var rooms = _getAllRoomsRaw();
            var idx = rooms.findIndex(function(r) {
                return r && r.idRoom === idRoom;
            });
            if (idx === -1) {
                return { sukses: false, pesan: 'Room tidak ditemukan' };
            }
            if (rooms[idx].tipe !== 'grup') {
                return { sukses: false, pesan: 'Bukan grup' };
            }

            var isAdmin = rooms[idx].admin.indexOf(idSaya) !== -1;
            var isSelf  = (idUser === idSaya);

            if (!isSelf && !isAdmin) {
                return { sukses: false, pesan: 'Hanya admin yang bisa hapus member' };
            }
            if (rooms[idx].member.indexOf(idUser) === -1) {
                return { sukses: false, pesan: 'User bukan member grup' };
            }

            rooms[idx].member = rooms[idx].member.filter(function(id) {
                return id !== idUser;
            });
            rooms[idx].admin = rooms[idx].admin.filter(function(id) {
                return id !== idUser;
            });
            rooms[idx].lastActivity = _now();

            // Auto-delete kalau kosong
            if (rooms[idx].member.length === 0) {
                rooms.splice(idx, 1);
                _save(_getKeyRoom(), rooms);
                try { localStorage.removeItem(_getKeyPesan(idRoom)); } catch (e) {}
                _dispatch('r2coin:fchatu-room-changed', {
                    idRoom: idRoom, action: 'delete-empty'
                });
                return { sukses: true, totalMember: 0, roomDeleted: true };
            }

            // Auto-promote admin jika kosong
            if (rooms[idx].admin.length === 0 && rooms[idx].member.length > 0) {
                rooms[idx].admin = [rooms[idx].member[0]];
            }

            var r = _save(_getKeyRoom(), rooms);
            if (!r.sukses) return { sukses: false, pesan: r.pesan };

            _dispatch('r2coin:fchatu-room-changed', {
                idRoom: idRoom,
                action: 'remove-member',
                idTarget: idUser,
                totalMember: rooms[idx].member.length
            });
            return {
                sukses: true,
                totalMember: rooms[idx].member.length
            };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.15] — fchatuUpdateGrup
    // ═══════════════════════════════════════════════════════════
    window.fchatuUpdateGrup = function(idRoom, data) {
        data = data || {};
        try {
            var idSaya = _uid();
            if (!idSaya) return { sukses: false, pesan: 'Sesi habis' };
            if (!idRoom) return { sukses: false, pesan: 'ID room kosong' };

            var rooms = _getAllRoomsRaw();
            var idx = rooms.findIndex(function(r) {
                return r && r.idRoom === idRoom;
            });
            if (idx === -1) {
                return { sukses: false, pesan: 'Room tidak ditemukan' };
            }
            if (rooms[idx].tipe !== 'grup') {
                return { sukses: false, pesan: 'Bukan grup' };
            }
            if (rooms[idx].admin.indexOf(idSaya) === -1) {
                return { sukses: false, pesan: 'Hanya admin yang bisa update grup' };
            }

            if (data.nama !== undefined) {
                var n = String(data.nama || '').trim();
                if (!n) {
                    return { sukses: false, pesan: 'Nama grup tidak boleh kosong' };
                }
                rooms[idx].nama = n.substring(0, 60);
            }
            if (data.fotoGrup !== undefined) {
                rooms[idx].fotoGrup = String(data.fotoGrup || '');
            }
            if (data.deskripsi !== undefined) {
                rooms[idx].deskripsi = String(data.deskripsi || '').substring(0, 200);
            }
            rooms[idx].updatedAt = _now();

            var r = _save(_getKeyRoom(), rooms);
            if (!r.sukses) return { sukses: false, pesan: r.pesan };

            _dispatch('r2coin:fchatu-room-changed', {
                idRoom: idRoom,
                action: 'update',
                room: rooms[idx]
            });
            return { sukses: true, room: rooms[idx] };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.16] — fchatuKeluarGrup
    // ═══════════════════════════════════════════════════════════
    window.fchatuKeluarGrup = function(idRoom) {
        try {
            var idSaya = _uid();
            if (!idSaya) return { sukses: false, pesan: 'Sesi habis' };
            if (!idRoom) return { sukses: false, pesan: 'ID room kosong' };

            var room = window.fchatuGetRoomById(idRoom);
            if (!room || room.tipe !== 'grup') {
                return { sukses: false, pesan: 'Bukan grup' };
            }
            if (room.member.indexOf(idSaya) === -1) {
                return { sukses: false, pesan: 'Anda bukan member grup' };
            }

            // Delegasi ke hapus member (self-removal sudah ditangani)
            return window.fchatuHapusMemberGrup(idRoom, idSaya);
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FCHATU.17] — 3 PINTU STANDAR (A11—A13)
    // ═══════════════════════════════════════════════════════════
    window.kirimFCHATU = function(tipe, ke, data, idRef) {
        try {
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum ada' };
            }
            // A13 — paket LENGKAP
            return window.mnKirimKeMenu({
                tipe: tipe || 'pesan',
                dari: {
                    idUser:   _uid(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                    menu:     'FCHATU',
                    blok:     'L4-FCHATU-BRIDGE'
                },
                ke: ke || { menu: 'FCHATU' },
                data: data || {},
                idRef: idRef || null,
                timestamp: _now()
            });
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.terimaFCHATU = function(aksiMenu) {
        try {
            if (typeof window.mnInboxMenu !== 'function') return [];
            return window.mnInboxMenu(aksiMenu || 'FCHATU');
        } catch (e) { return []; }
    };

        // ═══════════════════════════════════════════════════════════
    // [FCHATU.17c] — PINTU 3: AMBIL (A11, A13)
    // ═══════════════════════════════════════════════════════════
    // A13 COMPLIANT: return paket format {tipe, dari, ke, data, idRef, timestamp}
    // Konsisten dengan: ambilGID, ambilKdmp, ambilFDU, ambilProfil,
    //                  ambilFGKA, ambilFGPA, ambilFgGif, ambilFGD, ambilFGV,
    //                  ambilFSDU, ambilFMO, ambilFSE
    //
    // Usage:
    //   ambilFCHATU()                       → snapshot rooms (paket)
    //   ambilFCHATU({ keMenu: 'MN' })       → custom ke target
    //   ambilFCHATU({ idPaket, aksiMenu })  → ambil MN paket
    // ═══════════════════════════════════════════════════════════
    window.ambilFCHATU = function(opts) {
        opts = opts || {};
        try {
            // Mode 1: ambil MN paket
            if (opts.idPaket && opts.aksiMenu &&
                typeof window.mnAmbilPaket === 'function') {
                return window.mnAmbilPaket(opts.aksiMenu, opts.idPaket, opts);
            }

            // Mode 2: snapshot paket (A13 compliant)
            var rooms = window.fchatuGetRooms();
            var grup  = window.fchatuGetRoomsGrup();
            return {
                tipe: 'snapshot-fchatu',
                dari: { menu: 'FCHATU', blok: 'L4-FCHATU-BRIDGE' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: {
                    totalRooms:    rooms.length,
                    totalPersonal: rooms.length - grup.length,
                    totalGrup:     grup.length,
                    rooms:         rooms,
                    grup:          grup
                },
                idRef:     null,
                timestamp: _now()
            };
        } catch (e) {
            return {
                tipe: 'error',
                dari: { menu: 'FCHATU', blok: 'L4-FCHATU-BRIDGE' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: null,
                idRef: null,
                pesan: e.message
            };
        }
    };

    window.cekPintuFCHATU = function() {
        var skor = (typeof window.kirimFCHATU  === 'function' ? 1 : 0)
                 + (typeof window.terimaFCHATU === 'function' ? 1 : 0)
                 + (typeof window.ambilFCHATU  === 'function' ? 1 : 0);
        return {
            blok:   'FCHATU-BRIDGE',
            kirim:  typeof window.kirimFCHATU  === 'function',
            terima: typeof window.terimaFCHATU === 'function',
            ambil:  typeof window.ambilFCHATU  === 'function',
            skor:   skor + '/3',
            lengkap: skor === 3
        };
    };
