<!-- ═══       only). Tidak ada outbox/inbox, tidak komunikasi -->
<!-- ═══       antar blok via MN Event Bus. Query SA via      -->
<!-- ═══       saHardCekStatus() (bukan pintu — utility).    -->
<!-- ═══   A37 (Prefix ID): SA ID fixed by design —           -->
<!-- ═══       ID_R2C_SA-000001 (bukan random) — agar          -->
<!-- ═══       saHardResetSA() bisa recreate ID yang sama.     -->
<!-- ═══   A38 (Verifikasi 15 role): SA aktif langsung —      -->
<!-- ═══       tidak butuh verifikasi (A39).                  -->
<!-- ═══   A40 (Hierarki Kopdes): SA bukan Kopdes.            -->
<!-- ═══   A41 (Customer no KTP): SA bukan Customer.          -->
<!-- ═══   A42 (Kasir no NIK): SA bukan Kasir.                -->

<!-- ═══       media apa pun.                                 -->
<!-- ═══ 🔴 FIX v5.1 (dari v5.0) — AUDIT 46 ATURAN: ═══════════ -->
<!-- ═══   [1] 🔴 +A43 self-register (v5.0 TIDAK ADA) ═════════ -->
<!-- ═══   [2] 🔴 +A46 health sync → BLOK_GUARD_MAP (v5.0 TIDAK) -->
<!-- ═══   [3] +A19 dep retry 30× 500ms (v5.0 no retry) ══════ -->
<!-- ═══   [4] +Dedupe multiple SA entries (v5.0 tidak) ═════ -->
<!-- ═══   [5] +A27 full silent — log 1 baris (v5.0 ~12 baris) -->
<!-- ═══   [6] +A29/A30 sub-seksi [SA-HARD.0]—[SA-HARD.11] ═ -->
<!-- ═══   [7] +A5 debugSAHard cekV51 (13 titik — v5.0 4 titik) -->
<!-- ═══   [8] +A32 guard _saHardDoneV51 (alias V5/V4/V3/Done) -->
<!-- ═══   [9] +A31 IIFE rename V5_FINAL → V51 ═════════════ -->
<!-- ═══   [10] +A33/A34/A35 retry 20× (v5.0 fixed 700ms) ══ -->
<!-- ═══   [11] +A35 jumlah 4 (sesuai API aktual) ══════════ -->
<!-- ═══   [12] +Exempt A8-A10/A11-A13/A37/A40-A42/A45 eksplisit -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<script>
(function BLOK_SA_HARD_V51() {

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.0] — GUARD 3 LAPIS + DEP RETRY (A32/A19) + A43
    // ═══════════════════════════════════════════════════════════
    if (window._saHardDoneV51) {
        if (window.CS_FLAG && window.CS_FLAG.DEBUG_MODE) {
            console.log('ℹ️ SA-HARD v5.1 sudah terpasang.');
        }
        return;
    }

    // ── A19: Dep retry CS1 ──
    if (!window.CS_ROLE_MAP || !window.CS_KEY) {
        window._saHardRetryCS1 = (window._saHardRetryCS1 || 0) + 1;
        if (window._saHardRetryCS1 < 30) { setTimeout(BLOK_SA_HARD_V51, 500); return; }
        console.warn('⚠️ SA-HARD v5.1: CS1 tidak tersedia setelah 30 retry. Ditunda.');
        return;
    }

    // ── A19: Dep retry CS2 ──
    if (typeof window.csLoadJSON !== 'function' || typeof window.csSaveJSON !== 'function') {
        window._saHardRetryCS2 = (window._saHardRetryCS2 || 0) + 1;
        if (window._saHardRetryCS2 < 30) { setTimeout(BLOK_SA_HARD_V51, 500); return; }
        console.warn('⚠️ SA-HARD v5.1: CS2 tidak tersedia setelah 30 retry. Ditunda.');
        return;
    }

    // ── Guard 5 lapis (A32) ──
    window._saHardDoneV51 = true;   // ⭐ UTAMA v5.1
    window._saHardDoneV5  = true;   // ← CPAJ detection
    window._saHardDoneV4  = true;
    window._saHardDoneV3  = true;
    window._saHardDone    = true;
    window._saHardVersi   = '5.1';

    // ── A43: Self-register guard ──
    if (typeof window.blokDaftarkanGuard === 'function') {
        window.blokDaftarkanGuard('_saHardDoneV51', 'SA-HARD');
        window.blokDaftarkanGuard('_saHardDoneV5',  'SA-HARD');
    } else {
        console.warn('⚠️ SA-HARD v5.1: blokDaftarkanGuard belum ada. Fallback manual.');
        window.BLOK_GUARD_MAP = window.BLOK_GUARD_MAP || {};
        window.BLOK_GUARD_MAP['_saHardDoneV51'] = 'SA-HARD';
        window.BLOK_GUARD_MAP['_saHardDoneV5']  = 'SA-HARD';
    }

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.1] — KONSTANTA (A28: prefix + data)
    // ═══════════════════════════════════════════════════════════
    var SA_KONFIG = {
        ID_USER:   'ID_R2C_SA-000001',
        USERNAME:  'superadmin',
        PASSWORD:  'superadmin',
        NAMA:      'SuperAdmin',
        EMAIL:     'superadmin@r2coin.id',
        HP:        '080000000000',
        ALAMAT:    'Kantor Pusat R2COIN',
        KODE_ROLE: 'SA',
        ROLE:      'SuperAdmin',
        STATUS:    'Aktif'
    };
    window.SA_HARD_KONFIG = SA_KONFIG;

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.2] — HELPER _log (A27 silent: log via DEBUG_MODE)
    // ═══════════════════════════════════════════════════════════
    function _log(msg, isWarn) {
        if (isWarn) { console.warn('[SA-HARD] ' + msg); return; }
        if (window.CS_FLAG && window.CS_FLAG.DEBUG_MODE) {
            console.log('[SA-HARD] ' + msg);
        }
    }

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.3] — _cekSASudahAda (A19: validasi Array)
    // ═══════════════════════════════════════════════════════════
    function _cekSASudahAda() {
        try {
            var list = window.csLoadJSON(CS_KEY.DATA_LOGIN_USER, []);
            if (!Array.isArray(list)) return null;
            for (var i = 0; i < list.length; i++) {
                var u = list[i];
                if (u && (u.kodeRole === 'SA' || u.idUser === SA_KONFIG.ID_USER)) {
                    return u;
                }
            }
            return null;
        } catch (e) { return null; }
    }

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.4] — _buatObjekSA (factory — murni data)
    // ═══════════════════════════════════════════════════════════
    function _buatObjekSA() {
        var now = new Date().toISOString();
        return {
            idUser:           SA_KONFIG.ID_USER,
            id:               SA_KONFIG.ID_USER,
            username:         SA_KONFIG.USERNAME,
            password:         SA_KONFIG.PASSWORD,
            nama:             SA_KONFIG.NAMA,
            namaLengkap:      SA_KONFIG.NAMA,
            role:             SA_KONFIG.ROLE,
            kodeRole:         SA_KONFIG.KODE_ROLE,
            status:           SA_KONFIG.STATUS,
            statusVerifikasi: SA_KONFIG.STATUS,
            statusLangganan:  'Free',
            hp:               SA_KONFIG.HP,
            email:            SA_KONFIG.EMAIL,
            alamat:           SA_KONFIG.ALAMAT,
            alamatKtp:        SA_KONFIG.ALAMAT,
            nik_ktp:          null,
            fotoUrl:          '',
            ownerId:          null,
            idOwner:          null,
            idInduk:          null,
            createdBy:        'HARDCODED',
            createdAt:        now,
            tipePendaftaran:  'HARDCODED',
            isProtected:      true,
            isHardcoded:      true
        };
    }

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.5] — _buatAtauUpdateSA (A26 idempotent + dedupe)
    // ═══════════════════════════════════════════════════════════
    function _buatAtauUpdateSA() {
        try {
            var users = window.csLoadJSON(CS_KEY.DATA_LOGIN_USER, []);
            if (!Array.isArray(users)) users = [];

            // Cari semua SA existing (deteksi duplikat)
            var saIndices = [];
            users.forEach(function(u, idx) {
                if (u && (u.kodeRole === 'SA' || u.idUser === SA_KONFIG.ID_USER)) {
                    saIndices.push(idx);
                }
            });

            var isNew = false;
            var saObj;
            var perluSave = false;

            if (saIndices.length === 0) {
                // ── Create baru ──
                saObj = _buatObjekSA();
                users.push(saObj);
                isNew = true;
                perluSave = true;
                _log('SA baru dibuat: ' + SA_KONFIG.USERNAME);
            } else {
                // ── Update + dedupe ──
                saObj = users[saIndices[0]];
                if (saObj.username !== SA_KONFIG.USERNAME) { saObj.username = SA_KONFIG.USERNAME; perluSave = true; }
                if (saObj.password !== SA_KONFIG.PASSWORD) { saObj.password = SA_KONFIG.PASSWORD; perluSave = true; }
                if (saObj.kodeRole !== 'SA') { saObj.kodeRole = 'SA'; perluSave = true; }
                if (saObj.role !== SA_KONFIG.ROLE) { saObj.role = SA_KONFIG.ROLE; perluSave = true; }
                if (saObj.status !== 'Aktif') { saObj.status = 'Aktif'; perluSave = true; }
                if (saObj.statusVerifikasi !== 'Aktif') { saObj.statusVerifikasi = 'Aktif'; perluSave = true; }
                if (!saObj.isProtected) { saObj.isProtected = true; perluSave = true; }

                // A26: Dedupe — keep first, remove rest
                if (saIndices.length > 1) {
                    for (var i = saIndices.length - 1; i >= 1; i--) {
                        users.splice(saIndices[i], 1);
                    }
                    _log('Dedupe: ' + (saIndices.length - 1) + ' SA duplicates removed', true);
                    perluSave = true;
                }
            }

            if (perluSave) {
                window.csSaveJSON(CS_KEY.DATA_LOGIN_USER, users, { backup: false });
            }

            // ── Sync dataAkunAktif ──
            var aktif = window.csLoadJSON(CS_KEY.DATA_AKUN_AKTIF, []);
            if (!Array.isArray(aktif)) aktif = [];
            var idxA = aktif.findIndex(function(u) {
                return u && (u.idUser === SA_KONFIG.ID_USER || u.kodeRole === 'SA');
            });
            if (idxA === -1) {
                aktif.push(Object.assign({}, saObj));
                window.csSaveJSON(CS_KEY.DATA_AKUN_AKTIF, aktif, { backup: false });
            } else {
                aktif[idxA] = Object.assign({}, saObj);
                window.csSaveJSON(CS_KEY.DATA_AKUN_AKTIF, aktif, { backup: false });
            }

            // ── Buat profil entry (jika belum ada) ──
            try {
                var profilKey = 'profil_' + SA_KONFIG.ID_USER;
                if (!localStorage.getItem(profilKey)) {
                    localStorage.setItem(profilKey, JSON.stringify({
                        nama:        SA_KONFIG.NAMA,
                        namaLengkap: SA_KONFIG.NAMA,
                        namaToko:    'SuperAdmin',
                        nikKtp:      '',
                        email:       SA_KONFIG.EMAIL,
                        hp:          SA_KONFIG.HP,
                        alamat:      SA_KONFIG.ALAMAT,
                        fotoUrl:     '',
                        dragX:       0,
                        dragY:       0
                    }));
                }
            } catch (e) {}

            // ── Sync global VG (jika ada) ──
            try {
                if (Array.isArray(window.dataLoginUser)) {
                    window.dataLoginUser.length = 0;
                    users.forEach(function(x) { window.dataLoginUser.push(x); });
                }
                if (Array.isArray(window.dataAkunAktif)) {
                    window.dataAkunAktif.length = 0;
                    aktif.forEach(function(x) { window.dataAkunAktif.push(x); });
                }
            } catch (e) {}

            return { sukses: true, isNew: isNew, sa: saObj };
        } catch (e) {
            console.error('SA-HARD v5.1: gagal buat/update SA:', e);
            return { sukses: false, pesan: e.message };
        }
    }

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.6] — PUBLIC API (A28: 3 fungsi + debug)
    // ═══════════════════════════════════════════════════════════
    window.saHardCekStatus = function() {
        try {
            var sa = _cekSASudahAda();
            var users = window.csLoadJSON(CS_KEY.DATA_LOGIN_USER, []);
            return {
                terpasang:   window._saHardDoneV51,
                versi:       window._saHardVersi,
                saAda:       !!sa,
                saUsername:  sa ? sa.username : null,
                saIdUser:    sa ? (sa.idUser || sa.id) : null,
                saStatus:    sa ? sa.status : null,
                totalUser:   Array.isArray(users) ? users.length : 0,
                kredensial: {
                    username: SA_KONFIG.USERNAME,
                    password: SA_KONFIG.PASSWORD,
                    idUser:   SA_KONFIG.ID_USER
                }
            };
        } catch (e) { return { error: e.message }; }
    };

    window.saHardResetSA = function() {
        try {
            var users = window.csLoadJSON(CS_KEY.DATA_LOGIN_USER, []);
            if (Array.isArray(users)) {
                users = users.filter(function(u) { return u && u.kodeRole !== 'SA'; });
                window.csSaveJSON(CS_KEY.DATA_LOGIN_USER, users, { backup: false });
            }
            var aktif = window.csLoadJSON(CS_KEY.DATA_AKUN_AKTIF, []);
            if (Array.isArray(aktif)) {
                aktif = aktif.filter(function(u) { return u && u.kodeRole !== 'SA'; });
                window.csSaveJSON(CS_KEY.DATA_AKUN_AKTIF, aktif, { backup: false });
            }
            _log('SA dihapus. Jalankan saHardBuatSAIfMissing() untuk buat ulang.', true);
            return { sukses: true };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.saHardBuatSAIfMissing = function() {
        return _buatAtauUpdateSA();
    };

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.7] — DEBUG (A5) — cekV51 (13 titik cek)
    // ═══════════════════════════════════════════════════════════
    window.debugSAHard = function() {
        var info = {
            blok:  'SA-HARD',
            versi: window._saHardVersi,
            guard: {
                v51:  window._saHardDoneV51,
                v5:   window._saHardDoneV5,
                v4:   window._saHardDoneV4,
                v3:   window._saHardDoneV3,
                done: window._saHardDone
            },
            konfig: SA_KONFIG,
            status: window.saHardCekStatus(),
            cekV51: {
                A5_debugAda:          typeof window.debugSAHard === 'function',
                A19_retryPerDep:      typeof window._saHardRetryCS1 === 'number',
                A26_idempotent:       typeof _cekSASudahAda === 'function',
                A27_silent:           true,
                A28_prefixAPI:        typeof window.saHardCekStatus === 'function',
                A31_iifeUnik:         true,
                A32_guardUnik:        window._saHardDoneV51 === true,
                A33_registryBlok:     (window.CP_REGISTRY_BLOK || []).some(function(b) {
                    return b && b.kode === 'SA-HARD';
                }),
                A34_riwayat:          (window.CP_RIWAYAT || []).some(function(r) {
                    return r && r.blok === 'SA-HARD' &&
                           r.nama && r.nama.indexOf('v5.1') !== -1;
                }),
                A35_registryFungsi:   !!(window.CP_REGISTRY_FUNGSI &&
                                          window.CP_REGISTRY_FUNGSI['saHard']),
                A43_selfRegister:     !!(window.BLOK_GUARD_MAP &&
                                          window.BLOK_GUARD_MAP['_saHardDoneV51']),
                A46_healthSync:       !!(window.BLOK_GUARD_MAP &&
                                          window.BLOK_GUARD_MAP['_saHardDoneV5']),
                dedupe_logic:         true
            },
            exempt: {
                A8_A10_menuConfig:  'Seeder — bukan menu UI',
                A11_A13_3Pintu:     'Seeder — tidak komunikasi antar blok',
                A37_prefixID:       'ID SA fixed (ID_R2C_SA-000001) — by design',
                A38_verif15:        'SA aktif langsung — tidak butuh verif',
                A40_kopdes:         'SA bukan Kopdes',
                A41_customer:       'SA bukan Customer',
                A42_kasir:          'SA bukan Kasir',
                A45_media:          'Seeder — tidak menyimpan media'
            },
            fungsi: {
                saHardCekStatus:       typeof window.saHardCekStatus,
                saHardResetSA:         typeof window.saHardResetSA,
                saHardBuatSAIfMissing: typeof window.saHardBuatSAIfMissing,
                debugSAHard:           typeof window.debugSAHard
            }
        };
        console.log('🔍 debugSAHard v5.1:', info);
        return info;
    };

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.8] — JALANKAN (A26 idempotent)
    // ═══════════════════════════════════════════════════════════
    var hasil = _buatAtauUpdateSA();

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.9] — AUTO-REGISTRY (A33/A34/A35) — RETRY 20×
    // ═══════════════════════════════════════════════════════════
    var _regAttempt = 0;
    var _regMax = 20;

    function _registryAttempt() {
        _regAttempt++;
        var cpReady = typeof window.cpTambahBlok === 'function' &&
                      typeof window.cpUpdateBlok === 'function' &&
                      typeof window.cpTambahRiwayat === 'function' &&
                      typeof window.cpUpdateFungsi === 'function';
        if (!cpReady) {
            if (_regAttempt < _regMax) { setTimeout(_registryAttempt, 500); return; }
            console.warn('[SA-HARD v5.1] CP registry belum ready setelah ' + _regMax + ' attempt.');
            return;
        }
        try {
            var hariIni = new Date().toISOString().substring(0, 10);
            var namaFinal = 'SuperAdmin Tertanam v5.1 FINAL';

            // A33: cpTambahBlok-first
            var ada = (window.CP_REGISTRY_BLOK || []).some(function(b) {
                return b && b.kode === 'SA-HARD';
            });
            if (!ada) {
                window.cpTambahBlok({
                    kode: 'SA-HARD', nama: namaFinal,
                    layer: 'L2', status: 'Selesai', tanggal: hariIni
                });
            } else {
                window.cpUpdateBlok('SA-HARD', { status: 'Selesai', nama: namaFinal });
            }

            // A34: cpTambahRiwayat
            var adaR = (window.CP_RIWAYAT || []).some(function(r) {
                return r && r.blok === 'SA-HARD' &&
                       r.nama && r.nama.indexOf('v5.1') !== -1;
            });
            if (!adaR) {
                window.cpTambahRiwayat({
                    tanggal: hariIni, blok: 'SA-HARD', nama: namaFinal,
                    keterangan: 'FIX v5.1 (dari v5.0): +A43 self-register ' +
                                '(v5.0 TIDAK ADA) · +A46 health sync · ' +
                                '+A19 dep retry 30× (v5.0 no retry) · ' +
                                '+Dedupe multiple SA · +A27 full silent ' +
                                '(log 1 baris, dulu ~12) · +A29/A30 sub-seksi ' +
                                '[SA-HARD.0]—[SA-HARD.10] · +A5 debugSAHard ' +
                                'cekV51 (13 titik, dulu 4) · +A32 guard ' +
                                '_saHardDoneV51 (alias V5/V4/V3/Done) · ' +
                                '+A31 IIFE rename V5_FINAL → V51 · ' +
                                '+A33/A34/A35 retry 20× (dulu fixed 700ms) · ' +
                                '+A35 jumlah 4 · exempt A8-A10/A11-A13/' +
                                'A37/A40-A42/A45 eksplisit'
                });
            }

            // A35: cpUpdateFungsi
            window.cpUpdateFungsi('saHard', {
                nama:   'SuperAdmin Tertanam v5.1',
                status: 'Selesai',
                jumlah: 4
            });

            _log('Registry OK (attempt ' + _regAttempt + '/' + _regMax + ')');
        } catch (e) {
            console.warn('[SA-HARD v5.1] Registry error:', e.message);
        }
    }
    setTimeout(_registryAttempt, 700);

    // ═══════════════════════════════════════════════════════════
    // [SA-HARD.10] — LOG TERPASANG (A5, A27: SINGLE LINE ONLY)
    // ═══════════════════════════════════════════════════════════
    var _logStatus = (hasil && hasil.sukses)
        ? (hasil.isNew ? 'CREATED' : 'OK')
        : 'FAILED';

    console.log(
        '%c🇮🇩 SA-HARD v5.1 — SuperAdmin ' + _logStatus + ' 🇮🇩',
        'background:linear-gradient(90deg,#DC3545 0%,#DC3545 50%,#FFFFFF 50%,#FFFFFF 100%);' +
        'color:#000;padding:2px 6px;font-weight:bold;border:1px solid #DC3545;'
    );

})();
</script>
<!-- ═══ AKHIR BLOK SA-HARD v5.1 FINAL — SEEDER SUPERADMIN 🇮🇩 ══ -->
