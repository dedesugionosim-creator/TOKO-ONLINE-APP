    // [FSDU.10] — PINTU 1: KIRIM (A11, A13)
    // ═══════════════════════════════════════════════════════════
    window.kirimFSDU = function(tipe, ke, data, idRef) {
        try {
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }
            return window.mnKirimKeMenu({
                tipe: tipe || 'info',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser(),
                    menu:     'FSDU',
                    blok:     'L4-FSDU'
                },
                ke:        ke || { menu: 'FSDU' },
                data:      data || {},
                idRef:     idRef || null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()
            });
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSDU.11] — PINTU 2 & 3: TERIMA & AMBIL (FIXED A13)
    // ═══════════════════════════════════════════════════════════
    window.terimaFSDU = function(aksiMenu, opts) {
        try {
            if (typeof window.mnInboxMenu !== 'function') return [];
            return window.mnInboxMenu(aksiMenu || 'FSDU', opts);
        } catch (e) { return []; }
    };

    // A13 FIX: return paket format
    // Signature:
    //   ambilFSDU(tipeDasbor, filter)         → snapshot list owner per kategori
    //   ambilFSDU(tipeDasbor, filter, opts)   → opts bisa punya { idPaket, aksiMenu, keMenu }
    window.ambilFSDU = function(tipeDasbor, filter, opts) {
        filter = filter || {};
        opts   = opts   || {};
        try {
            // Mode 1: MN paket
            if (opts.idPaket && opts.aksiMenu && typeof window.mnAmbilPaket === 'function') {
                return window.mnAmbilPaket(opts.aksiMenu, opts.idPaket, opts);
            }

            // Mode 2: snapshot paket
            tipeDasbor = tipeDasbor || 'seller';
            var listResult = window.fsduListOwner(tipeDasbor, filter);
            var katList    = window.fsduListKategori();

            return {
                tipe: 'snapshot-fsdu',
                dari: { menu: 'FSDU', blok: 'L4-FSDU' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: {
                    kategori:      tipeDasbor,
                    daftar:        listResult.data || [],
                    total:         listResult.total || 0,
                    listKategori:  katList,
                    state:         window.fsduGetState(),
                    pengirim:      {
                        idUser:   window.gidIdUser(),
                        kodeRole: window.gidKodeRoleUser()
                    }
                },
                idRef:     null,
                timestamp: window.csNow ? window.csNow() : new Date().toISOString()
            };
        } catch (e) {
            return {
                tipe: 'error',
                dari: { menu: 'FSDU', blok: 'L4-FSDU' },
                ke:   { menu: opts.keMenu || 'caller' },
                data: null,
                pesan: e.message
            };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSDU.12a] — cekPintuFSDU + fsduCekKonsistensi32
    // ═══════════════════════════════════════════════════════════
    window.cekPintuFSDU = function() {
        var skor =
            (typeof window.kirimFSDU  === 'function' ? 1 : 0) +
            (typeof window.terimaFSDU === 'function' ? 1 : 0) +
            (typeof window.ambilFSDU  === 'function' ? 1 : 0);
        return {
            blok:    'FSDU',
            kirim:   typeof window.kirimFSDU  === 'function',
            terima:  typeof window.terimaFSDU === 'function',
            ambil:   typeof window.ambilFSDU  === 'function',
            skor:    skor + '/3',
            lengkap: skor === 3
        };
    };

    window.fsduStatistik = function() {
        try {
            var katList = window.fsduListKategori();
            var perKatTotal = {};
            katList.forEach(function(k) {
                var r = window.fsduListOwner(k.kode, { limit: 9999 });
                perKatTotal[k.kode] = r.sukses ? r.total : 0;
            });

            return {
                sukses: true,
                data: {
                    totalKategori:   katList.length,
                    perKategoriTotal: perKatTotal,
                    state:           window.fsduGetState()
                }
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    window.fsduCekKonsistensi32 = function() {
        var hasil = { ok: true, totalCek: 0, totalWarning: 0, detail: [] };
        function _addCek(nama, status, pesan) {
            hasil.totalCek++;
            if (status !== 'ok') hasil.totalWarning++;
            hasil.detail.push({ cek: nama, status: status, pesan: pesan || '-' });
            if (status !== 'ok') hasil.ok = false;
        }

        try {
            // [1] CS_ROLE_MAP = 32
            var total = window.CS_ROLE_MAP ? Object.keys(window.CS_ROLE_MAP).length : 0;
            if (total === 32) {
                _addCek('CS_ROLE_MAP = 32', 'ok', 'Benar: 32 role');
            } else {
                _addCek('CS_ROLE_MAP = 32', 'warning', 'Ada ' + total);
            }

            // [2] FMO v1.1 tersedia
            if (typeof window.fmoListOwner === 'function' &&
                typeof window.fmoDetailOwner === 'function' &&
                typeof window.fmoAmbilProdukOwner === 'function') {
                _addCek('FMO v1.1 tersedia', 'ok', 'list + detail + produk');
            } else {
                _addCek('FMO v1.1 tersedia', 'warning', 'FMO belum lengkap');
            }

            // [3] FGD v1.1 tersedia (untuk dompet)
            if (typeof window.getSaldoDompet === 'function' ||
                typeof window.getDompetUser === 'function') {
                _addCek('FGD v1.1 tersedia', 'ok', 'getSaldoDompet/getDompetUser');
            } else {
                _addCek('FGD v1.1 tersedia', 'warning', 'FGD belum v1.1');
            }

            // [4] 🔴 CRITICAL FIX: tidak lagi panggil fgdGetDompet
            var callStr = String(window.fsduDetailOwner || '');
            if (callStr.indexOf('fgdGetDompet') === -1) {
                _addCek('CRITICAL FIX: no fgdGetDompet', 'ok', 'Menggunakan getSaldoDompet/getDompetUser');
            } else {
                _addCek('CRITICAL FIX: no fgdGetDompet', 'error', 'Masih panggil fgdGetDompet (BUG!)');
            }

            // [5] FSDU_KATEGORI derive dari CS_ROLE_MAP (A25)
            var katMap = _deriveFsduKategori();
            var totalRoleKat = 0;
            Object.keys(katMap).forEach(function(k) {
                totalRoleKat += katMap[k].length;
            });
            if (totalRoleKat >= 15) {
                _addCek('FSDU_KATEGORI >= 15 role', 'ok', totalRoleKat + ' role ter-mapping');
            } else {
                _addCek('FSDU_KATEGORI >= 15 role', 'warning', 'Ada ' + totalRoleKat);
            }

            // [6] Auto-detect role baru bekerja
            var kategoris = Object.keys(katMap);
            if (kategoris.length === 5) {
                _addCek('5 Kategori FSDU', 'ok', kategoris.join(', '));
            } else {
                _addCek('5 Kategori FSDU', 'warning', 'Ada ' + kategoris.length);
            }

            // [7] 3 Pintu lengkap
            var pintu = window.cekPintuFSDU();
            if (pintu.lengkap) {
                _addCek('3 Pintu lengkap', 'ok', '3/3');
            } else {
                _addCek('3 Pintu lengkap', 'warning', pintu.skor);
            }

            // [8] A43 self-register
            if (window.BLOK_GUARD_MAP && window.BLOK_GUARD_MAP['_fsduDoneV11']) {
                _addCek('A43 self-register', 'ok', 'BLOK_GUARD_MAP terisi');
            } else if (typeof window.blokDaftarkanGuard === 'function') {
                _addCek('A43 self-register', 'warning', 'Entry FSDU belum terdaftar');
            } else {
                _addCek('A43 self-register', 'warning', 'blokDaftarkanGuard belum ada');
            }

            // [9] MFD tidak ada
            if (window.CS_ROLE_MAP && window.CS_ROLE_MAP['MFD']) {
                _addCek('MFD tidak ada', 'warning', 'MFD ada di CS_ROLE_MAP');
            } else {
                _addCek('MFD tidak ada', 'ok', 'MFD tidak ada (benar)');
            }
        } catch (e) {
            hasil.ok = false;
            hasil.detail.push({ cek: 'exception', status: 'error', pesan: e.message });
        }
        return hasil;
    };

<script>
(function BLOK_FG_GIF_V12() {

    // ═══════════════════════════════════════════════════════════
    // [GIF.1] — GUARD 3 LAPIS + DEP RETRY + A43 SELF-REGISTER
    // ═══════════════════════════════════════════════════════════
    if (window._fggifDoneV12) return;

    // ── A19: CS1 (WAJIB) ──
    if (!window.CS_ROLE_MAP) {
        window._fggifRetryCS1 = (window._fggifRetryCS1 || 0) + 1;
        if (window._fggifRetryCS1 < 20) { setTimeout(BLOK_FG_GIF_V12, 500); return; }
        console.warn('⚠️ FG-GIF v1.2: CS1 tidak tersedia setelah 20 retry. Ditunda.');
        return;
    }

    // ── A19: CS2 storage ──
    if (typeof window.csLoadJSON !== 'function' ||
        typeof window.csSaveJSON !== 'function') {
        window._fggifRetryCS2 = (window._fggifRetryCS2 || 0) + 1;
        if (window._fggifRetryCS2 < 20) { setTimeout(BLOK_FG_GIF_V12, 500); return; }
        console.warn('⚠️ FG-GIF v1.2: CS2 tidak tersedia. Ditunda.');
        return;
    }

    // ── A19: GID (WAJIB) ──
    if (typeof window.gidIdUser !== 'function' ||
        typeof window.gidKodeRoleUser !== 'function') {
        window._fggifRetryGID = (window._fggifRetryGID || 0) + 1;
        if (window._fggifRetryGID < 20) { setTimeout(BLOK_FG_GIF_V12, 500); return; }
        console.warn('⚠️ FG-GIF v1.2: GID tidak tersedia. Ditunda.');
        return;
    }

    // ── A19: FSE (WAJIB — untuk harga konversi) ──
    if (typeof window.getSettingEkonomiLengkapGlobal !== 'function') {
        window._fggifRetryFSE = (window._fggifRetryFSE || 0) + 1;
        if (window._fggifRetryFSE < 20) { setTimeout(BLOK_FG_GIF_V12, 500); return; }
        console.warn('⚠️ FG-GIF v1.2: FSE tidak tersedia. Ditunda.');
        return;
    }

    // ── Guard 4 lapis ──
    window._fggifDoneV12 = true;   // ⭐ UTAMA v1.2
    window._fggifDoneV11 = true;   // alias legacy
    window._fggifDoneV1  = true;   // alias legacy
    window._fggifDone    = true;   // general alias
    window._fggifVersi   = '1.2';

    // ── A43: Self-register guard ──
    if (typeof window.blokDaftarkanGuard === 'function') {
        window.blokDaftarkanGuard('_fggifDoneV12', 'FG-GIF');
    }

    // ═══════════════════════════════════════════════════════════
    // [GIF.2] — HELPER INTERNAL (DELEGASI A1/A2/A25)
    // ═══════════════════════════════════════════════════════════
    var STORAGE_KEY = 'dataSettingHargaGif';

    function _load() {
        var v = window.csLoadJSON(STORAGE_KEY, []);
        return Array.isArray(v) ? v : [];
    }
    function _save(list) {
        return window.csSaveJSON(STORAGE_KEY, list, { backup: false });
    }
    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }

    // A25: Delegasi ke CS5 csGenerateKodeKoleksi
    function _generateId() {
        if (typeof window.csGenerateKodeKoleksi === 'function') {
            try { return window.csGenerateKodeKoleksi('GIF'); } catch (e) {}
        }
        // Fallback
        var ts = Date.now().toString(36).toUpperCase();
        var rnd = (typeof window.csRandomStr === 'function')
            ? window.csRandomStr(4)
            : Math.random().toString(36).substr(2, 4).toUpperCase();
        return 'GIF-' + ts + '-' + rnd;
    }

    // ═══════════════════════════════════════════════════════════
    // [GIF.3] — VALIDASI INPUT (A19 + A45 media-safe)
    // ═══════════════════════════════════════════════════════════

    // Validasi hargaCoin (A19)
    function _validasiHargaCoin(coin) {
        var c = parseInt(coin, 10);
        if (isNaN(c) || c < 1) return null;
        if (c > 1000000) return null; // sanity cap
        return c;
    }

    // A45: Validasi media input — REJECT base64
    function _validasiMediaInput(input, jenis) {
        jenis = jenis || 'media';
        if (!input || input === null) return { idMedia: null, url: null, kosong: true };
        var str = String(input).trim();
        if (!str) return { idMedia: null, url: null, kosong: true };

        // 🔴 A45: REJECT base64 — DILARANG simpan langsung
        if (str.indexOf('data:') === 0) {
            return {
                error: 'A45 VIOLATION: ' + jenis + ' base64 tidak diizinkan. ' +
                       'Upload via mdSimpan() di BLOK MD (10.58) dulu, ' +
                       'lalu simpan idMedia hasilnya.'
            };
        }
        // Reject string panjang yang bukan URL (indikasi base64 tanpa prefix)
        if (str.length > 2000 && !/^https?:\/\//.test(str)) {
            return {
                error: 'A45 VIOLATION: ' + jenis + ' terlalu panjang (' + str.length +
                       ' char) — indikasi base64. Gunakan MD untuk upload.'
            };
        }

        // URL external atau path
        if (/^https?:\/\//.test(str) || str.indexOf('/') === 0) {
            return { idMedia: null, url: str };
        }

        // MD ID format (contoh: MD-XXX, R2C-MD-XXX)
        if (/^[A-Z][A-Z0-9]+-/.test(str)) {
            var url = str;
            if (typeof window.mdGetUrlPublik === 'function') {
                try { url = window.mdGetUrlPublik(str) || str; } catch (e) {}
            }
            return { idMedia: str, url: url };
        }

        return { error: 'Format ' + jenis + ' tidak dikenal: ' + str.substring(0, 50) };
    }

    // ═══════════════════════════════════════════════════════════
    // [GIF.4] — GETTER: GetAll, GetById, Cari, Statistik
    // ═══════════════════════════════════════════════════════════
    window.gifSettingGetAll = function() {
        return _load();
    };

    window.gifSettingGetById = function(id) {
        if (!id) return null;
        return _load().find(function(g) { return g && g.id === id; }) || null;
    };

    window.gifSettingCari = function(filter) {
        filter = filter || {};
        try {
            var list = _load();
            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(g) {
                    return g && g.nama && String(g.nama).toLowerCase().indexOf(q) !== -1;
                });
            }
            if (filter.hargaMin) {
                var hmin = parseInt(filter.hargaMin, 10);
                if (!isNaN(hmin)) {
                    list = list.filter(function(g) {
                        return g && (parseInt(g.hargaCoin, 10) || 0) >= hmin;
                    });
                }
            }
            if (filter.hargaMax) {
                var hmax = parseInt(filter.hargaMax, 10);
                if (!isNaN(hmax)) {
                    list = list.filter(function(g) {
                        return g && (parseInt(g.hargaCoin, 10) || 0) <= hmax;
                    });
                }
            }
            return { sukses: true, total: list.length, data: list };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: [] };
        }
    };

    window.gifSettingStatistik = function() {
        try {
            var list = _load();
            if (list.length === 0) {
                return {
                    sukses: true,
                    data: {
                        total: 0, hargaMin: 0, hargaMax: 0,
                        hargaRata: 0, totalNilaiCoin: 0,
                        adaFoto: 0, adaVideo: 0
                    }
                };
            }
            var total = list.length;
            var hMin = Infinity, hMax = 0, sum = 0;
            var adaFoto = 0, adaVideo = 0;
            list.forEach(function(g) {
                var h = parseInt(g.hargaCoin, 10) || 0;
                if (h < hMin) hMin = h;
                if (h > hMax) hMax = h;
                sum += h;
                if (g.fotoUrl || g.idMediaFoto) adaFoto++;
                if (g.videoUrl || g.idMediaVideo) adaVideo++;
            });
            return {
                sukses: true,
                data: {
                    total:         total,
                    hargaMin:      hMin === Infinity ? 0 : hMin,
                    hargaMax:      hMax,
                    hargaRata:     Math.round(sum / total),
                    totalNilaiCoin: sum,
                    adaFoto:       adaFoto,
                    adaVideo:      adaVideo
                }
            };
        } catch (e) {
            return { sukses: false, pesan: e.message, data: null };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [GIF.5] — MUTATOR: Tambah (A45 media-safe)
    // ═══════════════════════════════════════════════════════════
    window.gifSettingTambah = function(data) {
        try {
            if (!data || !data.nama) {
                return { sukses: false, pesan: 'Nama GIF wajib diisi' };
            }
            var hargaCoin = _validasiHargaCoin(data.harga || data.hargaCoin);
            if (hargaCoin === null) {
                return { sukses: false, pesan: 'Harga Coin harus bilangan 1—1.000.000' };
            }

            // A45: Validasi media input
            var medFoto  = _validasiMediaInput(data.fotoUrl  || data.idMediaFoto,  'foto');
            var medVideo = _validasiMediaInput(data.videoUrl || data.idMediaVideo, 'video');
            if (medFoto.error)  return { sukses: false, pesan: medFoto.error };
            if (medVideo.error) return { sukses: false, pesan: medVideo.error };

            var list = _load();
            var newGif = {
                id:            _generateId(),
                nama:          String(data.nama).trim(),
                hargaCoin:     hargaCoin,
                idMediaFoto:   medFoto.idMedia  || null,
                fotoUrl:       medFoto.url      || '',
                idMediaVideo:  medVideo.idMedia || null,
                videoUrl:      medVideo.url     || '',
                createdAt:     _now(),
                createdBy:     window.gidIdUser(),
                updatedAt:     null
            };
            list.push(newGif);
            _save(list);

            // A34
            if (typeof window.catatAktivitasGlobal === 'function') {
                try {
                    window.catatAktivitasGlobal(
                        window.gidIdUser(),
                        'Tambah GIF',
                        newGif.nama + ' — ' + newGif.hargaCoin + ' coin',
                        { kategori: 'Sistem', idRef: newGif.id }
                    );
                } catch (e) {}
            }

            return { sukses: true, pesan: 'GIF berhasil ditambahkan', data: newGif };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [GIF.6] — MUTATOR: Edit + Hapus
    // ═══════════════════════════════════════════════════════════
    window.gifSettingEdit = function(id, data) {
        try {
            if (!id || !data) return { sukses: false, pesan: 'ID / data kosong' };
            var list = _load();
            var idx = list.findIndex(function(g) { return g && g.id === id; });
            if (idx === -1) return { sukses: false, pesan: 'GIF tidak ditemukan' };

            // Validasi harga baru (jika ada)
            if (data.harga !== undefined || data.hargaCoin !== undefined) {
                var harga = _validasiHargaCoin(data.harga || data.hargaCoin);
                if (harga === null) {
                    return { sukses: false, pesan: 'Harga Coin tidak valid' };
                }
                list[idx].hargaCoin = harga;
            }

            // Nama (jika ada)
            if (data.nama !== undefined) {
                list[idx].nama = String(data.nama).trim();
            }

            // A45: Validasi media (jika ada perubahan)
            if (data.fotoUrl !== undefined || data.idMediaFoto !== undefined) {
                var medFoto = _validasiMediaInput(
                    data.fotoUrl || data.idMediaFoto, 'foto'
                );
                if (medFoto.error) return { sukses: false, pesan: medFoto.error };
                list[idx].idMediaFoto = medFoto.idMedia || null;
                list[idx].fotoUrl     = medFoto.url     || '';
            }
            if (data.videoUrl !== undefined || data.idMediaVideo !== undefined) {
                var medVideo = _validasiMediaInput(
                    data.videoUrl || data.idMediaVideo, 'video'
                );
                if (medVideo.error) return { sukses: false, pesan: medVideo.error };
                list[idx].idMediaVideo = medVideo.idMedia || null;
                list[idx].videoUrl     = medVideo.url     || '';
            }

            list[idx].updatedAt = _now();
            list[idx].updatedBy = window.gidIdUser();
            _save(list);

            // A34
            if (typeof window.catatAktivitasGlobal === 'function') {
                try {
                    window.catatAktivitasGlobal(
                        window.gidIdUser(),
                        'Edit GIF',
                        list[idx].nama,
                        { kategori: 'Sistem', idRef: id }
                    );
                } catch (e) {}
            }

            return { sukses: true, pesan: 'GIF berhasil diupdate', data: list[idx] };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    window.gifSettingHapus = function(id) {
        try {
            if (!id) return { sukses: false, pesan: 'ID kosong' };
            var list = _load();
            var target = list.find(function(g) { return g && g.id === id; });
            if (!target) return { sukses: false, pesan: 'GIF tidak ditemukan' };

            var newList = list.filter(function(g) { return g && g.id !== id; });
            _save(newList);

            // A34
            if (typeof window.catatAktivitasGlobal === 'function') {
                try {
                    window.catatAktivitasGlobal(
                        window.gidIdUser(),
                        'Hapus GIF',
                        target.nama,
                        { kategori: 'Sistem', idRef: id, level: 'warning' }
                    );
                } catch (e) {}
            }

            return { sukses: true, pesan: 'GIF berhasil dihapus' };
        } catch (e) { return { sukses: false, pesan: e.message }; }
    };

    // ═══════════════════════════════════════════════════════════
    // [GIF.7] — KONVERSI: HitungKonversi + Batch
    // ═══════════════════════════════════════════════════════════
    window.gifHitungKonversi = function(hargaCoin) {
        try {
            var c = parseInt(hargaCoin, 10);
            if (isNaN(c) || c < 0) return 0;
            var setting = window.getSettingEkonomiLengkapGlobal();
            var rate = parseInt(setting.hargaBeli, 10) || 900;
            return c * rate;
        } catch (e) { return 0; }
    };

    window.gifHitungKonversiBatch = function(listIdGif) {
        try {
            if (!Array.isArray(listIdGif)) return { sukses: false, pesan: 'Bukan array', data: [] };
            var hasil = [];
            var totalCoin = 0, totalRp = 0;
            listIdGif.forEach(function(id) {
                var g = window.gifSettingGetById(id);
                if (!g) return;
                var rp = window.gifHitungKonversi(g.hargaCoin);
                hasil.push({
                    id: g.id, nama: g.nama, hargaCoin: g.hargaCoin, hargaRp: rp
                });
                totalCoin += g.hargaCoin;
                totalRp   += rp;
            });
            return {
                sukses: true,
                data: { list: hasil, totalCoin: totalCoin, totalRp: totalRp }
            };
        } catch (e) { return { sukses: false, pesan: e.message, data: [] }; }
    };

    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }

    // ═══════════════════════════════════════════════════════════
    // [FKS.2] — KONSTANTA ROLE KDD (Kopdes Desa)
    // ═══════════════════════════════════════════════════════════
    // KDD = KDMP_DESA (level 4 — hierarki Kopdes A40).
    // Validasi via CS_ROLE_MAP (A36 — sumber kebenaran role)
    // Hierarki induk: KDMP_DESA → KDMP_KEC (A40)
    // ═══════════════════════════════════════════════════════════
    var ROLE_KDD = ['KDMP_DESA'];

    // Ekspose untuk blok lain
    window.FKS_ROLE_KDD = ROLE_KDD.slice();

    // Validasi role KDD via CS_ROLE_MAP (A36)
    function _isRoleKDDValid(kodeRole) {
        if (!kodeRole) return false;
        if (ROLE_KDD.indexOf(kodeRole) === -1) return false;
        return !!(window.CS_ROLE_MAP && window.CS_ROLE_MAP[kodeRole]);
    }

    // ═══════════════════════════════════════════════════════════
    // [FKS.3] — GETTER KATALOG KDD + VALIDASI
    // ═══════════════════════════════════════════════════════════

    // ── 3.1 fksGetDaftarKDD(filter) ──
    window.fksGetDaftarKDD = function(filter) {
        try {
            filter = filter || {};
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return [];

            var list = users.filter(function(u) {
                if (!u || !u.kodeRole) return false;
                if (!_isRoleKDDValid(u.kodeRole)) return false;
                var st = u.status || u.statusVerifikasi || 'Aktif';
                return st === 'Aktif';
            });

            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(u) {
                    return String(u.nama || u.namaLengkap || '')
                        .toLowerCase().indexOf(q) !== -1;
                });
            }
            if (filter.idInduk) {
                list = list.filter(function(u) {
                    return u.idInduk === filter.idInduk;
                });
            }

            return list.map(function(u) {
                var profil = _load('profil_' + u.idUser, {});
                if (!profil || typeof profil !== 'object') profil = {};
                return {
                    idUser:      u.idUser || u.id,
                    namaToko:    profil.namaToko || u.nama ||
                                 u.namaLengkap || 'Kopdes Desa',
                    kodeRole:    u.kodeRole,
                    wilayah:     u.kodeWilayah || u.alamat || 'Indonesia',
                    fotoUrl:     profil.fotoUrl || u.fotoUrl || '',
                    rating:      profil.rating || 5.0,
                    idInduk:     u.idInduk || null,
                    kodeWilayah: u.kodeWilayah || null
                };
            });
        } catch (e) {
            console.error('[FKS v1.2] fksGetDaftarKDD error:', e);
            return [];
        }
    };

    // ── 3.2 fksGetProdukKDD(idKDD) ──
    window.fksGetProdukKDD = function(idKDD) {
        try {
            if (!idKDD) return [];
            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) return [];
            return produk.filter(function(p) {
                return p && (p.idOwner === idKDD || p.idUser === idKDD);
            });
        } catch (e) {
            console.error('[FKS v1.2] fksGetProdukKDD error:', e);
            return [];
        }
    };

    // ── 3.3 fksCekKDDValid(idUser) — A40 hierarki ──
    window.fksCekKDDValid = function(idUser) {
        try {
            if (!idUser) return { valid: false, pesan: 'ID user kosong' };
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { valid: false, pesan: 'Data user tidak valid' };
            }

            var u = users.find(function(x) {
                return x && (x.idUser === idUser || x.id === idUser);
            });
            if (!u) return { valid: false, pesan: 'User tidak ditemukan: ' + idUser };

            if (!_isRoleKDDValid(u.kodeRole)) {
                return {
                    valid: false,
                    pesan: 'Role bukan KDD: ' + (u.kodeRole || '-')
                };
            }

            var st = u.status || u.statusVerifikasi || 'Aktif';
            if (st !== 'Aktif') {
                return { valid: false, pesan: 'KDD tidak aktif: ' + st };
            }

            // A40: KDMP_DESA wajib punya idInduk (KDMP_KEC)
            if (!u.idInduk) {
                return {
                    valid: false,
                    pesan: 'KDD wajib punya idInduk (KDMP_KEC) — A40'
                };
            }

            var induk = users.find(function(x) {
                return x && (x.idUser === u.idInduk || x.id === u.idInduk);
            });
            if (!induk) {
                return {
                    valid: false,
                    pesan: 'Induk KDD tidak ditemukan: ' + u.idInduk
                };
            }
            if (induk.kodeRole !== 'KDMP_KEC') {
                return {
                    valid: false,
                    pesan: 'Induk KDD harus KDMP_KEC, bukan: ' + induk.kodeRole
                };
            }

            return { valid: true, data: u, induk: induk };
        } catch (e) {
            return { valid: false, pesan: e.message };
        }
    };

    // ── 3.4 fksGetKasirKDD(idKDD) ──
    window.fksGetKasirKDD = function(idKDD) {
        try {
            if (!idKDD) return null;
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return null;
            return users.find(function(u) {
                return u && u.kodeRole === 'KSR_KDMP' &&
                       (u.idOwner === idKDD || u.idInduk === idKDD);
            }) || null;
        } catch (e) { return null; }
    };

    // ═══════════════════════════════════════════════════════════
    // [FKS.4] — MANAJEMEN KERANJANG (CRUD)
    // ═══════════════════════════════════════════════════════════
    window.fksGetKeranjang = function() {
        try {
            var cart = _load(_getKeranjangKey(), []);
            return Array.isArray(cart) ? cart : [];
        } catch (e) { return []; }
    };

    window.fksTambahKeranjang = function(idProduk, qty) {
        try {
            if (!idProduk) return { sukses: false, pesan: 'ID produk kosong' };
            var n = parseInt(qty, 10) || 1;
            if (n < 1) n = 1;

            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) {
                return { sukses: false, pesan: 'Data produk tidak valid' };
            }

            var prod = produk.find(function(p) {
                return p && (p.id === idProduk || p.idProduk === idProduk);
            });
            if (!prod) {
                return { sukses: false, pesan: 'Produk tidak ditemukan' };
            }

            // Validasi pemilik produk adalah KDD aktif + hierarki A40
            var idOwner = prod.idOwner || prod.idUser;
            var cek = window.fksCekKDDValid(idOwner);
            if (!cek.valid) {
                return {
                    sukses: false,
                    pesan: 'Produk bukan milik KDD aktif: ' + cek.pesan
                };
            }

            var cart = window.fksGetKeranjang();
            var existing = cart.find(function(c) {
                return c.idProduk === idProduk;
            });

            if (existing) {
                existing.qty += n;
                existing.subtotal = existing.qty * existing.harga;
            } else {
                cart.push({
                    idProduk: idProduk,
                    idKDD:    idOwner,
                    nama:     prod.nama || prod.namaProduk || '-',
                    harga:    parseFloat(prod.harga) || 0,
                    qty:      n,
                    subtotal: (parseFloat(prod.harga) || 0) * n
                });
            }
            var r = _save(_getKeranjangKey(), cart);
            if (!r.sukses) return { sukses: false, pesan: r.pesan };
            return { sukses: true, cart: cart };
        } catch (e) {
            console.error('[FKS v1.2] fksTambahKeranjang error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    window.fksKosongkanKeranjang = function() {
        try {
            var r = _save(_getKeranjangKey(), []);
            return { sukses: r.sukses, pesan: r.pesan };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fksHapusItemKeranjang = function(idProduk) {
        try {
            if (!idProduk) return { sukses: false, pesan: 'ID kosong' };
            var cart = window.fksGetKeranjang().filter(function(c) {
                return c.idProduk !== idProduk;
            });
            var r = _save(_getKeranjangKey(), cart);
            return { sukses: r.sukses, cart: cart };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FKS.5] — CHECKOUT KE CHAT KASIR (delegasi MN — A1, A2, A25)
    // ═══════════════════════════════════════════════════════════
    // Alur:
    //   1. Validasi KDD (role + status + hierarki A40)
    //   2. Cari kasir KSR_KDMP milik KDD
    //   3. Kalau kasir ada → kirim paket ke kasir
    //      Kalau kasir BELUM ada → kirim paket ke KDD langsung (fallback)
    //   4. Hapus keranjang KDD ini
    // ═══════════════════════════════════════════════════════════
    window.fksCheckoutKeChat = function(idKDD, metode) {
        try {
            if (!idKDD) return { sukses: false, pesan: 'ID KDD kosong' };

            // 1. Validasi KDD
            var cekKDD = window.fksCekKDDValid(idKDD);
            if (!cekKDD.valid) {
                return { sukses: false, pesan: 'KDD tidak valid: ' + cekKDD.pesan };
            }

            var cart = window.fksGetKeranjang().filter(function(c) {
                return c.idKDD === idKDD;
            });
            if (cart.length === 0) {
                return { sukses: false, pesan: 'Keranjang kosong untuk KDD ini' };
            }

            var total = cart.reduce(function(s, i) {
                return s + (i.subtotal || 0);
            }, 0);

            // 2. Cari kasir KSR_KDMP
            var kasir = window.fksGetKasirKDD(idKDD);

            // 3. Tentukan target chat (kasir → atau fallback ke KDD langsung)
            var targetChat = kasir ? (kasir.idUser || kasir.id) : idKDD;
            var targetRole = kasir ? 'KSR_KDMP' : 'KDMP_DESA';
            var modeChat = kasir ? 'kasir_kdd' : 'kdd_langsung';

            // A1: pakai ID transaksi dari CS5 jika tersedia
            var idRef = (typeof window.csGenerateIdTransaksi === 'function')
                ? window.csGenerateIdTransaksi()
                : ('KDD-' + Date.now());

            // A13: format paket standar
            var paketPesan = {
                tipe: 'order_kopdes',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                    nama:     window.getNamaUserAktif ? window.getNamaUserAktif() : 'User'
                },
                ke: {
                    menu:           'chat_kopdes',
                    idUserTarget:   targetChat,
                    kodeRoleTarget: targetRole
                },
                data: {
                    idKDD:    idKDD,
                    items:    cart,
                    total:    total,
                    metode:   metode || 'Belum Dipilih',
                    catatan:  'Mohon konfirmasi pesanan ini.',
                    modeChat: modeChat
                },
                idRef:     idRef,
                timestamp: _now()
            };

            // Delegasi MN (A25)
            if (typeof window.mnKirimKeMenu === 'function') {
                window.mnKirimKeMenu(paketPesan);
            } else {
                // Fallback dev: tulis ke inbox MN key (MN belum terpasang)
                var inboxKey = 'r2c_mn_inbox_chat_kopdes';
                var inbox = _load(inboxKey, []);
                if (!Array.isArray(inbox)) inbox = [];
                inbox.unshift(paketPesan);
                _save(inboxKey, inbox);
            }

            // 4. Hapus keranjang KDD ini
            var newCart = window.fksGetKeranjang().filter(function(c) {
                return c.idKDD !== idKDD;
            });
            _save(_getKeranjangKey(), newCart);

            return {
                sukses: true,
                pesan: kasir
                    ? 'Pesanan dikirim ke Kasir KDD'
                    : 'Pesanan dikirim ke KDD (kasir belum ada)',
                idRef:      idRef,
                target:     targetChat,
                targetRole: targetRole,
                modeChat:   modeChat,
                total:      total,
                adaKasir:   !!kasir
            };
        } catch (e) {
            console.error('[FKS v1.2] fksCheckoutKeChat error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

            kirim:  typeof window.kirimFKS  === 'function',
            terima: typeof window.terimaFKS === 'function',
            ambil:  typeof window.ambilFKS  === 'function',

            lengkap: skor === 3

<script>
(function BLOK_FSS_V14() {
    // ═══════════════════════════════════════════════════════════
    // [FSS.0] — GUARD UTAMA + ALIAS (A32) + SELF-REGISTER (A43)
    // ═══════════════════════════════════════════════════════════
    if (window._fssDoneV14) {
        console.log('ℹ️ BLOK FSS v1.4 sudah terpasang.');
        return;
    }
    if (!window.CS_ROLE_MAP) {
        console.warn('⚠️ BLOK FSS v1.4: CS_ROLE_MAP belum siap. Ditunda.');
        return;
    }
    if (!window.csLoadJSON || !window.csSaveJSON) {
        console.warn('⚠️ BLOK FSS v1.4: CS2 (Storage) belum siap. Ditunda.');
        return;
    }
    if (typeof window.gidIdUser !== 'function') {
        console.warn('⚠️ BLOK FSS v1.4: GID belum siap. Ditunda.');
        return;
    }

    // ── Set guard 5 lapis (A32) ──
    window._fssDoneV14 = true;   // ⭐ GUARD UTAMA v1.4
    window._fssDoneV13 = true;   // alias backward compat
    window._fssDoneV12 = true;   // alias
    window._fssDoneV11 = true;   // alias
    window._fssDoneV1  = true;   // alias legacy
    window._fssVersi   = '1.4';

    // ── [A43/A46] Self-register guard ke BLOK_GUARD_MAP ──
    // Tanpa ini → health check 10.83 tampil "❌ tidak ada"
    if (typeof window.blokDaftarkanGuard === 'function') {
        try {
            window.blokDaftarkanGuard('_fssDoneV14', 'FSS');
        } catch (e) {
            console.warn('[FSS v1.4] blokDaftarkanGuard warn:', e.message);
        }
    }

    // ═══════════════════════════════════════════════════════════
    // [FSS.0b] — REGISTER KEY PREFIX KE CS_KEY (A18 PATTERN)
    // ═══════════════════════════════════════════════════════════
    // A18 pattern: window.X = window.X || default (idempotent, safe extend).
    // Kalau CS1 v5.0 nanti mendaftarkan key ini secara resmi → no conflict.
    // ═══════════════════════════════════════════════════════════
    if (window.CS_KEY) {
        window.CS_KEY.KERANJANG_SELLER_PREFIX =
            window.CS_KEY.KERANJANG_SELLER_PREFIX || 'dataKeranjangSeller_';
    }

    // ═══════════════════════════════════════════════════════════
    // [FSS.1] — HELPER INTERNAL (delegasi CS2/CS4 — A1, A2, A25, A19)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) {
        try {
            var v = window.csLoadJSON(key, def);
            // A19: paksa tipe via CS4 helper jika tersedia
            if (typeof window.csIsArray === 'function' && window.csIsArray(def)) {
                return window.csIsArray(v) ? v : def;
            }
            if (typeof window.csIsObject === 'function' && window.csIsObject(def)) {
                return window.csIsObject(v) ? v : def;
            }
            // Fallback manual
            if (Array.isArray(def) && !Array.isArray(v)) return def;
            if (def && typeof def === 'object' && !Array.isArray(def) &&
                (!v || typeof v !== 'object' || Array.isArray(v))) {
                return def;
            }
            return v;
        } catch (e) { return def; }
    }

    function _save(key, data) {
        try {
            return window.csSaveJSON(key, data, { backup: false });
        } catch (e) { return { sukses: false, pesan: e.message }; }
    }

    function _getKeranjangKey() {
        try {
            var prefix = (window.CS_KEY && window.CS_KEY.KERANJANG_SELLER_PREFIX)
                ? window.CS_KEY.KERANJANG_SELLER_PREFIX
                : 'dataKeranjangSeller_';
            var idUser = window.gidIdUser();
            return idUser ? (prefix + idUser) : (prefix + 'GUEST');
        } catch (e) {
            return 'dataKeranjangSeller_GUEST';
        }
    }

    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }

    // ═══════════════════════════════════════════════════════════
    // [FSS.2] — KONSTANTA 6 ROLE SELLER SKU MURNI
    // ═══════════════════════════════════════════════════════════
    // 6 role seller SKU: TK · PP · PM · COD · OJ · GR
    // (DST/DP/DLR/JS/FIN pakai Surat Kerjasama — bukan cakupan FSS)
    // ═══════════════════════════════════════════════════════════
    var ROLE_SELLER = ['TK', 'PP', 'PM', 'COD', 'OJ', 'GR'];

    window.FSS_ROLE_SELLER = ROLE_SELLER.slice();

    function _isRoleSellerValid(kodeRole) {
        if (!kodeRole) return false;
        if (ROLE_SELLER.indexOf(kodeRole) === -1) return false;
        return !!(window.CS_ROLE_MAP && window.CS_ROLE_MAP[kodeRole]);
    }

    // ═══════════════════════════════════════════════════════════
    // [FSS.3] — GETTER KATALOG (daftar + produk seller)
    // ═══════════════════════════════════════════════════════════

    // ── 3.1 fssGetDaftarSeller(filter) ──
    window.fssGetDaftarSeller = function(filter) {
        try {
            filter = filter || {};
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return [];

            var list = users.filter(function(u) {
                if (!u || !u.kodeRole) return false;
                if (!_isRoleSellerValid(u.kodeRole)) return false;
                var st = u.status || u.statusVerifikasi || 'Aktif';
                return st === 'Aktif';
            });

            if (filter.kodeRole) {
                list = list.filter(function(u) { return u.kodeRole === filter.kodeRole; });
            }
            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(u) {
                    return String(u.nama || u.namaLengkap || '')
                        .toLowerCase().indexOf(q) !== -1;
                });
            }

            return list.map(function(u) {
                var profil = _load('profil_' + u.idUser, {});
                if (!profil || typeof profil !== 'object') profil = {};
                return {
                    idUser:   u.idUser || u.id,
                    namaToko: profil.namaToko || u.nama || u.namaLengkap || 'Seller',
                    kodeRole: u.kodeRole,
                    wilayah:  u.alamat || 'Indonesia',
                    fotoUrl:  profil.fotoUrl || u.fotoUrl || '',
                    rating:   profil.rating || 5.0
                };
            });
        } catch (e) {
            console.error('[FSS v1.4] fssGetDaftarSeller error:', e);
            return [];
        }
    };

    // ── 3.2 fssGetProdukSeller(idSeller) ──
    window.fssGetProdukSeller = function(idSeller) {
        try {
            if (!idSeller) return [];
            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) return [];
            return produk.filter(function(p) {
                return p && (p.idOwner === idSeller || p.idUser === idSeller);
            });
        } catch (e) {
            console.error('[FSS v1.4] fssGetProdukSeller error:', e);
            return [];
        }
    };

    // ── 3.3 fssCekSellerValid(idUser) — role + status ──
    window.fssCekSellerValid = function(idUser) {
        try {
            if (!idUser) return { valid: false, pesan: 'ID user kosong' };
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { valid: false, pesan: 'Data user tidak valid' };
            }

            var u = users.find(function(x) {
                return x && (x.idUser === idUser || x.id === idUser);
            });
            if (!u) return { valid: false, pesan: 'User tidak ditemukan: ' + idUser };

            if (!_isRoleSellerValid(u.kodeRole)) {
                return {
                    valid: false,
                    pesan: 'Role bukan seller: ' + (u.kodeRole || '-')
                };
            }

            var st = u.status || u.statusVerifikasi || 'Aktif';
            if (st !== 'Aktif') {
                return { valid: false, pesan: 'Seller tidak aktif: ' + st };
            }

            return { valid: true, data: u };
        } catch (e) {
            return { valid: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSS.4] — MANAJEMEN KERANJANG (CRUD)
    // ═══════════════════════════════════════════════════════════
    window.fssGetKeranjang = function() {
        try {
            var cart = _load(_getKeranjangKey(), []);
            return Array.isArray(cart) ? cart : [];
        } catch (e) { return []; }
    };

    // ── 4.2 fssTambahKeranjang — +validasi seller ──
    window.fssTambahKeranjang = function(idProduk, qty) {
        try {
            if (!idProduk) return { sukses: false, pesan: 'ID produk kosong' };
            var n = parseInt(qty, 10) || 1;
            if (n < 1) n = 1;

            var produk = _load('dataProduk', []);
            if (!Array.isArray(produk)) {
                return { sukses: false, pesan: 'Data produk tidak valid' };
            }

            var prod = produk.find(function(p) {
                return p && (p.id === idProduk || p.idProduk === idProduk);
            });
            if (!prod) return { sukses: false, pesan: 'Produk tidak ditemukan' };

            // Validasi pemilik produk adalah seller aktif
            var idOwner = prod.idOwner || prod.idUser;
            var cek = window.fssCekSellerValid(idOwner);
            if (!cek.valid) {
                return {
                    sukses: false,
                    pesan: 'Produk bukan milik seller aktif: ' + cek.pesan
                };
            }

            var cart = window.fssGetKeranjang();
            var existing = cart.find(function(c) { return c.idProduk === idProduk; });

            if (existing) {
                existing.qty += n;
                existing.subtotal = existing.qty * existing.harga;
            } else {
                cart.push({
                    idProduk: idProduk,
                    idSeller: idOwner,
                    nama:     prod.nama || prod.namaProduk || '-',
                    harga:    parseFloat(prod.harga) || 0,
                    qty:      n,
                    subtotal: (parseFloat(prod.harga) || 0) * n
                });
            }
            var r = _save(_getKeranjangKey(), cart);
            if (!r.sukses) return { sukses: false, pesan: r.pesan };
            return { sukses: true, cart: cart };
        } catch (e) {
            console.error('[FSS v1.4] fssTambahKeranjang error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    window.fssKosongkanKeranjang = function() {
        try {
            var r = _save(_getKeranjangKey(), []);
            return { sukses: r.sukses, pesan: r.pesan };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.fssHapusItemKeranjang = function(idProduk) {
        try {
            if (!idProduk) return { sukses: false, pesan: 'ID kosong' };
            var cart = window.fssGetKeranjang().filter(function(c) {
                return c.idProduk !== idProduk;
            });
            var r = _save(_getKeranjangKey(), cart);
            return { sukses: r.sukses, cart: cart };
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSS.5] — CHECKOUT KE CHAT (delegasi MN — A1, A2, A25, A12)
    // ═══════════════════════════════════════════════════════════
    // ⚠️ A12 NOTE — Graceful degradation:
    //   Kalau MN (mnKirimKeMenu) belum terpasang, fallback menulis ke
    //   inbox key `r2c_mn_inbox_chat_seller`. Ini adalah SCAFFOLDING
    //   untuk dev — bukan solusi permanen. Saat MN diinstall, MN akan
    //   baca key ini sebagai antrean awal. Ini adalah deviasi
    //   terencana dari A12 untuk development tanpa MN.
    // ═══════════════════════════════════════════════════════════
    window.fssCheckoutKeChat = function(idSeller, metode) {
        try {
            if (!idSeller) return { sukses: false, pesan: 'ID seller kosong' };

            // Validasi seller sebelum checkout
            var cekSeller = window.fssCekSellerValid(idSeller);
            if (!cekSeller.valid) {
                return { sukses: false, pesan: 'Seller tidak valid: ' + cekSeller.pesan };
            }

            var cart = window.fssGetKeranjang().filter(function(c) {
                return c.idSeller === idSeller;
            });
            if (cart.length === 0) {
                return { sukses: false, pesan: 'Keranjang kosong untuk seller ini' };
            }

            var total = cart.reduce(function(s, i) {
                return s + (i.subtotal || 0);
            }, 0);

            var users = _load('dataLoginUser', []);
            var sellerInfo = cekSeller.data;

            var kodeRoleKasir = 'KSR_' + (sellerInfo ? sellerInfo.kodeRole : 'TK');
            var kasir = (Array.isArray(users)) ? users.find(function(u) {
                return u && u.kodeRole === kodeRoleKasir &&
                       (u.idOwner === idSeller || u.idInduk === idSeller);
            }) : null;

            var targetChat = kasir ? kasir.idUser : idSeller;
            var targetRole = kasir ? kodeRoleKasir : (sellerInfo ? sellerInfo.kodeRole : 'TK');

            // A1: pakai ID transaksi dari CS5 jika tersedia
            var idRef = (typeof window.csGenerateIdTransaksi === 'function')
                ? window.csGenerateIdTransaksi()
                : ('ORDER-' + Date.now());

            var paketPesan = {
                tipe: 'order_seller',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                    nama:     window.getNamaUserAktif ? window.getNamaUserAktif() : 'User'
                },
                ke: {
                    menu:           'chat_seller',
                    idUserTarget:   targetChat,
                    kodeRoleTarget: targetRole
                },
                data: {
                    idSeller: idSeller,
                    items:    cart,
                    total:    total,
                    metode:   metode || 'Belum Dipilih',
                    catatan:  'Mohon konfirmasi pesanan ini.'
                },
                idRef:     idRef,
                timestamp: _now()
            };

            // Delegasi MN (A25) — graceful degradation jika belum ada
            var modeKirim = 'mn';
            if (typeof window.mnKirimKeMenu === 'function') {
                window.mnKirimKeMenu(paketPesan);
            } else {
                // ⚠️ A12 NOTE: scaffolding dev, lihat header [FSS.5]
                modeKirim = 'inbox-fallback';
                var inboxKey = 'r2c_mn_inbox_chat_seller';
                var inbox = _load(inboxKey, []);
                if (!Array.isArray(inbox)) inbox = [];
                inbox.unshift(paketPesan);
                _save(inboxKey, inbox);
            }

            // Hapus keranjang seller ini
            var newCart = window.fssGetKeranjang().filter(function(c) {
                return c.idSeller !== idSeller;
            });
            _save(_getKeranjangKey(), newCart);

            return {
                sukses: true,
                pesan: modeKirim === 'mn'
                    ? 'Pesanan dikirim ke Seller via MN'
                    : 'Pesanan dikirim ke Seller (MN belum ada — inbox fallback)',
                idRef:      idRef,
                target:     targetChat,
                targetRole: targetRole,
                modeKirim:  modeKirim,
                total:      total,
                adaKasir:   !!kasir
            };
        } catch (e) {
            console.error('[FSS v1.4] fssCheckoutKeChat error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSS.6] — 3 PINTU STANDAR (A11—A13)
    // ═══════════════════════════════════════════════════════════
    window.kirimFSS = function(tipe, ke, data, idRef) {
        try {
            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }
            return window.mnKirimKeMenu({
                tipe: tipe || 'pesan',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                    menu:     'FSS',
                    blok:     'L4-FSS'
                },
                ke: ke || { menu: 'FSS' },
                data: data || {},
                idRef: idRef || null,
                timestamp: _now()
            });
        } catch (e) {
            return { sukses: false, pesan: e.message };
        }
    };

    window.terimaFSS = function(aksiMenu) {
        try {
            if (typeof window.mnInboxMenu !== 'function') return [];
            return window.mnInboxMenu(aksiMenu || 'FSS');
        } catch (e) { return []; }
    };

    // ── 6.3 ambilFSS — panggil getter 1× lalu reuse ──
    window.ambilFSS = function(filter) {
        try {
            filter = filter || {};
            var sellerList = window.fssGetDaftarSeller(filter);
            var keranjang  = window.fssGetKeranjang();
            return {
                totalSeller:    sellerList.length,
                sellerList:     sellerList,
                totalKeranjang: keranjang.length,
                keranjang:      keranjang
            };
        } catch (e) {
            return {
                totalSeller: 0, sellerList: [],
                totalKeranjang: 0, keranjang: []
            };
        }
    };

    window.cekPintuFSS = function() {
        var skor = (typeof window.kirimFSS === 'function' ? 1 : 0)
                 + (typeof window.terimaFSS === 'function' ? 1 : 0)
                 + (typeof window.ambilFSS === 'function' ? 1 : 0);
        return {
            blok: 'FSS',
            kirim:  typeof window.kirimFSS === 'function',
            terima: typeof window.terimaFSS === 'function',
            ambil:  typeof window.ambilFSS === 'function',
            skor:   skor + '/3',
            lengkap: skor === 3
        };
    };

    // ═══════════════════════════════════════════════════════════
    // [FSS.7] — DEBUG (A5)
    // ═══════════════════════════════════════════════════════════
    window.debugFSS = function() {
        var pintu = window.cekPintuFSS();
        var guardTerdaftar = false;
        try {
            guardTerdaftar = !!(window.BLOK_GUARD_MAP && window.BLOK_GUARD_MAP['_fssDoneV14']);
        } catch (e) {}
        var info = {
            blok: 'FSS',
            versi: window._fssVersi,
            guard: {
                v14: window._fssDoneV14,
                v13: window._fssDoneV13,
                v12: window._fssDoneV12,
                v11: window._fssDoneV11,
                v1:  window._fssDoneV1
            },
            roleSeller: ROLE_SELLER.slice(),
            totalRole:  ROLE_SELLER.length,
            csKeyRegistered: (window.CS_KEY && window.CS_KEY.KERANJANG_SELLER_PREFIX)
                ? window.CS_KEY.KERANJANG_SELLER_PREFIX
                : '(belum terdaftar)',
            cekAturan: {
                A11_lengkap3Pintu:     pintu.lengkap,
                A12_mnDelegasi:        typeof window.mnKirimKeMenu === 'function',
                A18_registerCSKey:     !!(window.CS_KEY && window.CS_KEY.KERANJANG_SELLER_PREFIX),
                A19_tipeArray:         Array.isArray(window.fssGetKeranjang()),
                A19_csIsArray:         typeof window.csIsArray === 'function',
                A19_csIsObject:        typeof window.csIsObject === 'function',
                A25_delegasiCS:        true,
                A32_guardUnik:         window._fssDoneV14 === true,
                A33_registryBlok:      true,
                A34_registryRiwayat:   true,
                A35_registryFungsi:    true,
                A36_roleViaCS1:        !!window.CS_ROLE_MAP,

<script>
(function BLOK_FSO_V13() {
    // ═══════════════════════════════════════════════════════════
    // [FSO.0] — GUARD UTAMA + ALIAS (A32) + SELF-REGISTER (A43)
    // ═══════════════════════════════════════════════════════════
    if (window._fsoDoneV13) {
        console.log('ℹ️ BLOK FSO v1.3 sudah terpasang.');
        return;
    }
    if (!window.CS_ROLE_MAP || !window.csLoadJSON || !window.csSaveJSON) {
        console.warn('⚠️ BLOK FSO v1.3: Core System belum siap. Ditunda.');
        return;
    }
    if (typeof window.gidIdUser !== 'function') {
        console.warn('⚠️ BLOK FSO v1.3: GID belum siap. Ditunda.');
        return;
    }

    // ── Set guard 4 lapis (A32) ──
    window._fsoDoneV13 = true;   // ⭐ GUARD UTAMA v1.3
    window._fsoDoneV12 = true;   // alias backward compat
    window._fsoDoneV11 = true;   // alias
    window._fsoDoneV1  = true;   // alias legacy
    window._fsoVersi   = '1.3';

    // ── [A43/A46] Self-register guard ke BLOK_GUARD_MAP ──
    // Tanpa ini → health check 10.83 tampil "❌ tidak ada"
    if (typeof window.blokDaftarkanGuard === 'function') {
        try {
            window.blokDaftarkanGuard('_fsoDoneV13', 'FSO');
        } catch (e) {
            console.warn('[FSO v1.3] blokDaftarkanGuard warn:', e.message);
        }
    }

    // ═══════════════════════════════════════════════════════════
    // [FSO.1] — HELPER INTERNAL (delegasi CS2/CS4/CS5 — A1, A2, A25, A19)
    // ═══════════════════════════════════════════════════════════
    function _load(key, def) {
        try {
            var v = window.csLoadJSON(key, def);
            // A19: paksa tipe via CS4 helper jika tersedia
            if (typeof window.csIsArray === 'function' && window.csIsArray(def)) {
                return window.csIsArray(v) ? v : def;
            }
            if (typeof window.csIsObject === 'function' && window.csIsObject(def)) {
                return window.csIsObject(v) ? v : def;
            }
            // Fallback manual
            if (Array.isArray(def) && !Array.isArray(v)) return def;
            if (def && typeof def === 'object' && !Array.isArray(def) &&
                (!v || typeof v !== 'object' || Array.isArray(v))) {
                return def;
            }
            return v;
        } catch (e) { return def; }
    }

    function _save(key, data) {
        try {
            return window.csSaveJSON(key, data, { backup: false });
        } catch (e) { return { sukses: false, pesan: e.message }; }
    }

    function _now() {
        return window.csNow ? window.csNow() : new Date().toISOString();
    }

    // A1: pakai generator ID dari CS5 jika tersedia
    function _genIdRef(prefixFallback, tipe) {
        // tipe 'transaksi' → csGenerateIdTransaksi
        // tipe 'chat'      → csGenerateIdVerifikasi('CHAT')
        try {
            if (tipe === 'transaksi' && typeof window.csGenerateIdTransaksi === 'function') {
                return window.csGenerateIdTransaksi();
            }
            if (tipe === 'chat' && typeof window.csGenerateIdVerifikasi === 'function') {
                return window.csGenerateIdVerifikasi('CHAT');
            }
        } catch (e) {}
        return (prefixFallback || 'FSO') + '-' + Date.now();
    }

    // ═══════════════════════════════════════════════════════════
    // [FSO.2] — KONSTANTA ROLE OJEK
    // ═══════════════════════════════════════════════════════════
    // OJ = Mitra Ojol (kategori Seller, alur self_register_verif_sku)
    // Ojek TIDAK punya kasir (A42 — hanya 6 varian kasir resmi)
    // Chat ojek langsung ke OJ (tidak ada KSR_OJ)
    // ═══════════════════════════════════════════════════════════
    var ROLE_OJEK = ['OJ'];
    window.FSO_ROLE_OJEK = ROLE_OJEK.slice();

    function _isRoleOjekValid(kodeRole) {
        if (!kodeRole) return false;
        if (ROLE_OJEK.indexOf(kodeRole) === -1) return false;
        return !!(window.CS_ROLE_MAP && window.CS_ROLE_MAP[kodeRole]);
    }

    // ═══════════════════════════════════════════════════════════
    // [FSO.3] — GETTER KATALOG OJEK + VALIDASI
    // ═══════════════════════════════════════════════════════════

    // ── 3.1 fsoGetDaftarOjek(filter) ──
    window.fsoGetDaftarOjek = function(filter) {
        filter = filter || {};
        try {
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return [];

            var list = users.filter(function(u) {
                if (!u || !u.kodeRole) return false;
                if (!_isRoleOjekValid(u.kodeRole)) return false;
                var st = u.status || u.statusVerifikasi || 'Aktif';
                return st === 'Aktif';
            });

            if (filter.cari) {
                var q = String(filter.cari).toLowerCase();
                list = list.filter(function(u) {
                    return String(u.nama || u.namaLengkap || '')
                        .toLowerCase().indexOf(q) !== -1;
                });
            }
            if (filter.statusOnline !== undefined) {
                list = list.filter(function(u) {
                    var profil = _load('profil_' + u.idUser, {});
                    var isOnline = (profil.statusOnline !== false);
                    return isOnline === (filter.statusOnline === true);
                });
            }

            return list.map(function(u) {
                var profil = _load('profil_' + u.idUser, {});
                if (!profil || typeof profil !== 'object') profil = {};
                return {
                    idUser:    u.idUser || u.id,
                    nama:      u.nama || u.namaLengkap || 'Mitra Ojek',
                    kendaraan: profil.kendaraan || 'Motor',
                    plat:      profil.platNomor || '-',
                    wilayah:   u.alamat || 'Sekitar Anda',
                    fotoUrl:   profil.fotoUrl || u.fotoUrl || '',
                    rating:    profil.rating || 5.0,
                    status:    (profil.statusOnline !== false) ? 'Online' : 'Offline'
                };
            });
        } catch (e) {
            console.error('[FSO v1.3] fsoGetDaftarOjek error:', e);
            return [];
        }
    };

    // ── 3.2 fsoGetDetailOjek(idOjek) ──
    window.fsoGetDetailOjek = function(idOjek) {
        try {
            if (!idOjek) return null;
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) return null;
            var u = users.find(function(x) {
                return x && (x.idUser === idOjek || x.id === idOjek);
            });
            if (!u || !_isRoleOjekValid(u.kodeRole)) return null;
            var profil = _load('profil_' + u.idUser, {});
            if (!profil || typeof profil !== 'object') profil = {};
            return {
                idUser:    u.idUser || u.id,
                nama:      u.nama || u.namaLengkap || 'Mitra Ojek',
                hp:        u.hp || '',
                alamat:    u.alamat || '',
                kendaraan: profil.kendaraan || 'Motor',
                plat:      profil.platNomor || '-',
                rating:    profil.rating || 5.0,
                status:    (profil.statusOnline !== false) ? 'Online' : 'Offline'
            };
        } catch (e) {
            console.error('[FSO v1.3] fsoGetDetailOjek error:', e);
            return null;
        }
    };

    // ── 3.3 fsoCekOjekValid(idUser) ──
    window.fsoCekOjekValid = function(idUser) {
        try {
            if (!idUser) return { valid: false, pesan: 'ID kosong' };
            var users = _load('dataLoginUser', []);
            if (!Array.isArray(users)) {
                return { valid: false, pesan: 'Data user tidak valid' };
            }
            var u = users.find(function(x) {
                return x && (x.idUser === idUser || x.id === idUser);
            });
            if (!u) return { valid: false, pesan: 'User tidak ditemukan' };
            if (!_isRoleOjekValid(u.kodeRole)) {
                return { valid: false, pesan: 'Role bukan Ojek: ' + (u.kodeRole || '-') };
            }
            var st = u.status || u.statusVerifikasi || 'Aktif';
            if (st !== 'Aktif') {
                return { valid: false, pesan: 'Ojek tidak aktif: ' + st };
            }
            return { valid: true, data: u };
        } catch (e) {
            return { valid: false, pesan: e.message };
        }
    };

    // ═══════════════════════════════════════════════════════════
    // [FSO.4] — DELEGASI CHAT & REQUEST (A25 murni — NO fallback)
    // ═══════════════════════════════════════════════════════════
    // ⚠️ A12 NOTE — v1.2 sudah hapus fallback localStorage. v1.3 mempertahankan:
    //   Kalau MN belum terpasang → return { sukses:false } — TIDAK scaffolding.
    //   Ojek request WAJIB via MN untuk audit trail + integrasi chat real-time.
    // ═══════════════════════════════════════════════════════════

    // ── 4.1 fsoKirimChat — delegasi MN murni ──
    window.fsoKirimChat = function(idOjek, pesan) {
        try {
            if (!idOjek) return { sukses: false, pesan: 'ID ojek kosong' };
            if (!pesan || String(pesan).trim().length === 0) {
                return { sukses: false, pesan: 'Pesan kosong' };
            }

            var cek = window.fsoCekOjekValid(idOjek);
            if (!cek.valid) {
                return { sukses: false, pesan: 'Ojek tidak valid: ' + cek.pesan };
            }

            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }

            // A1: idRef via CS5 jika tersedia
            var idRef = _genIdRef('CHAT', 'chat');

            // A13: paket standar lengkap
            var paket = {
                tipe: 'chat_ojek',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                    menu:     'FSO',
                    blok:     'L4-FSO'
                },
                ke: {
                    menu:           'chat_ojek',
                    idUserTarget:   idOjek,
                    kodeRoleTarget: 'OJ'
                },
                data: { pesan: String(pesan).trim() },
                idRef:     idRef,
                timestamp: _now()
            };

            window.mnKirimKeMenu(paket);
            return { sukses: true, idRef: idRef, target: idOjek };
        } catch (e) {
            console.error('[FSO v1.3] fsoKirimChat error:', e);
            return { sukses: false, pesan: e.message };
        }
    };

    // ── 4.2 fsoRequestOjek — delegasi MN murni ──
    window.fsoRequestOjek = function(idOjek, dataPesanan) {
        try {
            if (!idOjek) return { sukses: false, pesan: 'ID ojek kosong' };
            if (!dataPesanan || !dataPesanan.jemput || !dataPesanan.tujuan) {
                return { sukses: false, pesan: 'Lokasi jemput & tujuan wajib diisi' };
            }

            var cek = window.fsoCekOjekValid(idOjek);
            if (!cek.valid) {
                return { sukses: false, pesan: 'Ojek tidak valid: ' + cek.pesan };
            }

            if (typeof window.mnKirimKeMenu !== 'function') {
                return { sukses: false, pesan: 'MN belum terpasang' };
            }

            // A1: idRef via CS5 (transaksi)
            var idRef = _genIdRef('OJEK', 'transaksi');

            var paket = {
                tipe: 'request_ojek',
                dari: {
                    idUser:   window.gidIdUser(),
                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                    menu:     'FSO',
                    blok:     'L4-FSO'
                },
                ke: {
                    menu:           'chat_ojek',
                    idUserTarget:   idOjek,
                    kodeRoleTarget: 'OJ'
                },
                data: {
                    jemput:      String(dataPesanan.jemput).trim(),
                    tujuan:      String(dataPesanan.tujuan).trim(),
                    deskripsi:   String(dataPesanan.deskripsi || '-').trim(),
                    jarakKm:     parseFloat(dataPesanan.jarak) || 0,
                    totalBiaya:  parseInt(dataPesanan.biaya, 10) || 0
                },
                idRef:     idRef,
                timestamp: _now()
            };

            window.mnKirimKeMenu(paket);
            return {
                sukses: true,
                pesan:  'Permintaan Ojek terkirim',
                idRef:  idRef,
                target: idOjek
            };
        } catch (e) {
            console.error('[FSO v1.3] fsoRequestOjek error:', e);

            var list = window.fsoGetDaftarOjek();
            var online = list.filter(function(o) { return o.status === 'Online'; }).length;
            var offline = list.length - online;
            return {
                total:   list.length,
                online:  online,
                offline: offline,
                target:  0   // OJ bukan target verif 15 (SKU based)
            };
        } catch (e) {
            return { total: 0, online: 0, offline: 0, target: 0 };

    // ═══════════════════════════════════════════════════════════

    // ── 6.1 PINTU 1: kirimFSO ──

                return { sukses: false, pesan: 'MN belum ada' };

            return window.mnKirimKeMenu({

                    idOwner:  window.gidIdOwner ? window.gidIdOwner() : null,
                    kodeRole: window.gidKodeRoleUser ? window.gidKodeRoleUser() : null,
                    menu:     'FSO',
                    blok:     'L4-FSO'

                ke: ke || { menu: 'FSO' },
                data: data || {},
                idRef: idRef || null,
                timestamp: _now()

            return { sukses: false, pesan: e.message };

    // ── 6.2 PINTU 2: terimaFSO ──
    window.terimaFSO = function(aksiMenu) {

    // ── 6.3 PINTU 3: ambilFSO ──

            blok: 'FSO',
            kirim:  typeof window.kirimFSO  === 'function',
            terima: typeof window.terimaFSO === 'function',
            ambil:  typeof window.ambilFSO  === 'function',
            skor:   skor + '/3',

                adaCekOjekValid:   typeof window.fsoCekOjekValid === 'function',
                adaKirimChat:      typeof window.fsoKirimChat === 'function',
                adaRequestOjek:    typeof window.fsoRequestOjek === 'function',
                selfRegisterGuard: guardTerdaftar,

            data: {

            pintu: pintu,
            fungsi: {
                fsoGetDaftarOjek:     typeof window.fsoGetDaftarOjek,

                fsoRequestOjek:       typeof window.fsoRequestOjek,
                fsoStatistikOjek:     typeof window.fsoStatistikOjek,
                kirimFSO:             typeof window.kirimFSO,
                terimaFSO:            typeof window.terimaFSO,
                ambilFSO:             typeof window.ambilFSO,
                cekPintuFSO:          typeof window.cekPintuFSO
            }
        };
        console.log('🔍 debugFSO v1.3:', info);
        return info;

    // ═══════════════════════════════════════════════════════════

            // A34: riwayat
            if (typeof window.cpTambahRiwayat === 'function') {

                        keterangan: 'FIX AUDIT v1.3: ' +
                                    '[A43/A46] +blokDaftarkanGuard(_fsoDoneV13,FSO) · ' +

                                    '[A1] idRef pakai csGenerateIdVerifikasi/Transaksi · ' +
                                    '[A5] debug lengkap cek A32/A33/A43/A44/A46 · ' +
                                    '[A11/A13] kirimFSO paket dari LENGKAP · ' +

                    status: 'Selesai',
                    jumlah: 10
                });
            }
        } catch (e) {
            console.warn('[FSO v1.3] Auto-registry error:', e.message);
        }
    }, 1000);

    // ═══════════════════════════════════════════════════════════
    // [FSO.9] — LOG TERPASANG (A5)

    console.log(

    console.log('');
    console.log('   🔴 FIX v1.3 (dari v1.2 — audit 46 aturan):');
    console.log('      ✅ [A43/A46] +blokDaftarkanGuard(_fsoDoneV13, FSO)');
    console.log('      ✅ [A33—A35] +auto-registry blok/riwayat/fungsi');
    console.log('      ✅ [A29/A30] Sub-seksi lengkap [FSO.0]—[FSO.9]');
    console.log('      ✅ [A19] _load() pakai csIsArray/csIsObject (CS4)');
    console.log('      ✅ [A1]  idRef pakai csGenerateIdVerifikasi/Transaksi');
    console.log('      ✅ [A5]  debug lengkap cek A32/A33/A43/A44/A46');
    console.log('      ✅ [A11/A13] kirimFSO paket dari LENGKAP');
    console.log('      ✅ [A11] +cekPintuFSO() verifikasi 3 pintu');
    console.log('      ✅ [A32] Guard baru _fsoDoneV13 (alias V12/V11/V1)');
    console.log('      ✅ [A31] IIFE unik BLOK_FSO_V13');

    console.log('      A1 · A2 · A3 · A5 · A6 · A7 · A11 · A12 · A13 · A19');
    console.log('      A25 · A29 · A30 · A31 · A32 · A33 · A34 · A35 · A36');
    console.log('      A40 · A43 · A44 · A46');
    console.log('');
    console.log('   🎁 Fungsi publik (10):');
    console.log('      • fsoGetDaftarOjek(filter)     — daftar ojek aktif');
    console.log('      • fsoGetDetailOjek(id)         — detail 1 ojek');
    console.log('      • fsoCekOjekValid(id)          — validasi ojek');
    console.log('      • fsoKirimChat(id, pesan)      — chat via MN');

    console.log('      • fsoStatistikOjek()           — statistik online/offline');

})();
